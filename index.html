<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Primal Forged">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Primal Forged</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #050505; color: #fafafa; }
    
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .loading-text { font-size: 12px; color: #525252; text-transform: uppercase; letter-spacing: 0.2em; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
    
    .app-header { position: fixed; top: 0; left: 0; right: 0; background: #050505; border-bottom: 1px solid #1c1c1c; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .logo { font-size: 10px; font-weight: 600; letter-spacing: 0.35em; }
    .logo-accent { color: #7f1d1d; margin-left: 6px; }
    .user-menu { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 10px; color: #525252; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { background: transparent; border: 1px solid #1c1c1c; color: #737373; padding: 6px 12px; font-size: 9px; cursor: pointer; font-family: inherit; }
    
    .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-box { width: 100%; max-width: 360px; }
    .auth-title { font-size: 24px; font-weight: 300; text-align: center; margin-bottom: 8px; letter-spacing: 0.1em; }
    .auth-subtitle { font-size: 12px; color: #8a8a8a; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .auth-input { width: 100%; padding: 14px 16px; background: #0a0a0a; border: 1px solid #1c1c1c; color: #fafafa; font-size: 14px; font-family: inherit; margin-bottom: 12px; }
    .auth-input:focus { outline: none; border-color: #7f1d1d; }
    .auth-btn { width: 100%; padding: 14px; background: #7f1d1d; border: none; color: #fff; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }
    .auth-btn:hover { background: #991b1b; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch { text-align: center; margin-top: 24px; font-size: 12px; color: #525252; }
    .auth-switch a { color: #e5484d; cursor: pointer; text-decoration: none; }
    .auth-forgot { text-align: right; margin: -4px 0 14px; font-size: 12px; }
    .auth-forgot a { color: #a3a3a3; text-decoration: none; }
    .auth-forgot a:hover { color: #fafafa; }
    .pw-wrap { position: relative; }
    .pw-wrap .auth-input { padding-right: 72px; }
    .pw-eye { position: absolute; right: 4px; top: 4px; height: 42px; min-width: 60px; background: transparent; border: none; color: #8a8a8a; font-family: inherit; font-size: 11px; letter-spacing: 0.08em; cursor: pointer; }
    .pw-rules { list-style: none; padding: 0; margin: -2px 0 16px; font-size: 12px; color: #737373; display: flex; flex-direction: column; gap: 4px; }
    .pw-rules li::before { content: '○'; display: inline-block; width: 18px; }
    .pw-rules li.ok { color: #22c55e; }
    .pw-rules li.ok::before { content: '✓'; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .auth-error { background: rgba(220,38,38,0.1); border: 1px solid #dc2626; color: #dc2626; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    .auth-success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid #1c1c1c; display: flex; z-index: 100; }
    .nav-item { flex: 1; padding: 12px 2px; background: transparent; border: none; color: #525252; font-size: 9px; text-transform: uppercase; letter-spacing: 0.02em; cursor: pointer; font-family: inherit; text-align: center; }
    .nav-item.active { color: #7f1d1d; }
    .nav-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    
    .card { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 16px; }
    .card-accent { border-left: 3px solid #7f1d1d; }
    
    .label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 500; display: block; }
    
    .page-header { margin-bottom: 24px; padding-top: 60px; }
    .page-sub { font-size: 10px; color: #7f1d1d; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 6px; font-weight: 600; }
    .page-title { font-size: 26px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; }
    
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
    .stat { text-align: center; padding: 16px 8px; background: #0a0a0a; border: 1px solid #1c1c1c; }
    .stat-value { font-size: 20px; font-weight: 300; }
    .stat-label { font-size: 8px; color: #525252; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.05em; }
    
    .tabs { display: flex; border-bottom: 1px solid #1c1c1c; margin-bottom: 24px; overflow-x: auto; }
    .tab { padding: 12px 10px; flex: 1 0 auto; background: transparent; border: none; border-bottom: 2px solid transparent; color: #525252; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; font-family: inherit; margin-bottom: -1px; white-space: nowrap; }
    @media (max-width: 380px) { .tab { padding: 12px 4px; letter-spacing: 0.04em; } }
    .tab.active { color: #fafafa; border-bottom-color: #7f1d1d; }
    
    .textarea { width: 100%; min-height: 150px; padding: 16px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 1.7; resize: vertical; }
    .textarea:focus { outline: none; border-color: #7f1d1d; }
    
    .slider-group { margin-bottom: 16px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-label { font-size: 12px; color: #a3a3a3; }
    .slider-value { font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .slider { 
      -webkit-appearance: none; 
      width: 100%; 
      height: 8px; 
      background: linear-gradient(to right, #dc2626, #eab308, #22c55e); 
      outline: none; 
      border-radius: 4px;
      opacity: 0.4;
    }
    .slider::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 22px; 
      height: 22px; 
      background: #fafafa; 
      cursor: pointer; 
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #fafafa;
      cursor: pointer;
      border-radius: 50%;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider-stress {
      background: linear-gradient(to right, #22c55e, #eab308, #dc2626);
    }
    
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 10px 14px; background: transparent; border: 1px solid #1c1c1c; color: #737373; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .tag:hover { border-color: #525252; }
    .tag.active { background: rgba(127,29,29,0.2); border-color: #7f1d1d; color: #fafafa; }
    
    .btn { padding: 14px 28px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; }
    .btn-primary { background: #7f1d1d; color: #fff; }
    .btn-primary:hover { background: #991b1b; }
    .btn-secondary { background: transparent; border: 1px solid #1c1c1c; color: #737373; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-small { padding: 10px 16px; font-size: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .entry { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 12px; }
    .entry-date { font-size: 11px; color: #525252; margin-bottom: 12px; }
    .entry-scores { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .entry-score { font-size: 10px; padding: 4px 8px; background: #1c1c1c; }
    .entry-content { font-size: 13px; color: #a3a3a3; line-height: 1.7; white-space: pre-wrap; }
    .entry-habits { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .entry-habit { font-size: 9px; padding: 4px 8px; border-radius: 2px; }
    .entry-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1c1c1c; }
    .entry-action { background: transparent; border: 1px solid #1c1c1c; color: #737373; padding: 8px 12px; font-size: 10px; cursor: pointer; font-family: inherit; }
    .entry-action:hover { border-color: #525252; }
    .entry-action.delete { color: #dc2626; }
    
    .info-box { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .info-title { font-size: 11px; color: #7f1d1d; margin-bottom: 6px; font-weight: 500; }
    .info-text { font-size: 12px; color: #a3a3a3; line-height: 1.6; }
    
    .prompt { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .prompt-label { font-size: 10px; color: #7f1d1d; margin-bottom: 6px; }
    .prompt-text { font-size: 13px; color: #a3a3a3; font-style: italic; }
    
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #166534; color: #fff; padding: 12px 24px; font-size: 12px; z-index: 400; display: none; }
    .toast.show { display: block; }
    
    .empty { text-align: center; padding: 40px 20px; color: #525252; font-size: 13px; }
    
    .insight { padding: 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
    .insight-positive { background: rgba(34,197,94,0.1); border-left: 3px solid #22c55e; }
    .insight-negative { background: rgba(234,179,8,0.1); border-left: 3px solid #eab308; }
    .insight-icon { font-size: 20px; }
    .insight-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .insight-positive .insight-title { color: #22c55e; }
    .insight-negative .insight-title { color: #eab308; }
    .insight-text { font-size: 11px; color: #a3a3a3; }

    /* Dashboard specific */
    .greeting { font-size: 20px; font-weight: 300; margin-bottom: 4px; }
    .greeting-sub { font-size: 12px; color: #525252; margin-bottom: 24px; }
    
    .streak-big { text-align: center; padding: 32px; }
    .streak-number { font-size: 72px; font-weight: 200; line-height: 1; }
    .streak-label { font-size: 11px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 8px; }
    
    .habit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .habit { padding: 12px 8px; background: transparent; border: 1px solid #1c1c1c; color: #525252; cursor: pointer; font-family: inherit; text-align: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .habit.done { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
    .habit.done.negative { background: rgba(234,179,8,0.1); border-color: #eab308; color: #eab308; }
    .habit-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .habit-label { font-size: 8px; text-transform: uppercase; }
    
    .quote-card { padding: 20px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 16px; }
    .quote-text { font-size: 14px; color: #a3a3a3; font-style: italic; line-height: 1.6; margin-bottom: 12px; }
    .quote-author { font-size: 11px; color: #525252; }
    
    /* Retention specific */
    .phase-indicator { padding: 12px; text-align: center; margin-top: 16px; }
    .phase-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
    
    .progress-bar { height: 4px; background: #1c1c1c; margin-top: 16px; }
    .progress-fill { height: 100%; transition: width 0.3s; }
    
    .emergency-btn { width: 100%; padding: 20px; background: #dc2626; border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 24px; }
    .emergency-btn:hover { background: #b91c1c; }
    
    .milestone { padding: 16px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 12px; display: flex; gap: 16px; align-items: flex-start; }
    .milestone.achieved { border-color: #22c55e; background: rgba(34,197,94,0.05); }
    .milestone-day { font-size: 24px; font-weight: 300; color: #525252; min-width: 50px; }
    .milestone.achieved .milestone-day { color: #22c55e; }
    .milestone-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .milestone-desc { font-size: 11px; color: #525252; }
    
    .urge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .urge { padding: 16px 8px; background: #0a0a0a; border: 1px solid #1c1c1c; cursor: pointer; text-align: center; }
    .urge:hover { border-color: #7f1d1d; }
    .urge-icon { font-size: 24px; display: block; margin-bottom: 8px; }
    .urge-label { font-size: 9px; color: #a3a3a3; text-transform: uppercase; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 24px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: #dc2626; }
    .modal-title.habit { color: #22c55e; }
    .modal-step { padding: 16px; background: #050505; border-left: 3px solid #dc2626; margin-bottom: 12px; }
    .modal-step.habit { border-left-color: #7f1d1d; }
    .modal-step-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .modal-step-text { font-size: 11px; color: #a3a3a3; }
    
    .habit-modal-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
    .habit-modal-duration { text-align: center; padding: 12px; background: rgba(127,29,29,0.2); border: 1px solid #7f1d1d; margin-bottom: 16px; font-size: 14px; color: #fafafa; }

    /* ===== MISSIES ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chip { padding: 8px 12px; background: transparent; border: 1px solid #1c1c1c; color: #737373; font-size: 10px; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; }
    .chip.active { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }
    .goal { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 16px; margin-bottom: 12px; }
    .goal.done { opacity: 0.6; }
    .goal-top { display: flex; gap: 12px; align-items: flex-start; }
    .goal-check { width: 24px; height: 24px; border: 2px solid #525252; background: transparent; color: #fff; cursor: pointer; flex-shrink: 0; font-size: 13px; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .goal-check.checked { background: #22c55e; border-color: #22c55e; }
    .goal-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; word-break: break-word; }
    .goal.done .goal-title { text-decoration: line-through; color: #737373; }
    .goal-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge { padding: 3px 8px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid #1c1c1c; color: #737373; }
    .goal-notes { font-size: 12px; color: #737373; margin-top: 10px; line-height: 1.5; white-space: pre-wrap; }
    .goal-progress-row { display: flex; justify-content: space-between; font-size: 10px; color: #737373; margin-top: 6px; }
    .goal-update { display: flex; gap: 8px; margin-top: 12px; }
    .input-sm { flex: 1; padding: 10px 12px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; min-width: 0; }
    .input-sm:focus { outline: none; border-color: #7f1d1d; }
    .subtasks { margin-top: 12px; border-top: 1px solid #1c1c1c; padding-top: 8px; }
    .subtask { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .subtask-check { width: 18px; height: 18px; border: 1px solid #525252; background: transparent; color: #fff; cursor: pointer; font-size: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .subtask-check.checked { background: #166534; border-color: #166534; }
    .subtask-text { flex: 1; font-size: 12px; color: #a3a3a3; word-break: break-word; }
    .subtask-text.done { text-decoration: line-through; color: #525252; }
    .icon-btn { background: transparent; border: none; color: #525252; cursor: pointer; font-size: 14px; padding: 2px 6px; font-family: inherit; }
    .icon-btn:hover { color: #dc2626; }
    .goal-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1c1c1c; }
    .form-label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.1em; margin: 14px 0 6px; display: block; }
    .form-input { width: 100%; padding: 12px 14px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; color-scheme: dark; }
    .form-input:focus { outline: none; border-color: #7f1d1d; }
    textarea.form-input { min-height: 70px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .template-list { max-height: 220px; overflow-y: auto; border: 1px solid #1c1c1c; }
    .template { display: block; width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: none; border-bottom: 1px solid #1c1c1c; color: #d4d4d4; font-size: 12px; cursor: pointer; font-family: inherit; }
    .template:hover { background: rgba(127,29,29,0.15); color: #fafafa; }
    .template-sub { font-size: 10px; color: #525252; margin-top: 2px; }
    .smart-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 16px; }
    .smart-cell { text-align: center; padding: 8px 2px; background: #050505; border: 1px solid #1c1c1c; }
    .smart-char { font-size: 15px; font-weight: 600; color: #7f1d1d; }
    .smart-word { font-size: 7px; color: #525252; text-transform: uppercase; margin-top: 2px; }

    /* Training */
    .tweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
    .tday { font-family: inherit; padding: 10px 0; text-align: center; background: transparent; border: 1px solid #262626; color: #d4d4d4; cursor: pointer; position: relative; min-width: 0; }
    .tday-d { display: block; font-size: 12px; font-weight: 500; }
    .tday-s { display: block; font-size: 9px; margin-top: 3px; color: #8a8a8a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
    .tday.rest { border-color: #1c1c1c; color: #525252; }
    .tday.rest .tday-s { color: #3a3a3a; }
    .tday.set { background: #1a0606; border-color: #7f1d1d; color: #fafafa; }
    .tday.set .tday-s { color: #e5484d; }
    .tday.today::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #e5484d; }
    .tday.sel { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }
    .tday.sel .tday-s { color: #fecaca; }
    .tday.sel.today::after { background: #fff; }
    .tsel { background: #0a0a0a; border: 1px solid #262626; color: #a3a3a3; font-family: inherit; font-size: 11px; padding: 8px; flex-shrink: 0; }
    .tgrid-head { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 8px; color: #8a8a8a; letter-spacing: 0.06em; text-align: center; padding: 0 13px; margin-bottom: 4px; }
    .tgroup { font-size: 10px; color: #8a8a8a; letter-spacing: 0.2em; margin: 14px 0 8px; }
    .tex { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 12px; margin-bottom: 8px; }
    .tex-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .tex-name { font-size: 14px; font-weight: 500; }

<body>
  <div id="app">
    <div class="loading">
      <span class="loading-text">Laden...</span>
    </div>
  </div>

  <script>
    // ============================================
    // SUPABASE CONFIG
    // ============================================
    const SUPABASE_URL = 'https://dgqfvyjgtkoeiyswgngs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rDP5Kvq0wBsObLeiXJ98OA_aa0q-ipz';
    // Kwam je binnen via de "wachtwoord vergeten"-mail? (vastleggen vóórdat Supabase de link verwerkt)
    const recoveryFromLink = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
    // ============================================
    // OFFLINE: laatst geladen gegevens bewaren + wijzigingen in de wachtrij
    // ============================================
    // Lezen: elk antwoord van de database wordt bewaard. Geen internet? Dan krijg je de laatst bewaarde versie.
    // Schrijven: geen internet? Dan gaat de wijziging in een wachtrij en wordt verstuurd zodra je weer online bent.
    const PF_DATA_CACHE = 'pf-data-v1';
    const pfNet = { offline: false, fromCache: false, flushing: false };
    const realFetch = window.fetch.bind(window);
    function pfQueue() { try { return JSON.parse(localStorage.getItem('pf_queue') || '[]'); } catch (e) { return []; } }
    function pfSaveQueue(q) { try { localStorage.setItem('pf_queue', JSON.stringify(q)); } catch (e) {} pfBanner(); }
    function pfHeaders(h) { const o = {}; try { new Headers(h || {}).forEach((v, k) => { o[k] = v; }); } catch (e) {} return o; }
    function pfIsNetErr(e) { return e && (e.name === 'TypeError' || /fetch|network|load failed/i.test(e.message || '')); }
    function pfUid() { try { return (state && state.user && state.user.id) || null; } catch (e) { return null; } }
    function pfTmpId() { return 'tmp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

    async function pfFetch(input, init) {
      init = init || {};
      const url = typeof input === 'string' ? input : input.url;
      const method = String(init.method || (typeof input !== 'string' && input.method) || 'GET').toUpperCase();
      if (!/\/rest\/v1\//.test(url)) return realFetch(input, init);
      const headers = pfHeaders(init.headers);
      if (method === 'GET' || method === 'HEAD') {
        const key = url + '#' + (headers.accept || '');
        try {
          const res = await realFetch(input, init);
          if (res.ok && method === 'GET' && 'caches' in window) { const copy = res.clone(); caches.open(PF_DATA_CACHE).then(c => c.put(key, copy)).catch(() => {}); }
          if (pfNet.offline) { pfNet.offline = false; pfNet.fromCache = false; pfBanner(); setTimeout(pfFlush, 300); }
          return res;
        } catch (e) {
          if (!pfIsNetErr(e) || !('caches' in window)) throw e;
          const hit = await caches.open(PF_DATA_CACHE).then(c => c.match(key)).catch(() => null);
          pfNet.offline = true;
          if (hit) { pfNet.fromCache = true; pfBanner(); return hit; }
          pfBanner();
          throw e;
        }
      }
      // Schrijven: als er al iets in de wachtrij staat, achteraan aansluiten (volgorde blijft kloppen)
      const queued = pfQueue().length > 0;
      if (!queued && navigator.onLine !== false) {
        try {
          const res = await realFetch(input, init);
          if (pfNet.offline) { pfNet.offline = false; pfBanner(); }
          return res;
        } catch (e) {
          if (!pfIsNetErr(e)) throw e;
        }
      }
      return pfEnqueue(url, method, headers, init.body, queued && navigator.onLine !== false);
    }

    function pfEnqueue(url, method, headers, body, justBehind) {
      if (!justBehind) pfNet.offline = true;
      else setTimeout(pfFlush, 200);
      let rows = null, tmp = [];
      try { rows = body ? JSON.parse(body) : null; } catch (e) {}
      const upsert = /on_conflict=/.test(url) || /resolution=/.test(headers.prefer || '');
      if (method === 'POST' && rows && !upsert) {
        const list = Array.isArray(rows) ? rows : [rows];
        list.forEach(r => { if (r && typeof r === 'object' && !r.id) { const id = pfTmpId(); tmp.push(id); r.__tmp = id; } else tmp.push(null); });
      }
      const q = pfQueue();
      q.push({ uid: pfUid(), url, method, headers: { ...headers, authorization: undefined }, body: rows ? JSON.stringify(rows) : (body || null), tmp, at: Date.now() });
      pfSaveQueue(q);
      // Antwoord nabootsen zoals de database dat zou doen
      const wantsRows = /return=representation/.test(headers.prefer || '');
      if (method === 'POST' || method === 'PATCH') {
        if (!wantsRows) return new Response(null, { status: method === 'POST' ? 201 : 204 });
        let out = rows ? (Array.isArray(rows) ? rows : [rows]).map(r => { const c = { ...r }; if (c.__tmp) { c.id = c.__tmp; delete c.__tmp; } if (!c.created_at) c.created_at = new Date().toISOString(); return c; }) : [];
        const single = /vnd\.pgrst\.object/.test(headers.accept || '');
        return new Response(JSON.stringify(single ? (out[0] || null) : out), { status: 201, headers: { 'Content-Type': 'application/json' } });
      }
      return new Response(null, { status: 204 });
    }

    // Wachtrij versturen. Tijdelijke id's (van iets dat offline is aangemaakt) worden vervangen door de echte.
    async function pfFlush() {
      if (pfNet.flushing || navigator.onLine === false) return;
      let q = pfQueue();
      if (!q.length) return;
      pfNet.flushing = true;
      let sent = 0, failed = 0;
      const map = (() => { try { return JSON.parse(localStorage.getItem('pf_tmpmap') || '{}'); } catch (e) { return {}; } })();
      const swap = (s) => s ? s.replace(/tmp-[a-z0-9]+-[a-z0-9]+/g, m => map[m] || m) : s;
      try {
        const { data } = await supabaseClient.auth.getSession();
        const token = data && data.session && data.session.access_token;
        const uid = data && data.session && data.session.user.id;
        if (!token) { pfNet.flushing = false; return; }
        while (q.length) {
          const it = q[0];
          if (it.uid && it.uid !== uid) { q.shift(); pfSaveQueue(q); continue; }  // van een ander account
          const headers = { ...it.headers, apikey: SUPABASE_KEY, authorization: 'Bearer ' + token };
          delete headers['content-length'];
          let body = swap(it.body);
          const hasTmp = (it.tmp || []).some(Boolean);
          if (hasTmp) {
            headers.prefer = String(headers.prefer || '').split(',').map(x => x.trim()).filter(x => x && !/^return=/.test(x)).concat('return=representation').join(',');
            headers.accept = 'application/json';
            try { const rows = JSON.parse(body); (Array.isArray(rows) ? rows : [rows]).forEach(r => delete r.__tmp); body = JSON.stringify(rows); } catch (e) {}
          }
          let res;
          try { res = await realFetch(swap(it.url), { method: it.method, headers, body: it.method === 'DELETE' ? undefined : body }); }
          catch (e) { break; }   // nog steeds geen verbinding: later opnieuw
          if (res.status >= 500) break;
          if (res.ok && hasTmp) {
            try { const out = await res.json(); (Array.isArray(out) ? out : [out]).forEach((r, i) => { if (it.tmp[i] && r && r.id) map[it.tmp[i]] = r.id; }); } catch (e) {}
            try { localStorage.setItem('pf_tmpmap', JSON.stringify(map)); } catch (e) {}
          }
          if (res.ok) sent++; else { failed++; console.warn('Wijziging uit wachtrij geweigerd', res.status, it.url); }
          q.shift(); pfSaveQueue(q);
        }
      } finally { pfNet.flushing = false; }
      if (!q.length) { try { localStorage.removeItem('pf_tmpmap'); } catch (e) {} }
      pfNet.offline = false; pfNet.fromCache = false; pfBanner();
      if (sent || failed) {
        if (typeof showToast === 'function') showToast(failed ? `⚠️ ${sent} wijziging(en) opgeslagen, ${failed} lukte niet` : `☁️ ${sent} offline wijziging${sent === 1 ? '' : 'en'} opgeslagen`);
        if (state.user && typeof loadAll === 'function') { await loadAll(); render(); }
      }
    }
    function pfBanner() {
      let el = document.getElementById('pf-offline');
      const n = pfQueue().length;
      const show = pfNet.offline || navigator.onLine === false || n > 0;
      if (!show) { if (el) el.remove(); return; }
      if (!el) { el = document.createElement('div'); el.id = 'pf-offline'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
      const off = pfNet.offline || navigator.onLine === false;
      el.className = off ? '' : 'syncing';
      el.textContent = off
        ? `Offline${n ? ` · ${n} wijziging${n === 1 ? '' : 'en'} wacht${n === 1 ? '' : 'en'}` : ''}${pfNet.fromCache ? ' · laatst geladen gegevens' : ''}`

    const proteinGoals = [
      ['Minimale behoefte', 0.8, 0.8],
      ['Gezondheid & onderhoud', 1.2, 1.4],

    // Gewoontes die je nog ziet en kunt afvinken (verborgen gewoontes tellen in je geschiedenis nog wel mee)
    const visibleHabitKeys = Object.keys(habitConfig).filter(k => habitConfig[k].positive && !habitConfig[k].hidden);

    function habitStats(key) {
      const today = todayStr();
      const hist = { ...state.habitHistory, [today]: { ...state.habits } };
      const done = d => !!(hist[d] && hist[d][key]);
      let week = 0;
      for (let d = weekKey(today); d <= today; d = dateAdd(d, 1)) if (done(d)) week++;
      const daysSoFar = diffDays(weekKey(today), today) + 1;
      let streak = 0, d = done(today) ? today : dateAdd(today, -1);
      while (done(d)) { streak++; d = dateAdd(d, -1); }
      const total = Object.keys(hist).filter(done).length;
      return { week, daysSoFar, streak, total };
    }

    // [n] → klikbaar bronnummer dat naar de bronnenlijst springt
    function habitSrcLinks(html) {
      return html.replace(/\[(\d+)\]/g, (m, n) => `<a href="#hs-src-${n}" class="hs-ref" onclick="return habitSrcJump(${n})" aria-label="Bron ${n}">${n}</a>`);
    }
    function habitSrcJump(n) {
      const box = document.getElementById('hs-sources');
      if (box) box.open = true;
      const el = document.getElementById('hs-src-' + n);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); }
      return false;
    }

    // Eén doel voor eiwitschema én voeding (bewaard bij je voedingsinstellingen)
    function proteinGoalIdx() {
      const g = (typeof nutritionSettings === 'function' ? nutritionSettings().goals : null) || {};
      if (g.goalIdx !== undefined && g.goalIdx !== null) return Number(g.goalIdx);
      try { const v = localStorage.getItem('pf_protein_goal'); return v === null ? 3 : Number(v); } catch (e) { return 3; }
    }
    function setProteinGoal(i) {
      try { localStorage.setItem('pf_protein_goal', String(i)); } catch (e) {}
      saveNutritionSettings({ goals: { ...(nutritionSettings().goals || {}), goalIdx: i } });
      document.querySelectorAll('.hs-prot-row').forEach((el, j) => el.classList.toggle('mine', j === i));
    }
    function renderProteinTable() {
      const kgVal = latestBodyValue('weight');
      const kg = kgVal ? Number(kgVal) : null;
      const max = 2.5, mine = proteinGoalIdx();
      const f = n => String(n).replace('.', ',');
      return `
        <div class="hs-prot-head"><span>Gram eiwit per kg lichaamsgewicht per dag</span><span class="gold">${kg ? 'jij: ' + f(Math.round(kg * 10) / 10) + ' kg' : 'voorbeeld: 85 kg'}</span></div>
        ${proteinGoals.map(([goal, lo, hi], i) => {
          const w = kg || 85;
          const left = lo === hi ? lo / max * 100 - 0.6 : lo / max * 100;
          const width = lo === hi ? 1.2 : (hi - lo) / max * 100;
          return `
            <button class="hs-prot-row ${i === mine ? 'mine' : ''}" onclick="setProteinGoal(${i})" aria-label="Kies doel: ${goal}">
              <span class="hs-prot-top"><span class="hs-prot-goal">${goal}</span><span class="hs-prot-gkg">${lo === hi ? f(lo) : f(lo) + ' – ' + f(hi)} g</span></span>
              <span class="hs-prot-bar"><span style="left: ${left}%; width: ${width}%;"></span></span>
              <span class="hs-prot-g">${lo === hi ? Math.round(lo * w) : Math.round(lo * w) + ' – ' + Math.round(hi * w)} g per dag</span>
            </button>`;
        }).join('')}
        <div class="hs-prot-scale"><span>0</span><span>1,0</span><span>2,0</span><span>2,5 g/kg</span></div>
        <div class="hs-note"><b>Verdeling:</b> 3–5 maaltijden met <b>35–50 g eiwit</b> per maaltijd. [10]</div>
        <p class="hs-small">Tik op je doel om het te markeren. ${kg ? 'Je gewicht komt uit je laatste meting.' : 'Vul je gewicht in bij Lichaam, dan rekent de app met jouw gewicht.'} Boven ±1,6 g/kg levert extra eiwit gemiddeld weinig meer op; tot 2,2 g/kg kan het voor sommigen nog helpen. [2] [9] Zelfs 100 g in één keer wordt niet verspild. [11]</p>
      `;
    }

      return sections.map(([title, html, kind], i) => `

        : `<div class="hs-secs">${renderHabitSections(info.sections)}</div>`;
      const typeCls = t => ({ Onderzoek: 'r', Overzicht: 'o', Uitleg: 'u', Richtlijn: 'g' }[t] || 'u');
      return `

              <div><b>${st.total}</b><span>Totaal</span></div>
            </div>
            ${check}
            ${body}
            ${info.sideNote ? `<div class="hs-side"><div class="hs-side-t">${info.sideNote.title}</div><div>${habitSrcLinks(info.sideNote.html)}</div><div class="hs-small" style="margin-top: 8px;"><a href="#" onclick="state.showHabitModal = null; setSection('sleep'); return false;">Meer over slaap bij Slaap →</a></div></div>` : ''}
            <details class="hs-sec hs-src" id="hs-sources">
              <summary><span>Bronnen & meer lezen · ${info.sources.length}</span><span class="hs-pm" aria-hidden="true"></span></summary>
              <div class="hs-body">

                  <a class="hs-source" id="hs-src-${i + 1}" href="${url}" target="_blank" rel="noopener noreferrer">
                    <span class="hs-source-n">${i + 1}</span>
                    <span style="min-width: 0;"><span class="hs-tag ${typeCls(type)}">${type}</span><span class="hs-source-t">${title} ↗</span></span>
                  </a>`).join('')}
              </div>
            </details>
            ${key === 'meditation' || key === 'coldShower' ? `<button class="btn btn-primary" style="width: 100%; margin-top: 18px; padding: 16px;" onclick="openHabitTimer('${key === 'meditation' ? 'breath' : 'cold'}')">⏱ Start ${key === 'meditation' ? 'ademhalingstimer' : 'koude-douche-timer'}</button>` : ''}

    function getColor(value, isStress = false) {
      // For stress: low is good (green), high is bad (red)
      // For others: low is bad (red), high is good (green)
      const v = isStress ? (11 - value) : value;
      
      if (v <= 2) return '#dc2626';      // Red
      if (v <= 3) return '#ea580c';      // Orange-red
      if (v <= 4) return '#f97316';      // Orange
      if (v <= 5) return '#eab308';      // Yellow
      if (v <= 6) return '#a3e635';      // Yellow-green
      if (v <= 7) return '#84cc16';      // Lime
      if (v <= 8) return '#22c55e';      // Green
      return '#16a34a';                   // Dark green
    }

    function getJournalStreak() {
      const dates = [...new Set(journaledEntries().map(e => e.date))].sort().reverse();
      if (!dates.length || dates[0] < dateAdd(todayStr(), -1)) return 0;
      let streak = 1;
      for (let i = 1; i < dates.length; i++) {
        const d1 = new Date(dates[i-1]);
        const d2 = new Date(dates[i]);
        const diff = (d1 - d2) / (1000 * 60 * 60 * 24);
        if (diff <= 1) streak++;
        else break;
      }
      return streak;
    }

    // Datums altijd in lokale tijd (niet UTC), anders klopt 'vandaag' niet tussen 00:00 en 02:00
    function localDateStr(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function addDays(n) {

    }

    function dateAdd(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return localDateStr(d);
    }

    function diffDays(a, b) {

    function patternEntries() {

    function sleepInsights() {
      // Energie en stemming na nachten van 7+ uur vs korter
      const rows = journaledEntries().map(e => ({ e, n: sleepNight(e.date) })).filter(x => x.n);
      const long = rows.filter(x => x.n.min >= 420), short = rows.filter(x => x.n.min < 420);
      const out = [];
      if (long.length >= 2 && short.length >= 2) {
        const avg = (arr, k) => { const v = arr.map(x => x.e[k]).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
        [['energy', 'energie'], ['mood', 'stemming']].forEach(([k, l]) => {
          const a = avg(long, k), b = avg(short, k);
          if (a !== null && b !== null && a - b >= 0.5) out.push({ icon: '😴', title: `7+ uur slaap verbetert je ${l}`, text: `Na 7+ uur: ${a.toFixed(1)} | Korter: ${b.toFixed(1)} (+${(a - b).toFixed(1)})`, positive: true, impact: a - b });
        });
      }
      return out;
    }
    function getInsights() {
      const entriesWithHabits = patternEntries();
      
      if (entriesWithHabits.length < 3) return [];
      
      const insights = [];
      
      // Analyze each habit's correlation with mood and energy
      Object.entries(habitConfig).filter(([k, c]) => !c.hidden).forEach(([habitKey, habitCfg]) => {
        const withHabit = entriesWithHabits.filter(e => e.habits && e.habits[habitKey]);
        const withoutHabit = entriesWithHabits.filter(e => e.habits && !e.habits[habitKey]);
        
        if (withHabit.length >= 2 && withoutHabit.length >= 2) {
          const avgMoodWith = withHabit.reduce((a, e) => a + (e.mood || 5), 0) / withHabit.length;
          const avgMoodWithout = withoutHabit.reduce((a, e) => a + (e.mood || 5), 0) / withoutHabit.length;
          const avgEnergyWith = withHabit.reduce((a, e) => a + (e.energy || 5), 0) / withHabit.length;
          const avgEnergyWithout = withoutHabit.reduce((a, e) => a + (e.energy || 5), 0) / withoutHabit.length;
          
          if (habitCfg.positive) {
            // Positive habit: show if it improves mood/energy
            const moodDiff = avgMoodWith - avgMoodWithout;
            const energyDiff = avgEnergyWith - avgEnergyWithout;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verbetert je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (+${moodDiff.toFixed(1)})`,
                positive: true,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} boost je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (+${energyDiff.toFixed(1)})`,
                positive: true,
                impact: energyDiff
              });
            }
          } else {
            // Negative habit: show if it lowers mood/energy
            const moodDiff = avgMoodWithout - avgMoodWith;
            const energyDiff = avgEnergyWithout - avgEnergyWith;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (-${moodDiff.toFixed(1)})`,
                positive: false,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (-${energyDiff.toFixed(1)})`,
                positive: false,
                impact: energyDiff
              });
            }
          }
        }
      });
      
      // Sort by impact and return top 6
      insights.sort((a, b) => (b.impact || 0) - (a.impact || 0));
      return insights.slice(0, 6);
    }

        return row;
      };

          .from('daily_habits')
          .upsert(buildRow(Object.keys(habitColumns)), { onConflict: 'user_id,date' }));

    function pwValid(p) { return pwRules.every(r => r[2](p || '')); }
    function pwCheck(inputId, listId) {
      const p = (document.getElementById(inputId) || {}).value || '';
      pwRules.forEach(([k, , f]) => { const el = document.getElementById(listId + '-' + k); if (el) el.classList.toggle('ok', f(p)); });
    }
    function pwRulesHtml(listId) {
      return `<ul class="pw-rules" aria-label="Wachtwoord-eisen">${pwRules.map(([k, l]) => `<li id="${listId}-${k}">${l}</li>`).join('')}</ul>`;
    }
    function pwToggle(btn, id) {
      const el = document.getElementById(id); if (!el) return;
      el.type = el.type === 'password' ? 'text' : 'password';
      btn.textContent = el.type === 'password' ? 'Toon' : 'Verberg';
      btn.setAttribute('aria-label', el.type === 'password' ? 'Wachtwoord tonen' : 'Wachtwoord verbergen');
    }
    // Supabase-meldingen in het Nederlands
    function authErrorNl(err) {
      const m = String((err && err.message) || err || '');
      if (/invalid login credentials/i.test(m)) return 'E-mail of wachtwoord klopt niet.';
      if (/email not confirmed/i.test(m)) return 'Je e-mailadres is nog niet bevestigd. Klik op de link in de mail die je kreeg bij het registreren.';
      if (/already registered|already exists/i.test(m)) return 'Er bestaat al een account met dit e-mailadres. Log in, of kies "Wachtwoord vergeten?".';
      if (/only request this after|rate limit|too many/i.test(m)) return 'Te veel pogingen achter elkaar. Wacht even en probeer het dan opnieuw.';
      if (/password should|weak password|password is/i.test(m)) return 'Dit wachtwoord is te zwak. Gebruik minimaal 8 tekens met een letter en een cijfer.';
      if (/same.*password|different from the old/i.test(m)) return 'Kies een ander wachtwoord dan je huidige.';
      if (/network|fetch/i.test(m)) return 'Geen verbinding. Controleer je internet en probeer het opnieuw.';
      return m;
    }
    function setAuthMode(m) {
      const em = document.getElementById('auth-email');
      if (em) state.authEmail = em.value;
      authMode = m; render();
    }

    function renderAuth() {
      const titles = { login: ['Welkom', 'Log in op je account'], signup: ['Account maken', 'Begin vandaag met smeden'], forgot: ['Wachtwoord vergeten', 'Vul je e-mail in. Je krijgt een link om een nieuw wachtwoord te kiezen.'] };
      const [title, sub] = titles[authMode] || titles.login;
      const btn = { login: 'Inloggen', signup: 'Registreren', forgot: 'Stuur resetlink' }[authMode];
      return `
        <div class="auth-container">
          <div class="auth-box">
            <div style="text-align: center; margin-bottom: 32px;">
              <span class="logo">PRIMAL</span><span class="logo logo-accent">FORGED</span>
            </div>
            <div class="auth-title">${title}</div>
            <div class="auth-subtitle">${sub}</div>
            <div id="auth-error" class="auth-error" role="alert" style="display: none;"></div>
            <div id="auth-success" class="auth-success" role="status" style="display: none;"></div>
            <form id="auth-form" onsubmit="handleAuth(event)" novalidate>
              <label class="sr-only" for="auth-email">E-mail</label>
              <input type="email" id="auth-email" class="auth-input" placeholder="E-mail" autocomplete="email" value="${esc(state.authEmail || '')}" required>
              ${authMode !== 'forgot' ? `
                <div class="pw-wrap">
                  <label class="sr-only" for="auth-password">Wachtwoord</label>
                  <input type="password" id="auth-password" class="auth-input" placeholder="Wachtwoord" autocomplete="${authMode === 'signup' ? 'new-password' : 'current-password'}" required ${authMode === 'signup' ? `oninput="pwCheck('auth-password', 'pr')"` : ''}>
                  <button type="button" class="pw-eye" onclick="pwToggle(this, 'auth-password')" aria-label="Wachtwoord tonen">Toon</button>
                </div>` : ''}
              ${authMode === 'signup' ? `
                <label class="sr-only" for="auth-password2">Herhaal wachtwoord</label>
                <input type="password" id="auth-password2" class="auth-input" placeholder="Herhaal wachtwoord" autocomplete="new-password" required>
                ${pwRulesHtml('pr')}` : ''}
              ${authMode === 'login' ? `<div class="auth-forgot"><a href="#" onclick="setAuthMode('forgot'); return false;">Wachtwoord vergeten?</a></div>` : ''}
              <button type="submit" class="auth-btn" id="auth-submit">${btn}</button>
            </form>
            <div class="auth-switch">
              ${authMode === 'login' ? `<span>Nog geen account?</span> <a href="#" onclick="setAuthMode('signup'); return false;">Registreren</a>`
                : authMode === 'signup' ? `<span>Al een account?</span> <a href="#" onclick="setAuthMode('login'); return false;">Inloggen</a>`
                : `<a href="#" onclick="setAuthMode('login'); return false;">← Terug naar inloggen</a>`}
            </div>
            <div class="auth-privacy">${authMode === 'signup' ? 'Door te registreren ga je akkoord met de ' : ''}<a href="#" onclick="const em = document.getElementById('auth-email'); if (em) state.authEmail = em.value; state.showPrivacy = true; render(); window.scrollTo(0, 0); return false;">${authMode === 'signup' ? 'privacyverklaring' : 'Privacy'}</a>.</div>
          </div>
        </div>
      `;
    }

    function toggleAuthMode() { setAuthMode(authMode === 'login' ? 'signup' : 'login'); }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const pwEl = document.getElementById('auth-password');
      const password = pwEl ? pwEl.value : '';
      const errorEl = document.getElementById('auth-error');
      const successEl = document.getElementById('auth-success');
      const submitBtn = document.getElementById('auth-submit');
      const label = submitBtn.textContent;
      const fail = (msg) => { errorEl.textContent = msg; errorEl.style.display = 'block'; };
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      state.authEmail = email;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Vul een geldig e-mailadres in.');
      if (authMode !== 'forgot' && !password) return fail('Vul je wachtwoord in.');
      if (authMode === 'signup') {
        if (!pwValid(password)) { pwCheck('auth-password', 'pr'); return fail('Je wachtwoord voldoet nog niet aan de eisen hieronder.'); }
        if (password !== document.getElementById('auth-password2').value) return fail('De twee wachtwoorden zijn niet hetzelfde.');
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Even geduld...';
      try {
        if (authMode === 'signup') {
          await signUp(email, password);
          successEl.textContent = 'Check je e-mail om je account te bevestigen!';
          successEl.style.display = 'block';
        } else if (authMode === 'forgot') {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
          if (error) throw error;
          successEl.textContent = 'Als er een account met dit e-mailadres is, krijg je binnen een paar minuten een mail met een link. Kijk ook in je spam.';
          successEl.style.display = 'block';
        } else {
          await signIn(email, password);
        }
      } catch (error) {
        fail(authErrorNl(error));
      }
      submitBtn.disabled = false;
      submitBtn.textContent = label;
    }

    // Nieuw wachtwoord kiezen na de link uit de mail
    function renderRecovery() {
      return `
        <div class="auth-container">
          <div class="auth-box">
            <div style="text-align: center; margin-bottom: 32px;">

            <div class="auth-title">Nieuw wachtwoord</div>

    async function saveNewPassword(e) {
      e.preventDefault();
      const pw = document.getElementById('rec-pw').value, pw2 = document.getElementById('rec-pw2').value;
      const err = document.getElementById('rec-error'), btn = document.getElementById('rec-submit');
      const fail = (m) => { err.textContent = m; err.style.display = 'block'; };
      err.style.display = 'none';
      if (!pwValid(pw)) { pwCheck('rec-pw', 'rr'); return fail('Je wachtwoord voldoet nog niet aan de eisen hieronder.'); }
      if (pw !== pw2) return fail('De twee wachtwoorden zijn niet hetzelfde.');
      btn.disabled = true; btn.textContent = 'Opslaan...';
      const { error } = await supabaseClient.auth.updateUser({ password: pw });
      if (error) { btn.disabled = false; btn.textContent = 'Opslaan'; return fail(authErrorNl(error)); }
      state.recovery = false;
      try { history.replaceState(null, '', location.pathname); } catch (x) {}
      if (state.user) await loadAll();
      render();
      showToast('🔒 Nieuw wachtwoord opgeslagen');
    }

    function habitChallengeLabel(key) {
      const c = habitChallenge(key);

      return `<span style="display: block; font-size: 8px; color: #e5484d; margin-top: 3px; letter-spacing: 0.02em;">${ev.dayNum}/${ev.D}</span>`;
    }

    function renderBackupReminder() {
      const hasData = state.entries.length > 0 || state.challenges.length > 0 || state.bodyStats.length > 0;
      const since = daysSinceBackup();
      if (!hasData || (since !== null && since <= 30)) return '';
      return `
        <div class="info-box" style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
          <div>
            <div class="info-title">💾 Tijd voor een back-up</div>

        </div>
      `;

    // ============================================
    // LICHAAM: CONFIG + HELPERS
    // ============================================
    const bodyMetrics = {
      weight:             { label: 'Gewicht',       short: 'Gewicht', unit: 'kg' },
      bodyfat_percentage: { label: 'Vetpercentage', short: 'Vet%',    unit: '%' },
      waist:              { label: 'Taille',        short: 'Taille',  unit: 'cm' },
      chest:              { label: 'Borst',         short: 'Borst',   unit: 'cm' },
      hips:               { label: 'Heup',          short: 'Heup',    unit: 'cm' },
      biceps:             { label: 'Biceps',        short: 'Biceps',  unit: 'cm' },
      thighs:             { label: 'Dij',           short: 'Dij',     unit: 'cm' }
    };

    function fmtVal(v) {
      if (v === null || v === undefined) return '—';
      return String(Math.round(Number(v) * 10) / 10).replace('.', ',');
    }

    function fmtDateShort(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
    }

    function fmtDateLong(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Metingen oplopend op datum
    function bodyEntriesFor(metric) {
      return state.bodyStats.filter(e => hasValue(e[metric])).map(e => ({ date: e.entry_date, value: Number(e[metric]), id: e.id }));
    }

    function latestBodyValue(metric) {
      const list = bodyEntriesFor(metric);
      return list.length ? list[list.length - 1].value : null;
    }

    function getBodyStartDate() {
      if (state.bodySettings && state.bodySettings.body_start_date) return state.bodySettings.body_start_date;
      return state.bodyStats.length ? state.bodyStats[0].entry_date : null;
    }

    // Eerste waarde op of na de startdatum
    function startBodyValue(metric) {
      const start = getBodyStartDate();
      if (!start) return null;
      const first = bodyEntriesFor(metric).find(e => e.date >= start);
      return first ? first.value : null;
    }

    function daysSince(dateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      return Math.round((today - new Date(dateStr + 'T00:00:00')) / 86400000);
    }


    // ============================================
    // LICHAAM: DATABASE
    // ============================================
    async function loadBody() {
      if (!state.user) return;
      const { data, error } = await supabaseClient
        .from('body_stats')
        .select('*')
        .eq('user_id', state.user.id)
        .order('entry_date', { ascending: true });
      if (error) console.error('Fout bij laden metingen:', error);
      else state.bodyStats = data || [];

      const res = await supabaseClient
        .from('user_settings')
        .select('*')
        .eq('user_id', state.user.id)
        .maybeSingle();
      if (res.error) {
        // Tabel bestaat nog niet -> lokaal bewaren tot body-update.sql is uitgevoerd
        state.bodySettingsMissing = true;
        try { state.bodySettings = JSON.parse(localStorage.getItem('pf_body_settings') || '{}'); } catch (e) { state.bodySettings = {}; }
      } else {
        state.bodySettingsMissing = false;
        state.bodySettings = res.data || {};
      }
    }

    async function saveBodySettings(patch) {
      state.bodySettings = { ...state.bodySettings, ...patch };
      if (!state.bodySettingsMissing) {
        const { error } = await supabaseClient.from('user_settings').upsert({
          user_id: state.user.id,
          body_start_date: state.bodySettings.body_start_date || null,
          height_cm: state.bodySettings.height_cm || null,
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id' });
        if (!error) return;
        console.warn('user_settings niet beschikbaar, lokaal opgeslagen:', error);
        state.bodySettingsMissing = true;
      }
      try { localStorage.setItem('pf_body_settings', JSON.stringify(state.bodySettings)); } catch (e) {}
    }

    function emptyBodyForm() {
      const latest = {};
      Object.keys(bodyMetrics).forEach(k => latest[k] = '');
      return { entry_date: todayStr(), ...latest };
    }

    function openBodyModal(id) {
      if (id) {
        const e = state.bodyStats.find(x => x.id === id);
        if (!e) return;
        state.editingBodyId = id;
        state.bodyForm = { entry_date: e.entry_date };
        Object.keys(bodyMetrics).forEach(k => state.bodyForm[k] = hasValue(e[k]) ? String(Number(e[k])) : '');
      } else {
        state.editingBodyId = null;
        state.bodyForm = emptyBodyForm();
      }
      state.showBodyModal = true;
      render();
    }

    function closeBodyModal() {
      state.showBodyModal = false;
      state.editingBodyId = null;
      render();
    }

    async function saveMeasurement() {
      const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const date = get('bf-date') || todayStr();
      const row = { user_id: state.user.id, entry_date: date };
      let count = 0;
      Object.keys(bodyMetrics).forEach(k => {
        const raw = get('bf-' + k);
        if (hasValue(raw)) {
          const n = parseFloat(String(raw).replace(',', '.'));
          row[k] = isNaN(n) ? null : n;
          if (!isNaN(n)) count++;
        } else {
          row[k] = null;
        }
      });
      if (count === 0) { alert('Vul minimaal één waarde in'); return; }

      const btn = document.getElementById('body-save-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }

      // Bestaat er al een meting op deze datum? Dan bijwerken.
      const existing = state.editingBodyId
        ? state.bodyStats.find(e => e.id === state.editingBodyId)
        : state.bodyStats.find(e => e.entry_date === date);

      let error;
      if (existing) {
        ({ error } = await supabaseClient.from('body_stats').update(row).eq('id', existing.id));
      } else {
        ({ error } = await supabaseClient.from('body_stats').insert([row]));
      }
      if (error) {
        console.error('Fout bij opslaan meting:', error);
        alert('Fout bij opslaan: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
        return;
      }

      // Startdatum één keer vastleggen
      const isFirst = !state.bodySettings || !state.bodySettings.body_start_date;
      await loadBody();
      if (isFirst) {
        const earliest = state.bodyStats.length ? state.bodyStats[0].entry_date : date;
        await saveBodySettings({ body_start_date: earliest });
      }

      state.showBodyModal = false;
      state.editingBodyId = null;
      render();
      if (isFirst) showToast('📍 Startdatum vastgelegd: ' + fmtDateShort(getBodyStartDate()));
      else showToast('✓ Meting opgeslagen');
    }

    async function deleteMeasurement(id) {
      if (!confirm('Meting verwijderen?')) return;
      const { error } = await supabaseClient.from('body_stats').delete().eq('id', id);
      if (error) { alert('Fout bij verwijderen: ' + error.message); return; }
      await loadBody();
      render();
    }


    async function saveHeight() {
      const el = document.getElementById('body-height');
      const n = el ? parseFloat(String(el.value).replace(',', '.')) : NaN;
      if (isNaN(n) || n < 100 || n > 250) { alert('Vul je lengte in centimeters in (bijv. 182)'); return; }
      await saveBodySettings({ height_cm: n });
      render();
      showToast('✓ Lengte opgeslagen');
    }

    function setBodyMetric(m) { state.bodyMetric = m; render(); }
    function setBodyRange(r) { state.bodyRange = r; render(); }

    // ============================================
    // RENDER: LICHAAM
    // ============================================
    function renderBody() {
      if (state.bodyTab === 'challenges') return renderChallenges();
      if (state.bodyTab === 'fotos') return renderPhotos();
      if (state.bodyTab === 'bloed') return renderBlood();
      const start = getBodyStartDate();
      const w = latestBodyValue('weight');
      const wList = bodyEntriesFor('weight');
      const wPrev = wList.length > 1 ? wList[wList.length - 2].value : null;
      const height = state.bodySettings && state.bodySettings.height_cm ? Number(state.bodySettings.height_cm) : null;
      const bmi = (w !== null && height) ? w / Math.pow(height / 100, 2) : null;
      const fat = latestBodyValue('bodyfat_percentage');
      const ffmi = (bmi !== null && fat !== null) ? (w * (1 - fat / 100)) / Math.pow(height / 100, 2) : null;

      const deltaHtml = (cur, prev) => {
        if (cur === null || prev === null) return '';
        const d = Math.round((cur - prev) * 10) / 10;
        if (d === 0) return '<div style="font-size: 9px; color: #525252; margin-top: 2px;">±0</div>';
        return `<div style="font-size: 9px; color: #737373; margin-top: 2px;">${d > 0 ? '+' : ''}${fmtVal(d)}</div>`;
      };

      const available = Object.keys(bodyMetrics).filter(k => bodyEntriesFor(k).length > 0);
      if (available.length && !available.includes(state.bodyMetric)) state.bodyMetric = available[0];

      const sinceRows = Object.entries(bodyMetrics).map(([k, m]) => {
        const s = startBodyValue(k), n = latestBodyValue(k);
        if (s === null || n === null) return '';
        const d = Math.round((n - s) * 10) / 10;
        return `
          <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid #1c1c1c; font-size: 12px;">
            <span style="color: #a3a3a3;">${m.label}</span>
            <span style="color: #737373; text-align: right;">${fmtVal(s)}</span>
            <span style="text-align: right;">${fmtVal(n)}</span>
            <span style="text-align: right; color: #fafafa;">${d > 0 ? '+' : ''}${fmtVal(d)} ${m.unit}</span>
          </div>`;
      }).join('');

      const history = [...state.bodyStats].reverse();
      const shown = state.bodyShowAll ? history : history.slice(0, 8);

      return `
        ${renderBodyHeader()}

        ${start ? `
          <div class="card card-accent" style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
            <div>
              <div style="font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 4px;">📍 Startdatum</div>
              <div style="font-size: 15px;">${fmtDateLong(start)}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 26px; font-weight: 300;">${daysSince(start)}</div>
              <div style="font-size: 9px; color: #525252; text-transform: uppercase;">dagen bezig</div>
            </div>
          </div>
        ` : `
          <div class="info-box">
            <div class="info-title">📍 Je startpunt</div>
            <div class="info-text">Bij je eerste meting legt de app automatisch je startdatum vast. Daarna zie je altijd hoe ver je sindsdien bent gekomen.</div>
          </div>

    function renderBodyChart() {
      const metric = state.bodyMetric;
      const m = bodyMetrics[metric];
      let pts = bodyEntriesFor(metric);
      if (state.bodyRange > 0) {
        const from = addDays(-state.bodyRange);
        pts = pts.filter(p => p.date >= from);
      }
      if (pts.length < 2) {
        return `<div class="empty" style="padding: 24px 12px;">${pts.length === 1
          ? `Eén meting in deze periode (${fmtVal(pts[0].value)} ${m.unit}). Vanaf twee metingen zie je hier je verloop.`
          : 'Geen metingen in deze periode.'}</div>`;
      }

      const W = 360, H = 200, L = 36, R = 6, T = 14, B = 24;
      const t0 = new Date(pts[0].date + 'T00:00:00').getTime();
      const t1 = new Date(pts[pts.length - 1].date + 'T00:00:00').getTime();
      let lo = Math.min(...pts.map(p => p.value)), hi = Math.max(...pts.map(p => p.value));
      const startVal = startBodyValue(metric);
      if (startVal !== null) { lo = Math.min(lo, startVal); hi = Math.max(hi, startVal); }
      const pad = Math.max((hi - lo) * 0.15, 0.5);
      lo -= pad; hi += pad;
      const x = t => L + ((t - t0) / Math.max(t1 - t0, 1)) * (W - L - R);
      const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

      const coords = pts.map(p => ({ ...p, cx: x(new Date(p.date + 'T00:00:00').getTime()), cy: y(p.value) }));
      const path = coords.map((c, i) => `${i ? 'L' : 'M'}${c.cx.toFixed(1)},${c.cy.toFixed(1)}`).join(' ');
      const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * (i / 3));
      const midIdx = Math.floor(coords.length / 2);

      window.__bodyChart = { coords, unit: m.unit, W };

      return `
        <div id="body-chart" style="position: relative; touch-action: pan-y;">
          <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${m.label} verloop" style="display: block; overflow: visible;">
            ${ticks.map(v => `
              <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#1c1c1c" stroke-width="1"/>
              <text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" fill="#525252" font-size="11" text-anchor="end">${fmtVal(v)}</text>
            `).join('')}
            ${startVal !== null ? `
              <line x1="${L}" x2="${W - R}" y1="${y(startVal).toFixed(1)}" y2="${y(startVal).toFixed(1)}" stroke="#525252" stroke-width="1" stroke-dasharray="4 4"/>
              <text x="${W - R}" y="${(y(startVal) - 6).toFixed(1)}" fill="#737373" font-size="10" text-anchor="end">start ${fmtVal(startVal)}</text>
            ` : ''}
            <path d="${path}" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${coords.length <= 45 ? coords.map(c => `<circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="4" fill="#e5484d" stroke="#0a0a0a" stroke-width="2"/>`).join('') : ''}
            <text x="${L}" y="${H - 6}" fill="#525252" font-size="11">${fmtDateShort(coords[0].date)}</text>
            ${coords.length > 2 ? `<text x="${coords[midIdx].cx.toFixed(1)}" y="${H - 6}" fill="#525252" font-size="11" text-anchor="middle">${fmtDateShort(coords[midIdx].date)}</text>` : ''}
            <text x="${W - R}" y="${H - 6}" fill="#525252" font-size="11" text-anchor="end">${fmtDateShort(coords[coords.length - 1].date)}</text>
            <line id="body-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#737373" stroke-width="1" style="display: none;"/>
            <circle id="body-dot" r="6" fill="#e5484d" stroke="#fafafa" stroke-width="2" style="display: none;"/>
          </svg>
          <div id="body-tip" style="position: absolute; top: 0; display: none; background: #050505; border: 1px solid #262626; padding: 6px 10px; font-size: 11px; pointer-events: none; white-space: nowrap;"></div>
        </div>
      `;
    }

    function setupBodyChart() {
      const box = document.getElementById('body-chart');
      const info = window.__bodyChart;
      if (!box || !info) return;
      const svg = box.querySelector('svg');
      const cross = document.getElementById('body-cross');
      const dot = document.getElementById('body-dot');
      const tip = document.getElementById('body-tip');

      const show = (clientX) => {
        const rect = svg.getBoundingClientRect();
        const scale = info.W / rect.width;
        const sx = (clientX - rect.left) * scale;
        let best = info.coords[0];
        info.coords.forEach(c => { if (Math.abs(c.cx - sx) < Math.abs(best.cx - sx)) best = c; });
        cross.setAttribute('x1', best.cx); cross.setAttribute('x2', best.cx);
        dot.setAttribute('cx', best.cx); dot.setAttribute('cy', best.cy);
        cross.style.display = ''; dot.style.display = '';
        tip.textContent = `${fmtDateLong(best.date)} · ${fmtVal(best.value)} ${info.unit}`;
        tip.style.display = 'block';
        const px = best.cx / scale;
        const tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(rect.width - tw, px - tw / 2)) + 'px';
      };
      const hide = () => { cross.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none'; };

      box.addEventListener('pointermove', e => show(e.clientX));
      box.addEventListener('pointerdown', e => show(e.clientX));
      box.addEventListener('pointerleave', hide);
    }
