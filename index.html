    // ============================================
    // RENDER: RETENTION
    // ============================================
    function retentionStats() {
      const today = todayStr(), from30 = dateAdd(today, -29);
      const rs = (state.retentionAll || []).filter(r => r.start_date);
      const on = new Set(); let best = getRetentionDays();
      rs.forEach(r => {
        const end = r.is_active ? dateAdd(today, 1) : (r.end_date || r.start_date);
        for (let d = r.start_date; d < end && d <= today; d = dateAdd(d, 1)) on.add(d);
        if (!r.is_active && r.end_date) best = Math.max(best, diffDays(r.start_date, r.end_date));
      });
      const first = rs.map(r => r.start_date).sort()[0];
      let known = 0, good = 0;
      if (first) for (let d = first > from30 ? first : from30; d <= today; d = dateAdd(d, 1)) { known++; if (on.has(d)) good++; }
      return { best, total: on.size, pct: known ? Math.round(good / known * 100) : null };
    }
    function renderRetention() {
      const days = getRetentionDays();
      const phase = getRetentionPhase(days);
      const nextMilestone = getNextMilestone(days);
      const prevMs = [...retentionMilestones].reverse().find(m => m.days <= days);
      const progress = nextMilestone && days < nextMilestone.days ? Math.round((days - (prevMs ? prevMs.days : 0)) / (nextMilestone.days - (prevMs ? prevMs.days : 0)) * 100) : 100;
      const st = retentionStats();
      const science = `
        <details class="card hm-why">
          <summary><span class="hm-gn">Eerlijk over de wetenschap</span><span class="hm-pm" aria-hidden="true"></span></summary>
          <div class="su-txt" style="margin-top: 10px;">Online lees je vaak dat je testosteron rond dag 7 piekt. Het onderzoek waar dat op gebaseerd is (2003) is ingetrokken. Er is geen goed bewijs voor grote lichamelijke veranderingen door retention.</div>
          <div class="su-txt" style="margin-top: 8px;">Daarom gaat het hier om wat je wél traint: discipline, focus, impulscontrole en bewust omgaan met je seksualiteit.</div>
          ${ketenSrcHtml(['retract'])}
        </details>`;
      return `
        <button class="entry-action" style="margin-bottom: 14px;" onclick="setSection('ketens')">← Ketens</button>
        <div class="page-header" style="margin-bottom: 8px;">
          <div class="page-sub">Discipline · Focus · Zelfbeheersing</div>
          <div class="page-title">Retention</div>
        </div>

        ${state.retentionStreak ? `
          <div class="kt-hero">
            <div class="kt-hero-ic">🔥</div>
            <div class="kt-hero-big" style="color: ${phase.color};">${days}<span>${days === 1 ? 'dag' : 'dagen'}</span></div>
            <div class="kt-hero-sub">${days ? `${days} ${days === 1 ? 'dag' : 'dagen'} geleden besloot je dat je impulsen jou niet meer besturen.` : 'Vandaag besloot je dat je impulsen jou niet meer besturen.'}</div>
            <div class="phase-indicator" style="background: ${phase.color}20; border: 1px solid ${phase.color}50; margin-top: 14px;">
              <div class="phase-name" style="color: ${phase.color}">Fase: ${phase.name}</div>
              <div class="hs-small" style="margin-top: 6px; color: #d4d4d4;">${esc(phase.text)}</div>
            </div>
            <div class="kt-hero-stats"><div><b>${st.pct !== null ? st.pct + '%' : '–'}</b><span>deze maand</span></div><div><b>${st.total}</b><span>dagen totaal</span></div><div><b>${st.best}</b><span>beste reeks</span></div></div>
            ${nextMilestone && days < nextMilestone.days ? `
              <div class="progress-bar" style="margin-top: 14px;"><div class="progress-fill" style="width: ${progress}%; background: ${phase.color};"></div></div>
              <div class="hs-small" style="margin-top: 8px;">Nog ${nextMilestone.days - days} ${nextMilestone.days - days === 1 ? 'dag' : 'dagen'} tot <b style="color: #fafafa;">${nextMilestone.title}</b></div>
            ` : ''}
          </div>

          <button class="kt-sos" onclick="state.showEmergencyModal = true; render();">🆘 Ik heb een drang</button>

          <div class="card">
            <label class="label">Bouw terug</label>
            <div class="su-txt">De energie die vrijkomt is van jou. Zet hem bewust in.</div>
            <div class="kp-chips" style="margin-top: 10px;">${['Discipline', 'Focus', 'Impulscontrole', 'Training', 'Bewust omgaan met seksualiteit'].map(b => `<span class="kt-build">${b}</span>`).join('')}</div>
          </div>

          <div class="card">
            <label class="label">Mijlpalen</label>
            ${retentionMilestones.map(m => `
              <div class="milestone ${days >= m.days ? 'achieved' : ''}">
                <div class="milestone-day">${m.days}</div>
                <div>
                  <div class="milestone-title">${days >= m.days ? '✓ ' : ''}${m.title}</div>
                  <div class="milestone-desc">${m.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="card">
            <label class="label">Wat helpt bij een drang</label>
            <div class="urge-grid">
              ${urges.map(u => `
                <div class="urge" title="${u.desc}">
                  <span class="urge-icon">${u.icon}</span>
                  <span class="urge-label">${u.label}</span>
                </div>
              `).join('')}
            </div>

          ${science}
          <button class="btn btn-secondary" style="width: 100%; margin-bottom: 16px;" onclick="resetRetention()">Uitglijder: opnieuw beginnen</button>
        ` : `
          <div class="card" style="text-align: center; padding: 32px 20px;">
            <div style="font-size: 44px; margin-bottom: 12px;">🔥</div>
            <div class="su-txt" style="margin-bottom: 8px;">Retention is geen verbod, maar een keuze: je traint discipline, focus en zelfbeheersing.</div>
            ${st.total ? `<div class="hs-small" style="margin-bottom: 18px;">Je beste reeks: <b style="color: #fafafa;">${st.best} dagen</b> · ${st.total} dagen totaal. Die blijven staan.</div>` : '<div style="height: 12px;"></div>'}
            <button class="btn btn-primary" onclick="startRetention()">${st.total ? 'Vandaag opnieuw beginnen' : 'Start vandaag'}</button>
          </div>
          ${science}
        `}

        ${state.showEmergencyModal ? renderEmergencyModal() : ''}
      `;
    }

    function renderEmergencyModal() {

    // ============================================
    // RENDER: JOURNAL
    // ============================================

    // ============================================
    // JOURNAL: VRAAG VAN VANDAAG (thema per weekdag, 50 vragen per thema)
    // ============================================
    const journalThemes = [
      { day: 'maandag', name: 'Focus & doelen', q: [
        'Wat is het ene ding dat deze week alles makkelijker maakt?',

        'Wat wil je over 5 jaar kunnen zeggen dat je nu nog niet kunt?',
        'Welke versie van jezelf wil je deze week laten zien?',
        'Waar zeg je deze week nee tegen, zodat je ergens anders ja tegen kunt zeggen?',
        'Wat staat er deze week op je planning dat je energie geeft, en wat kost energie?',
        'Welke taak schuif je steeds voor je uit? Wanneer doe je hem deze week?',

        'Wat kun je deze week loslaten of aan een ander overlaten?',

        'Wat is je focus voor de komende week, in één zin?',
        'Welke gewoonte ga je volgende week extra aandacht geven?',
        'Wat wil je volgende zondag kunnen opschrijven?',
        'Hoe rustig of onrustig was je hoofd deze week?',
        'Welk moment van rust heb je deze week echt genomen?',
        'Wat heb je deze week gedaan dat je toekomstige zelf zal bedanken?',
        'Waar was je deze week te druk mee?',
        'Hoe vaak schreef je deze week in je journal, en wat leverde het op?',
        'Welke vraag van deze week bleef in je hoofd hangen?',
        'Wat zou een goede vriend zeggen over jouw week?',
        'Wat wil je deze maand nog bereiken?',
        'Hoe staat het met je challenges, en wat is je plan?',
        'Waar heb je deze week te veel van gedaan, en waar te weinig?',
        'Hoe wil je je voelen op vrijdag van volgende week?',
        'Wat is het eerste dat je morgen doet om sterk aan de week te beginnen?'
      ]}
    ];

    // Thema volgt de weekdag; binnen het thema schuift de vraag elke week één plek op
    function journalPromptFor(dateStr, swap) {
      const d = new Date(dateStr + 'T12:00:00');
      const wd = (d.getDay() + 6) % 7;
      const theme = journalThemes[wd];
      const week = Math.floor((d - new Date('2024-01-01T12:00:00')) / (7 * 86400000));
      const idx = ((week + (swap ? 25 : 0)) % theme.q.length + theme.q.length) % theme.q.length;
      return { theme: theme.name, day: theme.day, text: theme.q[idx] };
    }

    // ============================================
    // JOURNAL: VANDAAG (ochtend & avond)
    // ============================================
    function todayJournalEntry() {
      const t = todayStr();
      return state.entries.find(e => e.date === t && e.daily) || null;
    }
    function yesterdayJournalEntry() {
      const y = dateAdd(todayStr(), -1);
      return state.entries.find(e => e.date === y && e.daily) || null;
    }
    function jdInit() {
      const t = todayStr();
      if (state.jd && state.jd.date === t) return state.jd;
      const e = todayJournalEntry();
      const d = (e && e.daily) || {};
      state.jd = {
        date: t, id: e ? e.id : null,
        bed: d.bed || '', wake: d.wake || '',
        goals: d.goals || '', goalsDone: d.goalsDone || [],
        gratitude: d.gratitude || '', answer: d.answer || '', win: d.win || '',
        tomorrow: d.tomorrow || '', hard: d.hard || '', free: (e && e.content) || '',
        swap: !!d.swap, valuesCheck: d.valuesCheck || null, morningAt: d.morningAt || null, eveningAt: d.eveningAt || null,
        sleep: e && e.sleep_quality ? e.sleep_quality : 7, energy: e && e.energy ? e.energy : 7,
        mood: e && e.mood ? e.mood : 7, focus: e && e.focus ? e.focus : 7,
        stress: e && e.stress ? e.stress : 4, libido: e && e.libido ? e.libido : 7
      };
      if (!state.jMode) state.jMode = (state.jd.morningAt && !state.jd.eveningAt) || new Date().getHours() >= 15 ? 'avond' : 'ochtend';
      return state.jd;
    }
    function jSet(field, value) { if (state.jd) state.jd[field] = value; }
    function jSlider(field, value) {
      if (!state.jd) return;
      state.jd[field] = parseInt(value);
      const el = document.getElementById('jv-' + field);
      if (el) { el.textContent = value; el.style.color = getColor(parseInt(value), field === 'stress'); }
    }
    function jSleepCalc() {
      const jd = state.jd; if (!jd || !jd.bed || !jd.wake) return null;
      const [bh, bm] = jd.bed.split(':').map(Number), [wh, wm] = jd.wake.split(':').map(Number);
      if ([bh, bm, wh, wm].some(isNaN)) return null;
      let min = (wh * 60 + wm) - (bh * 60 + bm);
      if (min === 0) return null; // zelfde tijd = waarschijnlijk een tikfout
      if (min < 0) min += 24 * 60;
      return min;
    }
    function jSleepText() {
      const m = jSleepCalc();
      return m === null ? 'Vul je tijden in' : `${Math.floor(m / 60)} u ${String(m % 60).padStart(2, '0')} min geslapen`;
    }
    function jTime(field, value) {
      jSet(field, value);
      const el = document.getElementById('j-sleeptxt');
      if (el) { el.textContent = jSleepText(); el.style.color = jSleepCalc() !== null && jSleepCalc() >= 420 ? '#22c55e' : '#a3a3a3'; }
    }
    function jGoalList(text) {
      return String(text || '').split('\n').map(l => l.replace(/^\s*\d+\s*[.)\-:]\s*/, '').trim()).filter(Boolean).slice(0, 5);
    }
    function jGoalToggle(i, checked) {
      const jd = state.jd; if (!jd) return;
      const n = jGoalList(jd.goals).length;
      jd.goalsDone = Array.from({ length: n }, (_, k) => k === i ? checked : !!jd.goalsDone[k]);
      const done = jd.goalsDone.filter(Boolean).length;
      const el = document.getElementById('j-goalscore'); if (el) el.textContent = `${done} / ${n}`;
      const row = document.getElementById('j-goal-' + i); if (row) row.classList.toggle('done', checked);
    }
    function jValue(v, val) {
      if (!state.jd) return;
      state.jd.valuesCheck = { ...(state.jd.valuesCheck || {}), [v]: parseInt(val) };
      const el = document.getElementById('jvc-' + valueSlug(v));
      if (el) { el.textContent = val; el.style.color = getColor(parseInt(val)); }
    }
    function jSwapPrompt() { if (state.jd) { state.jd.swap = !state.jd.swap; render(); } }
    function setJMode(m) { state.jMode = m; render(); window.scrollTo(0, 0); }

    // Zondag: alle 5 waarden meegeven (niet aangeraakt = 5)
    function jdValuesCheck(jd) {
      const top = latestValues();
      if (!top || new Date(jd.date + 'T12:00:00').getDay() !== 0 || !jd.eveningAt) return jd.valuesCheck || null;
      const out = {};
      const prev = valuesLiving() || {};
      top.top.forEach(v => out[v] = (jd.valuesCheck || {})[v] || (prev[v] && prev[v].score) || 5);
      return out;
    }
    async function saveJournalDay(part) {
      if (!state.user) return;
      const jd = jdInit();
      document.querySelectorAll('[data-jf]').forEach(el => { jd[el.dataset.jf] = el.value; });
      const now = new Date().toISOString();
      if (part === 'ochtend') {
        if (!jGoalList(jd.goals).length) { alert('Schrijf minstens één ding op dat je vandaag wilt waarmaken.'); return; }
        jd.morningAt = jd.morningAt || now;
      } else {
        if (!jd.gratitude.trim() && !jd.answer.trim() && !jd.win.trim()) { alert('Vul minstens je dankbaarheid, de vraag of je overwinning in.'); return; }
        jd.eveningAt = jd.eveningAt || now;
      }
      const prompt = journalPromptFor(jd.date, jd.swap);
      const daily = {
        bed: jd.bed, wake: jd.wake, sleepMin: jSleepCalc(), goals: jd.goals, goalsDone: jd.goalsDone,
        gratitude: jd.gratitude, prompt: prompt.text, theme: prompt.theme, answer: jd.answer, win: jd.win,
        tomorrow: jd.tomorrow, hard: jd.hard, swap: jd.swap, valuesCheck: jdValuesCheck(jd), morningAt: jd.morningAt, eveningAt: jd.eveningAt
      };
      const row = { user_id: state.user.id, date: jd.date, daily, content: jd.free || '', habits: { ...state.habits }, energy: jd.energy, sleep_quality: jd.sleep };
      if (jd.eveningAt) Object.assign(row, { mood: jd.mood, focus: jd.focus, stress: jd.stress, libido: jd.libido });
      const btn = document.getElementById('j-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }
      let res;
      if (jd.id) res = await supabaseClient.from('journal_entries').update(row).eq('id', jd.id);
      else {
        res = await supabaseClient.from('journal_entries').insert([row]).select().single();
        if (!res.error && res.data) jd.id = res.data.id;
      }
      if (res.error) {
        if (btn) { btn.disabled = false; btn.textContent = part === 'ochtend' ? 'Ochtend opslaan' : 'Dag afsluiten'; }
        alert('Fout bij opslaan: ' + res.error.message + (/daily/.test(res.error.message) ? '\n\nVoer eerst journal-update.sql uit in Supabase.' : ''));
        return;
      }
      await loadEntries();
      state.jd = null; jdInit();
      if (part === 'ochtend') state.jMode = 'avond';
      render();
      window.scrollTo(0, 0);
      showToast(part === 'ochtend' ? '☀️ Ochtend opgeslagen · tot vanavond' : '🌙 Dag afgesloten');
    }

    function jSliderHtml(field, label) {
      const v = state.jd[field];
      return `
        <div class="slider-group">
          <div class="slider-header">
            <span class="slider-label">${label}</span>
            <span class="slider-value" id="jv-${field}" style="color: ${getColor(v, field === 'stress')}">${v}</span>
          </div>
          <input type="range" class="slider ${field === 'stress' ? 'slider-stress' : ''}" min="1" max="10" value="${v}" oninput="jSlider('${field}', this.value)" aria-label="${label}">
        </div>`;
    }

    function renderJournalToday() {
      const jd = jdInit();
      const mode = state.jMode;
      const dateLabel = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
      const vtop = latestValues();
      const tabs = `
        ${vtop ? `<button class="j-values" onclick="openValues();" aria-label="Mijn waarden bekijken"><span>🧭</span>${vtop.top.map(esc).join(' · ')}</button>` : ''}
        ${mode === 'ochtend' && compassWhyLine() ? `<button class="j-why" onclick="setSection('kompas')"><span>Je waarom</span>${esc(compassWhyLine())}</button>` : ''}
        <div class="j-mode">
          <button class="${mode === 'ochtend' ? 'on' : ''}" onclick="setJMode('ochtend')">☀ Ochtend${jd.morningAt ? ' ✓' : ''}</button>
          <button class="${mode === 'avond' ? 'on' : ''}" onclick="setJMode('avond')">☾ Avond${jd.eveningAt ? ' ✓' : ''}</button>
        </div>
        <div class="j-date">${dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1)}</div>`;

      if (mode === 'ochtend') {
        const y = yesterdayJournalEntry();
        const tip = y && y.daily && y.daily.tomorrow ? y.daily.tomorrow : '';
        const sl = jSleepCalc();
        return `
          ${tabs}
          <div class="card">
            <label class="label">Hoe heb je geslapen?</label>
            <div class="j-times">
              <label>Naar bed<input type="time" class="form-input" value="${esc(jd.bed)}" oninput="jTime('bed', this.value)"></label>
              <span aria-hidden="true">→</span>
              <label>Opgestaan<input type="time" class="form-input" value="${esc(jd.wake)}" oninput="jTime('wake', this.value)"></label>
            </div>
            <div id="j-sleeptxt" style="font-size: 12px; margin: 10px 0 6px; color: ${sl !== null && sl >= 420 ? '#22c55e' : '#a3a3a3'};">${jSleepText()}</div>
            ${jSliderHtml('sleep', '😴 Slaapkwaliteit')}
            ${jSliderHtml('energy', '⚡ Energie')}
          </div>
          ${tip ? `<div class="j-tip"><span>Gisteren: morgen beter</span>"${esc(tip)}"</div>` : ''}
          <div class="card j-main">
            <label class="j-q" for="j-goals">Wat zijn 3 dingen die ik vandaag wil waarmaken?</label>
            <textarea class="textarea j-lines" id="j-goals" data-jf="goals" placeholder="1.&#10;2.&#10;3." oninput="jSet('goals', this.value)">${esc(jd.goals || '')}</textarea>
            <div class="j-hint">Vanavond vink je ze af.</div>
          </div>
          <button class="btn btn-primary" id="j-save" style="width: 100%; padding: 18px;" onclick="saveJournalDay('ochtend')">${jd.morningAt ? 'Ochtend bijwerken' : 'Ochtend opslaan'}</button>
          <div class="j-foot">±2 minuten · vanavond verder bij Avond</div>
        `;
      }

      const prompt = journalPromptFor(jd.date, jd.swap);
      const goals = jGoalList(jd.goals);
      const done = goals.filter((g, i) => jd.goalsDone[i]).length;
      return `
        ${tabs}
        <div class="card j-main gold">
          <label class="j-q" for="j-grat">Waar ben ik dankbaar voor vandaag?</label>
          <textarea class="textarea j-lines" id="j-grat" data-jf="gratitude" placeholder="1.&#10;2.&#10;3." oninput="jSet('gratitude', this.value)">${esc(jd.gratitude || '')}</textarea>
        </div>

        <div class="card j-main">
          <div class="j-qhead">
            <span>Vraag van vandaag · ${prompt.theme}</span>
            <button class="j-swap" onclick="jSwapPrompt()">${jd.swap ? '↺ Vorige vraag' : '↻ Andere vraag'}</button>
          </div>
          <label class="j-q" for="j-answer" style="margin-top: 10px;">${esc(prompt.text)}</label>
          <textarea class="textarea" id="j-answer" data-jf="answer" placeholder="Je antwoord…" oninput="jSet('answer', this.value)">${esc(jd.answer || '')}</textarea>
        </div>

        <div class="card">
          <label class="j-lbl green" for="j-win">Overwinning van vandaag</label>
          <input type="text" class="form-input" id="j-win" data-jf="win" value="${esc(jd.win || '')}" placeholder="Wat deed jíj vandaag goed, hoe klein ook?" oninput="jSet('win', this.value)">
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span class="label" style="margin: 0;">Waargemaakt?</span>
            ${goals.length ? `<span id="j-goalscore" style="font-size: 13px; color: #22c55e; font-weight: 500;">${done} / ${goals.length}</span>` : ''}
          </div>
          ${goals.length ? `<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px;">
            ${goals.map((g, i) => `
              <label class="j-goal ${jd.goalsDone[i] ? 'done' : ''}" id="j-goal-${i}">
                <input type="checkbox" ${jd.goalsDone[i] ? 'checked' : ''} onchange="jGoalToggle(${i}, this.checked)">
                <span>${esc(g)}</span>
              </label>`).join('')}
          </div>` : `<div class="j-hint" style="margin-top: 10px;">Je hebt vanochtend geen doelen opgeschreven. <a href="#" onclick="setJMode('ochtend'); return false;">Nu nog invullen →</a></div>`}
        </div>

        <div class="card">
          <label class="label">Hoe was je dag?</label>
          ${jSliderHtml('mood', '😊 Stemming')}
          ${jSliderHtml('focus', '🧠 Focus')}
          ${jSliderHtml('stress', '😰 Stress')}
          ${jSliderHtml('libido', '🔥 Libido')}
        </div>

        ${vtop && new Date(jd.date + 'T12:00:00').getDay() === 0 ? `
          <div class="card" style="border-top: 3px solid #d9a441;">
            <label class="label">🧭 Waarden-check · hoe goed leefde je hier deze week naar?</label>
            ${vtop.top.map((v, i) => {
              const val = (jd.valuesCheck || {})[v] || ((valuesLiving() || {})[v] || {}).score || 5;
              return `
                <div class="slider-group">
                  <div class="slider-header">
                    <span class="slider-label">${i + 1}. ${esc(v)}</span>
                    <span class="slider-value" id="jvc-${valueSlug(v)}" style="color: ${getColor(val)}">${val}</span>
                  </div>
                  <input type="range" class="slider" min="1" max="10" value="${val}" oninput="jValue(${esc(JSON.stringify(v))}, this.value)" aria-label="${esc(v)}">
                </div>`;
            }).join('')}
          </div>` : ''}

        <details class="j-opt" ${jd.hard ? 'open' : ''}>
          <summary><span>Lastig moment vandaag? <i>· optioneel</i></span><b aria-hidden="true"></b></summary>
          <textarea class="textarea" data-jf="hard" placeholder="Wat was de trigger, en wat deed je?" oninput="jSet('hard', this.value)">${esc(jd.hard || '')}</textarea>
        </details>

        <div class="card">
          <label class="j-lbl gold" for="j-tom">Morgen beter</label>
          <input type="text" class="form-input" id="j-tom" data-jf="tomorrow" value="${esc(jd.tomorrow || '')}" placeholder="Eén ding dat je morgen anders doet" oninput="jSet('tomorrow', this.value)">
          <div class="j-hint">Staat morgenochtend klaar boven je 3 doelen.</div>
        </div>

        <details class="j-opt" ${jd.free ? 'open' : ''}>
          <summary><span>Vrij schrijven <i>· optioneel</i></span><b aria-hidden="true"></b></summary>
          <textarea class="textarea" data-jf="free" placeholder="Wat houdt je bezig?" oninput="jSet('free', this.value)">${esc(jd.free || '')}</textarea>
        </details>

        <button class="btn btn-primary" id="j-save" style="width: 100%; padding: 18px; margin-top: 8px;" onclick="saveJournalDay('avond')">${jd.eveningAt ? 'Dag bijwerken' : 'Dag afsluiten'}</button>
        <div class="j-foot">±5 minuten</div>
      `;
    }

    function renderDailyEntry(entry) {
      const d = entry.daily || {};
      const goals = jGoalList(d.goals);
      const done = goals.filter((g, i) => (d.goalsDone || [])[i]).length;
      const lines = t => jGoalList(t).map(x => `<li>${esc(x)}</li>`).join('');
      const isToday = entry.date === todayStr();
      return `
        <div class="entry">
          <div class="entry-date">${formatDate(entry.date)}${d.theme ? ` · <span style="color: #8a8a8a;">${esc(d.theme)}</span>` : ''}</div>
          <div class="entry-scores">
            ${entry.mood ? `<span class="entry-score" style="color: ${getColor(entry.mood)}">😊 ${entry.mood}</span>` : ''}
            ${entry.energy ? `<span class="entry-score" style="color: ${getColor(entry.energy)}">⚡ ${entry.energy}</span>` : ''}
            ${d.sleepMin ? `<span class="entry-score" style="color: #a3a3a3;">😴 ${Math.floor(d.sleepMin / 60)}u${String(d.sleepMin % 60).padStart(2, '0')}</span>` : ''}
            ${goals.length ? `<span class="entry-score" style="color: ${done === goals.length ? '#22c55e' : '#a3a3a3'};">🎯 ${done}/${goals.length}</span>` : ''}
          </div>
          ${d.gratitude ? `<div class="j-h-lbl">Dankbaar</div><ol class="j-h-list">${lines(d.gratitude)}</ol>` : ''}
          ${d.answer ? `<div class="j-h-lbl">${esc(d.prompt || 'Vraag van vandaag')}</div><div class="entry-content">${esc(d.answer)}</div>` : ''}
          ${d.win ? `<div class="j-h-lbl">Overwinning</div><div class="entry-content">${esc(d.win)}</div>` : ''}
          ${d.tomorrow ? `<div class="j-h-lbl">Morgen beter</div><div class="entry-content">${esc(d.tomorrow)}</div>` : ''}
          ${d.hard ? `<div class="j-h-lbl">Lastig moment</div><div class="entry-content">${esc(d.hard)}</div>` : ''}
          ${entry.content ? `<div class="j-h-lbl">Vrij geschreven</div><div class="entry-content">${esc(entry.content)}</div>` : ''}
          <div class="entry-actions">
            ${isToday ? `<button class="entry-action" onclick="state.journalTab = 'new'; state.editingId = null; render(); window.scrollTo(0, 0);">✏️ Bewerken</button>` : ''}
            <button class="entry-action delete" onclick="deleteEntry('${entry.id}')">🗑️ Verwijderen</button>
          </div>
        </div>`;
    }

    function renderJournal() {
      // 'today' (links uit Vandaag te doen) is hetzelfde tabblad als 'new'
      if (state.journalTab === 'today') state.journalTab = 'new';
      return `
        <div class="page-header">
          <div class="page-sub">Mind</div>
          <div class="page-title">Journal</div>
        </div>
        
        <div class="stats">
          <div class="stat">
            <div class="stat-value">${journaledEntries().length}</div>
            <div class="stat-label">Entries</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: ${getColor(parseFloat(getAverageMood()) || 5)}">${getAverageMood()}</div>
            <div class="stat-label">Mood</div>
          </div>
          <div class="stat">
            <div class="stat-value">${getJournalStreak()}</div>
            <div class="stat-label">Streak</div>
          </div>
          <div class="stat">
            <div class="stat-value">${getAverageEnergy()}</div>
            <div class="stat-label">Energie</div>
          </div>
        </div>
        
        <div class="tabs">

          <button class="tab ${state.journalTab === 'patterns' ? 'active' : ''}" onclick="setJournalTab('patterns')">Patronen</button>
        </div>
        
        ${state.journalTab === 'new' ? (state.editingId ? renderNewEntry() : renderJournalToday()) : ''}
        ${state.journalTab === 'history' ? renderHistory() : ''}

      `;
    }

    function renderNewEntry() {
      const prompt = getDailyPrompt();
      return `
        ${state.editingId ? `
          <div class="card card-accent">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 12px; color: #7f1d1d;">✏️ Je bewerkt een entry</span>
              <button onclick="state.editingId = null; state.content = ''; render();" style="background: transparent; border: none; color: #525252; font-size: 11px; cursor: pointer;">Annuleer</button>
            </div>
          </div>
        ` : `
          <div class="prompt">
            <div class="prompt-label">📝 Vraag van vandaag</div>
            <div class="prompt-text">"${prompt}"</div>
          </div>
        `}
        
        <div class="card">
          <label class="label">Schrijf je gedachten</label>
          <textarea class="textarea" id="entry-content" placeholder="Wat houdt je bezig?">${state.content}</textarea>
        </div>
        
        <div class="card">
          <label class="label">Hoe voel je je?</label>
          ${['mood', 'energy', 'libido', 'focus', 'stress', 'sleep'].map(key => {
            const icons = { mood: '😊', energy: '⚡', libido: '🔥', focus: '🧠', stress: '😰', sleep: '😴' };
            const labels = { mood: 'Stemming', energy: 'Energie', libido: 'Libido', focus: 'Focus', stress: 'Stress', sleep: 'Slaap' };
            const value = state[key];
            const isStress = key === 'stress';
            return `
              <div class="slider-group">
                <div class="slider-header">
                  <span class="slider-label">${icons[key]} ${labels[key]}</span>
                  <span class="slider-value" id="${key}-value" style="color: ${getColor(value, isStress)}">${value}</span>
                </div>
                <input type="range" class="slider ${isStress ? 'slider-stress' : ''}" min="1" max="10" value="${value}" oninput="updateSlider('${key}', this.value)">
              </div>
            `;
          }).join('')}
        </div>
        
        <div class="card">
          <label class="label">Vandaag's Habits</label>
          <div class="info-box" style="margin-bottom: 12px;">
            <div class="info-text">💡 Habits worden automatisch gekoppeld aan je journal entry</div>

    // Alle tekst van een entry, om in te zoeken
    function entryText(e) {
      const d = e.daily || {};
      return [d.theme, d.prompt, d.answer, d.win, d.tomorrow, d.hard, jGoalList(d.gratitude).join(' '), jGoalList(d.goals).join(' '), e.content].filter(Boolean).join(' \n ');
    }
    // Eerste stuk tekst dat de moeite waard is om terug te lezen
    function entrySnippet(e, q) {
      const d = e.daily || {};
      const parts = [['Overwinning', d.win], ['Dankbaar', jGoalList(d.gratitude).join(' · ')], [d.prompt || 'Vraag', d.answer], ['Lastig moment', d.hard], ['Morgen beter', d.tomorrow], ['Doelen', jGoalList(d.goals).join(' · ')], ['Vrij geschreven', e.content]].filter(p => p[1]);
      let hit = q ? parts.find(p => p[1].toLowerCase().includes(q)) : parts[0];
      if (!hit) return null;
      let t = hit[1];
      if (q) { const i = t.toLowerCase().indexOf(q); if (i > 60) t = '…' + t.slice(i - 40); }
      return [hit[0], t.length > 160 ? t.slice(0, 160) + '…' : t];
    }
    // Terugblik: wat schreef je een week, maand, drie maanden en een jaar geleden?
    function journalLookback() {
      const today = todayStr();
      const byDate = {};
      journaledEntries().forEach(e => { if (!byDate[e.date] && entrySnippet(e)) byDate[e.date] = e; });
      const out = [];
      [[365, 'Een jaar geleden', 7], [91, '3 maanden geleden', 5], [30, 'Een maand geleden', 3], [7, 'Een week geleden', 1]].forEach(([back, label, spread]) => {
        if (out.length >= 2) return;
        const target = dateAdd(today, -back);
        for (let o = 0; o <= spread; o++) {
          const e = byDate[dateAdd(target, -o)] || byDate[dateAdd(target, o)];
          if (e && !out.some(x => x.e === e)) { out.push({ label, e }); break; }
        }
      });
      return out;
    }
    function renderLookback() {
      const lb = journalLookback();
      if (!lb.length) return '';
      return `
        <div class="card j-lb">
          <label class="label">⏳ Terugblik</label>
          ${lb.map(({ label, e }) => { const [k, t] = entrySnippet(e); return `
            <div class="j-lb-row">
              <div class="j-lb-when">${label} · ${formatDate(e.date)}</div>
              <div class="j-lb-k">${esc(k)}</div>
              <div class="j-lb-t">${esc(t)}</div>
            </div>`; }).join('')}
        </div>`;
    }
    function journalSearch(v) {

    function valuesData() {
      const s = state.bodySettings || {};
      if (s.values_data && Array.isArray(s.values_data.rounds)) return s.values_data;
      try { const v = JSON.parse(localStorage.getItem('pf_values') || 'null'); if (v && Array.isArray(v.rounds)) return v; } catch (e) {}
      return { rounds: [] };
    }
    async function saveValuesData(data) {
      state.bodySettings = { ...(state.bodySettings || {}), values_data: data };
      try { localStorage.setItem('pf_values', JSON.stringify(data)); } catch (e) {}
      if (!state.user) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, values_data: data }, { onConflict: 'user_id' });
      state.valuesLocal = !!error;
      if (error) console.warn('Waarden alleen lokaal opgeslagen (voer waarden-update.sql uit):', error.message);
    }
    function latestValues() {
      const r = valuesData().rounds;

    // Laatste "leef ik ernaar"-cijfers: zondagcheck in de journal als die nieuwer is dan de laatste ronde
    function valuesLiving() {
      const round = latestValues();
      if (!round) return null;
      const out = {};
      round.top.forEach(v => out[v] = { score: round.scores[v] || null, from: 'opdracht', date: round.date, trend: [] });
      state.entries.filter(e => e.daily && e.daily.valuesCheck && e.date >= round.date)
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach(e => round.top.forEach(v => {
          const sc = e.daily.valuesCheck[v];
          if (sc) { out[v].score = sc; out[v].from = 'zondag'; out[v].date = e.date; out[v].trend.push(sc); }
        }));
      return out;
    }
    function valuesBiggestGap() {
      const round = latestValues(); const liv = valuesLiving();
      if (!round || !liv) return null;
      let best = null;
      round.top.forEach((v, i) => {
        const sc = liv[v].score; if (!sc) return;
        const gap = 10 - sc;
        if (!best || gap > best.gap || (gap === best.gap && i < best.rank)) best = { v, gap, sc, rank: i };
      });
      return best && best.gap >= 3 ? best : null;
    }
    function valuesReminderDue() {
      const r = latestValues();
      return r && diffDays(r.date, todayStr()) >= 90;
    }

      if (n === 3 && f.top.length !== 5) { alert('Kies precies 5 waarden.'); return; }
      f.step = n; render(); window.scrollTo(0, 0);
    }
    function vfToggle(v) {
      const f = state.vf;
      if (f.top.includes(v)) f.top = f.top.filter(x => x !== v);
      else if (f.top.length < 5) f.top.push(v);

      render();

              <textarea class="textarea" id="vq-${i}" style="min-height: 90px;" oninput="vfAnswer(${i}, this.value)">${esc(f.answers[i])}</textarea>
            </div>`).join('')}
          <div class="hs-small" style="margin-bottom: 16px;">💡 Handig om te weten: je hoogste waarden veranderen per levensfase. Vul de vragen daarom af en toe opnieuw in.</div>
          <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="vfStep(2)">Verder: kies je top 5 →</button>`;
      }
      if (f.step === 2) {
        const opts = [...new Set([...valueOptions, ...f.top])];
        return `${head}
          <div class="card">
            <label class="label">Kies je 5 belangrijkste waarden · ${f.top.length}/5</label>
            <div class="hs-small" style="margin-bottom: 12px;">Kijk naar je antwoorden: welke woorden komen steeds terug? Kies wat je laat zien in hoe je leeft, niet wat je zou moeten vinden.</div>
            <div class="chips" style="margin: 0;">
              ${opts.map(v => `<button class="chip ${f.top.includes(v) ? 'active' : ''}" onclick="vfToggle(${esc(JSON.stringify(v))})">${esc(v)}</button>`).join('')}
            </div>
            <div class="goal-update" style="margin-top: 12px;">
              <input type="text" class="input-sm" id="vf-custom" placeholder="Eigen waarde" onkeydown="if(event.key === 'Enter') vfCustom()">
              <button class="btn btn-secondary btn-small" onclick="vfCustom()">+ Toevoegen</button>
            </div>
          </div>
          ${f.top.length ? `
            <div class="card">
              <label class="label">Op volgorde: belangrijkste bovenaan</label>
              ${f.top.map((v, i) => `
                <div class="v-order">
                  <span class="v-rank">${i + 1}</span><span style="flex: 1;">${esc(v)}</span>
                  <button class="icon-btn" onclick="vfMove(${i}, -1)" aria-label="${esc(v)} omhoog">↑</button>
                  <button class="icon-btn" onclick="vfMove(${i}, 1)" aria-label="${esc(v)} omlaag">↓</button>
                </div>`).join('')}
            </div>` : ''}
          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
            <button class="btn btn-secondary" onclick="vfStep(1)">← Vragen</button>
            <button class="btn btn-primary" onclick="vfStep(3)">Verder: cijfers →</button>
          </div>`;
      }
      return `${head}
        <div class="card">
          <label class="label">Hoe goed leef je hier nu naar?</label>
          <div class="hs-small" style="margin-bottom: 8px;">1 = helemaal niet · 10 = volledig. Wees eerlijk: het gat laat zien waar je eerste stap ligt.</div>
          ${f.top.map((v, i) => {
            const val = f.scores[v] || 5;
            return `
              <div class="slider-group">
                <div class="slider-header">
                  <span class="slider-label">${i + 1}. ${esc(v)}</span>
                  <span class="slider-value" id="vfs-${valueSlug(v)}" style="color: ${getColor(val)}">${val}</span>
                </div>
                <input type="range" class="slider" min="1" max="10" value="${val}" oninput="vfScore(${esc(JSON.stringify(v))}, this.value)" aria-label="${esc(v)}">
              </div>`;
          }).join('')}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
          <button class="btn btn-secondary" onclick="vfStep(2)">← Top 5</button>
          <button class="btn btn-primary" onclick="vfSave()">Opslaan</button>
        </div>`;
    }


    // ============================================
    // VOEDING
    // Bronnen: NEVO-online 2025/9.0 (RIVM) als nevo.json, Open Food Facts live, eigen producten
    // ============================================
    const foodMeals = [['ontbijt', 'Ontbijt'], ['lunch', 'Lunch'], ['diner', 'Diner'], ['snacks', 'Snacks']];
    const foodNutr = ['kcal', 'prot', 'carb', 'fat', 'fib', 'sugar', 'sat', 'salt'];
    const NEVO_SOURCE = 'Gebaseerd op gegevens van NEVO-online versie 2025/9.0, RIVM, Bilthoven en andere gegevens (Open Food Facts)';
    let nevoData = null, nevoLoading = null;

    function loadNevo() {
      if (nevoData) return Promise.resolve(nevoData);
      if (!nevoLoading) {
        nevoLoading = fetch('nevo.json').then(r => r.json()).then(d => {
          d.items = d.items.map(it => {
            const [code, name, group, ml, kcal, prot, carb, fat, fib, sugar, sat, na, syn] = it;
            return { key: 'nevo:' + code, src: 'NEVO', code, name, syn, group: d.groups[group], ml: !!ml,
              per100: { kcal, prot, carb, fat, fib, sugar, sat, salt: na === null || na === undefined ? null : Math.round(na * 2.5) / 1000 },
              search: (name + ' ' + (syn || '')).toLowerCase() };
          });
          nevoData = d;
          return d;
        }).catch(e => { nevoLoading = null; throw e; });
      }
      return nevoLoading;
    }

    function nutritionSettings() {
      const s = state.bodySettings || {};
      if (s.nutrition) return s.nutrition;
      try { const v = JSON.parse(localStorage.getItem('pf_nutrition') || 'null'); if (v) return v; } catch (e) {}
      return {};
    }
    async function saveNutritionSettings(patch) {
      const n = { ...nutritionSettings(), ...patch };
      state.bodySettings = { ...(state.bodySettings || {}), nutrition: n };
      try { localStorage.setItem('pf_nutrition', JSON.stringify(n)); } catch (e) {}
      if (!state.user) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, nutrition: n }, { onConflict: 'user_id' });
      if (error) console.warn('Voedingsinstellingen alleen lokaal (voer voeding-update.sql uit):', error.message);
    }

    async function loadFood() {
      if (!state.user) return;
      const since = dateAdd(todayStr(), -120);
      const res = await supabaseClient.from('food_logs').select('*').eq('user_id', state.user.id).gte('date', since);
      if (res.error) { state.foodError = true; state.foodLogs = []; return; }
      state.foodError = false;
      state.foodLogs = res.data || [];
      // Voor XP: aantal gelogde items per dag, alle tijd (alleen de datumkolom)
      const all = await supabaseClient.from('food_logs').select('date').eq('user_id', state.user.id);
      const cnt = {};
      (all.error ? state.foodLogs : (all.data || [])).forEach(r => { cnt[r.date] = (cnt[r.date] || 0) + 1; });
      state.foodDayCounts = cnt;
    }

    // Doelen: Mifflin-St Jeor × activiteit ± doel; eiwit uit het eiwitschema; vet 30%; rest koolhydraten
    const activityLevels = [['Weinig actief', 'Zittend werk, weinig sport', 1.2], ['Licht actief', '1–3 trainingen per week', 1.375], ['Actief', '4–5 trainingen per week', 1.55], ['Zeer actief', '6+ trainingen of zwaar lichamelijk werk', 1.725]];
    // Calorie-aanpassing per doel uit het eiwitschema (zelfde volgorde als proteinGoals)
    const goalKcalAdj = [0, 0, 0, 250, -500, 0];
    function foodTargets() {
      const g = nutritionSettings().goals || {};
      const w = Number(latestBodyValue('weight')) || Number(g.weight) || null;
      const h = Number((state.bodySettings || {}).height_cm) || Number(g.height) || null;
      const age = g.birthYear ? new Date().getFullYear() - Number(g.birthYear) : null;
      if (g.manual && g.kcal) return { kcal: +g.kcal, prot: +g.prot || 0, carb: +g.carb || 0, fat: +g.fat || 0, manual: true, w };
      if (!w || !h || !age) return null;
      const bmr = 10 * w + 6.25 * h - 5 * age + (g.sex === 'v' ? -161 : 5);
      const act = (activityLevels[g.activity ?? 2] || activityLevels[2])[2];
      const gi = proteinGoalIdx();
      const adj = goalKcalAdj[gi] || 0;
      const kcal = Math.round((bmr * act + adj) / 10) * 10;
      const pg = proteinGoals[gi] || proteinGoals[3];
      const prot = Math.round(w * (pg[1] + pg[2]) / 2);
      const fat = Math.round(kcal * 0.3 / 9);
      const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
      return { kcal, prot, carb, fat, w, bmr: Math.round(bmr), act, adj, pgLabel: pg[0] };
    }

    function foodScale(per100, grams) {
      const out = {};
      foodNutr.forEach(k => { const v = per100[k]; out[k] = v === null || v === undefined ? null : Math.round(v * grams / 100 * 10) / 10; });
      return out;
    }
    function foodDayLogs(date) { return (state.foodLogs || []).filter(l => l.date === date); }
    function foodSum(logs) {
      const s = { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0, sugar: 0, sat: 0, salt: 0 };
      logs.forEach(l => foodNutr.forEach(k => { s[k] += Number(l[k]) || 0; }));
      return s;
    }
    const f1 = n => String(Math.round((Number(n) || 0) * 10) / 10).replace('.', ',');
    const f0 = n => fmtInt(Math.round(Number(n) || 0));

    // Zoeken
    function foodCustomItems() {
      return (nutritionSettings().customFoods || []).map(c => ({ key: 'custom:' + c.id, src: 'EIGEN', name: c.name, per100: c.per100, portion: c.portion || null, ml: false, search: c.name.toLowerCase() }));
    }
    function foodLocalSearch(q) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length || !nevoData) return [];
      const pool = [...foodCustomItems(), ...nevoData.items];
      return pool.filter(it => terms.every(t => it.search.includes(t)))
        .map(it => ({ it, score: (it.search.startsWith(terms[0]) ? 0 : 1) + (it.src === 'EIGEN' ? -1 : 0) + it.name.length / 100 }))
        .sort((a, b) => a.score - b.score).slice(0, 40).map(x => x.it);
    }
    function offToItem(p) {
      const n = p.nutriments || {};
      const kcal = n['energy-kcal_100g'] ?? (n.energy_100g ? n.energy_100g / 4.184 : null);
      if (kcal === null || kcal === undefined) return null;
      const name = [p.brands ? String(p.brands).split(',')[0].trim() : '', p.product_name || p.product_name_nl || ''].filter(Boolean).join(' ') || 'Onbekend product';
      return { key: 'off:' + p.code, src: 'OFF', code: p.code, name, ml: false,
        per100: { kcal: Math.round(kcal), prot: n.proteins_100g ?? null, carb: n.carbohydrates_100g ?? null, fat: n.fat_100g ?? null, fib: n.fiber_100g ?? null, sugar: n.sugars_100g ?? null, sat: n['saturated-fat_100g'] ?? null, salt: n.salt_100g ?? null },
        portion: Number(p.serving_quantity) ? { g: Number(p.serving_quantity), label: p.serving_size || '1 portie' } : null };
    }
    const offFields = 'code,product_name,product_name_nl,brands,nutriments,serving_quantity,serving_size';
    async function foodOffSearch() {
      const q = (state.fQuery || '').trim();
      if (q.length < 2) return;
      state.fOff = { loading: true, items: [] }; render();
      try {
        const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&tagtype_0=countries&tag_contains_0=contains&tag_0=netherlands&fields=${offFields}`;
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        state.fOff = { loading: false, items: (d.products || []).map(offToItem).filter(Boolean) };
      } catch (e) {
        state.fOff = { loading: false, items: [], error: 'Open Food Facts is nu niet bereikbaar. Probeer het zo nog eens.' };
      }
      render();
    }
    async function foodBarcode(code) {
      code = String(code || '').replace(/\D/g, '');
      if (code.length < 6) { alert('Dat is geen geldige barcode.'); return; }
      showToast('Product opzoeken…');
      try {
        const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${offFields}`);
        const d = await r.json();
        const it = d && d.product ? offToItem({ ...d.product, code }) : null;
        if (!it) { alert('Dit product staat (nog) niet in Open Food Facts, of zonder voedingswaarden. Zoek het op naam of voeg het toe als eigen product.'); return; }
        openFoodProduct(it);
      } catch (e) { alert('Open Food Facts is nu niet bereikbaar. Probeer het zo nog eens.'); }
    }

    // Barcode scannen met de camera (html5-qrcode wordt pas geladen als je hem nodig hebt)
    let foodScanner = null;
    function loadScript(src) {
      return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    }
    async function startFoodScan() {
      state.fScan = true; render();
      try {
        if (!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
        const formats = window.Html5QrcodeSupportedFormats;
        foodScanner = new Html5Qrcode('food-scan', formats ? { formatsToSupport: [formats.EAN_13, formats.EAN_8, formats.UPC_A, formats.UPC_E] } : undefined);
        await foodScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, text => { stopFoodScan(); foodBarcode(text); }, () => {});
      } catch (e) {
        stopFoodScan();
        alert('De camera kon niet starten. Geef de app toestemming voor je camera, of typ de barcode in.');
      }
    }
    function stopFoodScan() {
      const s = foodScanner; foodScanner = null;
      if (s) { try { s.stop().catch(() => {}).finally(() => { try { s.clear(); } catch (e) {} }); } catch (e) {} }
      state.fScan = false; render();
    }

    // Navigatie binnen Voeding
    function setFoodDate(n) { state.fDate = dateAdd(state.fDate || todayStr(), n); if (state.fDate > todayStr()) state.fDate = todayStr(); render(); }
    function openFoodAdd(meal) {
      state.fMeal = meal || state.fMeal || defaultFoodMeal();
      state.fView = 'add'; state.fQuery = ''; state.fOff = null; state.fTab = 'search';
      render(); window.scrollTo(0, 0);
      loadNevo().then(() => { if (state.fView === 'add') render(); }).catch(() => { state.nevoError = true; render(); });
    }
    function defaultFoodMeal() { const h = new Date().getHours(); return h < 11 ? 'ontbijt' : h < 15 ? 'lunch' : h < 21 ? 'diner' : 'snacks'; }
    function foodQueryInput(v) {
      state.fQuery = v; state.fOff = null;
      const box = document.getElementById('food-results');
      if (box) box.innerHTML = renderFoodResults();
    }
    function foodItemFromLog(l) {
      const per100 = {};
      foodNutr.forEach(k => per100[k] = l.grams ? (Number(l[k]) || 0) * 100 / Number(l.grams) : null);
      return { key: l.ref || ('log:' + l.id), src: l.source === 'nevo' ? 'NEVO' : l.source === 'off' ? 'OFF' : l.source === 'quick' ? 'SNEL' : 'EIGEN', name: l.name, per100, ml: false };
    }
    function openFoodProduct(item, logId) {
      const last = (state.foodLogs || []).filter(l => l.ref === item.key && l.id !== logId).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0];
      const log = logId ? (state.foodLogs || []).find(l => l.id === logId) : null;
      state.fProduct = { item, grams: log ? String(Number(log.grams)) : (last ? String(Number(last.grams)) : (item.portion ? String(item.portion.g) : '100')), last: last ? Number(last.grams) : null, logId: logId || null, meal: log ? log.meal : state.fMeal };
      state.fView = 'product'; render(); window.scrollTo(0, 0);
    }
    function foodPick(key) {
      const it = (state.fPickMap || {})[key];
      if (it) openFoodProduct(it);
    }
    function foodGrams(v) {
      state.fProduct.grams = v;
      const g = pnum(v) || 0;
      const n = foodScale(state.fProduct.item.per100, g);
      foodNutr.forEach(k => { const el = document.getElementById('fp-' + k); if (el) el.textContent = n[k] === null ? '–' : (k === 'kcal' ? f0(n[k]) : f1(n[k])); });
      const hint = document.getElementById('fp-hint'); if (hint) hint.innerHTML = foodProteinHint(n.prot);
      document.querySelectorAll('.fp-chip').forEach(b => b.classList.toggle('on', Number(b.dataset.g) === g));
    }
    function foodProteinHint(addProt) {
      const t = foodTargets(); if (!t || !t.prot) return '';
      const p = state.fProduct;
      const day = foodSum(foodDayLogs(state.fDate || todayStr()).filter(l => l.id !== p.logId)).prot + (Number(addProt) || 0);
      return `Hiermee kom je op <b style="color: #f2cf7a;">${f0(day)} / ${t.prot} g eiwit</b> vandaag${day >= t.prot ? ' ✓' : ''}`;
    }
    async function saveFoodLog() {
      const p = state.fProduct; const g = pnum(p.grams);
      if (!g || g <= 0) { alert('Vul de hoeveelheid in grammen in.'); return; }
      const n = foodScale(p.item.per100, g);
      const row = { user_id: state.user.id, date: state.fDate || todayStr(), meal: p.meal || state.fMeal || 'snacks', name: p.item.name,
        source: p.item.src === 'NEVO' ? 'nevo' : p.item.src === 'OFF' ? 'off' : p.item.src === 'SNEL' ? 'quick' : 'custom', ref: p.item.key, grams: g, ...n };
      const res = p.logId ? await supabaseClient.from('food_logs').update(row).eq('id', p.logId) : await supabaseClient.from('food_logs').insert([row]);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message + (/food_logs/.test(res.error.message) ? '\n\nVoer eerst voeding-update.sql uit in Supabase.' : '')); return; }
      await loadFood();
      state.fView = 'day'; state.fProduct = null;
      render(); window.scrollTo(0, 0);
      showToast(p.logId ? '✓ Bijgewerkt' : '✓ ' + p.item.name + ' toegevoegd');
    }
    async function deleteFoodLog(id) {
      if (!confirm('Verwijderen?')) return;
      await supabaseClient.from('food_logs').delete().eq('id', id);
      await loadFood(); state.fView = 'day'; state.fProduct = null; render();
    }
    function toggleFoodFav(key) {
      const favs = nutritionSettings().favorites || [];
      const items = { ...(nutritionSettings().favItems || {}) };
      const on = favs.includes(key);
      if (!on && state.fProduct) items[key] = { name: state.fProduct.item.name, src: state.fProduct.item.src, per100: state.fProduct.item.per100, portion: state.fProduct.item.portion || null };
      if (on) delete items[key];
      saveNutritionSettings({ favorites: on ? favs.filter(k => k !== key) : [...favs, key], favItems: items });
      const b = document.getElementById('fp-fav'); if (b) { b.textContent = on ? '☆' : '★'; b.setAttribute('aria-pressed', on ? 'false' : 'true'); }
    }

    // Snel invoeren & eigen product & maaltijden
    async function saveQuickFood() {
      const v = id => pnum((document.getElementById(id) || {}).value);
      const name = ((document.getElementById('fq-name') || {}).value || '').trim() || 'Snel ingevoerd';
      const kcal = v('fq-kcal');
      if (!kcal) { alert('Vul minstens de calorieën in.'); return; }
      const row = { user_id: state.user.id, date: state.fDate || todayStr(), meal: state.fMeal, name, source: 'quick', ref: null, grams: 100,
        kcal, prot: v('fq-prot') || 0, carb: v('fq-carb') || 0, fat: v('fq-fat') || 0, fib: null, sugar: null, sat: null, salt: null };
      const res = await supabaseClient.from('food_logs').insert([row]);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message); return; }
      await loadFood(); state.fView = 'day'; render(); showToast('✓ Toegevoegd');
    }
    async function saveCustomFood() {
      const v = id => pnum((document.getElementById(id) || {}).value);
      const name = ((document.getElementById('fc-name') || {}).value || '').trim();
      if (!name || v('fc-kcal') === null) { alert('Vul minstens de naam en de calorieën per 100 g in.'); return; }
      const per100 = { kcal: v('fc-kcal'), prot: v('fc-prot') || 0, carb: v('fc-carb') || 0, fat: v('fc-fat') || 0, fib: v('fc-fib'), sugar: v('fc-sugar'), sat: v('fc-sat'), salt: v('fc-salt') };
      const portion = v('fc-portion') ? { g: v('fc-portion'), label: '1 portie' } : null;
      const c = { id: Date.now().toString(36), name, per100, portion };
      await saveNutritionSettings({ customFoods: [...(nutritionSettings().customFoods || []), c] });
      openFoodProduct({ key: 'custom:' + c.id, src: 'EIGEN', name, per100, portion });
    }
    async function saveMealPreset(meal) {
      const logs = foodDayLogs(state.fDate || todayStr()).filter(l => l.meal === meal);
      if (!logs.length) return;
      const name = prompt('Naam van deze maaltijd:', foodMeals.find(m => m[0] === meal)[1] + ' standaard');
      if (!name) return;
      const items = logs.map(l => ({ name: l.name, source: l.source, ref: l.ref, grams: Number(l.grams), per100: foodItemFromLog(l).per100 }));
      await saveNutritionSettings({ mealPresets: [...(nutritionSettings().mealPresets || []), { id: Date.now().toString(36), name: name.trim(), items }] });
      showToast('⭐ Maaltijd bewaard');
      render();
    }
    async function addMealPreset(id) {
      const m = (nutritionSettings().mealPresets || []).find(x => x.id === id);
      if (!m) return;
      const rows = m.items.map(it => ({ user_id: state.user.id, date: state.fDate || todayStr(), meal: state.fMeal, name: it.name, source: it.source, ref: it.ref, grams: it.grams, ...foodScale(it.per100, it.grams) }));
      const res = await supabaseClient.from('food_logs').insert(rows);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message); return; }
      await loadFood(); state.fView = 'day'; render(); showToast('✓ ' + m.name + ' toegevoegd');
    }
    async function deleteMealPreset(id) {
      if (!confirm('Maaltijd verwijderen?')) return;
      await saveNutritionSettings({ mealPresets: (nutritionSettings().mealPresets || []).filter(x => x.id !== id) });
      render();
    }

    // ---------- Render ----------
    function renderFood() {
      if (!state.fDate) state.fDate = todayStr();
      if (state.fView === 'add') return renderFoodAdd();
      if (state.fView === 'product' && state.fProduct) return renderFoodProduct();
      if (state.fView === 'goals') return renderFoodGoals();
      if (state.fView === 'quick') return renderFoodQuick();
      if (state.fView === 'custom') return renderFoodCustom();
      const fm = state.fMain || 'dagboek';
      const foodTabs = `<div class="tabs" role="tablist">${[['dagboek', 'Dagboek'], ['vasten', 'Vasten'], ['tvoed', 'T-voeding'], ['supps', 'Supps']].map(([k, l]) => `<button class="tab ${fm === k ? 'active' : ''}" role="tab" aria-selected="${fm === k}" onclick="state.fMain = '${k}'; render(); window.scrollTo(0, 0);">${l}</button>`).join('')}</div>`;
      if (fm !== 'dagboek') return `
        <div class="page-header" style="margin-bottom: 16px;"><div class="page-sub">Fysiek</div><div class="page-title">Voeding</div></div>
        ${foodTabs}
        ${fm === 'tvoed' ? renderTFood() : fm === 'vasten' ? renderFast() : renderSupps()}`;
      const date = state.fDate;
      const logs = foodDayLogs(date);
      const sum = foodSum(logs);
      const t = foodTargets();
      const label = date === todayStr() ? 'Vandaag' : date === dateAdd(todayStr(), -1) ? 'Gisteren' : '';
      const dl = new Date(date + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'short' });
      const pct = t ? Math.min(100, Math.round(sum.kcal / t.kcal * 100)) : 0;
      const over = t ? t.kcal - Math.round(sum.kcal) : null;
      const mac = (n, k, color) => {
        const goal = t ? t[k] : 0;
        return `<div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;"><span style="color: ${color};">${n}</span><span style="color: #a3a3a3;">${f0(sum[k])}${goal ? ' / ' + goal : ''} g</span></div>
          <div class="f-bar"><span style="width: ${goal ? Math.min(100, sum[k] / goal * 100) : 0}%; background: ${color};"></span></div></div>`;
      };
      return `
        <div class="page-header" style="margin-bottom: 16px;"><div class="page-sub">Fysiek</div><div class="page-title">Voeding</div></div>
        ${foodTabs}
        ${state.foodError ? `<div class="info-box"><div class="info-title">⚠️ Nog één update</div><div class="info-text">Voer voeding-update.sql uit in Supabase om je eten op te slaan.</div></div>` : ''}
        <div class="f-datebar">
          <button class="f-nav" onclick="setFoodDate(-1)" aria-label="Vorige dag">‹</button>
          <div style="font-size: 13px;">${label ? label + ' · ' : ''}${dl}</div>
          <button class="f-nav" onclick="setFoodDate(1)" aria-label="Volgende dag" ${date >= todayStr() ? 'disabled' : ''}>›</button>
        </div>
        <div class="card">
          ${t ? `
            <div class="f-top">
              <div><b>${f0(t.kcal)}</b><span>Doel</span></div>
              <div><b>${f0(sum.kcal)}</b><span>Gegeten</span></div>
              <div><b style="color: ${over >= 0 ? '#22c55e' : '#e5484d'}; font-weight: 500;">${f0(Math.abs(over))}</b><span>${over >= 0 ? 'Over' : 'Te veel'}</span></div>
            </div>
            <div class="f-bar" style="height: 8px; margin-top: 14px;"><span style="width: ${pct}%; background: ${over >= 0 ? '#7f1d1d' : '#e5484d'};"></span></div>
            <div style="font-size: 10px; color: #8a8a8a; margin-top: 6px; text-align: right;">kcal · ${pct}%</div>
          ` : `
            <div style="font-size: 13px; color: #d4d4d4;">Gegeten: <b>${f0(sum.kcal)} kcal</b></div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 12px;" onclick="state.fView = 'goals'; render();">Stel je dagdoel in →</button>
          `}
          <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
            ${mac('Eiwit', 'prot', '#d9a441')}${mac('Koolhydraten', 'carb', '#60a5fa')}${mac('Vet', 'fat', '#a78bfa')}
          </div>
          ${t && !t.manual ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 12px;">Eiwitdoel uit je eiwitschema: ${esc(t.pgLabel)} · ${f1(t.w)} kg</div>` : ''}
          ${sum.fib || sum.salt ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 6px;">Vezels ${f1(sum.fib)} g · suikers ${f1(sum.sugar)} g · zout ${f1(sum.salt)} g</div>` : ''}
        </div>
        ${foodMeals.map(([k, name]) => {
          const ml = logs.filter(l => l.meal === k).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
          const ms = foodSum(ml);
          return `
            <div class="f-meal">
              <div class="f-meal-head"><span>${name.toUpperCase()}</span><span>${f0(ms.kcal)} kcal${ms.prot ? ' · ' + f0(ms.prot) + ' g eiwit' : ''}</span></div>
              ${ml.map(l => `
                <button class="f-item" onclick="openFoodProduct(foodItemFromLog(state.foodLogs.find(x => x.id === '${l.id}')), '${l.id}')">
                  <span style="min-width: 0; text-align: left;"><span class="f-item-n">${esc(l.name)}</span><span class="f-item-d">${l.source === 'quick' ? 'snel ingevoerd' : f0(l.grams) + ' g'} · ${{ nevo: 'NEVO', off: 'Open Food Facts', custom: 'eigen product', quick: 'snel' }[l.source] || ''}</span></span>
                  <span class="f-item-k">${f0(l.kcal)} kcal</span>
                </button>`).join('')}
              <div class="f-meal-foot">
                <button onclick="openFoodAdd('${k}')">+ Toevoegen</button>
                ${ml.length ? `<button class="sub" onclick="saveMealPreset('${k}')">⭐ Bewaar als maaltijd</button>` : ''}
              </div>
            </div>`;
        }).join('')}
        <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 4px;" onclick="state.fView = 'goals'; render(); window.scrollTo(0, 0);">Doelen aanpassen</button>
        <div class="f-source">${NEVO_SOURCE}</div>
      `;
    }

    function renderFoodResults() {
      if (state.nevoError) return `<div class="empty">De voedingstabel kon niet laden. Controleer of nevo.json op GitHub staat.</div>`;
      const q = (state.fQuery || '').trim();
      state.fPickMap = {};
      const row = it => { state.fPickMap[it.key] = it; const p = it.per100;
        return `<button class="f-res" onclick="foodPick(${esc(JSON.stringify(it.key))})">
          <span style="flex: 1; min-width: 0; text-align: left;"><span class="f-item-n">${esc(it.name)}</span><span class="f-item-d">${f0(p.kcal)} kcal${p.prot !== null && p.prot !== undefined ? ' · ' + f1(p.prot) + ' g eiwit' : ''} per 100 ${it.ml ? 'ml' : 'g'}</span></span>
          <span class="f-tag ${it.src === 'NEVO' ? 'nevo' : it.src === 'OFF' ? 'off' : 'own'}">${it.src}</span></button>`; };
      if (state.fTab === 'recent' || state.fTab === 'fav' || state.fTab === 'meals') {
        if (state.fTab === 'meals') {
          const ms = nutritionSettings().mealPresets || [];
          if (!ms.length) return `<div class="empty">Nog geen maaltijden.<br><br>Tik bij een maaltijd op je dag op "⭐ Bewaar als maaltijd".</div>`;
          return ms.map(m => { const s = foodSum(m.items.map(it => foodScale(it.per100, it.grams)));
            return `<div class="f-res" style="cursor: default;"><span style="flex: 1; min-width: 0;"><span class="f-item-n">${esc(m.name)}</span><span class="f-item-d">${m.items.length} producten · ${f0(s.kcal)} kcal · ${f0(s.prot)} g eiwit</span></span>
              <button class="btn btn-primary btn-small" onclick="addMealPreset('${m.id}')">+</button><button class="icon-btn" onclick="deleteMealPreset('${m.id}')" aria-label="Maaltijd verwijderen">✕</button></div>`; }).join('');
        }
        let items = [];
        if (state.fTab === 'recent') {
          const seen = new Set();
          [...(state.foodLogs || [])].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).forEach(l => {
            const k = l.ref || ('quick:' + l.name); if (seen.has(k) || l.source === 'quick') return; seen.add(k); items.push(foodItemFromLog(l));
          });
          items = items.slice(0, 30);
        } else {
          const fi = nutritionSettings().favItems || {};
          items = (nutritionSettings().favorites || []).map(k => fi[k] ? { key: k, ...fi[k] } : null).filter(Boolean);
        }
        if (!items.length) return `<div class="empty">${state.fTab === 'recent' ? 'Nog niks gegeten in de app.' : 'Nog geen favorieten. Tik op ☆ bij een product.'}</div>`;
        return items.map(row).join('');
      }
      if (q.length < 2) return `<div class="hs-small" style="padding: 8px 0;">Typ minstens 2 letters, of scan een barcode.</div>`;
      if (!nevoData) return `<div class="hs-small">Voedingstabel laden…</div>`;
      const local = foodLocalSearch(q);
      return `
        ${local.length ? local.map(row).join('') : `<div class="hs-small" style="padding: 8px 0;">Niets gevonden in de RIVM-tabel.</div>`}
        <div class="f-offbox">
          ${!state.fOff ? `<button class="btn btn-secondary btn-small" style="width: 100%;" onclick="foodOffSearch()">🔍 Zoek "${esc(q)}" in winkelproducten (Open Food Facts)</button>`
            : state.fOff.loading ? `<div class="hs-small">Zoeken in Open Food Facts…</div>`
            : state.fOff.error ? `<div class="hs-small" style="color: #eab308;">${state.fOff.error}</div>`
            : state.fOff.items.length ? state.fOff.items.map(row).join('') : `<div class="hs-small">Geen winkelproducten gevonden.</div>`}
        </div>`;
    }

    function renderFoodAdd() {
      const tab = state.fTab || 'search';
      return `
        <div class="page-header" style="margin-bottom: 12px;"><div class="page-sub">Voeding</div><div class="page-title">Toevoegen</div></div>
        <button class="entry-action" style="margin-bottom: 14px;" onclick="state.fView = 'day'; render();">← Terug</button>
        <div class="f-meals">${foodMeals.map(([k, n]) => `<button class="${state.fMeal === k ? 'on' : ''}" onclick="state.fMeal = '${k}'; render();">${n}</button>`).join('')}</div>
        <div class="f-search">
          <input type="search" class="form-input" id="food-q" placeholder="Zoek product, bijv. kipfilet" value="${esc(state.fQuery || '')}" oninput="foodQueryInput(this.value)" onkeydown="if(event.key === 'Enter') foodOffSearch()" onfocus="state.fTab = 'search'" aria-label="Zoek product">
          <button class="f-scan" onclick="startFoodScan()" aria-label="Barcode scannen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16 8v8"></path></svg></button>
        </div>
        ${state.fScan ? `
          <div class="f-scanbox">
            <div id="food-scan" style="width: 100%;"></div>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px;">
              <input type="text" inputmode="numeric" class="input-sm" id="food-code" placeholder="Of typ de barcode">
              <button class="btn btn-secondary btn-small" onclick="const c = document.getElementById('food-code').value; stopFoodScan(); foodBarcode(c);">Zoek</button>
            </div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px;" onclick="stopFoodScan()">Stoppen</button>
          </div>` : ''}
        <div class="tabs" style="margin: 14px 0 10px;">
          ${[['search', 'Zoeken'], ['recent', 'Recent'], ['fav', 'Favorieten'], ['meals', 'Maaltijden']].map(([k, n]) => `<button class="tab ${tab === k ? 'active' : ''}" onclick="state.fTab = '${k}'; render();">${n}</button>`).join('')}
        </div>
        <div id="food-results" style="display: flex; flex-direction: column; gap: 6px;">${renderFoodResults()}</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px;">
          <button class="btn btn-secondary btn-small" onclick="state.fView = 'quick'; render();">✏️ Snel invoeren</button>
          <button class="btn btn-secondary btn-small" onclick="state.fView = 'custom'; render();">+ Eigen product</button>
        </div>
        <div class="f-source">${NEVO_SOURCE}</div>
      `;
    }

    function renderFoodProduct() {
      const p = state.fProduct; const it = p.item; const g = pnum(p.grams) || 0;
      const n = foodScale(it.per100, g);
      const fav = (nutritionSettings().favorites || []).includes(it.key);
      const chips = [...new Set([it.portion ? it.portion.g : null, 50, 100, 150, 200, p.last].filter(Boolean))];
      const srcTxt = it.src === 'NEVO' ? `RIVM · NEVO-code ${it.code}` : it.src === 'OFF' ? `Open Food Facts · barcode ${it.code}` : it.src === 'SNEL' ? 'Snel ingevoerd' : 'Eigen product';
      const v = (k, d) => n[k] === null || n[k] === undefined ? '–' : (d ? f0(n[k]) : f1(n[k]));
      return `
        <button class="entry-action" style="margin: 64px 0 16px;" onclick="state.fView = '${p.logId ? 'day' : 'add'}'; render();">← Terug</button>
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px;">
          <div><div style="font-size: 22px; font-weight: 300;">${esc(it.name)}</div><div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${srcTxt} · per 100 ${it.ml ? 'ml' : 'g'}: ${f0(it.per100.kcal)} kcal</div></div>
          ${it.src !== 'SNEL' && !String(it.key).startsWith('log:') ? `<button class="f-fav" id="fp-fav" aria-pressed="${fav}" aria-label="Favoriet" onclick="toggleFoodFav(${esc(JSON.stringify(it.key))})">${fav ? '★' : '☆'}</button>` : ''}
        </div>
        <div class="card">
          <label class="label" for="fp-g">Hoeveelheid</label>
          <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;">
            <input type="text" inputmode="decimal" id="fp-g" class="form-input" style="font-size: 26px; font-weight: 300;" value="${esc(p.grams)}" oninput="foodGrams(this.value)">
            <span style="color: #a3a3a3;">${it.ml ? 'ml' : 'gram'}</span>
          </div>
          <div class="chips" style="margin: 12px 0 0;">
            ${chips.map(c => `<button class="chip fp-chip ${g === c ? 'on active' : ''}" data-g="${c}" onclick="document.getElementById('fp-g').value = '${c}'; foodGrams('${c}'); this.parentNode.querySelectorAll('.chip').forEach(b => b.classList.remove('active')); this.classList.add('active');">${it.portion && c === it.portion.g ? esc(it.portion.label) + ' (' + c + ' g)' : c === p.last ? 'Vorige keer: ' + c + ' g' : c + ' g'}</button>`).join('')}
          </div>
          <label class="label" style="margin-top: 16px;">Maaltijd</label>
          <div class="f-meals">${foodMeals.map(([k, nm]) => `<button class="${p.meal === k ? 'on' : ''}" onclick="state.fProduct.meal = '${k}'; state.fProduct.grams = document.getElementById('fp-g').value; render();">${nm}</button>`).join('')}</div>
        </div>
        <div class="card">
          <div class="f-top">
            <div><b id="fp-kcal">${v('kcal', 1)}</b><span>kcal</span></div>
            <div><b id="fp-prot" style="color: #d9a441;">${v('prot')}</b><span>Eiwit</span></div>
            <div><b id="fp-carb" style="color: #60a5fa;">${v('carb')}</b><span>Koolh.</span></div>
            <div><b id="fp-fat" style="color: #a78bfa;">${v('fat')}</b><span>Vet</span></div>
          </div>
          <div class="f-rows">
            <div><span>waarvan suikers</span><span><span id="fp-sugar">${v('sugar')}</span> g</span></div>
            <div><span>waarvan verzadigd vet</span><span><span id="fp-sat">${v('sat')}</span> g</span></div>
            <div><span>Vezels</span><span><span id="fp-fib">${v('fib')}</span> g</span></div>
            <div><span>Zout</span><span><span id="fp-salt">${v('salt')}</span> g</span></div>
          </div>
        </div>
        <div class="j-tip" id="fp-hint" style="font-size: 12px;">${foodProteinHint(n.prot)}</div>
        <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="saveFoodLog()">${p.logId ? 'Bijwerken' : 'Toevoegen aan ' + (foodMeals.find(m => m[0] === p.meal) || ['', 'maaltijd'])[1].toLowerCase()}</button>
        ${p.logId ? `<button class="btn btn-secondary" style="width: 100%; margin-top: 8px;" onclick="deleteFoodLog('${p.logId}')">Verwijderen</button>` : ''}
        <div class="hs-small" style="text-align: center; margin-top: 10px;">Tip: weeg je eten. Op het oog zit je er al snel 20–30% naast.</div>
      `;
    }

    function renderFoodQuick() {
      return `
        <button class="entry-action" style="margin: 64px 0 16px;" onclick="state.fView = 'add'; render();">← Terug</button>
        <div class="card">
          <label class="label">Snel invoeren · ${(foodMeals.find(m => m[0] === state.fMeal) || ['', ''])[1]}</label>
          <div class="hs-small" style="margin-bottom: 12px;">Voor als je uit eten bent of het product niet kunt vinden.</div>
          <label class="form-label" for="fq-name">Omschrijving</label><input class="form-input" id="fq-name" placeholder="Bijv. pizza bij vrienden">
          <div class="form-row">
            <div><label class="form-label" for="fq-kcal">Kcal *</label><input class="form-input" id="fq-kcal" inputmode="decimal"></div>
            <div><label class="form-label" for="fq-prot">Eiwit (g)</label><input class="form-input" id="fq-prot" inputmode="decimal"></div>
          </div>
          <div class="form-row">
            <div><label class="form-label" for="fq-carb">Koolh. (g)</label><input class="form-input" id="fq-carb" inputmode="decimal"></div>
            <div><label class="form-label" for="fq-fat">Vet (g)</label><input class="form-input" id="fq-fat" inputmode="decimal"></div>
          </div>
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="saveQuickFood()">Toevoegen</button>`;
    }

    function renderFoodCustom() {
      const fld = (id, l) => `<div><label class="form-label" for="${id}">${l}</label><input class="form-input" id="${id}" inputmode="decimal"></div>`;
      return `
        <button class="entry-action" style="margin: 64px 0 16px;" onclick="state.fView = 'add'; render();">← Terug</button>
        <div class="card">
          <label class="label">Eigen product</label>
          <div class="hs-small" style="margin-bottom: 12px;">Neem de waarden per 100 g over van de verpakking. Je product blijft bewaard en is daarna gewoon te zoeken.</div>
          <label class="form-label" for="fc-name">Naam *</label><input class="form-input" id="fc-name" placeholder="Bijv. Whey proteïne vanille">
          <div class="form-row">${fld('fc-kcal', 'Kcal per 100 g *')}${fld('fc-prot', 'Eiwit (g)')}</div>
          <div class="form-row">${fld('fc-carb', 'Koolh. (g)')}${fld('fc-fat', 'Vet (g)')}</div>
          <div class="form-row">${fld('fc-sugar', 'Suikers (g)')}${fld('fc-sat', 'Verz. vet (g)')}</div>
          <div class="form-row">${fld('fc-fib', 'Vezels (g)')}${fld('fc-salt', 'Zout (g)')}</div>
          <div class="form-row">${fld('fc-portion', 'Portie (g), optioneel')}<div></div></div>
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="saveCustomFood()">Opslaan en toevoegen</button>`;
    }

    function setFoodGoal(field, value) {
      saveNutritionSettings({ goals: { ...(nutritionSettings().goals || {}), [field]: value } });
      render();
    }
    function renderFoodGoals() {
      const g = nutritionSettings().goals || {};
      const t = foodTargets();
      const w = latestBodyValue('weight');
      const h = (state.bodySettings || {}).height_cm || g.height || '';
      return `
        <div class="page-header" style="margin-bottom: 12px;"><div class="page-sub">Voeding</div><div class="page-title">Doelen</div></div>
        <button class="entry-action" style="margin-bottom: 16px;" onclick="state.fView = 'day'; render();">← Terug</button>
        <div class="card">
          <div class="tq">1 · OVER JOU</div>
          <div class="form-row">
            <div><label class="form-label" for="fg-w">Gewicht (kg)</label><input class="form-input" id="fg-w" inputmode="decimal" value="${esc(w || g.weight || '')}" ${w ? 'disabled' : ''} onchange="setFoodGoal('weight', this.value)"></div>
            <div><label class="form-label" for="fg-h">Lengte (cm)</label><input class="form-input" id="fg-h" inputmode="numeric" value="${esc(h)}" ${(state.bodySettings || {}).height_cm ? 'disabled' : ''} onchange="setFoodGoal('height', this.value)"></div>
          </div>
          <div class="form-row">
            <div><label class="form-label" for="fg-y">Geboortejaar</label><input class="form-input" id="fg-y" inputmode="numeric" placeholder="bijv. 1990" value="${esc(g.birthYear || '')}" onchange="setFoodGoal('birthYear', this.value)"></div>
            <div><span class="form-label">Geslacht</span><div class="f-meals" style="grid-template-columns: 1fr 1fr;"><button class="${g.sex !== 'v' ? 'on' : ''}" onclick="setFoodGoal('sex', 'm')">Man</button><button class="${g.sex === 'v' ? 'on' : ''}" onclick="setFoodGoal('sex', 'v')">Vrouw</button></div></div>
          </div>
          ${w ? `<div class="hs-small" style="margin-top: 8px;">Gewicht komt uit je laatste meting bij Lichaam.</div>` : ''}
        </div>
        <div class="card">
          <div class="tq">2 · HOE ACTIEF BEN JE?</div>
          ${activityLevels.map(([n, d], i) => `<button class="topt ${(g.activity ?? 2) === i ? 'on' : ''}" onclick="setFoodGoal('activity', ${i})"><span class="topt-t">${n}</span><span class="topt-s">${d}</span></button>`).join('')}
        </div>
        <div class="card">
          <div class="tq">3 · WAT IS JE DOEL?</div>
          ${proteinGoals.map(([n, lo, hi], i) => {
            const a = goalKcalAdj[i] || 0;
            return `<button class="topt ${proteinGoalIdx() === i ? 'on' : ''}" onclick="setProteinGoal(${i}); render();"><span class="topt-t">${n}</span><span class="topt-s">Eiwit ${String(lo).replace('.', ',')}${hi !== lo ? '–' + String(hi).replace('.', ',') : ''} g/kg · ${a > 0 ? '+' + a + ' kcal' : a < 0 ? '−' + Math.abs(a) + ' kcal' : 'calorieën op onderhoud'}</span></button>`;
          }).join('')}
          <div class="hs-small" style="margin-top: 4px;">Dit is hetzelfde doel als in het eiwitschema bij Clean eating: verander je het hier, dan verandert het daar ook.</div>
        </div>
        <div class="card" style="background: #120d04; border-color: #d9a441;">
          <div style="font-size: 10px; color: #d9a441; letter-spacing: 0.15em; font-weight: 600;">JOUW DAGDOEL</div>
          ${t ? `
            <div style="font-size: 30px; font-weight: 300; margin-top: 6px;">${f0(t.kcal)} <span style="font-size: 14px; color: #a3a3a3;">kcal</span></div>
            <div class="f-top" style="margin-top: 12px;">
