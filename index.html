    async function saveWorkout() {
      const f = state.trainForm;
      const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isNaN(n) ? null : n; };
      const name = (f.name || '').trim() || (f.exercises[0] ? f.exercises[0].name : '');
      if (!name) { alert('Geef je training een naam of voeg een oefening toe'); return; }

      const btn = document.getElementById('tf-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }

      // PR's bepalen vóór het opslaan (vergelijken met alle andere trainingen)
      const prs = [];
      f.exercises.forEach(ex => {
        const best = bestFor(ex.name, f.id);
        if (!best.e1rm && !best.weight) return; // eerste keer: geen PR-melding
        let top = null;
        ex.sets.forEach(s => {
          const w = num(s.weight) || 0, r = Math.round(num(s.reps) || 0);
          if (!w || !r) return;
          if (!top || e1rm(w, r) > e1rm(top.w, top.r)) top = { w, r };
        });
        if (top && (top.w > best.weight || e1rm(top.w, top.r) > best.e1rm + 0.01)) prs.push(`${ex.name} ${fmtInt(top.w)} kg × ${top.r}`);
      });

      const row = {
        user_id: state.user.id, date: f.date || todayStr(), name,
        duration_min: num(f.duration) ? Math.round(num(f.duration)) : null,
        outdoor: !!f.outdoor, notes: (f.notes || '').trim() || null
      };
      let id = f.id, error;
      if (id) {
        ({ error } = await supabaseClient.from('workouts').update(row).eq('id', id));
        if (!error) ({ error } = await supabaseClient.from('workout_sets').delete().eq('workout_id', id));
      } else {
        const res = await supabaseClient.from('workouts').insert([row]).select().single();
        error = res.error;
        if (res.data) id = res.data.id;
      }
      if (!error && id) {
        const sets = [];
        f.exercises.forEach((ex, pos) => ex.sets.forEach((s, j) => {
          const reps = num(s.reps), weight = num(s.weight);
          if (reps === null && weight === null) return;
          sets.push({ workout_id: id, user_id: state.user.id, exercise: ex.name.trim(), position: pos, set_no: j + 1, reps: reps === null ? null : Math.round(reps), weight });
        }));
        if (sets.length) ({ error } = await supabaseClient.from('workout_sets').insert(sets));
      }
      if (error) {
        alert('Fout bij opslaan: ' + error.message + (/workout/.test(error.message) ? '\n\nVoer eerst training-update.sql uit in Supabase.' : ''));
        if (btn) { btn.disabled = false; btn.textContent = 'Training opslaan'; }
        return;
      }

      // Koppelingen: habit Sport en 75 Hard
      const messages = [];
      if (row.date === todayStr()) {
        if (!state.habits.workout) await toggleHabit('workout');
        const h = hard75Active();
        if (h && (row.duration_min || 0) >= 45 && !f.id) {
          const tasks = { ...hard75TasksFor(h, todayStr()) };
          let key = null;
          if (!tasks.w1) key = 'w1';
          else if (!tasks.w2 && row.outdoor) key = 'w2';
          if (key) { await hard75Toggle(h.id, key); messages.push(key === 'w1' ? '75 Hard: training 1 afgevinkt' : '75 Hard: buitentraining afgevinkt'); }
        }
      }

      state.trainForm = null;
      state.trainView = 'list';
      await loadTraining();
      render();
      window.scrollTo(0, 0);
      if (prs.length) showToast('🏆 Nieuw PR: ' + prs[0]);
      else showToast(messages[0] || '💪 Training opgeslagen');
    }

    function kitAvailable(plan, ex) {
      if (!plan || plan.loc === 'gym') return true;
      const have = ['bw', ...(plan.kit || [])];
      return ex.kit.some(k => have.includes(k));
    }

    // Oefeningen voor een sessie, rekening houdend met materiaal en eigen vervangingen
    function sessionExercises(plan, key, withAbs) {
      const def = sessionDefs[key];
      if (!def) return [];
      const slots = withAbs ? [...def.slots, absSlot] : def.slots;
      const used = new Set();
      const out = [];
      slots.forEach((slot, idx) => {
        const slotId = idx === def.slots.length ? 'abs' : String(idx);
        const [group, ...prefs] = slot;
        const swap = (plan.swaps || {})[key + '|' + slotId];
        const candidates = [swap, ...prefs].filter(Boolean).map(libFind).filter(Boolean);
        let pick = candidates.find(e => e.group === group && kitAvailable(plan, e) && !used.has(e.name));
        if (!pick) pick = exerciseLib.find(e => e.group === group && kitAvailable(plan, e) && !used.has(e.name));
        if (!pick) return;
        used.add(pick.name);
        out.push({ slot: slotId, group, name: pick.name, range: pick.range });
      });
      return out;
    }

    function absDays(plan) {
      if (!plan.abs) return [];
      const t = plan.days.map((d, i) => d ? i : -1).filter(i => i >= 0);
      if (!t.length) return [];
      return t.length >= 3 ? [t[0], t[2]] : t.slice(0, 2);
    }

    // Beste combinatie gewicht × reps (hoogste geschatte 1RM). Een handmatig aangepast record telt vanaf de datum van aanpassen.
    function recordFor(name, excludeId) {
      const key = name.trim().toLowerCase();
      const plan = trainingPlan();
      const ov = plan && plan.records ? plan.records[key] : null;
      let best = ov ? { w: Number(ov.w) || 0, r: Number(ov.r) || 0, e: e1rm(ov.w, ov.r) || (Number(ov.r) || 0) / 1000 } : { w: 0, r: 0, e: 0 };
      state.workouts.forEach(w => {
        if (w.id === excludeId) return;
        if (ov && ov.date && w.date < ov.date) return;
        workoutSetsOf(w.id).forEach(s => {
          if (s.set_no === 0 || s.exercise.trim().toLowerCase() !== key) return;
          const wt = Number(s.weight) || 0, r = Number(s.reps) || 0;
          const e = wt ? e1rm(wt, r) : r / 1000; // zonder gewicht: meeste reps telt
          if (r && e > best.e) best = { w: wt, r, e };
        });
      });
      return best;
    }
    function setScore(w, r) { w = Number(w) || 0; r = Number(r) || 0; if (!r) return 0; return w ? e1rm(w, r) : r / 1000; }
    function pnum(v) { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; }
    function fmtKg(n) { if (n === null || n === undefined || n === '') return ''; return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }

    function trainWeekDates() {
      const start = weekKey(todayStr());
      return weekdayShort.map((_, i) => dateAdd(start, i));

      if (state.tday === undefined || state.tday === null) state.tday = (new Date().getDay() + 6) % 7;

      const date = trainWeekDates()[idx];
      if (state.tpick && state.tpick[date] !== undefined) return state.tpick[date];
      const saved = state.workouts.find(w => w.date === date && (w.kind || 'strength') !== 'cardio' && Object.keys(sessionDefs).some(k => sessionDefs[k].label === w.name));
      if (saved) return Object.keys(sessionDefs).find(k => sessionDefs[k].label === saved.name);
      return plan.days[idx];

      ]},
      dip: { label: 'Dips', steps: [
        ['Bench dip', 'Handen op een bank achter je, benen gebogen.'],
        ['Negative dip', 'Zak in 5 seconden tot je ellebogen op 90° staan.'],

      shoulder: { label: 'Schouders', steps: [

        ['Handstand hold tegen de muur', 'Borst naar de muur, armen gestrekt, duw de grond weg.', 'sec'],
        ['Negative handstand push-up', 'In handstand tegen de muur langzaam zakken tot je hoofd op een kussen rust.'],
        ['Handstand push-up', 'Helemaal op en neer tegen de muur.']
      ]},
      legs: { label: 'Benen', steps: [
        ['Squat (lichaamsgewicht)', 'Voeten op schouderbreedte, heupen onder je knieën, borst omhoog.'],
        ['Split squat', 'Grote stap, achterste knie zakt naar de grond.'],
        ['Bulgarian split squat (lichaamsgewicht)', 'Achterste voet op een stoel.'],
        ['Shrimp squat', 'Op één been, pak je achterste voet vast en zak tot je knie de grond raakt.'],
        ['Pistol squat', 'Op één been helemaal door, andere been gestrekt voor je. Zie ook het skill-blok.']
      ]},
      ham: { label: 'Hamstrings & billen', steps: [
        ['Glute bridge', 'Op je rug, voeten plat, heupen omhoog en billen aanspannen.'],
        ['Single-leg glute bridge', 'Hetzelfde op één been.'],
        ['Nordic negative', 'Knieën op een kussen, voeten vast onder de bank, val langzaam voorover.'],
        ['Nordic curl', 'Zak langzaam en trek jezelf weer omhoog.']
      ]},
      calf: { label: 'Kuiten', steps: [
        ['Calf raise op twee benen', 'Op je tenen omhoog, rustig weer zakken.'],
        ['Single-leg calf raise', 'Op één been, hand tegen de muur voor balans.'],
        ['Single-leg calf raise op een trede', 'Hiel zakt onder de trede, helemaal op en neer.']
      ]},
      core: { label: 'Core', steps: [
        ['Plank', 'Op je ellebogen, lichaam recht, billen aanspannen.', 'sec'],
        ['Hollow hold', 'Op je rug, armen en benen gestrekt en iets van de grond, onderrug plat.', 'sec'],
        ['Hanging knee raise', 'Hangen en knieën naar je borst.'],
        ['Hanging leg raise', 'Hangen en gestrekte benen tot heuphoogte.'],
        ['L-sit', 'Steun op twee stoelen of handvatten, benen gestrekt vooruit.', 'sec'],

      ]}
    };
    const caliDefaultLevels = { push: 1, pull: 2, row: 0, dip: 1, shoulder: 0, legs: 0, ham: 0, calf: 0, core: 0 };

    // [naam, unit, doel, mode]
    const caliSkills = {
      handstand: { label: 'Handstand', unit: 'sec', start: 'Kun je 30 sec in een pike hold staan, handen op de grond en heupen hoog? Loop dan met je voeten tegen de muur omhoog, met je borst naar de muur. Handen op schouderbreedte, vingers gespreid, armen gestrekt.', cues: 'Duw de grond weg, schouders bij je oren. Kijk tussen je handen.', steps: [['Pike hold', 'sec', 30], ['Handstand borst naar de muur', 'sec', 30], ['Handstand rug naar de muur', 'sec', 30], ['Kick-up naar vrije handstand', 'sec', 10], ['Vrije handstand', 'sec', 30]] },
      frontlever: { label: 'Front lever', unit: 'sec', req: 'Pas aan te raden vanaf minstens 8 pull-ups.', start: 'Begin met de tuck: hang aan de stang, knieën naar je borst, rug horizontaal.', cues: 'Armen gestrekt, schouderbladen naar beneden en naar achteren, alsof je de stang naar je heupen trekt.', steps: [['Tuck front lever', 'sec', 15], ['Advanced tuck front lever', 'sec', 15], ['Front lever één been', 'sec', 10], ['Straddle front lever', 'sec', 10], ['Front lever', 'sec', 10]] },
      planche: { label: 'Planche', unit: 'sec', req: 'Pas aan te raden vanaf 20 push-ups en 10 dips.', start: 'Begin met de planche lean: in push-up-positie, vingers naar opzij of achter, leun naar voren tot je schouders voorbij je handen zijn.', cues: 'Armen helemaal gestrekt, rug iets bol. Bouw heel langzaam op: zwaar voor polsen en ellebogen.', steps: [['Planche lean', 'sec', 20], ['Tuck planche', 'sec', 15], ['Advanced tuck planche', 'sec', 10], ['Straddle planche', 'sec', 10], ['Planche', 'sec', 5]] },
      lsit: { label: 'L-sit', unit: 'sec', start: 'Zit tussen twee stoelen of op dip-handvatten, druk je billen omhoog en houd je voeten nog op de grond.', cues: 'Schouders omlaag en weg van je oren, duw de grond hard weg.', steps: [['L-sit voeten op de grond', 'sec', 20], ['L-sit één been', 'sec', 15], ['Tuck L-sit', 'sec', 20], ['L-sit', 'sec', 20], ['V-sit', 'sec', 10]] },
      flag: { label: 'Human flag', unit: 'sec', req: 'Pas aan te raden vanaf 10 pull-ups en een stevige zijplank.', start: 'Begin met een zijplank met je bovenste arm omhoog, daarna de verticale flag aan een paal met je benen omhoog.', cues: 'Je onderste arm duwt, je bovenste arm trekt. Beide armen blijven gestrekt.', steps: [['Zijplank arm omhoog', 'sec', 45], ['Verticale flag', 'sec', 15], ['Tuck flag', 'sec', 10], ['Straddle flag', 'sec', 10], ['Human flag', 'sec', 10]] },
      backlever: { label: 'Back lever', unit: 'sec', req: 'Pas aan te raden vanaf 8 pull-ups en met gezonde schouders.', start: 'Begin met de German hang: hang en draai rustig door, zodat je schouders gerekt worden. Eerst 10 seconden.', cues: 'Dit rekt je schouder ver op. Ga langzaam; stop bij pijn (stijfheid is normaal).', steps: [['German hang', 'sec', 20], ['Skin the cat', 'reps', 5], ['Tuck back lever', 'sec', 15], ['Straddle back lever', 'sec', 10], ['Back lever', 'sec', 10]] },
      pullups: { label: 'Pull-ups', unit: 'reps', start: 'Kun je 30 seconden hangen? Doe dan negatives: spring omhoog met je kin boven de stang en zak in 5 seconden. 3 × 5.', cues: 'Begin elke herhaling met je schouderbladen naar beneden en strek je armen helemaal uit.', steps: [['Dead hang', 'sec', 30, 'best'], ['Negative pull-up', 'reps', 5], ['Pull-up', 'reps', 1, 'best'], ['Pull-up', 'reps', 5, 'best'], ['Pull-up', 'reps', 10, 'best'], ['Pull-up', 'reps', 15, 'best'], ['Pull-up', 'reps', 20, 'best']] },
      dips: { label: 'Dips', unit: 'reps', start: 'Kun je 30 seconden in de support hold blijven, gestrekte armen op twee stoelen of handvatten? Doe dan negatives: zak in 5 seconden tot 90° en stap weer omhoog.', cues: 'Leun licht naar voren en ga niet dieper dan 90° als je schouders dat niet prettig vinden.', steps: [['Support hold', 'sec', 30, 'best'], ['Negative dip', 'reps', 5], ['Dip', 'reps', 1, 'best'], ['Dip', 'reps', 10, 'best'], ['Dip', 'reps', 20, 'best'], ['Dip met +10 kg', 'reps', 5, 'best']] },
      muscleup: { label: 'Muscle-up', unit: 'reps', req: 'Pas aan te raden vanaf 10 strikte pull-ups.', start: 'Begin met de explosieve pull-up: trek zo hard dat je borst de stang raakt.', cues: 'Het gaat om de overgang: trek de stang naar je heupen, niet naar je kin, met een valse grip (pols over de stang).', steps: [['Pull-up', 'reps', 10, 'best'], ['Explosieve pull-up', 'reps', 5], ['Muscle-up met elastiek', 'reps', 3], ['Negative muscle-up', 'reps', 3], ['Muscle-up', 'reps', 1, 'best']] },
      pistol: { label: 'Pistol squat', unit: 'reps', start: 'Begin met de box pistol: ga op één been zitten op een bankje en sta weer op, andere been gestrekt voor je.', cues: 'Hiel op de grond, knie in de lijn van je tenen. Een gewichtje in je handen helpt juist je balans.', steps: [['Box pistol', 'reps', 8], ['Pistol met hand vast', 'reps', 8], ['Negative pistol', 'reps', 5], ['Pistol squat', 'reps', 1, 'best'], ['Pistol squat', 'reps', 5, 'best']] },
      hspu: { label: 'Handstand push-up', unit: 'reps', req: 'Pas aan te raden vanaf 30 sec handstand tegen de muur.', start: 'Begin met de pike push-up: heupen hoog, en zak met je hoofd naar de grond vóór je handen.', cues: 'Hoofd en handen vormen een driehoek, zodat je hoofd niet tussen je handen zakt. Kussen onder je hoofd bij de negatives.', steps: [['Pike push-up', 'reps', 12], ['Verhoogde pike push-up', 'reps', 10], ['Negative handstand push-up', 'reps', 5], ['Handstand push-up', 'reps', 1, 'best'], ['Handstand push-up', 'reps', 5, 'best']] },
      dragonflag: { label: 'Dragon flag', unit: 'reps', start: 'Begin met de lying leg raise: lig op een bankje, houd het vast achter je hoofd en til je gestrekte benen op.', cues: 'Je onderrug blijft plat. Gaat die hol staan, ga dan terug naar de tuck-variant.', steps: [['Lying leg raise', 'reps', 12], ['Tuck dragon flag', 'reps', 8], ['Dragon flag negative', 'reps', 5], ['Dragon flag één been', 'reps', 5], ['Dragon flag', 'reps', 5]] }
    };

    const caliSessions = {
      push: { sub: 'Push-ups, dips, schouders', ladders: ['push', 'dip', 'shoulder'] },
      pull: { sub: 'Pull-ups, rows, core', ladders: ['pull', 'row', 'core'] },
      legs: { sub: 'Benen, hamstrings, kuiten, core', ladders: ['legs', 'ham', 'calf', 'core'] },
      upper: { sub: 'Push, pull, dips, rows, schouders', ladders: ['push', 'pull', 'dip', 'row', 'shoulder'] },
      lower: { sub: 'Benen, hamstrings, kuiten, core', ladders: ['legs', 'ham', 'calf', 'core'] },
      fa: { sub: 'Push-ups, pull-ups, benen, core', ladders: ['push', 'pull', 'legs', 'core'] },
      fb: { sub: 'Dips, rows, hamstrings, schouders', ladders: ['dip', 'row', 'ham', 'shoulder'] }
    };

    function caliPlan(plan) { return { levels: { ...caliDefaultLevels, ...((plan.cali || {}).levels || {}) }, skill: (plan.cali || {}).skill || null, skillLevel: (plan.cali || {}).skillLevel || 0 }; }
    function caliLadderStep(ladder, lvl) {
      const L = caliLadders[ladder]; const i = Math.max(0, Math.min(L.steps.length - 1, lvl));
      const [name, how, unit] = L.steps[i];
      return { name, how, unit: unit || 'reps', t: unit === 'sec' ? 30 : 12, mode: 'all3', i, last: i === L.steps.length - 1 };
    }
    function caliSkillStep(skill, lvl) {
      const S = caliSkills[skill]; const i = Math.max(0, Math.min(S.steps.length - 1, lvl));
      const [name, unit, t, mode] = S.steps[i];
      return { name, unit, t, mode: mode || 'all3', i, last: i === S.steps.length - 1, goalW: /\+10 kg/.test(name) ? 10 : 0 };
    }
    const caliStepLabel = (st) => st.mode === 'best' ? `${st.name} · doel ${st.t}${st.unit === 'sec' ? ' sec' : ''}` : st.name;
    const caliRange = (st) => st.mode === 'best' ? `doel: 1 set van ${st.t} ${st.unit === 'sec' ? 'sec' : 'reps'}` : `doel: 3 × ${st.t} ${st.unit === 'sec' ? 'sec' : 'reps'}`;

    function caliSessionExercises(plan, key) {
      const cp = caliPlan(plan);
      const out = [];
      if (cp.skill && caliSkills[cp.skill]) {
        const st = caliSkillStep(cp.skill, cp.skillLevel);
        out.push({ slot: 'skill', group: 'skill', groupLabel: 'Skill · ' + caliSkills[cp.skill].label, name: st.name.replace(/ met \+10 kg$/, ''), label: caliStepLabel(st), cali: { kind: 'skill', id: cp.skill, step: st } });
      }
      (caliSessions[key] || { ladders: [] }).ladders.forEach(l => {
        const st = caliLadderStep(l, cp.levels[l]);
        if (out.some(o => o.name === st.name)) return; // al in het skill-blok
        out.push({ slot: 'cali-' + l, group: 'cali-' + l, groupLabel: caliLadders[l].label, name: st.name, label: st.name, cali: { kind: 'ladder', id: l, step: st } });
      });
      return out.map(x => ({ ...x, range: caliRange(x.cali.step) }));
    }

    // Klaar voor de volgende stap? all3: 3 trainingen op rij alle 3 werksets ≥ doel · best: één keer een set ≥ doel
    function caliSetsOk(st, sets) {
      const ok = s => (Number(s.r) || 0) >= st.t && (!st.goalW || (Number(s.w) || 0) >= st.goalW);
      const work = sets.filter(s => s.r !== '' && s.r !== null && s.r !== undefined);
      if (st.mode === 'best') return work.some(ok);
      return work.length >= 3 && work.slice(0, 3).every(ok);
    }
    function caliProgress(ex) {
      const st = ex.cali.step;
      const need = st.mode === 'best' ? 1 : 3;
      const key = ex.name.trim().toLowerCase();
      const cur = ex.sets.slice(1).map(s => ({ w: pnum(s.w), r: pnum(s.r) })).filter(s => s.r !== null);
      let streak = 0, broken = false;
      if (cur.length) { if (caliSetsOk(st, cur)) streak++; else broken = true; }
      if (!broken) {
        const ws = state.workouts.filter(w => w.id !== (state.ts && state.ts.workoutId) && workoutSetsOf(w.id).some(s => s.exercise.trim().toLowerCase() === key))
          .sort((a, b) => b.date.localeCompare(a.date) || String(b.created_at).localeCompare(String(a.created_at)));
        for (const w of ws) {
          const sets = workoutSetsOf(w.id).filter(s => s.exercise.trim().toLowerCase() === key && s.set_no !== 0).map(s => ({ w: s.weight, r: s.reps }));
          if (caliSetsOk(st, sets)) streak++; else break;
          if (streak >= need) break;
        }
      }
      return { streak: Math.min(streak, need), need, ready: streak >= need && !st.last };
    }
    function caliNextName(ex) {
      const c = ex.cali;
      const nx = c.kind === 'skill' ? caliSkillStep(c.id, c.step.i + 1) : caliLadderStep(c.id, c.step.i + 1);
      return caliStepLabel(nx);
    }
    function caliProgressHtml(ex, ei) {
      if (ex.advanced) return `<span class="cali-ok">✓ Volgende training: ${esc(ex.advanced)}</span>`;
      const p = caliProgress(ex);
      if (p.ready) return `<button class="cali-next" onclick="caliAdvance(${ei})">Klaar voor de volgende stap → ${esc(caliNextName(ex))}</button>`;
      if (ex.cali.step.last) return `<span class="cali-prog">Laatste stap van deze ladder · ga voor meer herhalingen</span>`;
      return `<span class="cali-prog">${p.need === 1 ? 'Haal het doel één keer' : `${p.streak}/3 trainingen gehaald`}</span>`;
    }
    function caliRepaint(ei) {
      const ex = state.ts && state.ts.exercises[ei];
      const el = document.getElementById('tcp-' + ei);
      if (ex && ex.cali && el) el.innerHTML = caliProgressHtml(ex, ei);
    }
    function caliSetLevel(kind, id, lvl) {
      const plan = { ...trainingPlan() };
      const cp = caliPlan(plan);
      if (kind === 'skill') { cp.skillLevel = lvl; } else { cp.levels = { ...cp.levels, [id]: lvl }; }
      plan.cali = cp;
      saveTrainingPlan(plan);
      return plan;
    }
    function caliAdvance(ei) {
      const ex = state.ts.exercises[ei];
      const next = caliNextName(ex);
      caliSetLevel(ex.cali.kind, ex.cali.id, ex.cali.step.i + 1);
      ex.advanced = next;
      caliRepaint(ei);
      showToast('⬆️ Volgende training: ' + next);
    }

    // Niveau-scherm met uitleg per stap
    function openCaliSheet(ei) { state.tcali = { ei }; render(); }
    function closeCaliSheet() { state.tcali = null; render(); }
    function chooseCaliLevel(lvl) {
      const ts = state.ts; const ex = ts.exercises[state.tcali.ei];
      const typed = ex.sets.some(s => s.w !== '' || s.r !== '');
      if (typed && !confirm('Je sets van deze oefening worden leeggemaakt. Toch wisselen?')) return;
      const plan = caliSetLevel(ex.cali.kind, ex.cali.id, lvl);
      const fresh = caliSessionExercises(plan, ts.session).find(x => x.slot === ex.slot);
      if (fresh) {
        const base = recordFor(fresh.name, ts.workoutId);
        const nx = { ...fresh, sets: [0, 1, 2, 3].map(() => ({ w: '', r: '' })), base, rec: { w: '', r: '' }, recManual: false, hit: false };
        refreshRecordState(nx);
        ts.exercises[state.tcali.ei] = nx;
      }
      state.tcali = null;
      render();
    }
    function renderCaliSheet() {
      const ex = state.ts && state.ts.exercises[state.tcali.ei];
      if (!ex || !ex.cali) return '';
      const c = ex.cali;
      const isSkill = c.kind === 'skill';
      const S = isSkill ? caliSkills[c.id] : null;
      const steps = isSkill ? S.steps.map((s, i) => caliSkillStep(c.id, i)) : caliLadders[c.id].steps.map((s, i) => ({ ...caliLadderStep(c.id, i), how: s[1] }));
      return `
        <div class="modal-overlay tsheet-wrap" onclick="if(event.target === this) closeCaliSheet();">
          <div class="tsheet" role="dialog" aria-label="Niveau kiezen">
            <div class="tsheet-handle"></div>
            <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${isSkill ? 'SKILL · ' + esc(S.label.toUpperCase()) : esc(caliLadders[c.id].label.toUpperCase()) + ' · LADDER'}</div>
            <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin: 6px 0 12px;">${isSkill ? 'Werk 5–10 minuten aan je skill, aan het begin van je training.' : 'Van makkelijk naar moeilijk.'} Ga pas een stap hoger als je het doel ${isSkill ? 'haalt' : '3 trainingen achter elkaar haalt'}. Bij scherpe pijn in een gewricht of pees: stop en ga een stap terug.</div>
            ${isSkill ? `
              ${S.req ? `<div class="cali-warn">⚠️ ${S.req} Zwaar voor je pezen: bouw rustig op.</div>` : ''}
              <div class="cali-how"><b>Hoe begin je:</b> ${S.start}</div>
              <div class="cali-how"><b>Let op:</b> ${S.cues}</div>
            ` : ''}
            ${steps.map((st, i) => {
              const rec = recordFor(st.name.replace(/ met \+10 kg$/, ''), state.ts.workoutId);
              const cur = i === c.step.i;
              return `<button class="tswap-opt ${cur ? 'cur' : ''}" onclick="${cur ? 'closeCaliSheet()' : `chooseCaliLevel(${i})`}">
                <span style="width: 20px; flex-shrink: 0; font-size: 12px; color: #8a8a8a;">${i + 1}</span>
                <span style="flex: 1; text-align: left; min-width: 0;">
                  <span style="display: block; font-size: 14px;">${esc(caliStepLabel(st))}${cur ? ' · <span style="color: #e5484d; font-size: 11px;">huidig</span>' : ''}</span>
                  ${st.how ? `<span style="display: block; font-size: 11px; color: #a3a3a3; margin-top: 3px; line-height: 1.5;">${esc(st.how)}</span>` : ''}
                  <span style="display: block; font-size: 10px; color: #8a8a8a; margin-top: 3px;">${caliRange(st)}</span>
                </span>
                <span style="font-size: 12px; color: #d9a441; white-space: nowrap;">${rec.r ? (rec.w ? '+' + fmtKg(rec.w) + ' kg × ' + rec.r : rec.r + (st.unit === 'sec' ? ' sec' : '')) : '—'}</span>
              </button>`;
            }).join('')}
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px;" onclick="closeCaliSheet()">Sluiten</button>
          </div>
        </div>`;
    }
    function tsuSkill(k) { state.tsetup.cali = { ...(state.tsetup.cali || {}), skill: k, skillLevel: 0 }; render(); }

    function buildSession(plan, idx, key) {
      const date = trainWeekDates()[idx];
      const def = sessionDefs[key];
      const saved = state.workouts.find(w => w.date === date && w.name === def.label && (w.kind || 'strength') !== 'cardio');
      const list = plan.loc === 'cali' ? caliSessionExercises(plan, key) : sessionExercises(plan, key, absDays(plan).includes(idx));
      const savedGroups = saved ? groupSets(workoutSetsOf(saved.id)) : [];
      savedGroups.forEach(g => {
        if (!list.some(x => x.name.toLowerCase() === g.name.trim().toLowerCase())) {
          const lib = libFind(g.name);
          list.push({ slot: 'extra', group: lib ? lib.group : 'extra', name: g.name.trim(), range: lib ? lib.range : '' });
        }
      });
      const exercises = list.map(x => {
        const sets = [0, 1, 2, 3].map(() => ({ w: '', r: '' }));
        const g = savedGroups.find(g => g.name.trim().toLowerCase() === x.name.toLowerCase());
        if (g) g.sets.forEach((s, j) => {
          const i = s.set_no === 0 ? 0 : Math.min(3, s.set_no || j + 1);
          sets[i] = { w: hasValue(s.weight) ? fmtKg(s.weight) : '', r: s.reps !== null && s.reps !== undefined ? String(s.reps) : '' };
        });
        const base = recordFor(x.name, saved ? saved.id : null);
        const ex = { ...x, sets, base, rec: { w: base.w ? fmtKg(base.w) : '', r: base.r ? String(base.r) : '' }, recManual: false, hit: false };
        refreshRecordState(ex);
        return ex;
      });
      return {
        key: date + '|' + key, date, idx, session: key, workoutId: saved ? saved.id : null, exercises,
        duration: saved && saved.duration_min ? String(saved.duration_min) : '', outdoor: saved ? !!saved.outdoor : false,
        startedAt: null, dirty: false
      };
    }

    function refreshRecordState(ex) {
      let top = null;
      ex.sets.forEach((s, i) => {
        if (i === 0) return; // warming-up telt niet mee
        const sc = setScore(pnum(s.w), pnum(s.r));
        if (sc && (!top || sc > top.e)) top = { w: pnum(s.w) || 0, r: Math.round(pnum(s.r)), e: sc };
      });
      const manual = ex.recManual ? setScore(pnum(ex.rec.w), pnum(ex.rec.r)) : 0;
      const ref = Math.max(ex.base.e, manual);
      if (top && top.e > ref + 1e-9) {
        ex.rec = { w: top.w ? fmtKg(top.w) : '', r: String(top.r) };
        ex.hit = true;
      } else {
        ex.hit = false;
        if (!ex.recManual) ex.rec = { w: ex.base.w ? fmtKg(ex.base.w) : '', r: ex.base.r ? String(ex.base.r) : '' };
      }
    }

    function recordBoxStyle(hit) {
      return hit ? 'border-color: #d9a441; background: #2a1f08; box-shadow: 0 0 12px rgba(217,164,65,0.35);' : '';
    }

    function tcSet(ei, si, field, value) {
      const ts = state.ts; if (!ts) return;
      const ex = ts.exercises[ei]; if (!ex) return;
      ex.sets[si][field] = value;
      ts.dirty = true;
      if (!ts.startedAt) ts.startedAt = Date.now();
      refreshRecordState(ex);
      paintRecord(ei);
      if (ex.cali) caliRepaint(ei);
    }
    function tcRec(ei, field, value) {
      const ts = state.ts; if (!ts) return;
      const ex = ts.exercises[ei]; if (!ex) return;
      ex.rec[field] = value; ex.recManual = true; ts.dirty = true;
      ex.hit = false;
      paintRecord(ei, true);
    }
    function paintRecord(ei, keepInputs) {
      const ex = state.ts.exercises[ei];
      const box = document.getElementById('trb-' + ei);
      if (!box) return;
      box.className = 'tcell tcell-rec' + (ex.hit ? ' hit' : '');
      if (!keepInputs) {
        const w = document.getElementById('trw-' + ei), r = document.getElementById('trr-' + ei);
        if (w && document.activeElement !== w) w.value = ex.rec.w;
        if (r && document.activeElement !== r) r.value = ex.rec.r;
      }
      const note = document.getElementById('trn-' + ei);
      if (note) note.innerHTML = ex.hit ? recordNote(ex) : '';
    }
    function recordNote(ex) {
      if (ex.cali) {
        const u = ex.cali.step.unit === 'sec' ? ' sec' : ' reps';
        const f = (w, r) => (Number(String(w).replace(',', '.')) ? '+' + w + ' kg × ' : '') + r + u;
        return `Nieuw record: ${f(ex.rec.w, ex.rec.r)}${ex.base.r ? ' (was ' + f(ex.base.w ? fmtKg(ex.base.w) : '', ex.base.r) + ')' : ''}`;
      }
      const was = ex.base.r ? (ex.base.w ? fmtKg(ex.base.w) + ' kg × ' + ex.base.r : ex.base.r + ' reps') : null;
      const now = ex.rec.w ? ex.rec.w + ' kg × ' + ex.rec.r : ex.rec.r + ' reps';
      return `Nieuw record: ${now}${was ? ' (was ' + was + ')' : ''}`;
    }

    function selectTrainDay(i) {
      if (state.ts && state.ts.dirty && state.ts.idx !== i && !confirm('Je training is nog niet opgeslagen. Toch naar een andere dag?')) return;
      state.tday = i;
      state.ts = null;
      render();
    }
    function pickSession(key) {
      const date = trainWeekDates()[trainSelectedIdx()];
      if (state.ts && state.ts.dirty && !confirm('Je training is nog niet opgeslagen. Toch wisselen?')) return;
      state.tpick = { ...(state.tpick || {}), [date]: key };
      state.ts = null;
      render();
    }

    // Opslaan van de krachttraining
    async function saveSession() {
      stopRest();
      const ts = state.ts; if (!ts) return;
      if (ts.date > todayStr()) { alert('Deze dag is nog niet geweest. Je kunt de training op ' + weekdayLong[ts.idx].toLowerCase() + ' invullen.'); return; }
      const def = sessionDefs[ts.session];
      const sets = [];
      ts.exercises.forEach((ex, pos) => ex.sets.forEach((s, i) => {
        const w = pnum(s.w), r = pnum(s.r);
        if (w === null && r === null) return;
        sets.push({ exercise: ex.name, position: pos, set_no: i, reps: r === null ? null : Math.round(r), weight: w });
      }));
      const manualRecs = ts.exercises.filter(ex => ex.recManual && (pnum(ex.rec.r) || 0) > 0);
      if (!sets.length && !manualRecs.length) { alert('Vul minstens één set in.'); return; }

      const btn = document.getElementById('ts-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }

      const prs = ts.exercises.filter(ex => ex.hit && ex.base.e > 0).map(ex => ex.name + ' ' + (ex.rec.w ? ex.rec.w + ' kg × ' + ex.rec.r : ex.rec.r + ' reps'));
      let duration = pnum(document.getElementById('ts-dur') ? document.getElementById('ts-dur').value : ts.duration);
      if (duration === null && ts.startedAt && ts.date === todayStr()) duration = Math.max(1, Math.round((Date.now() - ts.startedAt) / 60000));
      const outdoorEl = document.getElementById('ts-out');
      const outdoor = outdoorEl ? outdoorEl.checked : ts.outdoor;

      const row = { user_id: state.user.id, date: ts.date, name: def.label, kind: 'strength', duration_min: duration ? Math.round(duration) : null, outdoor: !!outdoor };
      const res = await writeWorkout(row, ts.workoutId);
      let error = res.error; const id = res.id;
      if (!error && id && ts.workoutId) ({ error } = await supabaseClient.from('workout_sets').delete().eq('workout_id', id));
      if (!error && id && sets.length) ({ error } = await supabaseClient.from('workout_sets').insert(sets.map(s => ({ ...s, workout_id: id, user_id: state.user.id }))));
      if (error) {
        alert('Fout bij opslaan: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Training afronden'; }
        return;
      }

      if (manualRecs.length) {
        const plan = { ...trainingPlan() };
        plan.records = { ...(plan.records || {}) };
        manualRecs.forEach(ex => { plan.records[ex.name.toLowerCase()] = { w: pnum(ex.rec.w) || 0, r: Math.round(pnum(ex.rec.r)), date: ts.date }; });
        await saveTrainingPlan(plan);
      }

      const messages = await afterWorkoutSaved(row, !ts.workoutId);
      state.ts = null;
      await loadTraining();
      render();
      if (prs.length) showToast('🏆 Nieuw record: ' + prs[0]);
      else showToast(messages[0] || '💪 Training opgeslagen');
    }

    // Nieuw: kolommen kind/distance_km bestaan pas na training2-update.sql. Ontbreken ze, dan slaan we zonder op.
    async function writeWorkout(row, existingId) {
      let r = { ...row };
      for (let attempt = 0; attempt < 3; attempt++) {
        let res;
        if (existingId) res = await supabaseClient.from('workouts').update(r).eq('id', existingId);
        else res = await supabaseClient.from('workouts').insert([r]).select().single();
        if (!res.error) return { error: null, id: existingId || (res.data && res.data.id) };
        const m = /'(kind|distance_km)' column|column "?(kind|distance_km)"?|(kind|distance_km)/.exec(res.error.message || '');
        const col = m && (m[1] || m[2] || m[3]);
        if (!col || !(col in r)) return { error: res.error };
        if (col === 'distance_km' && r.distance_km) r.notes = [r.notes, String(r.distance_km).replace('.', ',') + ' km'].filter(Boolean).join(' · ');
        delete r[col];
        state.trainingColsMissing = true;
      }
      return { error: { message: 'Opslaan lukte niet' } };
    }

    // Koppelingen: habit Sport en 75 Hard
    async function afterWorkoutSaved(row, isNew) {
      const messages = [];
      if (row.date !== todayStr()) return messages;
      if (!state.habits.workout) await toggleHabit('workout');
      const h = hard75Active();
      if (h && (row.duration_min || 0) >= 45 && isNew) {
        const tasks = { ...hard75TasksFor(h, todayStr()) };
        let key = null;
        if (!tasks.w1) key = 'w1';
        else if (!tasks.w2 && row.outdoor) key = 'w2';
        if (key) { await hard75Toggle(h.id, key); messages.push(key === 'w1' ? '75 Hard: training 1 afgevinkt' : '75 Hard: buitentraining afgevinkt'); }
      }
      return messages;
    }

    // Vervangen / toevoegen
    function openSwap(ei) { state.tswap = { ei }; render(); }
    function openAddExercise() { state.tswap = { add: true, group: null }; render(); }
    function closeSwap() { state.tswap = null; render(); }
    async function chooseSwap(name) {
      const sw = state.tswap; const ts = state.ts;
      if (!sw || !ts) return;
      const lib = libFind(name);
      const fresh = x => {
        const base = recordFor(x.name, ts.workoutId);
        const ex = { ...x, sets: [0, 1, 2, 3].map(() => ({ w: '', r: '' })), base, rec: { w: '', r: '' }, recManual: false, hit: false };
        refreshRecordState(ex);
        return ex;
      };
      if (sw.add) {
        ts.exercises.push(fresh({ slot: 'extra', group: lib.group, name: lib.name, range: lib.range }));
      } else {
        const old = ts.exercises[sw.ei];
        ts.exercises[sw.ei] = fresh({ slot: old.slot, group: old.group, name: lib.name, range: lib.range });
        if (old.slot !== 'extra') {
          const plan = { ...trainingPlan() };
          plan.swaps = { ...(plan.swaps || {}), [ts.session + '|' + old.slot]: lib.name };
          saveTrainingPlan(plan);
        }
      }
      ts.dirty = true;
      state.tswap = null;
      render();
    }
    function removeExtra(ei) {
      if (!state.ts) return;
      state.ts.exercises.splice(ei, 1);
      render();
    }

    // Setup
    function openTrainSetup() {
      const plan = trainingPlan();
      state.tsetup = plan ? JSON.parse(JSON.stringify(plan)) : { split: 'ppl', loc: 'gym', kit: [], days: makeDays('ppl', 5), abs: true, swaps: {}, records: {} };
      state.trainView = 'setup';
      render();
      window.scrollTo(0, 0);
    }
    function tsuCount(n) { const s = state.tsetup; s.split = adviceSplit(n); s.days = makeDays(s.split, n); render(); }
    function tsuSplit(k) { const s = state.tsetup; const n = s.days.filter(Boolean).length || 3; s.split = k; s.days = makeDays(k, n); render(); }
    function tsuDay(i) {
      const s = state.tsetup; const cycle = [...splitDefs[s.split].sessions, null];
      s.days[i] = cycle[(cycle.indexOf(s.days[i]) + 1) % cycle.length];
      render();
    }
    function tsuLoc(l) { state.tsetup.loc = l; render(); }
    function tsuKit(k) { const s = state.tsetup; s.kit = s.kit.includes(k) ? s.kit.filter(x => x !== k) : [...s.kit, k]; render(); }
    async function tsuSave() {
      const s = state.tsetup;
      if (!s.days.some(Boolean)) { alert('Kies minstens één trainingsdag.'); return; }
      await saveTrainingPlan(s);
      state.tsetup = null; state.ts = null; state.tpick = {};
      state.trainView = 'list';
      render();
      window.scrollTo(0, 0);
      showToast('Schema opgeslagen');
    }

    // Cardio
    function openCardio() {
      const idx = trainSelectedIdx();
      const date = trainWeekDates()[idx];
      state.tc = { kind: 'Hardlopen', min: '', km: '', outdoor: true, date: date > todayStr() ? todayStr() : date };
      state.trainView = 'cardio';
      render();
      window.scrollTo(0, 0);
    }
    function tcKind(k) { state.tc.kind = k; state.tc.outdoor = ['Hardlopen', 'Fietsen', 'Wandelen'].includes(k) ? true : (k === 'Zwemmen' || k === 'Roeien' || k === 'HIIT') ? false : state.tc.outdoor; render(); }
    function tcField(f, v) { state.tc[f] = v; const el = document.getElementById('tc-live'); if (el) el.innerHTML = cardioLive(); }
    function fmtPace(minPerKm) { if (!minPerKm || !isFinite(minPerKm)) return '—'; let m = Math.floor(minPerKm), s = Math.round((minPerKm - m) * 60); if (s === 60) { m++; s = 0; } return m + ':' + String(s).padStart(2, '0'); }
    function cardioLive() {
      const t = pnum(state.tc.min), d = pnum(state.tc.km);
      const pace = t && d ? fmtPace(t / d) + ' /km' : '—';
      const speed = t && d ? String(Math.round(d / (t / 60) * 10) / 10).replace('.', ',') + ' km/u' : '—';
      const h = hard75Active();
      const hint = h && state.tc.outdoor ? `<div style="font-size: 11px; color: ${t >= 45 ? '#22c55e' : '#a3a3a3'}; margin-top: 10px; grid-column: 1 / -1;">${t >= 45 ? 'Telt als buitentraining voor 75 Hard' : 'Voor 75 Hard telt buiten vanaf 45 minuten'}</div>` : '';
      return `
        <div class="tc-metric"><div class="tc-metric-v">${pace}</div><div class="tc-metric-l">TEMPO</div></div>
        <div class="tc-metric"><div class="tc-metric-v">${speed}</div><div class="tc-metric-l">SNELHEID</div></div>
        ${hint}
      `;
    }
    function cardioDistance(w) {
      if (hasValue(w.distance_km)) return Number(w.distance_km);
      const m = /([\d]+(?:[.,]\d+)?) km/.exec(w.notes || '');
      return m ? Number(m[1].replace(',', '.')) : 0;
    }
    function cardioRecords(kind) {
      const list = state.workouts.filter(w => w.name === kind && ((w.kind || '') === 'cardio' || cardioKinds.includes(w.name)));
      let longest = 0, longestTime = 0, bestPace = 0;
      list.forEach(w => {
        const d = cardioDistance(w), t = Number(w.duration_min) || 0;
        if (d > longest) longest = d;
        if (t > longestTime) longestTime = t;
        if (d >= 1 && t) { const p = t / d; if (!bestPace || p < bestPace) bestPace = p; }
      });
      return { count: list.length, longest, longestTime, bestPace };
    }
    async function saveCardio() {
      const c = state.tc;
      const t = pnum(c.min), d = cardioNoDistance.includes(c.kind) ? null : pnum(c.km);
      if (!t) { alert('Vul de tijd in minuten in.'); return; }
      const btn = document.getElementById('tc-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }
      const before = cardioRecords(c.kind);
      const row = { user_id: state.user.id, date: c.date || todayStr(), name: c.kind, kind: 'cardio', duration_min: Math.round(t), distance_km: d, outdoor: !!c.outdoor };
      const res = await writeWorkout(row, null);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message); if (btn) { btn.disabled = false; btn.textContent = 'Cardio opslaan'; } return; }
      const messages = await afterWorkoutSaved(row, true);
      let pr = null;
      if (before.count && d && d > before.longest) pr = 'langste afstand ' + String(d).replace('.', ',') + ' km';
      else if (before.count && d >= 1 && before.bestPace && t / d < before.bestPace) pr = 'snelste tempo ' + fmtPace(t / d) + ' /km';
      state.tc = null;
      state.trainView = 'list';
      await loadTraining();
      render();
      window.scrollTo(0, 0);
      showToast(pr ? '🏆 Nieuw record: ' + pr : (messages[0] || '🏃 Cardio opgeslagen'));
    }

    // ============================================
    // RENDER: TRAINING
    // ============================================
    function renderTraining() {
      if (state.trainView === 'edit' && state.trainForm) return renderWorkoutEditor();
      if (state.trainView === 'setup' && state.tsetup) return renderTrainSetup();
      if (state.trainView === 'cardio' && state.tc) return renderCardio();
      const plan = trainingPlan();
      if (!plan) { openTrainSetupSilently(); return renderTrainSetup(); }

      const dates = trainWeekDates();
      const today = todayStr();
      const idx = trainSelectedIdx();
      const key = sessionKeyFor(plan, idx);
      const date = dates[idx];

      return `
        <div class="page-header" style="margin-bottom: 16px;">
          <div class="page-sub">Fysiek</div>
          <div class="page-title">Training</div>
        </div>

        ${state.trainingError ? `
          <div class="info-box"><div class="info-title">⚠️ Training nog niet klaar</div><div class="info-text">${esc(state.trainingError)} Voer training-update.sql uit in Supabase.</div></div>
        ` : ''}
        ${state.trainingPlanLocal || state.trainingColsMissing ? `
          <div class="info-box"><div class="info-title">Nog één update</div><div class="info-text">Voer training2-update.sql uit in Supabase, dan wordt je schema ook online bewaard${state.trainingColsMissing ? ' en krijgt cardio een eigen afstandsveld' : ''}.</div></div>
        ` : ''}

        <div class="tweek">
          ${dates.map((d, i) => {
            const k = sessionKeyFor(plan, i);
            const cls = ['tday', i === idx ? 'sel' : '', !k ? 'rest' : '', d === today ? 'today' : ''].filter(Boolean).join(' ');
            return `<button class="${cls}" onclick="selectTrainDay(${i})" aria-label="${weekdayLong[i]}: ${k ? sessionDefs[k].label : 'rust'}">
              <span class="tday-d">${weekdayShort[i]}</span><span class="tday-s">${k ? esc(sessionDefs[k].label) : 'Rust'}</span>
            </button>`;
          }).join('')}
        </div>

        ${key ? renderSession(plan, idx, key) : renderRestDay(plan, idx)}

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 24px 0 8px;">
          <button class="btn btn-secondary btn-small" onclick="openCardio()">+ Cardio</button>
          <button class="btn btn-secondary btn-small" onclick="openTrainSetup()">Schema aanpassen</button>
        </div>

        <div class="tabs" style="margin-top: 24px;">
          <button class="tab ${state.trainTab !== 'prs' ? 'active' : ''}" onclick="state.trainTab = 'list'; render();">Logboek</button>
          <button class="tab ${state.trainTab === 'prs' ? 'active' : ''}" onclick="state.trainTab = 'prs'; render();">Records</button>
        </div>
        ${state.trainTab === 'prs' ? renderRecords() : renderWorkoutList()}
        ${state.tswap ? renderSwapSheet(plan) : ''}
        ${state.tcali ? renderCaliSheet() : ''}
      `;
    }

    function openTrainSetupSilently() {
      if (!state.tsetup) state.tsetup = { split: 'ppl', loc: 'gym', kit: [], days: makeDays('ppl', 5), abs: true, swaps: {}, records: {} };
      state.trainView = 'setup';
    }

    function renderRestDay(plan, idx) {
      const ses = splitDefs[plan.split].sessions;
      return `
        <div class="card" style="margin-top: 16px;">
          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.2em; font-weight: 600;">${weekdayLong[idx].toUpperCase()}</div>
          <div style="font-size: 26px; font-weight: 300; letter-spacing: 0.08em; margin-top: 4px;">RUSTDAG</div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 8px;">Spieren groeien in rust. Wandelen of rustige cardio mag altijd.</div>
          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.15em; margin-top: 16px; margin-bottom: 8px;">TOCH TRAINEN?</div>
          <div class="chips" style="margin: 0;">
            ${ses.map(k => `<button class="chip" onclick="pickSession('${k}')">${esc(sessionDefs[k].label)}</button>`).join('')}
          </div>
        </div>
      `;
    }

    function renderSession(plan, idx, key) {
      const dates = trainWeekDates();
      const date = dates[idx];
      if (!state.ts || state.ts.key !== date + '|' + key) state.ts = buildSession(plan, idx, key);
      const ts = state.ts;
      const def = sessionDefs[key];
      const today = todayStr();
      const when = date === today ? ' · VANDAAG' : date > today ? '' : (ts.workoutId ? ' · OPGESLAGEN' : '');
      let lastGroup = null;
      const ses = splitDefs[plan.split].sessions;

      return `
        <div style="border-top: 1px solid #1c1c1c; padding-top: 14px; margin-top: 16px; margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
            <div>
              <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${weekdayLong[idx].toUpperCase()}${when}</div>
              <div style="font-size: 26px; font-weight: 300; letter-spacing: 0.08em; margin-top: 2px;">${esc(def.label.toUpperCase())}</div>
              <div style="font-size: 11px; color: #8a8a8a; margin-top: 2px;">${esc(plan.loc === 'cali' && caliSessions[key] ? 'Calisthenics · ' + caliSessions[key].sub : def.sub)}</div>
            </div>
            <select class="tsel" aria-label="Andere training kiezen" onchange="pickSession(this.value || null)">
              ${ses.map(k => `<option value="${k}" ${k === key ? 'selected' : ''}>${esc(sessionDefs[k].label)}</option>`).join('')}
              <option value="">Rust</option>
            </select>
          </div>
        </div>

        <div class="tgrid-head">
          <span>WARM-UP</span><span>SET 1</span><span>SET 2</span><span>SET 3</span><span style="color: #d9a441;">RECORD</span>
        </div>

        ${ts.exercises.map((ex, ei) => {
          const head = ex.group !== lastGroup ? `<div class="tgroup ${ex.group === 'skill' ? 'skill' : ''}">${esc((ex.groupLabel || muscleGroups[ex.group] || 'Extra').toUpperCase())}</div>` : '';
          const ph = ex.cali ? ['+kg', ex.cali.step.unit === 'sec' ? 'sec' : 'reps'] : ['kg', 'reps'];
          lastGroup = ex.group;
          return `
            ${head}
            <div class="tex">
              <div class="tex-top">
                <div style="min-width: 0;">
                  <div class="tex-name">${esc(ex.label || ex.name)}</div>
                  <div class="tex-range">${ex.cali ? esc(ex.range) : ex.range ? 'werksets ' + esc(ex.range) + (/sec|mogelijk/.test(ex.range) ? '' : ' reps') : ''}</div>
                </div>
                ${ex.cali ? `<button class="tex-btn" onclick="openCaliSheet(${ei})">ⓘ Niveau</button>` : ex.slot === 'extra'
                  ? `<button class="tex-btn" onclick="removeExtra(${ei})" aria-label="Oefening weghalen">✕</button>`
                  : `<button class="tex-btn" onclick="openSwap(${ei})">⇄ Vervangen</button>`}
              </div>
              <div class="tgrid">
                ${ex.sets.map((s, si) => `
                  <div class="tcell${si === 0 ? ' warm' : ''}">
                    <input type="text" inputmode="decimal" value="${esc(s.w)}" placeholder="${ph[0]}" aria-label="${esc(ex.name)} ${si === 0 ? 'warm-up' : 'set ' + si} gewicht" oninput="tcSet(${ei}, ${si}, 'w', this.value)">
                    <input type="text" inputmode="numeric" class="reps" value="${esc(s.r)}" placeholder="${ph[1]}" aria-label="${esc(ex.name)} ${si === 0 ? 'warm-up' : 'set ' + si} reps" oninput="tcSet(${ei}, ${si}, 'r', this.value)" onchange="tcRepsDone(${ei}, ${si}, this.value)">
                  </div>
                `).join('')}
                <div class="tcell tcell-rec${ex.hit ? ' hit' : ''}" id="trb-${ei}">
                  <input type="text" inputmode="decimal" id="trw-${ei}" value="${esc(ex.rec.w)}" placeholder="${ph[0]}" aria-label="${esc(ex.name)} record gewicht" oninput="tcRec(${ei}, 'w', this.value)">
                  <input type="text" inputmode="numeric" id="trr-${ei}" class="reps" value="${esc(ex.rec.r)}" placeholder="${ph[1]}" aria-label="${esc(ex.name)} record reps" oninput="tcRec(${ei}, 'r', this.value)">
                </div>
              </div>
              <div class="tex-note" id="trn-${ei}">${ex.hit ? recordNote(ex) : ''}</div>
              ${ex.cali ? `<div class="cali-line" id="tcp-${ei}">${caliProgressHtml(ex, ei)}</div>` : ''}
            </div>
          `;
        }).join('')}

        <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 4px;" onclick="openAddExercise()">+ Oefening</button>

        <div class="card" style="margin-top: 16px; padding: 16px;">
          <div style="display: flex; gap: 12px; align-items: center;">
            <label class="form-label" style="margin: 0; flex-shrink: 0;" for="ts-dur">Duur (min)</label>
            <input type="text" inputmode="numeric" class="input-sm" id="ts-dur" value="${esc(ts.duration)}" placeholder="${ts.startedAt ? 'automatisch' : '60'}" oninput="state.ts.duration = this.value">
          </div>
          <label style="display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 13px; color: #a3a3a3; cursor: pointer;">
            <input type="checkbox" id="ts-out" ${ts.outdoor ? 'checked' : ''} onchange="state.ts.outdoor = this.checked" style="width: 18px; height: 18px; accent-color: #7f1d1d;"> Buiten getraind
          </label>
        </div>

        <button class="btn btn-primary" id="ts-save" style="width: 100%; padding: 18px;" onclick="saveSession()" ${date > today ? 'disabled' : ''}>${date > today ? 'Kan vanaf ' + weekdayLong[idx].toLowerCase() : (ts.workoutId ? 'Training bijwerken' : 'Training afronden')}</button>
      `;
    }

    function renderSwapSheet(plan) {
      const sw = state.tswap; const ts = state.ts;
      if (!ts) return '';
      let title, intro, groups;
      if (sw.add) {
        title = 'OEFENING TOEVOEGEN';
        intro = 'Alleen voor deze training. Kies een spiergroep en daarna de oefening.';
        groups = sw.group ? [sw.group] : [];
      } else {
        const ex = ts.exercises[sw.ei];
        title = (muscleGroups[ex.group] || '').toUpperCase() + ' · VERVANG ' + ex.name.toUpperCase();
        intro = `Alleen ${(muscleGroups[ex.group] || '').toLowerCase()}-oefeningen${plan.loc === 'home' ? ' die je thuis kunt doen' : ''}. Je record blijft per oefening bewaard, dus wisselen kost je niets.`;
        groups = [ex.group];
      }
      const current = sw.add ? null : ts.exercises[sw.ei].name;
      const inSession = ts.exercises.map(e => e.name);
      return `
        <div class="modal-overlay tsheet-wrap" onclick="if(event.target === this) closeSwap();">
          <div class="tsheet" role="dialog" aria-label="Oefening kiezen">
            <div class="tsheet-handle"></div>
            <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${esc(title)}</div>
            <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin: 6px 0 12px;">${esc(intro)}</div>
            ${sw.add ? `
              <div class="chips" style="margin: 0 0 12px;">
                ${Object.keys(muscleGroups).map(g => `<button class="chip ${sw.group === g ? 'active' : ''}" onclick="state.tswap.group = '${g}'; render();">${esc(muscleGroups[g])}</button>`).join('')}
              </div>
            ` : ''}
            ${groups.map(g => exerciseLib.filter(e => e.group === g && kitAvailable(plan, e)).map(e => {
              const rec = recordFor(e.name, ts.workoutId);
              const isCur = e.name === current;
              const taken = !isCur && inSession.includes(e.name);
              return `<button class="tswap-opt ${isCur ? 'cur' : ''}" ${taken ? 'disabled' : ''} onclick="${isCur ? 'closeSwap()' : `chooseSwap(${esc(JSON.stringify(e.name))})`}">
                <span style="flex: 1; text-align: left; min-width: 0;">
                  <span style="display: block; font-size: 14px;">${esc(e.name)}</span>
                  <span style="display: block; font-size: 11px; color: #8a8a8a; margin-top: 2px;">${e.kit.map(k => kitNames[k]).join(' / ')}${isCur ? ' · huidige' : taken ? ' · staat al in deze training' : ''}</span>
                </span>
                <span style="font-size: 12px; color: #d9a441; white-space: nowrap;">${rec.r ? (rec.w ? fmtKg(rec.w) + ' × ' + rec.r : rec.r + ' reps') : '—'}</span>
              </button>`;
            }).join('')).join('')}
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px;" onclick="closeSwap()">Annuleren</button>
          </div>
        </div>
      `;
    }

    function renderTrainSetup() {
      const s = state.tsetup;
      const count = s.days.filter(Boolean).length;
      const rest = 7 - count;
      const advice = adviceSplit(count || 3);
      const hasPlan = !!trainingPlan();
      const adviceText = {
        fb: 'Bij 2 of 3 dagen train je elke keer je hele lichaam, met 1 oefening per spiergroep. Zo raak je elke spier 2 tot 3 keer per week. Wissel Full A en Full B af.',
        ul: 'Bij 4 dagen wissel je bovenlichaam en onderlichaam af, met 2 oefeningen per spiergroep. Elke spiergroep komt 2 keer per week aan bod.',
        ppl: 'Bij 5 dagen train je Push, Pull en Legs. Spieren groeien in rust, daarom minimaal 2 rustdagen per week.'
      }[advice];
      const restMsg = rest >= 2 ? `<span style="color: #22c55e;">${rest} rustdagen ✓</span>`
        : rest === 1 ? `<span style="color: #eab308;">Maar 1 rustdag</span>` : `<span style="color: #e5484d;">Geen rustdag</span>`;

        <div class="page-header" style="margin-bottom: 16px;">
          <div class="page-sub">Training</div>
          <div class="page-title">Instellen</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-top: 8px; line-height: 1.6;">Vier vragen, daarna staat je schema klaar. Je kunt dit later altijd aanpassen.</div>
        </div>
        ${hasPlan ? `<button class="entry-action" style="margin-bottom: 16px;" onclick="state.tsetup = null; setTrainView('list');">← Terug</button>` : ''}

        <div class="card">
          <div class="tq">1 · HOEVEEL DAGEN PER WEEK?</div>
          <div class="tcount">
            ${[2, 3, 4, 5, 6].map(n => `<button class="${count === n ? 'on' : ''} ${n === 6 ? 'warn' : ''}" onclick="tsuCount(${n})">${n}</button>`).join('')}
          </div>
          ${count >= 6 ? `<div style="font-size: 11px; color: #eab308; line-height: 1.5; margin-top: 10px;">Bij 6 dagen blijft er maar 1 rustdag over. Spieren groeien in rust: 5 dagen is voor de meeste mensen beter.</div>` : ''}
        </div>

        <div class="card">
          <div class="tq">2 · HOE TRAIN JE?</div>
          <button class="topt ${s.loc === 'gym' ? 'on' : ''}" onclick="tsuLoc('gym')"><span class="topt-t">Gym</span><span class="topt-s">Barbells, dumbbells, kabels en machines</span></button>
          <button class="topt ${s.loc === 'home' ? 'on' : ''}" onclick="tsuLoc('home')"><span class="topt-t">Thuis</span><span class="topt-s">Kies hieronder wat je hebt</span></button>
          ${s.loc === 'home' ? `
            <div class="chips" style="margin: 4px 0 8px;">
              ${homeKitOptions.map(([k, l]) => `<button class="chip ${s.kit.includes(k) ? 'active' : ''}" onclick="tsuKit('${k}')">${l}</button>`).join('')}
            </div>
            <div style="font-size: 10px; color: #8a8a8a; margin-bottom: 8px;">Niks aangevinkt? Dan krijg je oefeningen met je eigen lichaamsgewicht.</div>
          ` : ''}
          <button class="topt ${s.loc === 'cali' ? 'on' : ''}" onclick="tsuLoc('cali')" style="margin-bottom: 0;"><span class="topt-t">Calisthenics</span><span class="topt-s">Lichaamsgewicht: ladders van makkelijk naar moeilijk. Optrekstang en dipstation of twee stoelen.</span></button>
        </div>

        <div class="card">
          <div class="tq" style="margin-bottom: 4px;">3 · WELKE TRAINING OP WELKE DAG?</div>
          <div style="font-size: 11px; color: #a3a3a3; line-height: 1.5; margin-bottom: 12px;">Tik op een dag om te wisselen: ${splitDefs[s.split].sessions.map(k => sessionDefs[k].label).join(', ')} of Rust. Deze rij zie je elke week bovenaan je training.</div>
          <div class="tweek" style="margin: 0;">
            ${s.days.map((k, i) => `<button class="tday ${k ? 'set' : 'rest'}" onclick="tsuDay(${i})" aria-label="${weekdayLong[i]}: ${k ? sessionDefs[k].label : 'rust'}">
              <span class="tday-d">${weekdayShort[i]}</span><span class="tday-s">${k ? esc(sessionDefs[k].label) : 'Rust'}</span>
            </button>`).join('')}
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; gap: 8px;">
            <span style="color: #a3a3a3;">Rustdagen: ${s.days.map((k, i) => k ? null : weekdayShort[i]).filter(Boolean).join(' · ') || 'geen'}</span>
            ${restMsg}
          </div>
        </div>

        ${s.loc === 'cali' ? `
        <div class="card">
          <div class="tq" style="margin-bottom: 4px;">4 · SKILL (OPTIONEEL)</div>
          <div style="font-size: 11px; color: #a3a3a3; line-height: 1.5; margin-bottom: 12px;">Eén vaardigheid waar je 5–10 minuten aan werkt, aan het begin van elke training.</div>
          <div class="chips" style="margin: 0;">
            <button class="chip ${!(s.cali && s.cali.skill) ? 'active' : ''}" onclick="tsuSkill(null)">Geen</button>
            ${Object.keys(caliSkills).map(k => `<button class="chip ${s.cali && s.cali.skill === k ? 'active' : ''}" onclick="tsuSkill('${k}')">${esc(caliSkills[k].label)}</button>`).join('')}
          </div>
          ${s.cali && s.cali.skill ? `
            ${caliSkills[s.cali.skill].req ? `<div class="cali-warn" style="margin-top: 12px;">⚠️ ${caliSkills[s.cali.skill].req} Zwaar voor je pezen: bouw rustig op.</div>` : ''}
            <div class="cali-how" style="margin-top: 12px;"><b>Hoe begin je:</b> ${caliSkills[s.cali.skill].start}</div>
          ` : ''}
          <div style="font-size: 11px; color: #8a8a8a; line-height: 1.5; margin-top: 12px;">Je startniveau per oefening stel je in de training in met <b style="color: #a3a3a3;">ⓘ Niveau</b>.</div>
        </div>` : `
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
          <div>
            <div class="tq" style="margin-bottom: 0;">4 · BUIKSPIEREN ERBIJ?</div>
            <div style="font-size: 11px; color: #a3a3a3; margin-top: 6px; line-height: 1.5;">Eén oefening aan het eind van 2 trainingen per week</div>
          </div>
          <button class="ttoggle ${s.abs ? 'on' : ''}" role="switch" aria-checked="${s.abs ? 'true' : 'false'}" aria-label="Buikspieren" onclick="state.tsetup.abs = !state.tsetup.abs; render();"><span></span></button>
        </div>`}

        <div class="card" style="background: #120d04; border-color: #d9a441;">
          <div style="font-size: 10px; color: #d9a441; letter-spacing: 0.15em; font-weight: 600;">ONS ADVIES</div>
          <div style="font-size: 20px; font-weight: 300; letter-spacing: 0.04em; margin-top: 6px;">${splitDefs[advice].name} · ${count || '?'} ${count === 1 ? 'dag' : 'dagen'}</div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 6px;">${adviceText}</div>
          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.15em; margin-top: 14px; margin-bottom: 8px;">SPLIT</div>
          <div class="chips" style="margin: 0;">
            ${Object.keys(splitDefs).map(k => `<button class="chip ${s.split === k ? 'active' : ''}" onclick="tsuSplit('${k}')">${esc(splitDefs[k].short)}${k === advice ? ' · advies' : ''}</button>`).join('')}
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="tsuSave()">${hasPlan ? 'Schema opslaan' : 'Schema maken'}</button>
      `;
    }

    function renderCardio() {
      const c = state.tc;
      const rec = cardioRecords(c.kind);
      const noDist = cardioNoDistance.includes(c.kind);
      return `
        <div class="page-header" style="margin-bottom: 16px;">
          <div class="page-sub">Training</div>
          <div class="page-title">Cardio</div>
        </div>
        <button class="entry-action" style="margin-bottom: 16px;" onclick="state.tc = null; setTrainView('list');">← Terug</button>

        <div class="card">
          <div class="tq">SOORT</div>
          <div class="tkinds">
            ${cardioKinds.map(k => `<button class="${c.kind === k ? 'on' : ''}" onclick="tcKind('${k}')">${k}</button>`).join('')}
          </div>
          <div class="form-row" style="margin-top: 8px;">
            <div><label class="form-label">Tijd (min)</label><input type="text" inputmode="decimal" class="form-input" id="tc-min" value="${esc(c.min)}" placeholder="30" oninput="tcField('min', this.value)"></div>
            ${noDist ? '<div></div>' : `<div><label class="form-label">Afstand (km)</label><input type="text" inputmode="decimal" class="form-input" id="tc-km" value="${esc(c.km)}" placeholder="5,0" oninput="tcField('km', this.value)"></div>`}
          </div>
          ${noDist ? '' : `<div class="tc-live" id="tc-live">${cardioLive()}</div>`}
          <div class="form-row">
            <div><label class="form-label">Datum</label><input type="date" class="form-input" value="${esc(c.date)}" max="${todayStr()}" onchange="state.tc.date = this.value"></div>
            <div></div>
          </div>
          <label style="display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 13px; color: #a3a3a3; cursor: pointer;">
            <input type="checkbox" ${c.outdoor ? 'checked' : ''} onchange="state.tc.outdoor = this.checked; const l = document.getElementById('tc-live'); if (l) l.innerHTML = cardioLive();" style="width: 18px; height: 18px; accent-color: #7f1d1d;"> Buiten
          </label>
        </div>

        ${rec.count ? `
          <div class="card" style="background: #120d04; border-color: #d9a441;">
            <div style="font-size: 10px; color: #d9a441; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 10px;">JE RECORDS · ${esc(c.kind.toUpperCase())}</div>
            ${!noDist && rec.bestPace ? `<div class="trec-row"><span>Snelste tempo</span><span>${fmtPace(rec.bestPace)} /km</span></div>` : ''}
            ${!noDist && rec.longest ? `<div class="trec-row"><span>Langste afstand</span><span>${String(Math.round(rec.longest * 10) / 10).replace('.', ',')} km</span></div>` : ''}

          </div>
        ` : ''}

        <button class="btn btn-primary" id="tc-save" style="width: 100%; padding: 18px;" onclick="saveCardio()">Cardio opslaan</button>
      `;
    }

    function openLogItem(id) {
      const w = workoutById(id);
      if (!w) return;
      const i = trainWeekDates().indexOf(w.date);
      const isSession = Object.keys(sessionDefs).some(k => sessionDefs[k].label === w.name) && (w.kind || 'strength') !== 'cardio';
      if (i >= 0 && isSession && trainingPlan()) {
        if (state.ts && state.ts.dirty && !confirm('Je training is nog niet opgeslagen. Toch wisselen?')) return;
        state.tday = i; state.ts = null;
        if (state.tpick) delete state.tpick[w.date];
        render(); window.scrollTo(0, 0);
        return;
      }
      editWorkout(id);
    }

    function renderWorkoutList() {
      if (!state.workouts.length) return `<div class="empty">Nog geen trainingen gelogd.<br><br>Vul hierboven je eerste training in: je records komen vanzelf in het gouden vakje te staan.</div>`;
      const list = state.trainShowAll ? state.workouts : state.workouts.slice(0, 15);
      return `
        ${list.map(w => {
          const groups = groupSets(workoutSetsOf(w.id));
          const vol = workoutVolume(w.id);
          return `
            <div class="goal" style="cursor: pointer;" onclick="openLogItem('${w.id}')">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
                <div class="goal-title" style="margin-bottom: 0;">${esc(w.name)}</div>
                <div style="font-size: 11px; color: #a3a3a3; white-space: nowrap;">${fmtDateShort(w.date)}</div>
              </div>
              <div class="goal-meta" style="margin-top: 6px;">
                ${w.duration_min ? `<span class="badge">${w.duration_min} min</span>` : ''}
                ${w.outdoor ? '<span class="badge">🌳 buiten</span>' : ''}
                ${cardioDistance(w) ? `<span class="badge">${String(cardioDistance(w)).replace('.', ',')} km</span>` : ''}
                ${vol ? `<span class="badge">${fmtInt(Math.round(vol))} kg volume</span>` : ''}
              </div>
              ${groups.length ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.7; margin-top: 8px;">${groups.map(g => `${esc(g.name)} <span style="color: #8a8a8a;">${setsSummary(g.sets)}</span>`).join('<br>')}</div>` : ''}
              ${w.notes ? `<div class="goal-notes">${esc(w.notes)}</div>` : ''}
            </div>
          `;
        }).join('')}
        ${state.workouts.length > 15 ? `<button class="btn btn-secondary btn-small" style="width: 100%;" onclick="state.trainShowAll = !state.trainShowAll; render();">${state.trainShowAll ? 'Minder tonen' : 'Alle ' + state.workouts.length + ' trainingen tonen'}</button>` : ''}
      `;
    }

    function renderRecords() {
      const names = {};
      state.workoutSets.forEach(s => {
        const key = s.exercise.trim().toLowerCase();
        if (!names[key]) names[key] = s.exercise.trim();
      });
      const rows = Object.values(names).map(n => ({ n, b: bestFor(n, null), count: new Set(state.workoutSets.filter(s => s.exercise.trim().toLowerCase() === n.toLowerCase()).map(s => s.workout_id)).size }))
        .filter(x => x.b.weight || x.b.reps)
        .sort((a, b) => b.count - a.count || a.n.localeCompare(b.n));
      if (!rows.length) return `<div class="empty">Nog geen records. Log trainingen met gewichten om je records te zien.</div>`;
      return `
        <div class="card">
          <div style="display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; font-size: 9px; color: #8a8a8a; letter-spacing: 0.1em; padding-bottom: 8px; border-bottom: 1px solid #1c1c1c;">
            <span>OEFENING</span><span style="text-align: right;">ZWAARSTE</span><span style="text-align: right;">GESCHAT 1RM</span>
          </div>
          ${rows.map(r => `
            <div style="display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid #1c1c1c; font-size: 12px; align-items: baseline;">
              <span>${esc(r.n)}<span style="display: block; font-size: 10px; color: #8a8a8a; margin-top: 2px;">${r.count}× getraind</span></span>
              <span style="text-align: right;">${r.b.weight ? fmtInt(r.b.weight) + ' kg × ' + r.b.reps : r.b.reps + ' reps'}<span style="display: block; font-size: 10px; color: #8a8a8a; margin-top: 2px;">${r.b.wDate ? fmtDateShort(r.b.wDate) : ''}</span></span>
              <span style="text-align: right;">${r.b.e1rm ? fmtInt(Math.round(r.b.e1rm)) + ' kg' : '—'}</span>
            </div>
          `).join('')}
          <div style="font-size: 10px; color: #8a8a8a; line-height: 1.6; margin-top: 12px;">Geschat 1RM = wat je ongeveer 1 keer zou kunnen tillen, berekend uit je beste set (formule van Epley).</div>
        </div>
      `;
    }

                  <button class="icon-btn" style="color: #8a8a8a;" onclick="tfMoveExercise(${i}, -1)" aria-label="Omhoog">↑</button>
                  <button class="icon-btn" style="color: #8a8a8a;" onclick="tfMoveExercise(${i}, 1)" aria-label="Omlaag">↓</button>

              <div style="display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 8px; align-items: center; margin-top: 12px; font-size: 9px; color: #8a8a8a; letter-spacing: 0.1em;">
                <span>SET</span><span>REPS</span><span>KG</span><span></span>
              </div>
              ${ex.sets.map((s, j) => `
                <div style="display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 8px; align-items: center; margin-top: 6px;">

                  <input type="text" inputmode="numeric" class="input-sm" value="${esc(s.reps)}" placeholder="reps" oninput="tfSet(${i}, ${j}, 'reps', this.value)" aria-label="Reps set ${j + 1}">
                  <input type="text" inputmode="decimal" class="input-sm" value="${esc(s.weight)}" placeholder="kg" oninput="tfSet(${i}, ${j}, 'weight', this.value)" aria-label="Gewicht set ${j + 1}">

        <div class="card">

      `;
    }

    // ============================================
    // WEEKRAPPORT
    // ============================================
    const weekQuestions = [
      'Wat was je grootste overwinning deze week, en hoe herhaal je die?',
      'Welke habit liet je het vaakst liggen, en wat hield je tegen?',
      'Op welk moment was je deze week het sterkst? Wat deed je toen anders?',
      'Wat ga je volgende week bewust anders doen? Eén ding.',
      'Waar ben je deze week trots op dat niemand anders heeft gezien?',
      'Welke situatie kostte je deze week de meeste energie, en hoe bereid je je erop voor?',
      'Als je deze week een cijfer geeft voor discipline: welk cijfer, en wat maakt het één punt hoger?',
      'Wie of wat heeft je deze week geholpen, en hoe kun je daar meer van krijgen?'
    ];

    function isoWeekNumber(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const jan4 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    }

    function computeWeek(offset) {
      const p = getProgress();
      const today = todayStr();
      const start = dateAdd(weekKey(today), -7 * offset);
      const end = dateAdd(start, 6);
      const last = end < today ? end : today;
      const inWeek = d => d >= start && d <= last;
      const dayMap = {};
      p.days.forEach(d => { dayMap[d.date] = d; });

      const days = [];
      for (let d = start; d <= end; d = dateAdd(d, 1)) {
        days.push({ date: d, future: d > today, ...(dayMap[d] || { xp: 0, score: 0 }) });
      }
      // Dagen vóór je eerste gegevens tellen niet mee
      const firstDate = p.days.length ? p.days[0].date : today;
      days.forEach(d => { d.before = d.date < firstDate; });
      const past = days.filter(d => !d.future && !d.before);
      const avg = past.length ? Math.round(past.reduce((a, d) => a + (d.score || 0), 0) / past.length) : 0;
      const xp = past.reduce((a, d) => a + (d.xp || 0), 0);
      const best = past.reduce((b, d) => (!b || d.score > b.score ? d : b), null);

      // Habits: hoe vaak per habit
      const hist = { ...state.habitHistory, [today]: { ...state.habits } };
      const habitCounts = visibleHabitKeys.map(k => ({ k, n: past.filter(d => hist[d.date] && hist[d.date][k]).length }))
        .sort((a, b) => b.n - a.n);
      const negCount = negativeHabitKeys.reduce((a, k) => a + past.filter(d => hist[d.date] && hist[d.date][k]).length, 0);

      // Challenges
      let chDone = 0, chTotal = 0;
      const completed = [], failed = [];
      state.challenges.forEach(c => {
        const ev = evalChallenge(c);
        ev.days.forEach(d => {
          if (!inWeek(d.date) || d.st === 'future' || d.st === 'pending') return;
          if (c.ended_on && d.date > c.ended_on) return;
          chTotal++;
          if (d.st === 'done') chDone++;
        });
        if (c.ended_on && inWeek(c.ended_on)) (c.status === 'completed' ? completed : failed).push(c.name);
      });

      const workouts = (state.workouts || []).filter(w => inWeek(w.date));
      const minutes = workouts.reduce((a, w) => a + (Number(w.duration_min) || 0), 0);
      const journals = journaledEntries().filter(e => inWeek(e.date)).length;

      // Gewicht: laatste meting tot en met deze week vs. laatste meting daarvoor
      const wl = bodyEntriesFor('weight');
      const wNow = wl.filter(x => x.date <= last).pop() || null;
      const wPrev = wl.filter(x => x.date < start).pop() || null;
      const weightDelta = (wNow && wPrev && wNow.date >= start) ? Math.round((wNow.value - wPrev.value) * 10) / 10 : null;

      return { offset, start, end, days, past, avg, xp, best, habitCounts, negCount, chDone, chTotal, completed, failed, workouts, minutes, journals, wNow, weightDelta, week: isoWeekNumber(start) };
    }

    function deltaBadge(now, prev, unit) {
      if (prev === null || prev === undefined) return '';
      const d = now - prev;
      if (!d) return `<span style="color: #8a8a8a; font-size: 11px;">= vorige week</span>`;
      return `<span style="color: ${d > 0 ? '#22c55e' : '#eab308'}; font-size: 11px;">${d > 0 ? '+' : ''}${fmtInt(d)}${unit || ''} t.o.v. vorige week</span>`;
    }

    function writeWeekReflection(q, week) {
      state.content = `Weekreflectie week ${week}\n${q}\n\n`;
      state.editingId = null;
      state.journalTab = 'new';
      setSection('journal');
    }

    function setWeekOffset(o) {
      state.weekOffset = Math.max(0, o);
      render();

          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.15em;">GEMIDDELDE DAGSCORE</div>

                <div style="font-size: 10px; color: #a3a3a3; margin-bottom: 4px;">${d.future || d.before ? '' : d.score}</div>
                <div style="height: 48px; display: flex; align-items: flex-end;"><div style="width: 100%; height: ${d.future || d.before ? 2 : Math.max(3, Math.round(d.score * 0.48))}px; background: ${d.future || d.before ? '#141414' : (w.best && d.date === w.best.date ? '#e5484d' : (d.score >= 50 ? '#525252' : '#262626'))};"></div></div>

        <div class="card">
          <label class="label">Habits deze week</label>
          ${w.habitCounts.map(h => `
            <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0;">
              <span style="width: 24px; text-align: center;">${habitConfig[h.k].icon}</span>

                ${w.days.map(d => {
                  const hist = d.date === todayStr() ? state.habits : (state.habitHistory[d.date] || {});
                  return `<span style="width: 10px; height: 10px; background: ${d.future || d.before ? '#141414' : (hist[h.k] ? '#22c55e' : '#262626')};"></span>`;

        </div>

        <div class="card">
          <label class="label">Challenges, lichaam & slaap</label>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Challenge-dagen gehaald</span><span>${w.chTotal ? w.chDone + ' van ' + w.chTotal : '—'}</span></div>
          ${w.completed.length ? `<div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Voltooid</span><span style="color: #22c55e;">🏆 ${w.completed.map(esc).join(', ')}</span></div>` : ''}
          ${w.failed.length ? `<div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Gestopt of gemist</span><span>${w.failed.map(esc).join(', ')}</span></div>` : ''}
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Trainingstijd</span><span>${w.minutes ? w.minutes + ' min' : (w.workouts.length ? w.workouts.length + ' trainingen' : '—')}</span></div>
          ${(() => { const sn = sleepNights(w.start, w.end); const r = sleepRegularity(sn); return `<div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Gem. slaap</span><span>${sn.length ? fmtSleepDur(sleepAvg(sn)) + ' (' + sn.length + ' nachten)' : '—'}</span></div><div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Slaapregelmaat</span><span style="color: ${r ? r.color : '#fafafa'};">${r ? r.score + ' · ' + r.label.toLowerCase() : '—'}</span></div>`; })()}
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Gewicht</span><span>${w.wNow ? fmtVal(w.wNow.value) + ' kg' + (w.weightDelta !== null ? ` (${w.weightDelta > 0 ? '+' : ''}${fmtVal(w.weightDelta)})` : '') : '—'}</span></div>
        </div>

        <div class="prompt">

    // Dashboardkaart: zondag de lopende week, maandag de afgelopen week
    function renderWeekTeaser() {
      const dow = new Date().getDay(); // 0 = zondag, 1 = maandag
      if (dow !== 0 && dow !== 1) return '';
      const offset = dow === 1 ? 1 : 0;
      const w = computeWeek(offset);
      if (!w.past.some(d => d.xp > 0)) return '';
      return `
        <div class="card card-accent" style="cursor: pointer;" onclick="state.weekOffset = ${offset}; setSection('week');">

              <div style="font-size: 13px; margin-top: 6px;">Gem. dagscore ${w.avg} · +${fmtInt(w.xp)} XP · ${w.workouts.length} ${w.workouts.length === 1 ? 'training' : 'trainingen'}</div>
