<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Primal Forged">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Primal Forged</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #050505; color: #fafafa; }
    
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .loading-text { font-size: 12px; color: #525252; text-transform: uppercase; letter-spacing: 0.2em; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
    
    .app-header { position: fixed; top: 0; left: 0; right: 0; background: #050505; border-bottom: 1px solid #1c1c1c; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .logo { font-size: 10px; font-weight: 600; letter-spacing: 0.35em; }
    .logo-accent { color: #7f1d1d; margin-left: 6px; }
    .user-menu { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 10px; color: #525252; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { background: transparent; border: 1px solid #1c1c1c; color: #737373; padding: 6px 12px; font-size: 9px; cursor: pointer; font-family: inherit; }
    
    .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-box { width: 100%; max-width: 360px; }
    .auth-title { font-size: 24px; font-weight: 300; text-align: center; margin-bottom: 8px; letter-spacing: 0.1em; }
    .auth-subtitle { font-size: 11px; color: #525252; text-align: center; margin-bottom: 32px; }
    .auth-input { width: 100%; padding: 14px 16px; background: #0a0a0a; border: 1px solid #1c1c1c; color: #fafafa; font-size: 14px; font-family: inherit; margin-bottom: 12px; }
    .auth-input:focus { outline: none; border-color: #7f1d1d; }
    .auth-btn { width: 100%; padding: 14px; background: #7f1d1d; border: none; color: #fff; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }
    .auth-btn:hover { background: #991b1b; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch { text-align: center; margin-top: 24px; font-size: 12px; color: #525252; }
    .auth-switch a { color: #7f1d1d; cursor: pointer; text-decoration: none; }
    .auth-error { background: rgba(220,38,38,0.1); border: 1px solid #dc2626; color: #dc2626; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    .auth-success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid #1c1c1c; display: flex; z-index: 100; }
    .nav-item { flex: 1; padding: 12px 2px; background: transparent; border: none; color: #525252; font-size: 9px; text-transform: uppercase; letter-spacing: 0.02em; cursor: pointer; font-family: inherit; text-align: center; }
    .nav-item.active { color: #7f1d1d; }
    .nav-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    
    .card { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 16px; }
    .card-accent { border-left: 3px solid #7f1d1d; }
    
    .label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 500; display: block; }
    
    .page-header { margin-bottom: 24px; padding-top: 60px; }
    .page-sub { font-size: 10px; color: #7f1d1d; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 6px; font-weight: 600; }
    .page-title { font-size: 26px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; }
    
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
    .stat { text-align: center; padding: 16px 8px; background: #0a0a0a; border: 1px solid #1c1c1c; }
    .stat-value { font-size: 20px; font-weight: 300; }
    .stat-label { font-size: 8px; color: #525252; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.05em; }
    
    .tabs { display: flex; border-bottom: 1px solid #1c1c1c; margin-bottom: 24px; overflow-x: auto; }
    .tab { padding: 12px 16px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #525252; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; font-family: inherit; margin-bottom: -1px; white-space: nowrap; }
    .tab.active { color: #fafafa; border-bottom-color: #7f1d1d; }
    
    .textarea { width: 100%; min-height: 150px; padding: 16px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 1.7; resize: vertical; }
    .textarea:focus { outline: none; border-color: #7f1d1d; }
    
    .slider-group { margin-bottom: 16px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-label { font-size: 12px; color: #a3a3a3; }
    .slider-value { font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .slider { 
      -webkit-appearance: none; 
      width: 100%; 
      height: 8px; 
      background: linear-gradient(to right, #dc2626, #eab308, #22c55e); 
      outline: none; 
      border-radius: 4px;
      opacity: 0.4;
    }
    .slider::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 22px; 
      height: 22px; 
      background: #fafafa; 
      cursor: pointer; 
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #fafafa;
      cursor: pointer;
      border-radius: 50%;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider-stress {
      background: linear-gradient(to right, #22c55e, #eab308, #dc2626);
    }
    
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 10px 14px; background: transparent; border: 1px solid #1c1c1c; color: #737373; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .tag:hover { border-color: #525252; }
    .tag.active { background: rgba(127,29,29,0.2); border-color: #7f1d1d; color: #fafafa; }
    
    .btn { padding: 14px 28px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; }
    .btn-primary { background: #7f1d1d; color: #fff; }
    .btn-primary:hover { background: #991b1b; }
    .btn-secondary { background: transparent; border: 1px solid #1c1c1c; color: #737373; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-small { padding: 10px 16px; font-size: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .entry { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 12px; }
    .entry-date { font-size: 11px; color: #525252; margin-bottom: 12px; }
    .entry-scores { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .entry-score { font-size: 10px; padding: 4px 8px; background: #1c1c1c; }
    .entry-content { font-size: 13px; color: #a3a3a3; line-height: 1.7; white-space: pre-wrap; }
    .entry-habits { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .entry-habit { font-size: 9px; padding: 4px 8px; border-radius: 2px; }
    .entry-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1c1c1c; }
    .entry-action { background: transparent; border: 1px solid #1c1c1c; color: #737373; padding: 8px 12px; font-size: 10px; cursor: pointer; font-family: inherit; }
    .entry-action:hover { border-color: #525252; }
    .entry-action.delete { color: #dc2626; }
    
    .info-box { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .info-title { font-size: 11px; color: #7f1d1d; margin-bottom: 6px; font-weight: 500; }
    .info-text { font-size: 12px; color: #a3a3a3; line-height: 1.6; }
    
    .prompt { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .prompt-label { font-size: 10px; color: #7f1d1d; margin-bottom: 6px; }
    .prompt-text { font-size: 13px; color: #a3a3a3; font-style: italic; }
    
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #166534; color: #fff; padding: 12px 24px; font-size: 12px; z-index: 400; display: none; }
    .toast.show { display: block; }
    
    .empty { text-align: center; padding: 40px 20px; color: #525252; font-size: 13px; }
    
    .insight { padding: 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
    .insight-positive { background: rgba(34,197,94,0.1); border-left: 3px solid #22c55e; }
    .insight-negative { background: rgba(234,179,8,0.1); border-left: 3px solid #eab308; }
    .insight-icon { font-size: 20px; }
    .insight-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .insight-positive .insight-title { color: #22c55e; }
    .insight-negative .insight-title { color: #eab308; }
    .insight-text { font-size: 11px; color: #a3a3a3; }

    /* Dashboard specific */
    .greeting { font-size: 20px; font-weight: 300; margin-bottom: 4px; }
    .greeting-sub { font-size: 12px; color: #525252; margin-bottom: 24px; }
    
    .streak-big { text-align: center; padding: 32px; }
    .streak-number { font-size: 72px; font-weight: 200; line-height: 1; }
    .streak-label { font-size: 11px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 8px; }
    
    .habit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .habit { padding: 12px 8px; background: transparent; border: 1px solid #1c1c1c; color: #525252; cursor: pointer; font-family: inherit; text-align: center; }
    .habit.done { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
    .habit.done.negative { background: rgba(234,179,8,0.1); border-color: #eab308; color: #eab308; }
    .habit-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .habit-label { font-size: 8px; text-transform: uppercase; }
    
    .quote-card { padding: 20px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 16px; }
    .quote-text { font-size: 14px; color: #a3a3a3; font-style: italic; line-height: 1.6; margin-bottom: 12px; }
    .quote-author { font-size: 11px; color: #525252; }
    
    /* Retention specific */
    .phase-indicator { padding: 12px; text-align: center; margin-top: 16px; }
    .phase-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
    
    .progress-bar { height: 4px; background: #1c1c1c; margin-top: 16px; }
    .progress-fill { height: 100%; transition: width 0.3s; }
    
    .emergency-btn { width: 100%; padding: 20px; background: #dc2626; border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 24px; }
    .emergency-btn:hover { background: #b91c1c; }
    
    .milestone { padding: 16px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 12px; display: flex; gap: 16px; align-items: flex-start; }
    .milestone.achieved { border-color: #22c55e; background: rgba(34,197,94,0.05); }
    .milestone-day { font-size: 24px; font-weight: 300; color: #525252; min-width: 50px; }
    .milestone.achieved .milestone-day { color: #22c55e; }
    .milestone-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .milestone-desc { font-size: 11px; color: #525252; }
    
    .urge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .urge { padding: 16px 8px; background: #0a0a0a; border: 1px solid #1c1c1c; cursor: pointer; text-align: center; }
    .urge:hover { border-color: #7f1d1d; }
    .urge-icon { font-size: 24px; display: block; margin-bottom: 8px; }
    .urge-label { font-size: 9px; color: #a3a3a3; text-transform: uppercase; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 24px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: #dc2626; }
    .modal-title.habit { color: #22c55e; }
    .modal-step { padding: 16px; background: #050505; border-left: 3px solid #dc2626; margin-bottom: 12px; }
    .modal-step.habit { border-left-color: #7f1d1d; }
    .modal-step-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .modal-step-text { font-size: 11px; color: #a3a3a3; }
    
    .habit-modal-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
    .habit-modal-duration { text-align: center; padding: 12px; background: rgba(127,29,29,0.2); border: 1px solid #7f1d1d; margin-bottom: 16px; font-size: 14px; color: #fafafa; }

    /* ===== MISSIES ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chip { padding: 8px 12px; background: transparent; border: 1px solid #1c1c1c; color: #737373; font-size: 10px; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; }
    .chip.active { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }
    .goal { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 16px; margin-bottom: 12px; }
    .goal.done { opacity: 0.6; }
    .goal-top { display: flex; gap: 12px; align-items: flex-start; }
    .goal-check { width: 24px; height: 24px; border: 2px solid #525252; background: transparent; color: #fff; cursor: pointer; flex-shrink: 0; font-size: 13px; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .goal-check.checked { background: #22c55e; border-color: #22c55e; }
    .goal-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; word-break: break-word; }
    .goal.done .goal-title { text-decoration: line-through; color: #737373; }
    .goal-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge { padding: 3px 8px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid #1c1c1c; color: #737373; }
    .goal-notes { font-size: 12px; color: #737373; margin-top: 10px; line-height: 1.5; white-space: pre-wrap; }
    .goal-progress-row { display: flex; justify-content: space-between; font-size: 10px; color: #737373; margin-top: 6px; }
    .goal-update { display: flex; gap: 8px; margin-top: 12px; }
    .input-sm { flex: 1; padding: 10px 12px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; min-width: 0; }
    .input-sm:focus { outline: none; border-color: #7f1d1d; }
    .subtasks { margin-top: 12px; border-top: 1px solid #1c1c1c; padding-top: 8px; }
    .subtask { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .subtask-check { width: 18px; height: 18px; border: 1px solid #525252; background: transparent; color: #fff; cursor: pointer; font-size: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .subtask-check.checked { background: #166534; border-color: #166534; }
    .subtask-text { flex: 1; font-size: 12px; color: #a3a3a3; word-break: break-word; }
    .subtask-text.done { text-decoration: line-through; color: #525252; }
    .icon-btn { background: transparent; border: none; color: #525252; cursor: pointer; font-size: 14px; padding: 2px 6px; font-family: inherit; }
    .icon-btn:hover { color: #dc2626; }
    .goal-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1c1c1c; }
    .form-label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.1em; margin: 14px 0 6px; display: block; }
    .form-input { width: 100%; padding: 12px 14px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; color-scheme: dark; }
    .form-input:focus { outline: none; border-color: #7f1d1d; }
    textarea.form-input { min-height: 70px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .template-list { max-height: 220px; overflow-y: auto; border: 1px solid #1c1c1c; }
    .template { display: block; width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: none; border-bottom: 1px solid #1c1c1c; color: #d4d4d4; font-size: 12px; cursor: pointer; font-family: inherit; }
    .template:hover { background: rgba(127,29,29,0.15); color: #fafafa; }
    .template-sub { font-size: 10px; color: #525252; margin-top: 2px; }
    .smart-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 16px; }
    .smart-cell { text-align: center; padding: 8px 2px; background: #050505; border: 1px solid #1c1c1c; }
    .smart-char { font-size: 15px; font-weight: 600; color: #7f1d1d; }
    .smart-word { font-size: 7px; color: #525252; text-transform: uppercase; margin-top: 2px; }

    /* Training */
    .tweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
    .tday { font-family: inherit; padding: 10px 0; text-align: center; background: transparent; border: 1px solid #262626; color: #d4d4d4; cursor: pointer; position: relative; min-width: 0; }
    .tday-d { display: block; font-size: 12px; font-weight: 500; }
    .tday-s { display: block; font-size: 9px; margin-top: 3px; color: #8a8a8a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
    .tday.rest { border-color: #1c1c1c; color: #525252; }
    .tday.rest .tday-s { color: #3a3a3a; }
    .tday.set { background: #1a0606; border-color: #7f1d1d; color: #fafafa; }
    .tday.set .tday-s { color: #e5484d; }
    .tday.today::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #e5484d; }
    .tday.sel { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }
    .tday.sel .tday-s { color: #fecaca; }
    .tday.sel.today::after { background: #fff; }
    .tsel { background: #0a0a0a; border: 1px solid #262626; color: #a3a3a3; font-family: inherit; font-size: 11px; padding: 8px; flex-shrink: 0; }
    .tgrid-head { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 8px; color: #8a8a8a; letter-spacing: 0.06em; text-align: center; padding: 0 13px; margin-bottom: 4px; }
    .tgroup { font-size: 10px; color: #8a8a8a; letter-spacing: 0.2em; margin: 14px 0 8px; }
    .tex { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 12px; margin-bottom: 8px; }
    .tex-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .tex-name { font-size: 14px; font-weight: 500; }
    .tex-range { font-size: 10px; color: #8a8a8a; margin-top: 2px; }
    .tex-btn { font-family: inherit; font-size: 10px; color: #a3a3a3; background: transparent; border: 1px solid #262626; padding: 8px 10px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    .tex-note { font-size: 11px; color: #d9a441; }
    .tex-note:not(:empty) { margin-top: 8px; }
    .tgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .tcell { display: flex; flex-direction: column; border: 1px solid #262626; background: #050505; min-width: 0; }
    .tcell.warm { background: #070707; border-color: #1c1c1c; }
    .tcell input { width: 100%; min-width: 0; box-sizing: border-box; background: transparent; border: none; color: #fafafa; font-family: inherit; font-size: 13px; font-weight: 500; text-align: center; padding: 7px 0; outline: none; }
    .tcell input.reps { font-size: 11px; font-weight: 400; color: #a3a3a3; border-top: 1px solid #1c1c1c; }
    .tcell.warm input { color: #a3a3a3; }
    .tcell input::placeholder { color: #3a3a3a; }
    .tcell:focus-within { border-color: #7f1d1d; }

    function habitStats(key) {
      const today = todayStr();
      const hist = { ...state.habitHistory, [today]: { ...state.habits } };
      const done = d => !!(hist[d] && hist[d][key]);
      let week = 0;
      for (let d = weekKey(today); d <= today; d = dateAdd(d, 1)) if (done(d)) week++;
      const daysSoFar = diffDays(weekKey(today), today) + 1;
      let streak = 0, d = done(today) ? today : dateAdd(today, -1);
      while (done(d)) { streak++; d = dateAdd(d, -1); }
      const total = Object.keys(hist).filter(done).length;
      return { week, daysSoFar, streak, total };
    }

    function getColor(value, isStress = false) {

      if (v <= 4) return '#f97316';      // Orange

    function getJournalStreak() {
      if (state.entries.length === 0) return 0;
      let streak = 1;
      const dates = [...new Set(state.entries.map(e => e.date))].sort().reverse();
      for (let i = 1; i < dates.length; i++) {
        const d1 = new Date(dates[i-1]);
        const d2 = new Date(dates[i]);
        const diff = (d1 - d2) / (1000 * 60 * 60 * 24);
        if (diff <= 1) streak++;
        else break;
      }
      return streak;
    }

        .replace(/&/g, '&amp;')

        .replace(/"/g, '&quot;')

    // Datums altijd in lokale tijd (niet UTC), anders klopt 'vandaag' niet tussen 00:00 en 02:00
    function localDateStr(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function todayStr() {
      return localDateStr(new Date());
    }

    function addDays(n) {
      const d = new Date();
      d.setDate(d.getDate() + n);
      return localDateStr(d);
    }

    function dateAdd(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return localDateStr(d);
    }

    function diffDays(a, b) {
      return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
    }

      if (v === null || v === undefined || v === '') return '0';

    function getInsights() {
      // Filter entries that have habits data
      const entriesWithHabits = state.entries.filter(e => e.habits && Object.keys(e.habits).length > 0 && e.mood);
      
      if (entriesWithHabits.length < 3) return [];
      
      const insights = [];
      
      // Analyze each habit's correlation with mood and energy
      Object.entries(habitConfig).filter(([k, c]) => !c.hidden).forEach(([habitKey, habitCfg]) => {
        const withHabit = entriesWithHabits.filter(e => e.habits && e.habits[habitKey]);
        const withoutHabit = entriesWithHabits.filter(e => e.habits && !e.habits[habitKey]);
        
        if (withHabit.length >= 2 && withoutHabit.length >= 2) {
          const avgMoodWith = withHabit.reduce((a, e) => a + (e.mood || 5), 0) / withHabit.length;
          const avgMoodWithout = withoutHabit.reduce((a, e) => a + (e.mood || 5), 0) / withoutHabit.length;
          const avgEnergyWith = withHabit.reduce((a, e) => a + (e.energy || 5), 0) / withHabit.length;
          const avgEnergyWithout = withoutHabit.reduce((a, e) => a + (e.energy || 5), 0) / withoutHabit.length;
          
          if (habitCfg.positive) {
            // Positive habit: show if it improves mood/energy
            const moodDiff = avgMoodWith - avgMoodWithout;
            const energyDiff = avgEnergyWith - avgEnergyWithout;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verbetert je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (+${moodDiff.toFixed(1)})`,
                positive: true,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} boost je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (+${energyDiff.toFixed(1)})`,
                positive: true,
                impact: energyDiff
              });
            }
          } else {
            // Negative habit: show if it lowers mood/energy
            const moodDiff = avgMoodWithout - avgMoodWith;
            const energyDiff = avgEnergyWithout - avgEnergyWith;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (-${moodDiff.toFixed(1)})`,
                positive: false,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (-${energyDiff.toFixed(1)})`,
                positive: false,
                impact: energyDiff
              });
            }
          }
        }
      });
      
      // Sort by impact and return top 6
      insights.sort((a, b) => (b.impact || 0) - (a.impact || 0));
      return insights.slice(0, 6);
    }

    async function toggleHabit(habit) {
      state.habits[habit] = !state.habits[habit];
      render();
      
      if (!state.user) return;
      const today = todayStr();

      const buildRow = (keys) => {
        const row = { user_id: state.user.id, date: today };
        keys.forEach(k => row[habitColumns[k]] = !!state.habits[k]);
        return row;
      };

      let error = null;
      if (habitsDbHasExtraColumns) {
        ({ error } = await supabaseClient
          .from('daily_habits')
          .upsert(buildRow(Object.keys(habitColumns)), { onConflict: 'user_id,date' }));
        // Kolommen bestaan nog niet -> terugvallen op de oude manier
        if (error && /column|schema cache/i.test(error.message || '')) {
          console.warn('Extra habit-kolommen ontbreken nog, voer de SQL-update uit.', error);
          habitsDbHasExtraColumns = false;
          error = null;
        }
      }
      if (!habitsDbHasExtraColumns) {
        ({ error } = await supabaseClient
          .from('daily_habits')
          .upsert(buildRow(coreHabitKeys), { onConflict: 'user_id,date' }));
        const extra = {};
        Object.keys(habitColumns).filter(k => !coreHabitKeys.includes(k)).forEach(k => extra[k] = !!state.habits[k]);
        try { localStorage.setItem(`habits_extra_${today}`, JSON.stringify(extra)); } catch (e) {}
      }
      if (error) {
        console.error('Fout bij opslaan habits:', error);
        showToast('⚠️ Habit niet opgeslagen');
      }
      state.habitHistory[today] = { ...(state.habitHistory[today] || {}), [habit]: !!state.habits[habit] };
      if (habitChallenge(habit)) {
        const msgs = await settleChallenges();
        if (msgs.length) { render(); showToast(msgs[0]); }
      }
    }

    async function exportBackup() {
      if (!state.user) return;
      const btn = document.getElementById('backup-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Back-up maken...'; }

      const backup = {
        app: 'Primal Forged',
        version: 1,
        exported_at: new Date().toISOString(),
        user_email: state.user.email,
        tables: {}
      };
      let total = 0;
      for (const table of backupTables) {
        const { data, error } = await supabaseClient.from(table).select('*').eq('user_id', state.user.id);
        if (error) {
          backup.tables[table] = { error: error.message };
        } else {
          backup.tables[table] = data || [];
          total += (data || []).length;
        }
      }

      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `primal-forged-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      try { localStorage.setItem('pf_last_backup', new Date().toISOString()); } catch (e) {}
      render();
      showToast(`✓ Back-up gedownload (${total} items)`);
    }

    async function saveMeasurement() {
      const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const date = get('bf-date') || todayStr();
      const row = { user_id: state.user.id, entry_date: date };
      let count = 0;
      Object.keys(bodyMetrics).forEach(k => {
        const raw = get('bf-' + k);
        if (hasValue(raw)) {
          const n = parseFloat(String(raw).replace(',', '.'));
          row[k] = isNaN(n) ? null : n;
          if (!isNaN(n)) count++;
        } else {
          row[k] = null;
        }
      });
      if (count === 0) { alert('Vul minimaal één waarde in'); return; }

      const btn = document.getElementById('body-save-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }

      // Bestaat er al een meting op deze datum? Dan bijwerken.
      const existing = state.editingBodyId
        ? state.bodyStats.find(e => e.id === state.editingBodyId)
        : state.bodyStats.find(e => e.entry_date === date);

      let error;
      if (existing) {
        ({ error } = await supabaseClient.from('body_stats').update(row).eq('id', existing.id));
      } else {
        ({ error } = await supabaseClient.from('body_stats').insert([row]));
      }
      if (error) {
        console.error('Fout bij opslaan meting:', error);
        alert('Fout bij opslaan: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
        return;
      }

      // Startdatum één keer vastleggen
      const isFirst = !state.bodySettings || !state.bodySettings.body_start_date;
      await loadBody();
      if (isFirst) {
        const earliest = state.bodyStats.length ? state.bodyStats[0].entry_date : date;
        await saveBodySettings({ body_start_date: earliest });
      }

      state.showBodyModal = false;
      state.editingBodyId = null;
      render();
      if (isFirst) showToast('📍 Startdatum vastgelegd: ' + fmtDateShort(getBodyStartDate()));
      else showToast('✓ Meting opgeslagen');
    }

      if (!confirm('Meting verwijderen?')) return;
      const { error } = await supabaseClient.from('body_stats').delete().eq('id', id);
      if (error) { alert('Fout bij verwijderen: ' + error.message); return; }
      await loadBody();
      render();
    }

    function renderBodyChart() {
      const metric = state.bodyMetric;
      const m = bodyMetrics[metric];
      let pts = bodyEntriesFor(metric);
      if (state.bodyRange > 0) {
        const from = addDays(-state.bodyRange);
        pts = pts.filter(p => p.date >= from);
      }
      if (pts.length < 2) {
        return `<div class="empty" style="padding: 24px 12px;">${pts.length === 1
          ? `Eén meting in deze periode (${fmtVal(pts[0].value)} ${m.unit}). Vanaf twee metingen zie je hier je verloop.`
          : 'Geen metingen in deze periode.'}</div>`;
      }

      const W = 360, H = 200, L = 36, R = 6, T = 14, B = 24;
      const t0 = new Date(pts[0].date + 'T00:00:00').getTime();
      const t1 = new Date(pts[pts.length - 1].date + 'T00:00:00').getTime();
      let lo = Math.min(...pts.map(p => p.value)), hi = Math.max(...pts.map(p => p.value));
      const startVal = startBodyValue(metric);
      if (startVal !== null) { lo = Math.min(lo, startVal); hi = Math.max(hi, startVal); }
      const pad = Math.max((hi - lo) * 0.15, 0.5);
      lo -= pad; hi += pad;
      const x = t => L + ((t - t0) / Math.max(t1 - t0, 1)) * (W - L - R);
      const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

      const coords = pts.map(p => ({ ...p, cx: x(new Date(p.date + 'T00:00:00').getTime()), cy: y(p.value) }));
      const path = coords.map((c, i) => `${i ? 'L' : 'M'}${c.cx.toFixed(1)},${c.cy.toFixed(1)}`).join(' ');
      const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * (i / 3));
      const midIdx = Math.floor(coords.length / 2);

      window.__bodyChart = { coords, unit: m.unit, W };

      return `
        <div id="body-chart" style="position: relative; touch-action: pan-y;">
          <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${m.label} verloop" style="display: block; overflow: visible;">
            ${ticks.map(v => `
              <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#1c1c1c" stroke-width="1"/>
              <text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" fill="#525252" font-size="11" text-anchor="end">${fmtVal(v)}</text>
            `).join('')}
            ${startVal !== null ? `
              <line x1="${L}" x2="${W - R}" y1="${y(startVal).toFixed(1)}" y2="${y(startVal).toFixed(1)}" stroke="#525252" stroke-width="1" stroke-dasharray="4 4"/>
              <text x="${W - R}" y="${(y(startVal) - 6).toFixed(1)}" fill="#737373" font-size="10" text-anchor="end">start ${fmtVal(startVal)}</text>
            ` : ''}
            <path d="${path}" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${coords.length <= 45 ? coords.map(c => `<circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="4" fill="#e5484d" stroke="#0a0a0a" stroke-width="2"/>`).join('') : ''}
            <text x="${L}" y="${H - 6}" fill="#525252" font-size="11">${fmtDateShort(coords[0].date)}</text>
            ${coords.length > 2 ? `<text x="${coords[midIdx].cx.toFixed(1)}" y="${H - 6}" fill="#525252" font-size="11" text-anchor="middle">${fmtDateShort(coords[midIdx].date)}</text>` : ''}
            <text x="${W - R}" y="${H - 6}" fill="#525252" font-size="11" text-anchor="end">${fmtDateShort(coords[coords.length - 1].date)}</text>
            <line id="body-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#737373" stroke-width="1" style="display: none;"/>
            <circle id="body-dot" r="6" fill="#e5484d" stroke="#fafafa" stroke-width="2" style="display: none;"/>
          </svg>
          <div id="body-tip" style="position: absolute; top: 0; display: none; background: #050505; border: 1px solid #262626; padding: 6px 10px; font-size: 11px; pointer-events: none; white-space: nowrap;"></div>
        </div>
      `;
    }

    function setupBodyChart() {
      const box = document.getElementById('body-chart');
      const info = window.__bodyChart;
      if (!box || !info) return;
      const svg = box.querySelector('svg');
      const cross = document.getElementById('body-cross');
      const dot = document.getElementById('body-dot');
      const tip = document.getElementById('body-tip');

      const show = (clientX) => {
        const rect = svg.getBoundingClientRect();
        const scale = info.W / rect.width;
        const sx = (clientX - rect.left) * scale;
        let best = info.coords[0];
        info.coords.forEach(c => { if (Math.abs(c.cx - sx) < Math.abs(best.cx - sx)) best = c; });
        cross.setAttribute('x1', best.cx); cross.setAttribute('x2', best.cx);
        dot.setAttribute('cx', best.cx); dot.setAttribute('cy', best.cy);
        cross.style.display = ''; dot.style.display = '';
        tip.textContent = `${fmtDateLong(best.date)} · ${fmtVal(best.value)} ${info.unit}`;
        tip.style.display = 'block';
        const px = best.cx / scale;
        const tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(rect.width - tw, px - tw / 2)) + 'px';
      };
      const hide = () => { cross.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none'; };

      box.addEventListener('pointermove', e => show(e.clientX));
      box.addEventListener('pointerdown', e => show(e.clientX));
      box.addEventListener('pointerleave', hide);
    }

    function chTemplate(id) {
      return challengeTemplates.find(t => t.id === id) || null;
    }

    function chLinkedHabit(c) {
      return c && c.link && c.link.startsWith('habit:') ? c.link.slice(6) : null;
    }

    // Uitleg: bij een gekoppelde habit de bestaande habit-uitleg
    function chInfo(c) {
      if (c.kind === 'hard75') return { what: 'Zes regels per dag, 75 dagen lang, zonder uitzondering.', how: 'Vink elke regel af zodra je hem gedaan hebt. Inhalen kan alleen op dezelfde dag.', why: 'Een test van mentale hardheid: je bewijst aan jezelf dat je je aan je woord houdt.' };
      const t = chTemplate(c.template_id) || {};
      const hk = chLinkedHabit(c);
      if (hk && habitConfig[hk]) {
        const hi = habitInfo[hk];
        if (hi) {
          const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\[\d+\]/g, '').replace(/\s+/g, ' ').trim();
          const hoe = (hi.sections || (hi.parts && hi.parts[0].sections) || []).find(x => x[0] === 'Hoe');
          const steps = hoe ? (hoe[1].match(/<li>(.*?)<\/li>/g) || []).slice(0, 3).map(strip).join(' ') : '';
          return { what: hi.summary, how: steps, why: 'Tik op ⓘ bij de gewoonte op je dashboard voor het waarom en de bronnen.' };
        }
        return { what: habitConfig[hk].what, how: habitConfig[hk].how, why: habitConfig[hk].why };
      }
      return { what: t.what || c.description || '', how: t.how || '', why: t.why || '' };
    }

    function chTargetFor(c, dayN) {
      const t = Number(c.target) || 0;
      const s = Number(c.step) || 0;
      return t + s * (dayN - 1);
    }

    function chUnit(c) {
      return c.unit || '';
    }

    function fmtInt(n) {
      const v = Number(n);
      if (isNaN(v)) return '—';
      return Number.isInteger(v) ? v.toLocaleString('nl-NL') : String(Math.round(v * 10) / 10).replace('.', ',');
    }

    // ============================================
    // CHALLENGES: BEREKENEN
    // ============================================
    function chLog(c, date) {
      return state.chLogIndex[c.id + '|' + date] || null;
    }

    function rebuildChLogIndex() {
      const idx = {};
      state.challengeLogs.forEach(l => { idx[l.challenge_id + '|' + l.date] = l; });
      state.chLogIndex = idx;
    }

    function habitDoneOn(key, date) {
      if (date === todayStr()) return !!state.habits[key];
      const row = state.habitHistory[date];
      return !!(row && row[key]);
    }

    // done | fail | pending (nog in te vullen: vandaag of gisteren)
    function chDayStatus(c, date, today) {
      const log = chLog(c, date);
      if (c.link === 'retention') {
        const r = state.retentionStreak;
        const failDate = !r ? today : (r.start_date > c.start_date ? r.start_date : null);
        if (failDate && date >= failDate) return 'fail';
        return 'done';
      }
      if (c.kind === 'hard75') {
        if (log && log.failed) return 'fail';
        const t = (log && log.tasks) || {};
        if (hard75Tasks.every(x => t[x.key])) return 'done';
        return date >= dateAdd(today, -1) ? 'pending' : 'fail';
      }
      if (c.kind === 'abstain') return (log && log.failed) ? 'fail' : 'done';

      let done = false;
      const hk = chLinkedHabit(c);
      if (hk) done = habitDoneOn(hk, date);
      else if (c.link === 'journal') done = state.entries.some(e => e.date === date);
      else if (c.kind === 'number') done = !!log && hasValue(log.value) && Number(log.value) >= chTargetFor(c, diffDays(c.start_date, date) + 1);
      else done = !!(log && log.done);

      if (done) return 'done';
      return date >= dateAdd(today, -1) ? 'pending' : 'fail';
    }

    function evalChallenge(c) {
      const today = todayStr();
      const D = Number(c.duration) || 30;
      const S = c.start_date;
      const rule = c.link === 'retention' ? 'strict' : (c.miss_rule || 'jokers');
      const jokersTotal = rule === 'jokers' ? Math.max(1, Math.floor(D / 10)) : 0;
      const days = [];
      let used = 0, failedOn = null, doneCount = 0, missedCount = 0;

      for (let i = 0; i < D; i++) {
        const date = dateAdd(S, i);
        if (failedOn || date > today) { days.push({ n: i + 1, date, st: 'future' }); continue; }
        let st = chDayStatus(c, date, today);
        if (st === 'fail') {
          if (rule === 'continue') { st = 'missed'; missedCount++; }
          else if (rule === 'jokers' && used < jokersTotal) { used++; st = 'joker'; }
          else { failedOn = date; st = 'missed'; missedCount++; }
        }
        if (st === 'done') doneCount++;
        days.push({ n: i + 1, date, st, today: date === today });
      }

      const lastDate = dateAdd(S, D - 1);
      const passive = c.kind === 'abstain' || c.link === 'retention';
      const complete = !failedOn && (passive
        ? lastDate < today
        : days.every(d => d.st !== 'pending' && d.st !== 'future'));

      let streak = 0;
      for (let j = days.length - 1; j >= 0; j--) {
        const st = days[j].st;
        if (st === 'future' || st === 'pending') continue;
        if (st === 'done' || st === 'joker') streak++;
        else break;
      }
      let best = 0, run = 0;
      days.forEach(d => {
        if (d.st === 'done' || d.st === 'joker') { run++; best = Math.max(best, run); }
        else if (d.st === 'missed') run = 0;
      });
      const resolved = days.filter(d => d.st === 'done' || d.st === 'joker' || d.st === 'missed').length;
      const pct = resolved ? Math.round((doneCount / resolved) * 100) : 100;
      const dayNum = Math.min(D, Math.max(1, diffDays(S, today) + 1));
      const todayDay = days.find(d => d.date === today) || null;
      const yesterdayDay = days.find(d => d.date === dateAdd(today, -1)) || null;

      return { days, D, dayNum, doneCount, missedCount, failedOn, complete, rule, jokersTotal, jokersLeft: jokersTotal - used, streak, best, pct, todayDay, yesterdayDay };
    }

    function activeChallenges() {
      return state.challenges.filter(c => c.status === 'active' && c.is_active !== false);
    }

    function habitChallenge(habitKey) {
      return activeChallenges().find(c => chLinkedHabit(c) === habitKey) || null;
    }

    // ============================================
    // CHALLENGES: DATABASE
    // ============================================
    async function loadChallenges() {
      if (!state.user) return;
      const { data, error } = await supabaseClient
        .from('challenges')
        .select('*')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false });
      if (error) {
        console.error('Fout bij laden challenges:', error);
        state.challengesError = error.message;
        return;
      }
      state.challengesError = null;
      // Alleen challenges van de nieuwe versie (met een soort)
      state.challenges = (data || []).filter(c => c.kind);

      const logs = await supabaseClient.from('challenge_logs').select('*').eq('user_id', state.user.id);
      if (logs.error) {
        console.error('challenge_logs niet beschikbaar:', logs.error);
        state.challengesError = 'De challenges-update in Supabase is nog niet uitgevoerd.';
        state.challengeLogs = [];
      } else {
        state.challengeLogs = logs.data || [];
      }
      rebuildChLogIndex();
      await loadHabitHistory();
    }

    async function loadHabitHistory() {
      // Volledige geschiedenis: nodig voor challenges, XP en dagscore
      const { data, error } = await supabaseClient
        .from('daily_habits')
        .select('*')
        .eq('user_id', state.user.id);
      if (error) { console.error('Fout bij laden habit-geschiedenis:', error); return; }
      const hist = {};
      (data || []).forEach(row => {
        const h = {};
        Object.entries(habitColumns).forEach(([key, col]) => { h[key] = !!row[col]; });
        hist[row.date] = h;
      });
      state.habitHistory = hist;
    }

    // Mislukte of voltooide challenges afronden in de database
    async function settleChallenges() {
      const messages = [];
      for (const c of activeChallenges()) {
        const ev = evalChallenge(c);
        let update = null;
        if (ev.failedOn) {
          update = { status: 'failed', is_active: false, end_reason: 'missed', ended_on: ev.failedOn, days_completed: ev.doneCount };
          messages.push(`${c.name}: dag ${diffDays(c.start_date, ev.failedOn) + 1} gemist`);
        } else if (ev.complete) {
          update = { status: 'completed', is_active: false, is_completed: true, end_reason: 'completed', ended_on: todayStr(), days_completed: ev.doneCount };
          messages.push(`🏆 ${c.name} voltooid!`);
        } else if (Number(c.days_completed) !== ev.doneCount) {
          update = { days_completed: ev.doneCount };
        }
        if (update) {
          const { error } = await supabaseClient.from('challenges').update(update).eq('id', c.id);
          if (!error) Object.assign(c, update);
          else console.error('Fout bij bijwerken challenge:', error);
        }
      }
      return messages;
    }

    async function refreshChallenges() {
      await loadChallenges();
      const msgs = await settleChallenges();
      render();
      if (msgs.length) showToast(msgs[0]);
    }

    async function setChallengeLog(c, date, patch) {
      const existing = chLog(c, date);
      const row = { challenge_id: c.id, user_id: state.user.id, date, done: false, value: null, failed: false, ...(existing ? { done: existing.done, value: existing.value, failed: existing.failed } : {}), ...patch };
      if (existing && existing.tasks && !('tasks' in patch)) row.tasks = existing.tasks;
      const { error } = await supabaseClient.from('challenge_logs').upsert(row, { onConflict: 'challenge_id,date' });
      if (error) {
        alert('Fout bij opslaan: ' + error.message + (/tasks/.test(error.message) ? '\n\nVoer eerst hard75-update.sql uit in Supabase.' : ''));
        return false;
      }
      return true;
    }

    function findChallenge(id) {
      return state.challenges.find(c => c.id === id) || null;
    }

    async function chToggle(id, date) {
      const c = findChallenge(id);
      if (!c) return;
      const hk = chLinkedHabit(c);
      if (hk) {
        if (date === todayStr()) { await toggleHabit(hk); }
        else { await setHabitForDate(hk, date, !habitDoneOn(hk, date)); }
        await refreshChallenges();
        return;
      }
      const log = chLog(c, date);
      if (await setChallengeLog(c, date, { done: !(log && log.done) })) await refreshChallenges();
    }

    async function chSetValue(id, date) {
      const c = findChallenge(id);
      const el = document.getElementById(`cv-${id}-${date}`);
      if (!c || !el || !hasValue(el.value)) return;
      const n = parseFloat(String(el.value).replace(',', '.'));
      if (isNaN(n)) { alert('Vul een getal in'); return; }
      if (await setChallengeLog(c, date, { value: n })) {
        await refreshChallenges();
        const dayN = diffDays(c.start_date, date) + 1;
        if (n >= chTargetFor(c, dayN)) showToast('✓ Doel gehaald voor vandaag');
      }
    }

    async function chFail(id) {
      const c = findChallenge(id);
      if (!c) return;
      const ev = evalChallenge(c);
      const consequence = ev.rule === 'strict' || (ev.rule === 'jokers' && ev.jokersLeft === 0)
        ? 'De challenge stopt en je kunt opnieuw beginnen.'
        : ev.rule === 'jokers' ? 'Dit kost een joker.' : 'Je reeks begint opnieuw, de challenge loopt door.';
      if (!confirm(`Vandaag niet gelukt?\n\n${consequence}`)) return;
      if (await setChallengeLog(c, todayStr(), { failed: true })) await refreshChallenges();
    }

    async function setHabitForDate(key, date, value) {
      const row = { user_id: state.user.id, date };
      row[habitColumns[key]] = value;
      const { error } = await supabaseClient.from('daily_habits').upsert(row, { onConflict: 'user_id,date' });
      if (error) { alert('Fout bij opslaan habit: ' + error.message); return; }
      state.habitHistory[date] = { ...(state.habitHistory[date] || {}), [key]: value };
    }

    async function startChallenge() {
      const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const custom = state.chSetupTemplate === 'custom';
      const t = custom ? null : chTemplate(state.chSetupTemplate);

      const name = custom ? get('cs-name').trim() : t.name;
      if (!name) { alert('Geef je challenge een naam'); return; }
      const kind = custom ? get('cs-kind') : t.kind;
      const duration = parseInt(get('cs-duration'), 10);
      if (!duration || duration < 1 || duration > 365) { alert('Kies een duur tussen 1 en 365 dagen'); return; }

      let target = null, unit = null, step = null;
      if (kind === 'number') {
        target = parseFloat(String(get('cs-target')).replace(',', '.'));
        if (isNaN(target) || target <= 0) { alert('Vul een doel per dag in'); return; }
        unit = custom ? (get('cs-unit').trim() || null) : t.unit;
        step = t && t.step ? t.step : null;
      }
      const link = t && t.link ? t.link : null;

      if (link && activeChallenges().some(c => c.link === link)) {
        alert('Je hebt al een actieve challenge die aan deze habit gekoppeld is.');
        return;
      }

      const previous = state.challenges.filter(c => c.template_id === (custom ? 'custom' : t.id) && c.name === name).length;
      const row = {
        user_id: state.user.id,
        template_id: custom ? 'custom' : t.id,
        name,
        description: custom ? null : (t.what || null),
        duration,
        start_date: (link === 'retention')
          ? [get('cs-start') || todayStr(), state.retentionStreak ? state.retentionStreak.start_date : todayStr()].sort().pop()
          : (get('cs-start') || todayStr()),
        status: 'active',
        is_active: true,
        is_completed: false,
        days_completed: 0,
        today_completed: false,
        kind,
        target,
        unit,
        step,
        link,
        miss_rule: link === 'retention' ? 'strict' : (get('cs-rule') || 'jokers'),
        why: get('cs-why').trim() || null,
        attempt: previous + 1
      };

      const btn = document.getElementById('cs-start-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Starten...'; }
      const { error } = await supabaseClient.from('challenges').insert([row]);
      if (error) {
        console.error('Fout bij starten challenge:', error);
        alert('Fout bij starten: ' + error.message + (/column/i.test(error.message) ? '\n\nVoer eerst challenges-update.sql uit in Supabase.' : ''));
        if (btn) { btn.disabled = false; btn.textContent = 'Challenge starten'; }
        return;
      }
      if (link === 'retention' && !state.retentionStreak) await startRetention();
      state.chView = 'list';
      await refreshChallenges();
      showToast('🔥 Challenge gestart: ' + name);
    }

    async function stopChallenge(id) {
      if (!confirm('Challenge stoppen? Hij komt in je geschiedenis.')) return;
      const { error } = await supabaseClient.from('challenges').update({
        status: 'failed', is_active: false, end_reason: 'stopped', ended_on: todayStr()
      }).eq('id', id);
      if (error) { alert('Fout bij stoppen: ' + error.message); return; }
      state.chView = 'list';
      await refreshChallenges();
    }

    async function restartChallenge(id) {
      const old = findChallenge(id);
      if (!old) return;
      if (old.kind === 'hard75' && hard75Active()) { alert('Je hebt al een actieve 75 Hard.'); return; }
      if (old.link && activeChallenges().some(c => c.link === old.link)) {
        alert('Je hebt al een actieve challenge die aan deze habit gekoppeld is.');
        return;
      }
      const row = {
        user_id: state.user.id, template_id: old.template_id, name: old.name, description: old.description,
        duration: old.duration, start_date: todayStr(), status: 'active', is_active: true, is_completed: false,
        days_completed: 0, today_completed: false, kind: old.kind, target: old.target, unit: old.unit, step: old.step,
        link: old.link, miss_rule: old.miss_rule, why: old.why, attempt: (Number(old.attempt) || 1) + 1
      };
      const { error } = await supabaseClient.from('challenges').insert([row]);
      if (error) { alert('Fout bij starten: ' + error.message); return; }
      await refreshChallenges();
      showToast('🔥 Poging ' + row.attempt + ' gestart');
    }

      const { error } = await supabaseClient.from('challenges').delete().eq('id', id);
      if (error) { alert('Fout bij verwijderen: ' + error.message); return; }
      await refreshChallenges();
    }

            <div style="flex: 1; min-width: 0;" ${titleLink}>
              <div style="font-size: 14px;">${esc(c.name)}</div>
              <div style="font-size: 11px; color: #8a8a8a;">${ev.streak} ${ev.streak === 1 ? 'dag' : 'dagen'} schoon · dag ${ev.dayNum} van ${ev.D}</div>
            </div>
            <button class="entry-action" onclick="chFail('${c.id}')">Niet gelukt</button>
          </div>`;
      }

      if (c.kind === 'number' && !hk && c.link !== 'journal') {
        const log = chLog(c, date);
        const val = log && hasValue(log.value) ? Number(log.value) : 0;
        const target = chTargetFor(c, dayN);
        const pct = Math.min(100, Math.round((val / target) * 100));
        return `
          <div style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div style="display: flex; justify-content: space-between; gap: 8px;" ${titleLink}>
              <span style="font-size: 14px;">${done ? '✓ ' : ''}${esc(c.name)}</span>
              <span style="font-size: 12px; color: ${done ? '#22c55e' : '#a3a3a3'};">${fmtInt(val)} / ${fmtInt(target)} ${esc(chUnit(c))}</span>
            </div>
            <div class="progress-bar" style="margin-top: 6px;"><div class="progress-fill" style="width: ${pct}%; background: ${done ? '#22c55e' : '#e5484d'};"></div></div>
            <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${sub}</div>
            <div class="goal-update" style="margin-top: 8px;">
              <input type="text" inputmode="decimal" autocomplete="off" class="input-sm" id="cv-${c.id}-${date}" placeholder="Totaal ${isYesterday ? 'gisteren' : 'vandaag'}" onkeydown="if(event.key === 'Enter') chSetValue('${c.id}', '${date}')">
              <button class="btn btn-secondary btn-small" onclick="chSetValue('${c.id}', '${date}')">Opslaan</button>
            </div>
          </div>`;
      }

      if (c.link === 'journal') {
        return `
          <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div class="goal-check ${done ? 'checked' : ''}" style="width: 28px; height: 28px;">${done ? '✓' : ''}</div>
            <div style="flex: 1; min-width: 0;" ${titleLink}>
              <div style="font-size: 14px;">${esc(c.name)}</div>
              <div style="font-size: 11px; color: #8a8a8a;">${sub} · via Journal</div>
            </div>
            ${!done && !isYesterday ? `<button class="entry-action" onclick="setSection('journal')">Schrijven →</button>` : ''}
          </div>`;
      }

      return `
        <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
          ${chCheckBox(done, `chToggle('${c.id}', '${date}')`, c.name + (done ? ' gedaan' : ' afvinken'))}
          <div style="flex: 1; min-width: 0;" ${titleLink}>
            <div style="font-size: 14px;">${esc(c.name)}</div>
            <div style="font-size: 11px; color: #8a8a8a;">${sub}${hk ? ' · telt via habit ' + habitConfig[hk].icon : ''}</div>
          </div>
        </div>`;
    }

    function chStrip(ev, count) {
      const today = todayStr();
      const cells = [];
      for (let i = count - 1; i >= 0; i--) {
        const date = dateAdd(today, -i);
        const d = ev.days.find(x => x.date === date);
        let bg = '#1c1c1c', border = 'none';
        if (d) {
          if (d.st === 'done') bg = '#22c55e';
          else if (d.st === 'joker') bg = '#eab308';
          else if (d.st === 'missed') bg = '#7f1d1d';
          if (d.today) border = '1px solid #fafafa';
        } else {
          bg = 'transparent';
        }
        cells.push(`<div style="height: 14px; background: ${bg}; border: ${border}; box-sizing: border-box;"></div>`);
      }
      return `<div style="display: grid; grid-template-columns: repeat(${count}, minmax(0, 1fr)); gap: 3px; margin-top: 12px;">${cells.join('')}</div>`;
    }

    function renderChList() {
      const h75 = hard75Active();
      const active = activeChallenges().filter(c => c.kind !== 'hard75');
      const finished = state.challenges.filter(c => c.status !== 'active' || c.is_active === false);
      const completed = finished.filter(c => c.status === 'completed').length;
      const evs = {};
      active.forEach(c => { evs[c.id] = evalChallenge(c); });
      const bestStreak = Math.max(0, ...active.map(c => evs[c.id].best), ...finished.map(c => Number(c.days_completed) || 0));

      const yesterday = dateAdd(todayStr(), -1);
      const started = active.filter(c => c.start_date <= todayStr());
      const todayRows = started.map(c => renderChActionRow(c, evs[c.id], todayStr(), false)).join('') + active.filter(c => c.start_date > todayStr()).map(c => `<div style="padding: 12px 0; border-bottom: 1px solid #1c1c1c; font-size: 13px; color: #a3a3a3;">${esc(c.name)} · start ${fmtDateShort(c.start_date)}</div>`).join('');
      const yRows = active.filter(c => {
        const ev = evs[c.id];
        return ev.yesterdayDay && ev.yesterdayDay.st === 'pending' && c.kind !== 'abstain' && c.link !== 'retention' && c.link !== 'journal';
      }).map(c => renderChActionRow(c, evs[c.id], yesterday, true)).join('');
      const openToday = active.filter(c => evs[c.id].todayDay && evs[c.id].todayDay.st === 'pending').length;

      return `
        ${renderBodyHeader()}

        ${state.challengesError ? `
          <div class="info-box">
            <div class="info-title">⚠️ Challenges nog niet klaar</div>
            <div class="info-text">${esc(state.challengesError)} Voer challenges-update.sql uit in Supabase.</div>
          </div>
        ` : ''}

        ${h75 ? renderHard75Hero(h75) : ''}

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">${activeChallenges().length}</div><div class="stat-label">Actief</div></div>
          <div class="stat"><div class="stat-value" style="color: #22c55e;">${completed}</div><div class="stat-label">Voltooid</div></div>
          <div class="stat"><div class="stat-value">${bestStreak}d</div><div class="stat-label">Beste reeks</div></div>
        </div>

        ${active.length ? `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
              <label class="label" style="margin-bottom: 0;">Vandaag</label>
              <span style="font-size: 11px; color: #a3a3a3;">${openToday ? openToday + ' nog te doen' : 'Alles gedaan ✓'}</span>
            </div>
            ${todayRows}
            ${yRows ? `
              <div style="font-size: 10px; color: #eab308; letter-spacing: 0.1em; margin-top: 16px;">GISTEREN NOG INVULLEN</div>
              ${yRows}
            ` : ''}
          </div>

          <label class="label" style="margin-top: 8px;">Actieve challenges</label>
          ${active.map(c => {
            const ev = evs[c.id];
            return `
              <div class="goal" style="cursor: pointer;" onclick="chGo('detail', '${c.id}')">
                <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
                  <div class="goal-title" style="margin-bottom: 0;">${esc(c.name)}</div>
                  <div style="font-size: 11px; color: #a3a3a3; white-space: nowrap;">Dag ${ev.dayNum} / ${ev.D}</div>
                </div>
                <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${chKinds[c.kind] || ''} · ${chRules[ev.rule].label}${ev.rule === 'jokers' ? ' (' + ev.jokersLeft + ' over)' : ''}</div>
                ${chStrip(ev, 14)}
                <div style="font-size: 10px; color: #8a8a8a; margin-top: 6px;">Laatste 14 dagen</div>
              </div>
            `;
          }).join('')}
        ` : `
          <div class="empty">Nog geen actieve challenges.<br><br>Kies er een uit de bibliotheek of maak je eigen.</div>
        `}

        <button class="btn btn-primary" style="width: 100%; margin: 8px 0 16px;" onclick="chGo('library')">+ Challenge kiezen</button>

        ${h75 ? '' : `<div class="card" style="border-color: #7f1d1d; cursor: pointer;" onclick="chGo('hard75')">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">OPTIONEEL · HOOFDFOCUS</div>
            <div style="font-size: 10px; color: #8a8a8a;">75 dagen</div>
          </div>
          <div style="font-size: 22px; font-weight: 300; letter-spacing: 0.08em; margin-top: 8px;">75 HARD</div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 6px;">Het zwaarste programma voor mentale hardheid. Zes dagelijkse regels, geen uitzonderingen.</div>
          <div style="font-size: 11px; color: #e5484d; margin-top: 12px;">Bekijk de uitleg →</div>
        </div>`}

        ${finished.length ? `
          <div class="card">
            <label class="label">Geschiedenis</label>
            ${finished.map(c => {
              const icon = c.status === 'completed' ? '🏆' : c.end_reason === 'stopped' ? '⏹' : '✕';
              const label = c.status === 'completed' ? 'Voltooid' : c.end_reason === 'stopped' ? 'Gestopt' : 'Gemist';
              return `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #1c1c1c;">
                  <div style="min-width: 0;">
                    <div style="font-size: 13px;">${icon} ${esc(c.name)}${Number(c.attempt) > 1 ? ` <span style="color: #8a8a8a; font-size: 11px;">· poging ${c.attempt}</span>` : ''}</div>
                    <div style="font-size: 11px; color: #8a8a8a; margin-top: 2px;">${label} · ${Number(c.days_completed) || 0} van ${c.duration} dagen${c.ended_on ? ' · ' + fmtDateShort(c.ended_on) : ''}</div>
                  </div>
                  <div style="display: flex; gap: 4px; flex-shrink: 0;">
                    ${c.status !== 'completed' ? `<button class="entry-action" onclick="restartChallenge('${c.id}')">Opnieuw</button>` : ''}
                    <button class="icon-btn" onclick="deleteChallenge('${c.id}')" title="Verwijderen">🗑️</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      `;
    }

    function renderChLibrary() {
      const d = state.chDomain;
      const list = challengeTemplates.filter(t => d === 'all' || t.domain === d);
      const activeIds = activeChallenges().map(c => c.template_id);
      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('list')">← Terug</button>
        <div style="font-size: 18px; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 12px;">KIES EEN CHALLENGE</div>

        <div class="chips">
          <button class="chip ${d === 'all' ? 'active' : ''}" onclick="setChDomain('all')">Alle</button>
          ${Object.entries(chDomains).map(([k, v]) => `<button class="chip ${d === k ? 'active' : ''}" onclick="setChDomain('${k}')">${v.icon} ${v.label}</button>`).join('')}

          <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">Kies zelf naam, soort, duur en regels</div>

        ${list.map(t => {

            <button class="goal" style="width: 100%; text-align: left; color: #fafafa; font-family: inherit; cursor: pointer; ${running ? 'opacity: 0.5;' : ''}" onclick="chGo('setup', '${t.id}')">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
                <div style="font-size: 14px; font-weight: 500;">${esc(t.name)}</div>
                <div style="font-size: 10px; color: #8a8a8a; white-space: nowrap;">${chDomains[t.domain].icon} ${chDomains[t.domain].label}</div>
              </div>
              <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin-top: 6px;">${esc(desc || '')}</div>
              <div class="goal-meta" style="margin-top: 10px;">
                <span class="badge">${chKinds[t.kind]}</span>
                <span class="badge">${t.durations.join(' · ')} dagen</span>
                ${t.link && t.link.startsWith('habit:') ? `<span class="badge">telt via habit ${habitConfig[t.link.slice(6)].icon}</span>` : ''}
                ${t.link === 'retention' ? '<span class="badge">via Retention</span>' : ''}
                ${t.link === 'journal' ? '<span class="badge">via Journal</span>' : ''}
                ${running ? '<span class="badge" style="color: #22c55e;">loopt al</span>' : ''}
              </div>
            </button>
          `;
        }).join('')}

        <div class="card" style="border-color: #7f1d1d; cursor: pointer;" onclick="chGo('hard75')">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.06em;">75 HARD</div>
            <div style="font-size: 10px; color: #e5484d;">🔥 HOOFDFOCUS</div>
          </div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin-top: 6px;">6 regels per dag, 75 dagen lang. Uitleg lezen en starten →</div>

      `;
    }

    function renderChSetup() {
      const custom = state.chSetupTemplate === 'custom';
      const t = custom ? null : chTemplate(state.chSetupTemplate);
      if (!custom && !t) { state.chView = 'list'; return renderChList(); }
      const info = t ? chInfo({ template_id: t.id, link: t.link }) : null;
      const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`;
      const durations = custom ? [7, 14, 21, 30, 60, 90] : t.durations;
      const defDuration = durations.includes(30) ? 30 : durations[0];
      const rule = t ? t.rule : 'jokers';
      const linkedTaken = t && t.link && activeChallenges().some(c => c.link === t.link);

      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('library')">← Terug</button>

        <div class="card card-accent">
          <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${custom ? 'EIGEN CHALLENGE' : chDomains[t.domain].label.toUpperCase() + ' · ' + chKinds[t.kind].toUpperCase()}</div>
          <div style="font-size: 22px; font-weight: 300; letter-spacing: 0.06em; margin-top: 6px;">${custom ? 'Nieuwe challenge' : esc(t.name)}</div>
          ${info && info.what ? `
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
              <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">WAT</strong> · ${esc(info.what)}</div>
              ${info.how ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">HOE</strong> · ${esc(info.how)}</div>` : ''}
              ${info.why ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">WAAROM</strong> · ${esc(info.why)}</div>` : ''}
            </div>
          ` : ''}
          ${t && t.link && t.link.startsWith('habit:') ? `<div class="info-text" style="margin-top: 12px;">🔗 Telt automatisch via je habit ${habitConfig[t.link.slice(6)].icon} ${habitConfig[t.link.slice(6)].label} op het dashboard. Je vinkt maar één keer af.</div>` : ''}
          ${t && t.link === 'retention' ? `<div class="info-text" style="margin-top: 12px;">🔗 Loopt via je Retention-streak. Reset je die, dan stopt deze challenge.</div>` : ''}
          ${t && t.link === 'journal' ? `<div class="info-text" style="margin-top: 12px;">🔗 Telt automatisch zodra je die dag een Journal-entry hebt.</div>` : ''}
        </div>

        ${linkedTaken ? `
          <div class="info-box"><div class="info-text">Deze challenge loopt al. Rond hem eerst af of stop hem.</div></div>
        ` : `
          <div class="card">

              <select class="form-input" id="cs-kind" onchange="document.getElementById('cs-number').style.display = this.value === 'number' ? 'block' : 'none'">

              </select>
              <div id="cs-number" style="display: none;">
                <div class="form-row">
                  <div><label class="form-label">Doel per dag</label><input type="text" inputmode="decimal" class="form-input" id="cs-target" placeholder="50"></div>
                  <div><label class="form-label">Eenheid</label><input type="text" class="form-input" id="cs-unit" placeholder="squats"></div>
                </div>
              </div>
            ` : (t.kind === 'number' ? `
              <label class="form-label" style="margin-top: 0;">${t.step ? 'Start (dag 1)' : 'Doel per dag'} (${esc(t.unit)})</label>
              <input type="text" inputmode="decimal" class="form-input" id="cs-target" value="${t.target}">
              ${t.step ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 4px;">Elke dag ${t.step} meer.</div>` : ''}
            ` : '')}

            <label class="form-label">Duur</label>
            <select class="form-input" id="cs-duration">
              ${durations.map(n => opt(n, n + ' dagen', defDuration)).join('')}
            </select>

            ${t && t.link === 'retention' ? '' : `
              <label class="form-label">Als je een dag mist</label>
              <select class="form-input" id="cs-rule">
                ${Object.entries(chRules).map(([k, r]) => opt(k, r.label + ': ' + r.text, rule)).join('')}
              </select>
            `}

            <label class="form-label">Startdatum</label>
            <select class="form-input" id="cs-start">
              ${opt(todayStr(), 'Vandaag', todayStr())}
              ${opt(addDays(-1), 'Gisteren (al begonnen)', todayStr())}
              ${opt(addDays(1), 'Morgen', todayStr())}

            <label class="form-label">Jouw waarom</label>

            <button class="btn btn-primary" id="cs-start-btn" style="width: 100%; margin-top: 20px;" onclick="startChallenge()">Challenge starten</button>
          </div>
        `}
      `;
    }

    function renderChDetail() {
      const c = findChallenge(state.chDetailId);
      if (!c) { state.chView = 'list'; return renderChList(); }
      const ev = evalChallenge(c);
      const info = chInfo(c);
      const isActive = c.status === 'active' && c.is_active !== false;
      const cols = ev.D === 75 ? 15 : ev.D <= 60 ? 10 : 15;
      const cell = d => {
        let bg = '#1c1c1c', color = '#8a8a8a', extra = '';
        if (d.st === 'done') { bg = '#22c55e'; color = '#050505'; }
        else if (d.st === 'joker') { bg = '#eab308'; color = '#050505'; }
        else if (d.st === 'missed') { bg = '#7f1d1d'; color = '#fafafa'; }
        if (d.today) extra = 'outline: 2px solid #fafafa; outline-offset: 1px;';
        return `<div style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: ${ev.D > 60 ? 8 : 10}px; background: ${bg}; color: ${color}; ${extra}" title="${fmtDateLong(d.date)}">${d.n}</div>`;
      };
      const milestones = [7, 14, 21, 30, 60, 90].filter(m => m <= ev.D);
      if (!milestones.includes(ev.D)) milestones.push(ev.D);
      const today = todayStr();

      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('list')">← Terug</button>

        <div style="margin-bottom: 16px;">
          <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${(chKinds[c.kind] || '').toUpperCase()}${Number(c.attempt) > 1 ? ' · POGING ' + c.attempt : ''}</div>
          <div style="font-size: 24px; font-weight: 300; letter-spacing: 0.06em; margin-top: 4px;">${esc(c.name.toUpperCase())}</div>
        </div>

        ${c.kind === 'hard75' && isActive ? renderHard75Hero(c) : `<div class="card" style="text-align: center;">
          <div style="font-size: 64px; font-weight: 200; line-height: 1;">${isActive ? ev.dayNum : (Number(c.days_completed) || ev.doneCount)}</div>
          <div style="font-size: 11px; color: #8a8a8a; letter-spacing: 0.15em; margin-top: 8px;">${isActive ? `DAG ${ev.dayNum} VAN ${ev.D}` : (c.status === 'completed' ? 'VOLTOOID' : c.end_reason === 'stopped' ? 'GESTOPT' : 'GEMIST') + ` · ${ev.D} DAGEN`}</div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round((ev.doneCount / ev.D) * 100)}%; background: #e5484d;"></div></div>
          ${isActive && c.start_date <= today ? `<div style="text-align: left; margin-top: 12px;">${renderChActionRow(c, ev, today, false)}</div>` : ''}
          ${isActive && c.start_date > today ? `<div style="font-size: 12px; color: #a3a3a3; margin-top: 12px;">Start op ${fmtDateLong(c.start_date)}</div>` : ''}
        </div>`}

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">${ev.streak}</div><div class="stat-label">Huidige reeks</div></div>
          <div class="stat"><div class="stat-value">${ev.best}</div><div class="stat-label">Langste reeks</div></div>
          <div class="stat"><div class="stat-value">${ev.pct}%</div><div class="stat-label">Gelukt</div></div>
        </div>

        <div class="card">
          <label class="label">Kalender</label>
          <div style="display: grid; grid-template-columns: repeat(${cols}, minmax(0, 1fr)); gap: 4px;">
            ${ev.days.map(cell).join('')}
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 10px; color: #a3a3a3;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #22c55e;"></span>Gelukt</span>
            ${ev.rule === 'jokers' ? '<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #eab308;"></span>Joker</span>' : ''}
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #7f1d1d;"></span>Gemist</span>

        </div>

        ${info.what || info.how || info.why ? `
          <div class="card">
            <label class="label">Uitleg</label>
            ${info.what ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-bottom: 8px;"><strong style="color: #fafafa;">WAT</strong> · ${esc(info.what)}</div>` : ''}
            ${info.how ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-bottom: 8px;"><strong style="color: #fafafa;">HOE</strong> · ${esc(info.how)}</div>` : ''}
            ${info.why ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">WAAROM</strong> · ${esc(info.why)}</div>` : ''}
          </div>
        ` : ''}

        ${isActive
          ? `<button class="btn btn-secondary" style="width: 100%;" onclick="stopChallenge('${c.id}')">Challenge stoppen</button>`
          : (c.status !== 'completed' ? `<button class="btn btn-primary" style="width: 100%;" onclick="restartChallenge('${c.id}')">Opnieuw beginnen</button>` : '')}
      `;
    }

    function renderHard75Info() {

          <div style="font-size: 13px; color: #a3a3a3; line-height: 1.7; margin-top: 12px;">Een programma voor mentale hardheid, bedacht door ondernemer Andy Frisella. Geen fitnessprogramma maar een test van discipline: 75 dagen achter elkaar elke dag dezelfde regels, zonder één uitzondering.</div>
