    const VALUES_BONUS_XP = 100;

    function valuesData() {
      const s = state.bodySettings || {};
      if (s.values_data && Array.isArray(s.values_data.rounds)) return s.values_data;
      try { const v = JSON.parse(localStorage.getItem('pf_values') || 'null'); if (v && Array.isArray(v.rounds)) return v; } catch (e) {}
      return { rounds: [] };
    }
    async function saveValuesData(data) {
      state.bodySettings = { ...(state.bodySettings || {}), values_data: data };
      try { localStorage.setItem('pf_values', JSON.stringify(data)); } catch (e) {}
      if (!state.user) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, values_data: data }, { onConflict: 'user_id' });
      state.valuesLocal = !!error;
      if (error) console.warn('Waarden alleen lokaal opgeslagen (voer waarden-update.sql uit):', error.message);
    }
    function latestValues() {
      const r = valuesData().rounds;
      return r.length ? r[r.length - 1] : null;
    }
    function valuesBonusDate() {
      const r = valuesData().rounds;
      return r.length ? r[0].date : null;
    }
    // Laatste "leef ik ernaar"-cijfers: zondagcheck in de journal als die nieuwer is dan de laatste ronde
    function valuesLiving() {
      const round = latestValues();
      if (!round) return null;
      const out = {};
      round.top.forEach(v => out[v] = { score: round.scores[v] || null, from: 'opdracht', date: round.date, trend: [] });
      state.entries.filter(e => e.daily && e.daily.valuesCheck && e.date >= round.date)
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach(e => round.top.forEach(v => {
          const sc = e.daily.valuesCheck[v];
          if (sc) { out[v].score = sc; out[v].from = 'zondag'; out[v].date = e.date; out[v].trend.push(sc); }
        }));
      return out;
    }
    function valuesBiggestGap() {
      const round = latestValues(); const liv = valuesLiving();
      if (!round || !liv) return null;
      let best = null;
      round.top.forEach((v, i) => {
        const sc = liv[v].score; if (!sc) return;
        const gap = 10 - sc;
        if (!best || gap > best.gap || (gap === best.gap && i < best.rank)) best = { v, gap, sc, rank: i };
      });
      return best && best.gap >= 3 ? best : null;
    }
    function valuesReminderDue() {
      const r = latestValues();
      return r && diffDays(r.date, todayStr()) >= 90;
    }

    // Opdracht invullen: stap 1 vragen, stap 2 top 5, stap 3 cijfers
    function startValuesForm() {
      const prev = latestValues();
      state.vf = { step: 1, answers: valueQuestions.map(() => ''), top: prev ? [...prev.top] : [], scores: {}, custom: '' };
      state.valuesView = 'form';
      render(); window.scrollTo(0, 0);
    }
    function vfAnswer(i, v) { if (state.vf) state.vf.answers[i] = v; }
    function vfStep(n) {
      const f = state.vf;
      if (n === 2 && f.answers.filter(a => a.trim()).length < 5) { alert('Beantwoord minstens 5 van de 10 vragen. Hoe eerlijker, hoe beter je top 5.'); return; }
      if (n === 3 && f.top.length !== 5) { alert('Kies precies 5 waarden.'); return; }
      f.step = n; render(); window.scrollTo(0, 0);
    }
    function vfToggle(v) {
      const f = state.vf;
      if (f.top.includes(v)) f.top = f.top.filter(x => x !== v);
      else if (f.top.length < 5) f.top.push(v);
      else { showToast('Je hebt er al 5. Haal er eerst één weg.'); return; }
      render();
    }
    function vfCustom() {
      const el = document.getElementById('vf-custom');
      const v = (el ? el.value : '').trim();
      if (!v) return;
      const name = v.charAt(0).toUpperCase() + v.slice(1);
      if (!state.vf.top.includes(name)) vfToggle(name);
    }
    function vfMove(i, d) {
      const t = state.vf.top; const j = i + d;
      if (j < 0 || j >= t.length) return;
      [t[i], t[j]] = [t[j], t[i]]; render();
    }
    function vfScore(v, val) {
      state.vf.scores[v] = parseInt(val);
      const el = document.getElementById('vfs-' + valueSlug(v));
      if (el) { el.textContent = val; el.style.color = getColor(parseInt(val)); }
    }
    const valueSlug = v => v.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    async function vfSave() {
      const f = state.vf;
      f.top.forEach(v => { if (!f.scores[v]) f.scores[v] = 5; });
      const data = valuesData();
      const first = !data.rounds.length;
      data.rounds = [...data.rounds, { date: todayStr(), answers: f.answers, top: f.top, scores: f.scores }];
      await saveValuesData(data);
      state.vf = null; state.valuesView = 'overview';
      render(); window.scrollTo(0, 0);
      showToast(first ? '🧭 Je waarden staan · +' + VALUES_BONUS_XP + ' XP' : '🧭 Je waarden zijn bijgewerkt');
    }
    function openValueChallenge(id) {
      state.activeSection = 'body'; state.bodyTab = 'challenges';
      chGo('setup', id);
    }

    function renderValues() {
      if (state.valuesView === 'form' && state.vf) return renderValuesForm();
      const round = latestValues();
      const intro = `
        <div class="card v-intro">
          <div class="v-big">Wat vind jij écht belangrijk in dit leven?</div>
          <p>Veel mensen kennen zichzelf niet. Ze weten niet wat ze belangrijk vinden, en daardoor zijn ze zichzelf niet. Ze durven niet af te wijken en volgen hun dromen niet. Veel mensen waarderen zichzelf niet.</p>
          <p>Het enige wat je hoeft te doen, is jezelf <b>toestemming geven</b> om naar je hoogste waarden te leven.</p>
        </div>`;
      const emb = state.activeSection === 'journal';
      const head = `
        ${emb ? '' : `<div class="page-header"><div class="page-sub">Fundament</div><div class="page-title">Waarden</div></div>`}
        ${state.valuesLocal ? `<div class="info-box"><div class="info-title">Nog één update</div><div class="info-text">Voer waarden-update.sql uit in Supabase, dan worden je waarden ook online bewaard.</div></div>` : ''}`;
      if (!round) {
        return `${head}${intro}
          <div class="card">
            <label class="label">De opdracht</label>
            <div style="font-size: 13px; color: #d4d4d4; line-height: 1.7;">1. Beantwoord 10 vragen over hoe je nu leeft.<br>2. Kies je top 5 waarden en zet ze op volgorde.<br>3. Geef per waarde een cijfer: hoe goed leef je ernaar?</div>
            <div style="font-size: 11px; color: #8a8a8a; margin-top: 10px;">±15 minuten · eenmalig +${VALUES_BONUS_XP} XP</div>
          </div>
          <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="startValuesForm()">Start de opdracht</button>`;
      }
      const liv = valuesLiving();
      const gap = valuesBiggestGap();
      const rounds = valuesData().rounds;
      const tid = gap ? (valueChallenge[gap.v] || 'journal') : null;
      const tpl = tid ? chTemplate(tid) : null;
      return `${head}
        ${valuesReminderDue() ? `<div class="info-box"><div class="info-title">🧭 Kloppen je waarden nog?</div><div class="info-text">Je laatste keer was ${diffDays(round.date, todayStr())} dagen geleden. Waarden veranderen per levensfase.</div></div>` : ''}
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="label" style="margin: 0;">Mijn top 5</label>
            <span style="font-size: 10px; color: #8a8a8a;">${fmtDateShort(round.date)}</span>
          </div>
          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.1em; margin: 12px 0 4px; display: flex; justify-content: flex-end;">LEEF IK ERNAAR?</div>
          ${round.top.map((v, i) => {
            const l = liv[v] || {}; const sc = l.score;
            return `
              <div class="v-row">
                <span class="v-rank">${i + 1}</span>
                <span class="v-name">${esc(v)}</span>
                <span class="v-bar"><span style="width: ${(sc || 0) * 10}%; background: ${sc ? getColor(sc) : '#262626'};"></span></span>
                <span class="v-score" style="color: ${sc ? getColor(sc) : '#525252'};">${sc || '—'}</span>
              </div>
              ${l.trend && l.trend.length > 1 ? `<div class="v-trend">zondagen: ${l.trend.slice(-6).join(' → ')}</div>` : ''}`;
          }).join('')}
          <div class="hs-small" style="margin-top: 12px;">Elke zondag werk je deze cijfers bij in je journal, bij Terugblik.</div>
        </div>
        ${gap ? `
          <div class="card" style="background: #120d04; border-color: #3a2c0c;">
            <div style="font-size: 10px; color: #d9a441; letter-spacing: 0.15em; font-weight: 600;">GROOTSTE GAT</div>
            <div style="font-size: 14px; margin-top: 6px; line-height: 1.5;"><b>${esc(gap.v)}</b> is je nummer ${gap.rank + 1}, maar scoort een <b>${gap.sc}</b>.</div>
            ${tpl ? `<div style="font-size: 12px; color: #a3a3a3; margin-top: 6px; line-height: 1.5;">Een stap in de goede richting: de challenge <b style="color: #fafafa;">${esc(tpl.name)}</b>.</div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 12px;" onclick="openValueChallenge('${tid}')">Bekijk challenge →</button>` : ''}
          </div>` : ''}
        <button class="btn btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="startValuesForm()">Opdracht opnieuw invullen</button>
        <div class="hs-small" style="text-align: center; margin-bottom: 20px;">💡 Je hoogste waarden veranderen per levensfase. Je eerdere antwoorden blijven bewaard.</div>
        <label class="label">Eerdere keren · ${rounds.length}</label>
        ${[...rounds].reverse().map((r, k) => `
          <details class="j-opt">
            <summary><span>${fmtDateShort(r.date)} · ${r.top.map(esc).join(', ')}</span><b aria-hidden="true"></b></summary>
            <div style="padding: 0 18px 18px;">
              ${valueQuestions.map((q, i) => r.answers[i] ? `<div class="j-h-lbl">${esc(q)}</div><div class="entry-content">${esc(r.answers[i])}</div>` : '').join('')}
              <div class="j-h-lbl">Cijfers toen</div>
              <div class="entry-content">${r.top.map(v => `${esc(v)}: ${r.scores[v] || '—'}`).join(' · ')}</div>
            </div>
          </details>`).join('')}
      `;
    }

    function renderValuesForm() {
      const f = state.vf;
      const steps = `<div class="v-steps">${['Vragen', 'Top 5', 'Cijfers'].map((t, i) => `<span class="${f.step === i + 1 ? 'on' : f.step > i + 1 ? 'done' : ''}">${i + 1}. ${t}</span>`).join('')}</div>`;
      const head = `
        ${state.activeSection === 'journal' ? '' : `<div class="page-header"><div class="page-sub">Fundament</div><div class="page-title">Waarden</div></div>`}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="if (confirm('Stoppen? Je antwoorden worden niet bewaard.')) { state.vf = null; state.valuesView = 'overview'; render(); }">← Stoppen</button>
        ${steps}`;
      if (f.step === 1) {
        return `${head}
          <div class="card v-intro">
            <div class="v-big">Wat vind jij écht belangrijk in dit leven?</div>
            <p>Veel mensen kennen zichzelf niet. Ze weten niet wat ze belangrijk vinden, en daardoor zijn ze zichzelf niet. Ze durven niet af te wijken en volgen hun dromen niet. Veel mensen waarderen zichzelf niet.</p>
            <p>Het enige wat je hoeft te doen, is jezelf <b>toestemming geven</b> om naar je hoogste waarden te leven.</p>
            <p style="margin-bottom: 0;"><b>Opdracht:</b> beantwoord de vragen hieronder, voor meer inzicht in jouw waarden.</p>
          </div>
          ${valueQuestions.map((q, i) => `
            <div class="card">
              <label class="j-q" for="vq-${i}"><span style="color: #e5484d;">${i + 1}.</span> ${q}</label>
              <textarea class="textarea" id="vq-${i}" style="min-height: 90px;" oninput="vfAnswer(${i}, this.value)">${esc(f.answers[i])}</textarea>
            </div>`).join('')}
          <div class="hs-small" style="margin-bottom: 16px;">💡 Handig om te weten: je hoogste waarden veranderen per levensfase. Vul de vragen daarom af en toe opnieuw in.</div>
          <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="vfStep(2)">Verder: kies je top 5 →</button>`;
      }
      if (f.step === 2) {
        const opts = [...new Set([...valueOptions, ...f.top])];
        return `${head}
          <div class="card">
            <label class="label">Kies je 5 belangrijkste waarden · ${f.top.length}/5</label>
            <div class="hs-small" style="margin-bottom: 12px;">Kijk naar je antwoorden: welke woorden komen steeds terug? Kies wat je laat zien in hoe je leeft, niet wat je zou moeten vinden.</div>
            <div class="chips" style="margin: 0;">
              ${opts.map(v => `<button class="chip ${f.top.includes(v) ? 'active' : ''}" onclick="vfToggle(${esc(JSON.stringify(v))})">${esc(v)}</button>`).join('')}
            </div>
            <div class="goal-update" style="margin-top: 12px;">
              <input type="text" class="input-sm" id="vf-custom" placeholder="Eigen waarde" onkeydown="if(event.key === 'Enter') vfCustom()">
              <button class="btn btn-secondary btn-small" onclick="vfCustom()">+ Toevoegen</button>
            </div>
          </div>
          ${f.top.length ? `
            <div class="card">
              <label class="label">Op volgorde: belangrijkste bovenaan</label>
              ${f.top.map((v, i) => `
                <div class="v-order">
                  <span class="v-rank">${i + 1}</span><span style="flex: 1;">${esc(v)}</span>
                  <button class="icon-btn" onclick="vfMove(${i}, -1)" aria-label="${esc(v)} omhoog">↑</button>
                  <button class="icon-btn" onclick="vfMove(${i}, 1)" aria-label="${esc(v)} omlaag">↓</button>
                </div>`).join('')}
            </div>` : ''}
          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
            <button class="btn btn-secondary" onclick="vfStep(1)">← Vragen</button>
            <button class="btn btn-primary" onclick="vfStep(3)">Verder: cijfers →</button>
          </div>`;
      }
      return `${head}
        <div class="card">
          <label class="label">Hoe goed leef je hier nu naar?</label>
          <div class="hs-small" style="margin-bottom: 8px;">1 = helemaal niet · 10 = volledig. Wees eerlijk: het gat laat zien waar je eerste stap ligt.</div>
          ${f.top.map((v, i) => {
            const val = f.scores[v] || 5;
            return `
              <div class="slider-group">
                <div class="slider-header">
                  <span class="slider-label">${i + 1}. ${esc(v)}</span>
                  <span class="slider-value" id="vfs-${valueSlug(v)}" style="color: ${getColor(val)}">${val}</span>
                </div>
                <input type="range" class="slider" min="1" max="10" value="${val}" oninput="vfScore(${esc(JSON.stringify(v))}, this.value)" aria-label="${esc(v)}">
              </div>`;
          }).join('')}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
          <button class="btn btn-secondary" onclick="vfStep(2)">← Top 5</button>
          <button class="btn btn-primary" onclick="vfSave()">Opslaan</button>
        </div>`;
    }


    // ============================================
    // VOEDING
    // Bronnen: NEVO-online 2025/9.0 (RIVM) als nevo.json, Open Food Facts live, eigen producten
    // ============================================
    const foodMeals = [['ontbijt', 'Ontbijt'], ['lunch', 'Lunch'], ['diner', 'Diner'], ['snacks', 'Snacks']];
    const foodNutr = ['kcal', 'prot', 'carb', 'fat', 'fib', 'sugar', 'sat', 'salt'];
    const NEVO_SOURCE = 'Gebaseerd op gegevens van NEVO-online versie 2025/9.0, RIVM, Bilthoven en andere gegevens (Open Food Facts)';
    let nevoData = null, nevoLoading = null;

    function loadNevo() {
      if (nevoData) return Promise.resolve(nevoData);
      if (!nevoLoading) {
        nevoLoading = fetch('nevo.json').then(r => r.json()).then(d => {
          d.items = d.items.map(it => {
            const [code, name, group, ml, kcal, prot, carb, fat, fib, sugar, sat, na, syn] = it;
            return { key: 'nevo:' + code, src: 'NEVO', code, name, syn, group: d.groups[group], ml: !!ml,
              per100: { kcal, prot, carb, fat, fib, sugar, sat, salt: na === null || na === undefined ? null : Math.round(na * 2.5) / 1000 },
              search: (name + ' ' + (syn || '')).toLowerCase() };
          });
          nevoData = d;
          return d;
        }).catch(e => { nevoLoading = null; throw e; });
      }
      return nevoLoading;
    }

    function nutritionSettings() {
      const s = state.bodySettings || {};
      if (s.nutrition) return s.nutrition;
      try { const v = JSON.parse(localStorage.getItem('pf_nutrition') || 'null'); if (v) return v; } catch (e) {}
      return {};
    }
    async function saveNutritionSettings(patch) {
      const n = { ...nutritionSettings(), ...patch };
      state.bodySettings = { ...(state.bodySettings || {}), nutrition: n };
      try { localStorage.setItem('pf_nutrition', JSON.stringify(n)); } catch (e) {}
      if (!state.user) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, nutrition: n }, { onConflict: 'user_id' });
      if (error) console.warn('Voedingsinstellingen alleen lokaal (voer voeding-update.sql uit):', error.message);
    }

    async function loadFood() {
      if (!state.user) return;
      const since = dateAdd(todayStr(), -120);
      const res = await supabaseClient.from('food_logs').select('*').eq('user_id', state.user.id).gte('date', since);
      if (res.error) { state.foodError = true; state.foodLogs = []; return; }
      state.foodError = false;
      state.foodLogs = res.data || [];
      // Voor XP: aantal gelogde items per dag, alle tijd (alleen de datumkolom)
      const all = await supabaseClient.from('food_logs').select('date').eq('user_id', state.user.id);
      const cnt = {};
      (all.error ? state.foodLogs : (all.data || [])).forEach(r => { cnt[r.date] = (cnt[r.date] || 0) + 1; });
      state.foodDayCounts = cnt;
    }

    // Doelen: Mifflin-St Jeor × activiteit ± doel; eiwit uit het eiwitschema; vet 30%; rest koolhydraten
    const activityLevels = [['Weinig actief', 'Zittend werk, weinig sport', 1.2], ['Licht actief', '1–3 trainingen per week', 1.375], ['Actief', '4–5 trainingen per week', 1.55], ['Zeer actief', '6+ trainingen of zwaar lichamelijk werk', 1.725]];
    // Calorie-aanpassing per doel uit het eiwitschema (zelfde volgorde als proteinGoals)
    const goalKcalAdj = [0, 0, 0, 250, -500, 0];
    function foodTargets() {
      const g = nutritionSettings().goals || {};
      const w = Number(latestBodyValue('weight')) || Number(g.weight) || null;
      const h = Number((state.bodySettings || {}).height_cm) || Number(g.height) || null;
      const age = g.birthYear ? new Date().getFullYear() - Number(g.birthYear) : null;
      if (g.manual && g.kcal) return { kcal: +g.kcal, prot: +g.prot || 0, carb: +g.carb || 0, fat: +g.fat || 0, manual: true, w };
      if (!w || !h || !age) return null;
      const bmr = 10 * w + 6.25 * h - 5 * age + (g.sex === 'v' ? -161 : 5);
      const act = (activityLevels[g.activity ?? 2] || activityLevels[2])[2];
      const gi = proteinGoalIdx();
      const adj = goalKcalAdj[gi] || 0;
      const kcal = Math.round((bmr * act + adj) / 10) * 10;
      const pg = proteinGoals[gi] || proteinGoals[3];
      const prot = Math.round(w * (pg[1] + pg[2]) / 2);
      const fat = Math.round(kcal * 0.3 / 9);
      const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
      return { kcal, prot, carb, fat, w, bmr: Math.round(bmr), act, adj, pgLabel: pg[0] };
    }

    function foodScale(per100, grams) {
      const out = {};
      foodNutr.forEach(k => { const v = per100[k]; out[k] = v === null || v === undefined ? null : Math.round(v * grams / 100 * 10) / 10; });
      return out;
    }
    function foodDayLogs(date) { return (state.foodLogs || []).filter(l => l.date === date); }
    function foodSum(logs) {
      const s = { kcal: 0, prot: 0, carb: 0, fat: 0, fib: 0, sugar: 0, sat: 0, salt: 0 };
      logs.forEach(l => foodNutr.forEach(k => { s[k] += Number(l[k]) || 0; }));
      return s;
    }
    const f1 = n => String(Math.round((Number(n) || 0) * 10) / 10).replace('.', ',');
    const f0 = n => fmtInt(Math.round(Number(n) || 0));

    // Zoeken
    function foodCustomItems() {
      return (nutritionSettings().customFoods || []).map(c => ({ key: 'custom:' + c.id, src: 'EIGEN', name: c.name, per100: c.per100, portion: c.portion || null, ml: false, search: c.name.toLowerCase() }));
    }
    function foodLocalSearch(q) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length || !nevoData) return [];
      const pool = [...foodCustomItems(), ...nevoData.items];
      return pool.filter(it => terms.every(t => it.search.includes(t)))
        .map(it => ({ it, score: (it.search.startsWith(terms[0]) ? 0 : 1) + (it.src === 'EIGEN' ? -1 : 0) + it.name.length / 100 }))
        .sort((a, b) => a.score - b.score).slice(0, 40).map(x => x.it);
    }
    function offToItem(p) {
      const n = p.nutriments || {};
      const kcal = n['energy-kcal_100g'] ?? (n.energy_100g ? n.energy_100g / 4.184 : null);
      if (kcal === null || kcal === undefined) return null;
      const name = [p.brands ? String(p.brands).split(',')[0].trim() : '', p.product_name || p.product_name_nl || ''].filter(Boolean).join(' ') || 'Onbekend product';
      return { key: 'off:' + p.code, src: 'OFF', code: p.code, name, ml: false,
        per100: { kcal: Math.round(kcal), prot: n.proteins_100g ?? null, carb: n.carbohydrates_100g ?? null, fat: n.fat_100g ?? null, fib: n.fiber_100g ?? null, sugar: n.sugars_100g ?? null, sat: n['saturated-fat_100g'] ?? null, salt: n.salt_100g ?? null },
        portion: Number(p.serving_quantity) ? { g: Number(p.serving_quantity), label: p.serving_size || '1 portie' } : null };
    }
    const offFields = 'code,product_name,product_name_nl,brands,nutriments,serving_quantity,serving_size';
    async function foodOffSearch() {
      const q = (state.fQuery || '').trim();
      if (q.length < 2) return;
      state.fOff = { loading: true, items: [] }; render();
      try {
        const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&tagtype_0=countries&tag_contains_0=contains&tag_0=netherlands&fields=${offFields}`;
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        state.fOff = { loading: false, items: (d.products || []).map(offToItem).filter(Boolean) };
      } catch (e) {
        state.fOff = { loading: false, items: [], error: 'Open Food Facts is nu niet bereikbaar. Probeer het zo nog eens.' };
      }
      render();
    }
    async function foodBarcode(code) {
      code = String(code || '').replace(/\D/g, '');
      if (code.length < 6) { alert('Dat is geen geldige barcode.'); return; }
      showToast('Product opzoeken…');
      try {
        const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${offFields}`);
        const d = await r.json();
        const it = d && d.product ? offToItem({ ...d.product, code }) : null;
        if (!it) { alert('Dit product staat (nog) niet in Open Food Facts, of zonder voedingswaarden. Zoek het op naam of voeg het toe als eigen product.'); return; }
        openFoodProduct(it);
      } catch (e) { alert('Open Food Facts is nu niet bereikbaar. Probeer het zo nog eens.'); }
    }

    // Barcode scannen met de camera (html5-qrcode wordt pas geladen als je hem nodig hebt)
    let foodScanner = null;
    function loadScript(src) {
      return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    }
    async function startFoodScan() {
      state.fScan = true; render();
      try {
        if (!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
        const formats = window.Html5QrcodeSupportedFormats;
        foodScanner = new Html5Qrcode('food-scan', formats ? { formatsToSupport: [formats.EAN_13, formats.EAN_8, formats.UPC_A, formats.UPC_E] } : undefined);
        await foodScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, text => { stopFoodScan(); foodBarcode(text); }, () => {});
      } catch (e) {
        stopFoodScan();
        alert('De camera kon niet starten. Geef de app toestemming voor je camera, of typ de barcode in.');
      }
    }
    function stopFoodScan() {
      const s = foodScanner; foodScanner = null;
      if (s) { try { s.stop().catch(() => {}).finally(() => { try { s.clear(); } catch (e) {} }); } catch (e) {} }
      state.fScan = false; render();
    }

    // Navigatie binnen Voeding
    function setFoodDate(n) { state.fDate = dateAdd(state.fDate || todayStr(), n); if (state.fDate > todayStr()) state.fDate = todayStr(); render(); }
    function openFoodAdd(meal) {
      state.fMeal = meal || state.fMeal || defaultFoodMeal();
      state.fView = 'add'; state.fQuery = ''; state.fOff = null; state.fTab = 'search';
      render(); window.scrollTo(0, 0);
      loadNevo().then(() => { if (state.fView === 'add') render(); }).catch(() => { state.nevoError = true; render(); });
    }
    function defaultFoodMeal() { const h = new Date().getHours(); return h < 11 ? 'ontbijt' : h < 15 ? 'lunch' : h < 21 ? 'diner' : 'snacks'; }
    function foodQueryInput(v) {
      state.fQuery = v; state.fOff = null;
      const box = document.getElementById('food-results');
      if (box) box.innerHTML = renderFoodResults();
    }
    function foodItemFromLog(l) {
      const per100 = {};
      foodNutr.forEach(k => per100[k] = l.grams ? (Number(l[k]) || 0) * 100 / Number(l.grams) : null);
      return { key: l.ref || ('log:' + l.id), src: l.source === 'nevo' ? 'NEVO' : l.source === 'off' ? 'OFF' : l.source === 'quick' ? 'SNEL' : 'EIGEN', name: l.name, per100, ml: false };
    }
    function openFoodProduct(item, logId) {
      const last = (state.foodLogs || []).filter(l => l.ref === item.key && l.id !== logId).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0];
      const log = logId ? (state.foodLogs || []).find(l => l.id === logId) : null;
      state.fProduct = { item, grams: log ? String(Number(log.grams)) : (last ? String(Number(last.grams)) : (item.portion ? String(item.portion.g) : '100')), last: last ? Number(last.grams) : null, logId: logId || null, meal: log ? log.meal : state.fMeal };
      state.fView = 'product'; render(); window.scrollTo(0, 0);
    }
    function foodPick(key) {
      const it = (state.fPickMap || {})[key];
      if (it) openFoodProduct(it);
    }
    function foodGrams(v) {
      state.fProduct.grams = v;
      const g = pnum(v) || 0;
      const n = foodScale(state.fProduct.item.per100, g);
      foodNutr.forEach(k => { const el = document.getElementById('fp-' + k); if (el) el.textContent = n[k] === null ? '–' : (k === 'kcal' ? f0(n[k]) : f1(n[k])); });
      const hint = document.getElementById('fp-hint'); if (hint) hint.innerHTML = foodProteinHint(n.prot);
      document.querySelectorAll('.fp-chip').forEach(b => b.classList.toggle('on', Number(b.dataset.g) === g));
    }
    function foodProteinHint(addProt) {
      const t = foodTargets(); if (!t || !t.prot) return '';
      const p = state.fProduct;
      const day = foodSum(foodDayLogs(state.fDate || todayStr()).filter(l => l.id !== p.logId)).prot + (Number(addProt) || 0);
      return `Hiermee kom je op <b style="color: #f2cf7a;">${f0(day)} / ${t.prot} g eiwit</b> vandaag${day >= t.prot ? ' ✓' : ''}`;
    }
    async function saveFoodLog() {
      const p = state.fProduct; const g = pnum(p.grams);
      if (!g || g <= 0) { alert('Vul de hoeveelheid in grammen in.'); return; }
      const n = foodScale(p.item.per100, g);
      const row = { user_id: state.user.id, date: state.fDate || todayStr(), meal: p.meal || state.fMeal || 'snacks', name: p.item.name,
        source: p.item.src === 'NEVO' ? 'nevo' : p.item.src === 'OFF' ? 'off' : p.item.src === 'SNEL' ? 'quick' : 'custom', ref: p.item.key, grams: g, ...n };
      const res = p.logId ? await supabaseClient.from('food_logs').update(row).eq('id', p.logId) : await supabaseClient.from('food_logs').insert([row]);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message + (/food_logs/.test(res.error.message) ? '\n\nVoer eerst voeding-update.sql uit in Supabase.' : '')); return; }
      await loadFood();
      state.fView = 'day'; state.fProduct = null;
      render(); window.scrollTo(0, 0);
      showToast(p.logId ? '✓ Bijgewerkt' : '✓ ' + p.item.name + ' toegevoegd');
    }
    async function deleteFoodLog(id) {
      if (!confirm('Verwijderen?')) return;
      await supabaseClient.from('food_logs').delete().eq('id', id);
      await loadFood(); state.fView = 'day'; state.fProduct = null; render();
    }
    function toggleFoodFav(key) {
      const favs = nutritionSettings().favorites || [];
      const items = { ...(nutritionSettings().favItems || {}) };
      const on = favs.includes(key);
      if (!on && state.fProduct) items[key] = { name: state.fProduct.item.name, src: state.fProduct.item.src, per100: state.fProduct.item.per100, portion: state.fProduct.item.portion || null };
      if (on) delete items[key];
      saveNutritionSettings({ favorites: on ? favs.filter(k => k !== key) : [...favs, key], favItems: items });
      const b = document.getElementById('fp-fav'); if (b) { b.textContent = on ? '☆' : '★'; b.setAttribute('aria-pressed', on ? 'false' : 'true'); }
    }

    // Snel invoeren & eigen product & maaltijden
    async function saveQuickFood() {
      const v = id => pnum((document.getElementById(id) || {}).value);
      const name = ((document.getElementById('fq-name') || {}).value || '').trim() || 'Snel ingevoerd';
      const kcal = v('fq-kcal');
      if (!kcal) { alert('Vul minstens de calorieën in.'); return; }
      const row = { user_id: state.user.id, date: state.fDate || todayStr(), meal: state.fMeal, name, source: 'quick', ref: null, grams: 100,
        kcal, prot: v('fq-prot') || 0, carb: v('fq-carb') || 0, fat: v('fq-fat') || 0, fib: null, sugar: null, sat: null, salt: null };
      const res = await supabaseClient.from('food_logs').insert([row]);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message); return; }
      await loadFood(); state.fView = 'day'; render(); showToast('✓ Toegevoegd');
    }
    async function saveCustomFood() {
      const v = id => pnum((document.getElementById(id) || {}).value);
      const name = ((document.getElementById('fc-name') || {}).value || '').trim();
      if (!name || v('fc-kcal') === null) { alert('Vul minstens de naam en de calorieën per 100 g in.'); return; }
      const per100 = { kcal: v('fc-kcal'), prot: v('fc-prot') || 0, carb: v('fc-carb') || 0, fat: v('fc-fat') || 0, fib: v('fc-fib'), sugar: v('fc-sugar'), sat: v('fc-sat'), salt: v('fc-salt') };
      const portion = v('fc-portion') ? { g: v('fc-portion'), label: '1 portie' } : null;
      const c = { id: Date.now().toString(36), name, per100, portion };
      await saveNutritionSettings({ customFoods: [...(nutritionSettings().customFoods || []), c] });
      openFoodProduct({ key: 'custom:' + c.id, src: 'EIGEN', name, per100, portion });
    }
    async function saveMealPreset(meal) {
      const logs = foodDayLogs(state.fDate || todayStr()).filter(l => l.meal === meal);
      if (!logs.length) return;
      const name = prompt('Naam van deze maaltijd:', foodMeals.find(m => m[0] === meal)[1] + ' standaard');
      if (!name) return;
      const items = logs.map(l => ({ name: l.name, source: l.source, ref: l.ref, grams: Number(l.grams), per100: foodItemFromLog(l).per100 }));
      await saveNutritionSettings({ mealPresets: [...(nutritionSettings().mealPresets || []), { id: Date.now().toString(36), name: name.trim(), items }] });
      showToast('⭐ Maaltijd bewaard');
      render();
    }
    async function addMealPreset(id) {
      const m = (nutritionSettings().mealPresets || []).find(x => x.id === id);
      if (!m) return;
      const rows = m.items.map(it => ({ user_id: state.user.id, date: state.fDate || todayStr(), meal: state.fMeal, name: it.name, source: it.source, ref: it.ref, grams: it.grams, ...foodScale(it.per100, it.grams) }));
      const res = await supabaseClient.from('food_logs').insert(rows);
      if (res.error) { alert('Fout bij opslaan: ' + res.error.message); return; }
      await loadFood(); state.fView = 'day'; render(); showToast('✓ ' + m.name + ' toegevoegd');
    }
    async function deleteMealPreset(id) {
      if (!confirm('Maaltijd verwijderen?')) return;
      await saveNutritionSettings({ mealPresets: (nutritionSettings().mealPresets || []).filter(x => x.id !== id) });
      render();
    }

    // ---------- Render ----------
    function renderFood() {
      if (!state.fDate) state.fDate = todayStr();
      if (state.fView === 'add') return renderFoodAdd();
      if (state.fView === 'product' && state.fProduct) return renderFoodProduct();
      if (state.fView === 'goals') return renderFoodGoals();
      if (state.fView === 'quick') return renderFoodQuick();
      if (state.fView === 'custom') return renderFoodCustom();
      const fm = state.fMain || 'dagboek';
      const foodTabs = `<div class="tabs" role="tablist">${[['dagboek', 'Dagboek'], ['vasten', 'Vasten'], ['tvoed', 'T-voeding'], ['supps', 'Supps']].map(([k, l]) => `<button class="tab ${fm === k ? 'active' : ''}" role="tab" aria-selected="${fm === k}" onclick="state.fMain = '${k}'; render(); window.scrollTo(0, 0);">${l}</button>`).join('')}</div>`;
      if (fm !== 'dagboek') return `
        <div class="page-header" style="margin-bottom: 16px;"><div class="page-sub">Fysiek</div><div class="page-title">Voeding</div></div>
        ${foodTabs}
        ${fm === 'tvoed' ? renderTFood() : fm === 'vasten' ? renderFast() : renderSupps()}`;
      const date = state.fDate;
      const logs = foodDayLogs(date);
      const sum = foodSum(logs);
      const t = foodTargets();
      const label = date === todayStr() ? 'Vandaag' : date === dateAdd(todayStr(), -1) ? 'Gisteren' : '';
      const dl = new Date(date + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'short' });
      const pct = t ? Math.min(100, Math.round(sum.kcal / t.kcal * 100)) : 0;
      const over = t ? t.kcal - Math.round(sum.kcal) : null;
      const mac = (n, k, color) => {
        const goal = t ? t[k] : 0;
        return `<div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;"><span style="color: ${color};">${n}</span><span style="color: #a3a3a3;">${f0(sum[k])}${goal ? ' / ' + goal : ''} g</span></div>
          <div class="f-bar"><span style="width: ${goal ? Math.min(100, sum[k] / goal * 100) : 0}%; background: ${color};"></span></div></div>`;
      };
      return `
        <div class="page-header" style="margin-bottom: 16px;"><div class="page-sub">Fysiek</div><div class="page-title">Voeding</div></div>
        ${foodTabs}
        ${state.foodError ? `<div class="info-box"><div class="info-title">⚠️ Nog één update</div><div class="info-text">Voer voeding-update.sql uit in Supabase om je eten op te slaan.</div></div>` : ''}
        <div class="f-datebar">
          <button class="f-nav" onclick="setFoodDate(-1)" aria-label="Vorige dag">‹</button>
          <div style="font-size: 13px;">${label ? label + ' · ' : ''}${dl}</div>
          <button class="f-nav" onclick="setFoodDate(1)" aria-label="Volgende dag" ${date >= todayStr() ? 'disabled' : ''}>›</button>
        </div>
        <div class="card">
          ${t ? `
            <div class="f-top">
              <div><b>${f0(t.kcal)}</b><span>Doel</span></div>
              <div><b>${f0(sum.kcal)}</b><span>Gegeten</span></div>
              <div><b style="color: ${over >= 0 ? '#22c55e' : '#e5484d'}; font-weight: 500;">${f0(Math.abs(over))}</b><span>${over >= 0 ? 'Over' : 'Te veel'}</span></div>
            </div>
            <div class="f-bar" style="height: 8px; margin-top: 14px;"><span style="width: ${pct}%; background: ${over >= 0 ? '#7f1d1d' : '#e5484d'};"></span></div>
            <div style="font-size: 10px; color: #8a8a8a; margin-top: 6px; text-align: right;">kcal · ${pct}%</div>
          ` : `
            <div style="font-size: 13px; color: #d4d4d4;">Gegeten: <b>${f0(sum.kcal)} kcal</b></div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 12px;" onclick="state.fView = 'goals'; render();">Stel je dagdoel in →</button>
          `}
          <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
            ${mac('Eiwit', 'prot', '#d9a441')}${mac('Koolhydraten', 'carb', '#60a5fa')}${mac('Vet', 'fat', '#a78bfa')}
          </div>
          ${t && !t.manual ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 12px;">Eiwitdoel uit je eiwitschema: ${esc(t.pgLabel)} · ${f1(t.w)} kg</div>` : ''}
          ${sum.fib || sum.salt ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 6px;">Vezels ${f1(sum.fib)} g · suikers ${f1(sum.sugar)} g · zout ${f1(sum.salt)} g</div>` : ''}
        </div>
        ${foodMeals.map(([k, name]) => {
          const ml = logs.filter(l => l.meal === k).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
          const ms = foodSum(ml);
          return `
            <div class="f-meal">
              <div class="f-meal-head"><span>${name.toUpperCase()}</span><span>${f0(ms.kcal)} kcal${ms.prot ? ' · ' + f0(ms.prot) + ' g eiwit' : ''}</span></div>
              ${ml.map(l => `
                <button class="f-item" onclick="openFoodProduct(foodItemFromLog(state.foodLogs.find(x => x.id === '${l.id}')), '${l.id}')">
                  <span style="min-width: 0; text-align: left;"><span class="f-item-n">${esc(l.name)}</span><span class="f-item-d">${l.source === 'quick' ? 'snel ingevoerd' : f0(l.grams) + ' g'} · ${{ nevo: 'NEVO', off: 'Open Food Facts', custom: 'eigen product', quick: 'snel' }[l.source] || ''}</span></span>
                  <span class="f-item-k">${f0(l.kcal)} kcal</span>
                </button>`).join('')}
              <div class="f-meal-foot">
                <button onclick="openFoodAdd('${k}')">+ Toevoegen</button>
                ${ml.length ? `<button class="sub" onclick="saveMealPreset('${k}')">⭐ Bewaar als maaltijd</button>` : ''}
              </div>
            </div>`;
        }).join('')}
        <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 4px;" onclick="state.fView = 'goals'; render(); window.scrollTo(0, 0);">Doelen aanpassen</button>
        <div class="f-source">${NEVO_SOURCE}</div>
      `;
    }

    function renderFoodResults() {
      if (state.nevoError) return `<div class="empty">De voedingstabel kon niet laden. Controleer of nevo.json op GitHub staat.</div>`;
      const q = (state.fQuery || '').trim();
      state.fPickMap = {};
      const row = it => { state.fPickMap[it.key] = it; const p = it.per100;
        return `<button class="f-res" onclick="foodPick(${esc(JSON.stringify(it.key))})">
          <span style="flex: 1; min-width: 0; text-align: left;"><span class="f-item-n">${esc(it.name)}</span><span class="f-item-d">${f0(p.kcal)} kcal${p.prot !== null && p.prot !== undefined ? ' · ' + f1(p.prot) + ' g eiwit' : ''} per 100 ${it.ml ? 'ml' : 'g'}</span></span>
          <span class="f-tag ${it.src === 'NEVO' ? 'nevo' : it.src === 'OFF' ? 'off' : 'own'}">${it.src}</span></button>`; };
      if (state.fTab === 'recent' || state.fTab === 'fav' || state.fTab === 'meals') {
        if (state.fTab === 'meals') {
          const ms = nutritionSettings().mealPresets || [];
          if (!ms.length) return `<div class="empty">Nog geen maaltijden.<br><br>Tik bij een maaltijd op je dag op "⭐ Bewaar als maaltijd".</div>`;
          return ms.map(m => { const s = foodSum(m.items.map(it => foodScale(it.per100, it.grams)));
            return `<div class="f-res" style="cursor: default;"><span style="flex: 1; min-width: 0;"><span class="f-item-n">${esc(m.name)}</span><span class="f-item-d">${m.items.length} producten · ${f0(s.kcal)} kcal · ${f0(s.prot)} g eiwit</span></span>
              <button class="btn btn-primary btn-small" onclick="addMealPreset('${m.id}')">+</button><button class="icon-btn" onclick="deleteMealPreset('${m.id}')" aria-label="Maaltijd verwijderen">✕</button></div>`; }).join('');
        }
        let items = [];
        if (state.fTab === 'recent') {
          const seen = new Set();
          [...(state.foodLogs || [])].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).forEach(l => {
            const k = l.ref || ('quick:' + l.name); if (seen.has(k) || l.source === 'quick') return; seen.add(k); items.push(foodItemFromLog(l));
          });
          items = items.slice(0, 30);
        } else {
          const fi = nutritionSettings().favItems || {};
          items = (nutritionSettings().favorites || []).map(k => fi[k] ? { key: k, ...fi[k] } : null).filter(Boolean);
        }
        if (!items.length) return `<div class="empty">${state.fTab === 'recent' ? 'Nog niks gegeten in de app.' : 'Nog geen favorieten. Tik op ☆ bij een product.'}</div>`;
        return items.map(row).join('');
      }
      if (q.length < 2) return `<div class="hs-small" style="padding: 8px 0;">Typ minstens 2 letters, of scan een barcode.</div>`;
      if (!nevoData) return `<div class="hs-small">Voedingstabel laden…</div>`;
      const local = foodLocalSearch(q);
      return `
        ${local.length ? local.map(row).join('') : `<div class="hs-small" style="padding: 8px 0;">Niets gevonden in de RIVM-tabel.</div>`}
        <div class="f-offbox">
          ${!state.fOff ? `<button class="btn btn-secondary btn-small" style="width: 100%;" onclick="foodOffSearch()">🔍 Zoek "${esc(q)}" in winkelproducten (Open Food Facts)</button>`
            : state.fOff.loading ? `<div class="hs-small">Zoeken in Open Food Facts…</div>`
            : state.fOff.error ? `<div class="hs-small" style="color: #eab308;">${state.fOff.error}</div>`
            : state.fOff.items.length ? state.fOff.items.map(row).join('') : `<div class="hs-small">Geen winkelproducten gevonden.</div>`}
        </div>`;
    }

    function renderFoodAdd() {
      const tab = state.fTab || 'search';
      return `
        <div class="page-header" style="margin-bottom: 12px;"><div class="page-sub">Voeding</div><div class="page-title">Toevoegen</div></div>
        <button class="entry-action" style="margin-bottom: 14px;" onclick="state.fView = 'day'; render();">← Terug</button>
        <div class="f-meals">${foodMeals.map(([k, n]) => `<button class="${state.fMeal === k ? 'on' : ''}" onclick="state.fMeal = '${k}'; render();">${n}</button>`).join('')}</div>
        <div class="f-search">
          <input type="search" class="form-input" id="food-q" placeholder="Zoek product, bijv. kipfilet" value="${esc(state.fQuery || '')}" oninput="foodQueryInput(this.value)" onkeydown="if(event.key === 'Enter') foodOffSearch()" onfocus="state.fTab = 'search'" aria-label="Zoek product">
          <button class="f-scan" onclick="startFoodScan()" aria-label="Barcode scannen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16 8v8"></path></svg></button>
        </div>
        ${state.fScan ? `
          <div class="f-scanbox">
            <div id="food-scan" style="width: 100%;"></div>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px;">
              <input type="text" inputmode="numeric" class="input-sm" id="food-code" placeholder="Of typ de barcode">
              <button class="btn btn-secondary btn-small" onclick="const c = document.getElementById('food-code').value; stopFoodScan(); foodBarcode(c);">Zoek</button>
            </div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px;" onclick="stopFoodScan()">Stoppen</button>
          </div>` : ''}
        <div class="tabs" style="margin: 14px 0 10px;">
          ${[['search', 'Zoeken'], ['recent', 'Recent'], ['fav', 'Favorieten'], ['meals', 'Maaltijden']].map(([k, n]) => `<button class="tab ${tab === k ? 'active' : ''}" onclick="state.fTab = '${k}'; render();">${n}</button>`).join('')}
        </div>
        <div id="food-results" style="display: flex; flex-direction: column; gap: 6px;">${renderFoodResults()}</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px;">
          <button class="btn btn-secondary btn-small" onclick="state.fView = 'quick'; render();">✏️ Snel invoeren</button>
          <button class="btn btn-secondary btn-small" onclick="state.fView = 'custom'; render();">+ Eigen product</button>
        </div>
        <div class="f-source">${NEVO_SOURCE}</div>
      `;
    }

    function renderFoodProduct() {
      const p = state.fProduct; const it = p.item; const g = pnum(p.grams) || 0;
      const n = foodScale(it.per100, g);
      const fav = (nutritionSettings().favorites || []).includes(it.key);
      const chips = [...new Set([it.portion ? it.portion.g : null, 50, 100, 150, 200, p.last].filter(Boolean))];
      const srcTxt = it.src === 'NEVO' ? `RIVM · NEVO-code ${it.code}` : it.src === 'OFF' ? `Open Food Facts · barcode ${it.code}` : it.src === 'SNEL' ? 'Snel ingevoerd' : 'Eigen product';
      const v = (k, d) => n[k] === null || n[k] === undefined ? '–' : (d ? f0(n[k]) : f1(n[k]));
      return `
        <button class="entry-action" style="margin: 64px 0 16px;" onclick="state.fView = '${p.logId ? 'day' : 'add'}'; render();">← Terug</button>
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px;">
          <div><div style="font-size: 22px; font-weight: 300;">${esc(it.name)}</div><div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${srcTxt} · per 100 ${it.ml ? 'ml' : 'g'}: ${f0(it.per100.kcal)} kcal</div></div>
          ${it.src !== 'SNEL' && !String(it.key).startsWith('log:') ? `<button class="f-fav" id="fp-fav" aria-pressed="${fav}" aria-label="Favoriet" onclick="toggleFoodFav(${esc(JSON.stringify(it.key))})">${fav ? '★' : '☆'}</button>` : ''}
        </div>
        <div class="card">
          <label class="label" for="fp-g">Hoeveelheid</label>
          <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;">
            <input type="text" inputmode="decimal" id="fp-g" class="form-input" style="font-size: 26px; font-weight: 300;" value="${esc(p.grams)}" oninput="foodGrams(this.value)">
            <span style="color: #a3a3a3;">${it.ml ? 'ml' : 'gram'}</span>

    // ============================================
    // SLAAP
    // ============================================
    function sleepSettings() {
      const s = state.bodySettings || {};
      let v = s.sleep;
      if (!v) { try { v = JSON.parse(localStorage.getItem('pf_sleep') || 'null'); } catch (e) {} }
      v = v || {};
      return { wake: v.wake || '07:00', hours: v.hours || 8, night: v.night || 'off', strength: v.strength || 100, routine: v.routine || {}, set: !!v.wake };
    }
    let sleepSaveTimer = null;
    function saveSleepSettings(patch, quiet) {
      const cur = sleepSettings();
      delete cur.set;
      const n = { ...cur, ...patch };
      // routine-historie blijft bewaard: telt mee voor je XP
      Object.keys(n.routine || {}).forEach(d => { if (!n.routine[d] || !n.routine[d].length) delete n.routine[d]; });
      state.bodySettings = { ...(state.bodySettings || {}), sleep: n };
      try { localStorage.setItem('pf_sleep', JSON.stringify(n)); } catch (e) {}
      applyNightMode();
      if (!state.user) return;
      clearTimeout(sleepSaveTimer);
      sleepSaveTimer = setTimeout(async () => {
        const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, sleep: n }, { onConflict: 'user_id' });
        if (error) console.warn('Slaapinstellingen alleen lokaal (voer slaap-update.sql uit):', error.message);
      }, quiet ? 800 : 0);
    }
    function hm2min(t) { const [h, m] = String(t || '').split(':').map(Number); return isNaN(h) || isNaN(m) ? null : h * 60 + m; }
    function min2hm(n) { n = ((Math.round(n) % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
    function fmtSleepDur(min) { return min === null || min === undefined ? '—' : `${Math.floor(min / 60)}u${String(min % 60).padStart(2, '0')}`; }
    function sleepBedMin() { const s = sleepSettings(); return hm2min(s.wake) - Math.round(s.hours * 60); }
    // Na middernacht hoort de avondroutine nog bij gisteravond
    function sleepEveningDate() { return new Date().getHours() < 5 ? dateAdd(todayStr(), -1) : todayStr(); }

    // Nachten uit je journal (ochtend) of het Slaap-scherm: datum = de ochtend dat je opstond
    function sleepNight(date) {
      const e = state.entries.find(x => x.date === date && x.daily && x.daily.sleepMin);
      if (!e) return null;
      return { date, min: e.daily.sleepMin, bed: e.daily.bed, wake: e.daily.wake, q: e.sleep_quality || null };
    }
    function sleepNights(from, to) {
      const out = [];
      for (let d = from; d <= to; d = dateAdd(d, 1)) { const n = sleepNight(d); if (n) out.push(n); }
      return out;
    }
    function sleepSd(arr) { const m = arr.reduce((a, b) => a + b, 0) / arr.length; return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / arr.length); }
    // Eigen eenvoudige regelmaat-score: hoeveel je bed- en opstatijd schommelen (geen officiële SRI)
    function sleepRegularity(nights) {
      const ok = nights.filter(n => hm2min(n.bed) !== null && hm2min(n.wake) !== null);
      if (ok.length < 3) return null;
      const bed = ok.map(n => (hm2min(n.bed) - 720 + 1440) % 1440); // minuten sinds 12:00
      const wake = ok.map(n => (hm2min(n.wake) + 720) % 1440 - 720);  // rond middernacht
      const sdBed = Math.round(sleepSd(bed)), sdWake = Math.round(sleepSd(wake));
      const avg = (sdBed + sdWake) / 2;
      const score = Math.max(0, Math.min(100, Math.round(100 - avg * 1.2)));
      const label = avg <= 20 ? 'Zeer regelmatig' : avg <= 45 ? 'Redelijk regelmatig' : 'Onregelmatig';
      const color = avg <= 20 ? '#22c55e' : avg <= 45 ? '#eab308' : '#e5484d';
      return { sdBed, sdWake, score, label, color, n: ok.length };
    }
    function sleepAvg(nights) { return nights.length ? Math.round(nights.reduce((a, n) => a + n.min, 0) / nights.length) : null; }

    function sleepRoutineItems() {

    }

    async function saveSleepNight() {
      if (!state.user) return;
      const jd = jdInit();
      if (!jd.bed || !jd.wake) { alert('Vul in hoe laat je naar bed ging en opstond.'); return; }
      const sleepMin = jSleepCalc();
      const existing = jd.id ? state.entries.find(e => e.id === jd.id) : null;
      const daily = { ...((existing && existing.daily) || {}), bed: jd.bed, wake: jd.wake, sleepMin };
      const btn = document.getElementById('sl-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }
      let res;
      if (jd.id) res = await supabaseClient.from('journal_entries').update({ daily, sleep_quality: jd.sleep }).eq('id', jd.id);
      else {
        res = await supabaseClient.from('journal_entries').insert([{ user_id: state.user.id, date: jd.date, daily, content: '', habits: { ...state.habits }, energy: jd.energy, sleep_quality: jd.sleep }]).select().single();
        if (!res.error && res.data) jd.id = res.data.id;
      }
      if (res.error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
        alert('Fout bij opslaan: ' + res.error.message);
        return;
      }
      await loadEntries();
      state.jd = null; jdInit();
      render();
      showToast('😴 Nacht opgeslagen');
    }

    // Rode nachtmodus: legt een rood filter over deze app (niet over je hele telefoon)
    function nightModeActive() {
      const s = sleepSettings();
      if (s.night === 'on') return true;
      if (s.night !== 'auto') return false;
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      const start = ((sleepBedMin() - 60) % 1440 + 1440) % 1440, end = hm2min(s.wake);
      return start < end ? m >= start && m < end : m >= start || m < end;
    }
    function applyNightMode() {
      let el = document.getElementById('pf-night');
      const on = !!state.user && nightModeActive();
      if (!on) { if (el) el.remove(); document.documentElement.classList.remove('pf-night-on'); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'pf-night';
        el.setAttribute('aria-hidden', 'true');
        document.body.appendChild(el);
      }
      el.style.opacity = (sleepSettings().strength || 100) / 100;
      document.documentElement.classList.add('pf-night-on');
    }

      const rad = Math.PI / 180;
      const d = (date.getTime() - 946728000000) / 86400000; // dagen sinds 1 jan 2000 12:00 UTC
      const g = (357.529 + 0.98560028 * d) * rad;
      const q = 280.459 + 0.98564736 * d;
      const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
      const e = (23.439 - 0.00000036 * d) * rad;
      const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / rad;
      const decl = Math.asin(Math.sin(e) * Math.sin(L));
      const gmst = 18.697374558 + 24.06570982441908 * d;
      const ha = (((gmst + lon / 15) * 15 - ra) % 360 + 360) % 360 * rad;
      const la = lat * rad;
      return Math.asin(Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha)) / rad;
    }
    function sunLoc() {
      try { const v = JSON.parse(localStorage.getItem('pf_geo') || 'null'); if (v && isFinite(v.lat)) return v; } catch (e) {}
      return { lat: 52.37, lon: 4.90, name: 'Amsterdam' };
    }
    function sunUseMyLocation() {
      if (!navigator.geolocation) { alert('Je browser kan je locatie niet bepalen.'); return; }
      navigator.geolocation.getCurrentPosition(p => {
        const v = { lat: Math.round(p.coords.latitude * 100) / 100, lon: Math.round(p.coords.longitude * 100) / 100, name: 'jouw locatie' };
        try { localStorage.setItem('pf_geo', JSON.stringify(v)); } catch (e) {}
        render();
      }, () => alert('Locatie niet beschikbaar. De app rekent met Amsterdam.'), { timeout: 10000 });
    }
    // Venster van de dag waarin de zon boven de drempel staat
    function sunWindow(day, loc, min) {
      let start = null, end = null, max = -90, maxAt = null;
      for (let m = 4 * 60; m <= 22 * 60; m += 5) {
        const t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, m);
        const el = sunElevation(t, loc.lat, loc.lon);
        if (el > max) { max = el; maxAt = t; }
        if (el >= min) { if (!start) start = t; end = t; }
      }
      return { start, end, max, maxAt };
    }
    const hhmm = t => t ? String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') : '—';
    function renderSunD() {
      const loc = sunLoc();
      const now = new Date();
      const elNow = sunElevation(now, loc.lat, loc.lon);
      const w = sunWindow(now, loc, 45);
      const statusNow = elNow >= 45 ? ['#22c55e', 'Nu: vitamine D mogelijk'] : elNow >= 35 ? ['#eab308', 'Nu: weinig, de zon staat net te laag'] : elNow > 0 ? ['#8a8a8a', 'Nu: te laag voor vitamine D'] : ['#525252', 'Nu: de zon is onder'];
      // Eerste en laatste dag van het jaar met een vitamine D-venster
      let first = null, last = null;
      for (let i = 0; i < 366; i += 2) {
        const day = new Date(now.getFullYear(), 0, 1 + i);
        if (day.getFullYear() !== now.getFullYear()) break;
        const el = sunElevation(new Date(day.getFullYear(), day.getMonth(), day.getDate(), 13, 30), loc.lat, loc.lon);
        if (el >= 45) { if (!first) first = day; last = day; }
      }
      const dm = d => d ? d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : '—';
      const hours = [];
      for (let h = 7; h <= 19; h++) hours.push(h);
      const months = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      const grid = months.map((mn, mi) => {
        const cells = hours.map(h => {
          const el = sunElevation(new Date(now.getFullYear(), mi, 15, h, 30), loc.lat, loc.lon);
          const c = el >= 45 ? '#d9a441' : el >= 35 ? '#5c4615' : '#141414';
          return `<span style="background: ${c};" title="${mn} ${h}:30 · zon ${Math.round(el)}°"></span>`;
        }).join('');
        return `<div class="sd-row ${mi === now.getMonth() ? 'now' : ''}"><b>${mn}</b>${cells}</div>`;
      }).join('');
      return `
        <details class="hs-sec sd-box">
          <summary><span>☀️ Wanneer maakt je huid vitamine D?</span><span class="hs-pm" aria-hidden="true"></span></summary>
          <div class="hs-body">
            <div class="sd-now">
              <div><b style="color: ${statusNow[0]};">${Math.round(elNow)}°</b><span>Zon nu</span></div>
              <div><b>${Math.round(w.max)}°</b><span>Hoogst vandaag (${hhmm(w.maxAt)})</span></div>
              <div><b style="font-size: 15px;">${w.start ? hhmm(w.start) + '–' + hhmm(w.end) : 'Geen'}</b><span>Vitamine D-venster</span></div>
            </div>
            <div style="font-size: 12px; color: ${statusNow[0]}; margin: 8px 0 12px;">${statusNow[1]}</div>
            <p><b>Vuistregel: je schaduw is korter dan jijzelf.</b> Dan staat de zon hoger dan 45° en komt er genoeg UVB door om vitamine D te maken. Staat de zon lager, dan maakt je huid weinig tot niets.</p>
            <p>${loc.name === 'Amsterdam' ? 'In Amsterdam' : 'Op jouw locatie'} staat de zon dit jaar van <b>${dm(first)}</b> tot <b>${dm(last)}</b> rond het middaguur hoog genoeg. Daarbuiten heb je het van je voorraad, je eten of een supplement nodig.</p>
            <div class="sd-grid" role="img" aria-label="Zonnestand per maand en uur">
              <div class="sd-row sd-head"><b></b>${hours.map(h => `<i>${h % 2 ? '' : h}</i>`).join('')}</div>
              ${grid}
            </div>
            <div class="sl-legend"><span><i style="background: #d9a441;"></i>boven 45°: vitamine D</span><span><i style="background: #5c4615;"></i>35–45°: weinig</span><span><i style="background: #262626;"></i>te laag</span></div>
            <p class="hs-small" style="margin-top: 10px;">Berekend voor ${loc.name} (${loc.lat}° NB), de 15e van elke maand, wintertijd/zomertijd van je telefoon. Bewolking, ozon en je huidtype tellen niet mee: het is een vuistregel, geen meting.
              ${loc.name === 'Amsterdam' ? `<a href="#" style="color: #e5484d;" onclick="sunUseMyLocation(); return false;">Gebruik mijn locatie →</a>` : `<a href="#" style="color: #e5484d;" onclick="try { localStorage.removeItem('pf_geo'); } catch (e) {} render(); return false;">Terug naar Amsterdam</a>`}</p>
            <div class="sd-app">
              <b>Precies willen weten?</b> De gratis app <b>D Minder</b> rekent ook met bewolking, ozon en je huidtype, en houdt bij hoeveel vitamine D je opbouwt.
              <div class="sd-links"><a href="https://apps.apple.com/app/d-minder-pro/id547102495" target="_blank" rel="noopener noreferrer">iPhone ↗</a><a href="https://play.google.com/store/apps/details?id=com.ontometrics.dminder" target="_blank" rel="noopener noreferrer">Android ↗</a></div>
            </div>
          </div>
        </details>`;
    }

    function userPrefs() {

    let prefsSaveTimer = null;
    function saveUserPrefs(patch) {
      const p = { ...userPrefs(), ...patch };
      state.bodySettings = { ...(state.bodySettings || {}), prefs: p };

      if (!state.user) return;
      clearTimeout(prefsSaveTimer);
      prefsSaveTimer = setTimeout(async () => {
        const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, prefs: p }, { onConflict: 'user_id' });

    function dashLayout() {
      const d = userPrefs().dash || {};
      const known = dashCards.map(c => c[0]);
      const order = (d.order || []).filter(k => known.includes(k));
      // Nieuwe kaarten op hun standaardplek invoegen (na de kaart die er standaard voor staat)
      known.forEach((k, i) => {
        if (order.includes(k)) return;
        let at = order.length;
        for (let j = i - 1; j >= 0; j--) { const pos = order.indexOf(known[j]); if (pos >= 0) { at = pos + 1; break; } }
        order.splice(at, 0, k);
      });
      return { order, off: (d.off || []).filter(k => known.includes(k)) };
    }

    // "Vandaag te doen": wat er vandaag nog openstaat, uit alle onderdelen
    function todayTodo() {
      const today = todayStr();
      const items = [];
      const je = todayJournalEntry();
      const daily = (je && je.daily) || {};
      const go = (js) => js;
      items.push({ n: 'Ochtend-journal', sub: daily.morningAt ? 'Doelen gezet' : 'Slaap, energie en 3 doelen', done: !!daily.morningAt,
        go: go("state.jMode = 'ochtend'; state.journalTab = 'today'; setSection('journal')") });
      const night = sleepNight(today);
      items.push({ n: 'Nacht ingevuld', sub: night ? fmtSleepDur(night.min) + (night.q ? ' · kwaliteit ' + night.q : '') : 'Hoe laat naar bed en op?', done: !!night, go: "setSection('sleep')" });
      const plan = trainingPlan();
      if (plan) {
        const idx = (new Date().getDay() + 6) % 7;
        const key = sessionKeyFor(plan, idx);
        const trained = (state.workouts || []).some(w => w.date === today);
        if (key || trained) items.push({ n: key ? sessionDefs[key].label + '-training' : 'Training', sub: trained ? 'Gedaan' : 'Volgens je schema', done: trained,
          go: `state.tday = ${idx}; state.trainView = 'list'; setSection('training')` });
      }
      const t = foodTargets();
      if (t && t.prot) {
        const sum = foodSum(foodDayLogs(today));
        const left = Math.max(0, Math.round(t.prot - sum.prot));
        items.push({ n: `Eiwit ${Math.round(sum.prot)} / ${t.prot} g`, sub: left ? `Nog ${left} g te gaan` : 'Doel gehaald', done: !left,
          go: "state.fView = 'day'; state.fMain = 'dagboek'; state.fDate = todayStr(); setSection('food')" });
      }
      const chs = activeChallenges().filter(c => c.kind !== 'hard75' && c.start_date <= today);
      if (chs.length) {
        const st = chs.map(c => { const ev = evalChallenge(c); return [c.name, ev.todayDay ? ev.todayDay.st : 'pending']; });
        const doneN = st.filter(x => x[1] === 'done').length;
        const open = st.filter(x => x[1] !== 'done').map(x => x[0]);
        items.push({ n: `Challenges ${doneN} / ${chs.length}`, sub: open.length ? 'Open: ' + open.slice(0, 2).join(', ') + (open.length > 2 ? '…' : '') : 'Alles gehaald', done: !open.length,
          go: "state.bodyTab = 'challenges'; state.chView = 'list'; setSection('body')" });
      }
      const sd = stepsData(), st = stepsOn(today);
      items.push({ n: `Stappen ${st !== null ? fmtInt(st) : 0} / ${fmtInt(sd.goal)}`, sub: st !== null ? (st >= sd.goal ? 'Doel gehaald' : `Nog ${fmtInt(sd.goal - st)} te gaan`) : 'Vul je stappen in', done: st !== null && st >= sd.goal,
        go: "state.stepsYesterday = false; document.getElementById('dash-steps') ? (document.getElementById('dash-steps').scrollIntoView({ behavior: 'smooth', block: 'center' }), setTimeout(() => { const i = document.getElementById('steps-in'); if (i) i.focus(); }, 400)) : null" });
      const pos = getPositiveHabitsCount();
      const openH = visibleHabitKeys.filter(k => habitConfig[k].positive && !state.habits[k]).map(k => habitConfig[k].label.charAt(0) + habitConfig[k].label.slice(1).toLowerCase());
      items.push({ n: `Gewoontes ${pos} / ${visibleHabitKeys.length}`, sub: openH.length ? 'Open: ' + openH.slice(0, 3).join(', ') + (openH.length > 3 ? '…' : '') : 'Alles afgevinkt', done: pos >= 6,
        go: "document.getElementById('dash-habits') && document.getElementById('dash-habits').scrollIntoView({ behavior: 'smooth', block: 'center' })" });
      const s = sleepSettings();
      const routineN = ((s.routine || {})[sleepEveningDate()] || []).length;
      items.push({ n: 'Avondroutine & avond-journal', sub: daily.eveningAt ? `Dag afgesloten · routine ${routineN}/7` : `Scherm weg om ${min2hm(sleepBedMin() - 60)} · routine ${routineN}/7`,
        done: !!daily.eveningAt && routineN >= 5, go: daily.eveningAt ? "setSection('sleep')" : "state.jMode = 'avond'; state.journalTab = 'today'; setSection('journal')" });
      return items;
    }

    function renderYearCard() {
      const p = getProgress();
      const year = new Date().getFullYear();
      const today = todayStr();
      const byDate = {};
      p.days.forEach(d => { byDate[d.date] = d.score; });
      // reeks: dagen met dagscore 50+ achter elkaar (vandaag telt mee als hij al 50+ is)
      let cur = 0, best = 0, run = 0;
      p.days.forEach(d => { if (d.score >= 50) { run++; best = Math.max(best, run); } else if (d.date !== today) run = 0; });
      for (let i = p.days.length - 1; i >= 0; i--) {
        const d = p.days[i];
        if (d.score >= 50) cur++;
        else if (d.date === today) continue;
        else break;
      }
      const months = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      const color = s => s === undefined ? '#0d0d0d' : s >= 60 ? '#e5484d' : s >= 35 ? '#7f1d1d' : s > 0 ? '#3a1414' : '#141414';
      const rows = months.map((m, mi) => {
        const len = new Date(year, mi + 1, 0).getDate();
        let cells = '';
        for (let d = 1; d <= 31; d++) {
          if (d > len) { cells += '<i class="yr-x"></i>'; continue; }
          const ds = `${year}-${String(mi + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells += `<i style="background: ${color(byDate[ds])};${ds === today ? ' outline: 1px solid #fafafa;' : ''}" title="${d} ${m}${byDate[ds] !== undefined ? ': dagscore ' + byDate[ds] : ''}"></i>`;
        }
        return `<div class="yr-row"><span>${m}</span><div class="yr-cells">${cells}</div></div>`;
      }).join('');
      return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="label" style="margin: 0;">${year} in dagen</label>
            <span style="font-size: 11px; color: #8a8a8a;">reeks <b style="color: #fafafa;">${cur}</b> · beste <b style="color: #fafafa;">${best}</b></span>

          <div class="yr-leg"><span>Dagscore</span><i style="background: #141414;"></i><i style="background: #3a1414;"></i><i style="background: #7f1d1d;"></i><i style="background: #e5484d;"></i><span>laag → hoog · reeks = dagen met 50+</span></div>
        </div>`;
    }

    function dashMove(k, dir) {

      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];

    }
    function dashToggle(k) {
      const { order, off } = dashLayout();
      const nOff = off.includes(k) ? off.filter(x => x !== k) : [...off, k];
      saveUserPrefs({ dash: { order, off: nOff } }); render();
    }

    // ============================================
    // TIMERS: rust (training), ademhaling (Rust), koude douche (Koud)
    // De timers staan buiten de app-weergave, zodat ze blijven lopen als de pagina opnieuw tekent.
    // ============================================
    let audioCtx = null;
    function timerBeep(times) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < (times || 1); i++) {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
          const t = audioCtx.currentTime + i * 0.3;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          o.start(t); o.stop(t + 0.22);
        }
      } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    }
    function timerUnlockAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
    const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

    // ---- Rusttimer (training) ----
    let restTick = null;
    function startRest(label) {
      timerUnlockAudio();
      const sec = Number(userPrefs().rest) || 90;
      state.rest = { end: Date.now() + sec * 1000, total: sec, label: label || '' };
      drawRest();
      clearInterval(restTick);
      restTick = setInterval(drawRest, 250);
    }
    function restAdjust(d) {
      const r = state.rest; if (!r) return;
      r.end += d * 1000; r.total = Math.max(15, r.total + d);
      saveUserPrefs({ rest: Math.max(15, Math.min(600, (Number(userPrefs().rest) || 90) + d)) });
      drawRest();
    }
    function stopRest() {
      clearInterval(restTick); restTick = null; state.rest = null;
      document.body.classList.remove('rest-on');
      const el = document.getElementById('pf-rest'); if (el) el.remove();
    }
    function drawRest() {
      const r = state.rest; if (!r) return;
      let el = document.getElementById('pf-rest');
      if (!el) {
        el = document.createElement('div'); el.id = 'pf-rest'; el.setAttribute('role', 'timer');
        document.body.classList.add('rest-on');
        el.innerHTML = `<div class="rt-top"><div style="flex: 1; min-width: 0;"><div class="rt-l" id="rt-l"></div><div class="rt-t" id="rt-t"></div></div>
          <button onclick="restAdjust(-15)" aria-label="15 seconden minder">−15</button><button onclick="restAdjust(15)" aria-label="15 seconden meer">+15</button><button class="rt-skip" onclick="stopRest()">Skip</button></div>
          <div class="rt-bar"><span id="rt-b"></span></div>`;
        document.body.appendChild(el);
      }
      const left = (r.end - Date.now()) / 1000;
      if (left <= 0) {
        if (!r.doneAt) { r.doneAt = Date.now(); timerBeep(2); }
        el.classList.add('done');
        document.getElementById('rt-l').textContent = 'RUST VOORBIJ';
        document.getElementById('rt-t').textContent = 'Volgende set!';
        document.getElementById('rt-b').style.width = '100%';
        if (Date.now() - r.doneAt > 4000) stopRest();
        return;
      }
      el.classList.remove('done');
      document.getElementById('rt-l').textContent = 'RUST' + (r.label ? ' · ' + r.label : '');
      document.getElementById('rt-t').textContent = fmtClock(left);
      document.getElementById('rt-b').style.width = Math.min(100, (1 - left / r.total) * 100) + '%';
    }
    // Na het invullen van de reps van een werkset start de rust vanzelf
    function tcRepsDone(ei, si, value) {
      if (si < 1 || !String(value).trim()) return;
      const ex = state.ts && state.ts.exercises && state.ts.exercises[ei];
      startRest(ex ? ex.name + ' · set ' + si : 'set ' + si);
    }

    // ---- Ademhaling & koude douche ----
    let htTick = null;
    const breathPhases = [['Adem in', 4], ['Vasthouden', 4], ['Adem uit', 4], ['Vasthouden', 4]];
    function openHabitTimer(kind) {
      timerUnlockAudio();
      state.showHabitModal = null; render();
      const p = userPrefs();
      state.htimer = { kind, dur: kind === 'breath' ? (p.breathDur || 300) : (p.coldDur || 60), running: false, start: 0, pausedAt: 0, done: false };
      drawHabitTimer();
    }
    function htSetDur(sec) { const t = state.htimer; if (!t || t.running) return; t.dur = sec; drawHabitTimer(); }
    function htStart() {
      const t = state.htimer; if (!t) return;
      timerUnlockAudio();
      if (t.pausedAt) { t.start += Date.now() - t.pausedAt; t.pausedAt = 0; }
      else { t.start = Date.now(); saveUserPrefs(t.kind === 'breath' ? { breathDur: t.dur } : { coldDur: t.dur }); }
      t.running = true;
      clearInterval(htTick); htTick = setInterval(drawHabitTimer, 200);
      drawHabitTimer();
    }
    function htPause() { const t = state.htimer; if (!t || !t.running) return; t.running = false; t.pausedAt = Date.now(); clearInterval(htTick); drawHabitTimer(); }
    function closeHabitTimer() {
      clearInterval(htTick); htTick = null;
      const t = state.htimer;
      // koude douche: ook een onvoltooide poging telt mee als "vorige keer"
      if (t && t.kind === 'cold' && t.start && !t.done) {
        const el = Math.round(((t.pausedAt || Date.now()) - t.start) / 1000);
        if (el >= 10) { const c = userPrefs().cold || {}; saveUserPrefs({ cold: { last: el, best: Math.max(c.best || 0, el) } }); }
      }
      state.htimer = null;
      const el = document.getElementById('pf-htimer'); if (el) el.remove();
    }
    async function htFinish() {
      const t = state.htimer; if (!t || t.done) return;
      t.done = true; t.running = false; clearInterval(htTick);
      timerBeep(3);
      const key = t.kind === 'breath' ? 'meditation' : 'coldShower';
      if (t.kind === 'cold') { const c = userPrefs().cold || {}; saveUserPrefs({ cold: { last: t.dur, best: Math.max(c.best || 0, t.dur) } }); }
      if (!state.habits[key]) await toggleHabit(key);
      drawHabitTimer();
    }
    function drawHabitTimer() {
      const t = state.htimer; if (!t) return;
      let el = document.getElementById('pf-htimer');
      if (!el) { el = document.createElement('div'); el.id = 'pf-htimer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
      const elapsed = t.start ? ((t.pausedAt || Date.now()) - t.start) / 1000 : 0;
      const left = Math.max(0, t.dur - elapsed);
      if (t.running && left <= 0) { htFinish(); return; }
      const cold = t.kind === 'cold';
      const opts = cold ? [[30, '30 sec'], [60, '1 min'], [120, '2 min'], [180, '3 min']] : [[180, '3 min'], [300, '5 min'], [600, '10 min'], [900, '15 min']];
      const c = userPrefs().cold || {};
      let middle;
      if (t.done) {
        middle = `<div class="ht-done">✓</div><div class="ht-msg">${cold ? 'Klaar! Goed gedaan.' : 'Klaar. Merk hoe je je nu voelt.'}</div><div class="ht-sub">${cold ? 'Koud' : 'Rust'} is afgevinkt bij je gewoontes.</div>`;
      } else if (!cold) {
        const cyc = breathPhases.reduce((a, p) => a + p[1], 0);
        const inCyc = elapsed % cyc;
        let acc = 0, ph = breathPhases[0], phLeft = 4, phIdx = 0;
        for (let i = 0; i < breathPhases.length; i++) { if (inCyc < acc + breathPhases[i][1]) { ph = breathPhases[i]; phIdx = i; phLeft = acc + breathPhases[i][1] - inCyc; break; } acc += breathPhases[i][1]; }
        const prog = 1 - phLeft / ph[1];
        const scale = !t.start ? 0.6 : phIdx === 0 ? 0.6 + 0.4 * prog : phIdx === 1 ? 1 : phIdx === 2 ? 1 - 0.4 * prog : 0.6;
        middle = `
          <div class="ht-box"><div class="ht-sq" style="transform: scale(${scale.toFixed(3)});"></div>
            <div class="ht-in"><div class="ht-ph">${t.start ? ph[0] : 'Klaar?'}</div><div class="ht-n">${t.start ? Math.ceil(phLeft) : '4·4·4·4'}</div></div></div>
          <div class="ht-steps">${['IN 4', 'VAST 4', 'UIT 4', 'VAST 4'].map((s, i) => `<span style="color: ${t.start && i === phIdx ? '#fafafa' : '#525252'};">${s}</span>`).join('')}</div>
          <div class="ht-sub">${fmtClock(left)} over${t.start ? ' · ronde ' + (Math.floor(elapsed / cyc) + 1) : ''}</div>`;
      } else {
        middle = `
          <div class="ht-clock">${fmtClock(left)}</div>
          <div class="ht-bar"><span style="width: ${t.dur ? Math.min(100, elapsed / t.dur * 100) : 0}%;"></span></div>
          <div class="ht-sub">Rustig uitademen door je mond. Langzaam opbouwen gaat voor lang.</div>
          ${c.last ? `<div class="ht-sub" style="color: #737373;">Vorige keer: ${fmtClock(c.last)} · beste: ${fmtClock(c.best || c.last)}</div>` : ''}`;
      }
      el.className = cold ? 'cold' : 'breath';
      // Alleen het middenstuk vernieuwen zolang de knoppen hetzelfde blijven (anders mis je soms een tik)
      const struct = [t.kind, t.dur, !!t.start, t.running, !!t.pausedAt, t.done].join('|');
      const mid = document.getElementById('ht-mid');
      if (mid && el.dataset.struct === struct) { mid.innerHTML = middle; return; }
      el.dataset.struct = struct;
      el.innerHTML = `
        <div class="ht-card">
          <button class="ht-x" onclick="closeHabitTimer()" aria-label="Sluiten">✕</button>
          <div class="ht-title">${cold ? 'Koud douchen' : 'Rust · box breathing'}</div>
          ${!t.start && !t.done ? `<div class="ht-opts">${opts.map(([s, l]) => `<button class="${t.dur === s ? 'on' : ''}" onclick="htSetDur(${s})">${l}</button>`).join('')}</div>` : ''}
          <div id="ht-mid">${middle}</div>
          ${t.done ? `<button class="ht-main" onclick="closeHabitTimer()">Sluiten</button>`
            : t.running ? `<button class="ht-sec" onclick="htPause()">Pauze</button>`
            : `<button class="ht-main" onclick="htStart()">${t.pausedAt ? 'Verder' : 'Start'}</button>`}
        </div>`;
    }

    // ============================================

    // ============================================

      state.photosError = !!ph.error; state.photos = ph.error ? [] : (ph.data || []);
      const bl = await supabaseClient.from('blood_tests').select('*').eq('user_id', state.user.id).order('date', { ascending: true });
      state.bloodError = !!bl.error; state.bloodTests = bl.error ? [] : (bl.data || []);
    }
    state.photoUrls = {};
    async function photoUrlsFor(list) {
      const need = list.filter(p => p && !state.photoUrls[p.path]);
      if (!need.length) return;
      const res = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrls(need.map(p => p.path), 3600);

      render();
    }
    // Foto verkleinen (max 1080 px, jpg) zodat hij snel laadt en weinig ruimte kost
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1080, sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

          c.toBlob(b => b ? resolve(b) : reject(new Error('Kon foto niet verwerken')), 'image/jpeg', 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Dit bestand is geen foto')); };
        img.src = url;
      });

        const path = `${state.user.id}/${date}-${pose}-${Date.now()}.jpg`;
        const up = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        const ins = await supabaseClient.from('progress_photos').insert([{ user_id: state.user.id, date, pose, path }]);
        if (ins.error) throw ins.error;
        await loadPhotosAndBlood(); render(); showToast('📸 Foto opgeslagen');

    async function deletePhoto(id) {

    function photoWeight(date) {

    function renderPhotos() {
