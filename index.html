    // ============================================

    async function saveBloodTest() {

      Object.entries(f.markers).forEach(([k, m]) => { if (String(m.v).trim()) markers[k] = { v: String(m.v).trim(), unit: m.unit, lo: String(m.lo || '').trim(), hi: String(m.hi || '').trim() }; });
      f.custom.forEach(c => { if (String(c.name).trim() && String(c.v).trim()) markers['c_' + String(c.name).trim()] = { v: String(c.v).trim(), unit: c.unit, lo: String(c.lo || '').trim(), hi: String(c.hi || '').trim() }; });
      if (!Object.keys(markers).length) { alert('Vul minstens één waarde in.'); return; }
      const row = { user_id: state.user.id, date: f.date || todayStr(), markers, note: f.note || '' };

    function renderBloodForm() {

    function renderBlood() {

    }

      const L = { ...bookLessons() };
      const arr = (L[id] || ['', '', '']).slice(0, 3);
      while (arr.length < 3) arr.push('');
      arr[i] = String(v || '').trim().slice(0, 240);
      if (arr.some(Boolean)) L[id] = arr; else delete L[id];

      if (!bookById(id)) return;

      const inp = document.getElementById('del-confirm');
      if (!inp || inp.value.trim().toUpperCase() !== 'VERWIJDER') return;

      state.delBusy = true; render();
      const uid = state.user.id;
      try {
        // 1. Foto's uit de opslag (de database mag die niet zelf wissen)
        const paths = new Set((state.photos || []).map(p => p.path).filter(Boolean));
        try {
          const { data: files } = await supabaseClient.storage.from('progress-photos').list(uid, { limit: 1000 });
          (files || []).forEach(f => f && f.name && paths.add(uid + '/' + f.name));
        } catch (e) {}
        const all = [...paths];
        for (let i = 0; i < all.length; i += 100) {
          const { error } = await supabaseClient.storage.from('progress-photos').remove(all.slice(i, i + 100));
          if (error) throw new Error("Foto's wissen lukte niet: " + error.message);
        }
        // 2. Meldingen op dit toestel uit
        try { if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.ready; const sub = reg.pushManager && await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } } catch (e) {}
        // 3. Alle gegevens en het account zelf
        const { error } = await supabaseClient.rpc('delete_my_account');
        if (error) throw new Error(error.message + (/function|schema cache/i.test(error.message) ? '\n\nIs account-update.sql al uitgevoerd in Supabase?' : ''));
        // 4. Dit toestel opschonen
        try { Object.keys(localStorage).filter(k => k.startsWith('pf_') || k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
        await pfClearCache();
        state.delBusy = false;
        try { await supabaseClient.auth.signOut(); } catch (e) {}
        state.user = null; state.showPrivacy = false; authMode = 'login';
        render();
        alert('Je account en al je gegevens zijn verwijderd.');

    // ============================================
    async function loadAll() {
      await Promise.all([loadEntries(), loadRetention(), loadHabits(), loadBody(), loadTraining(), loadFood(), loadPhotosAndBlood()]);
      syncProtTarget();
      // Eén onderdeel dat faalt mag de rest van de app niet blokkeren
      try {
        await loadChallenges();
        const msgs = await settleChallenges();
        if (msgs.length) setTimeout(() => showToast(msgs[0]), 600);
      } catch (e) {
        console.error('Challenges laden mislukt:', e);
        state.challengesError = 'Challenges konden niet laden.';
      }
    }

    // Nieuwe versie online gezet? Dan een balk om bij te werken
    async function checkNewVersion() {
      if (navigator.onLine === false) return;
      try {
        const res = await realFetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
        if (!m || m[1] === APP_VERSION || document.getElementById('pf-update')) return;
        const el = document.createElement('button');
        el.id = 'pf-update';
        el.innerHTML = `Nieuwe versie (${esc(m[1])}) · <b>tik om bij te werken</b>`;
        el.onclick = () => { el.textContent = 'Bijwerken…'; location.reload(); };
        document.body.appendChild(el);
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkNewVersion(); });
    setInterval(checkNewVersion, 30 * 60 * 1000);
    setTimeout(checkNewVersion, 8000);

    async function init() {
      let { data: { session } } = await supabaseClient.auth.getSession();
      // Offline en je sessie kon niet worden ververst: toch je laatst bekende account gebruiken
      if (!session && navigator.onLine === false) {
        try { const st = JSON.parse(localStorage.getItem('sb-dgqfvyjgtkoeiyswgngs-auth-token') || 'null'); if (st && st.user) session = { user: st.user }; } catch (e) {}
      }
      
      if (session) {
        state.user = session.user;
        if (recoveryFromLink) state.recovery = true;
        else await loadAll();
      }
      
      state.loading = false;
      render();
      if (state.user && !state.recovery) gotoFromHash();
      pfBanner();
      if (state.user) setTimeout(pfFlush, 1500);
      window.addEventListener('hashchange', gotoFromHash);
      
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'TOKEN_REFRESHED') return;
        if (event === 'PASSWORD_RECOVERY') { state.user = session ? session.user : state.user; state.recovery = true; render(); return; }
        if (session) {
          state.user = session.user;
          await loadAll();
        } else {
          state.user = null;
          state.entries = [];
          state.retentionStreak = null;
          state.bodyStats = [];
      state.bodySettings = {};
      state.challenges = [];
      state.challengeLogs = [];
      state.chLogIndex = {};
      state.retentionAll = [];
      state.showRankUp = null;
      state.workouts = [];
      state.workoutSets = [];
      state.trainForm = null;
      Object.assign(state, { ts: null, tpick: {}, tswap: null, tsetup: null, tc: null, tday: null, trainView: 'list', jd: null, jMode: null });
        }
        render();
      });
    }

    init();
  </script>
</body>
