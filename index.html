    function chInfo(c) {
      if (c.kind === 'hard75') return { what: 'Zes regels per dag, 75 dagen lang, zonder uitzondering.', how: 'Vink elke regel af zodra je hem gedaan hebt. Inhalen kan alleen op dezelfde dag.', why: 'Een test van mentale hardheid: je bewijst aan jezelf dat je je aan je woord houdt.' };
      const t = chTemplate(c.template_id) || {};
      const hk = chLinkedHabit(c);
      if (hk && habitConfig[hk]) {
        const hi = habitInfo[hk];
        if (hi) {
          const strip = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\[\d+\]/g, '').replace(/\s+/g, ' ').trim();
          const hoe = (hi.sections || (hi.parts && hi.parts[0].sections) || []).find(x => x[0] === 'Hoe');
          const steps = hoe ? (hoe[1].match(/<li>(.*?)<\/li>/g) || []).slice(0, 3).map(strip).join(' ') : '';
          return { what: hi.summary, how: steps, why: 'Tik op ⓘ bij de gewoonte op je dashboard voor het waarom en de bronnen.' };
        }
        return { what: habitConfig[hk].what, how: habitConfig[hk].how, why: habitConfig[hk].why };
      }
      return { what: t.what || c.description || '', how: t.how || '', why: t.why || '' };
    }

    function chTargetFor(c, dayN) {
      const t = Number(c.target) || 0;
      const s = Number(c.step) || 0;
      return t + s * (dayN - 1);
    }

    function chUnit(c) {
      return c.unit || '';
    }

    function fmtInt(n) {
      const v = Number(n);
      if (isNaN(v)) return '—';
      return Number.isInteger(v) ? v.toLocaleString('nl-NL') : String(Math.round(v * 10) / 10).replace('.', ',');
    }

    // ============================================
    // CHALLENGES: BEREKENEN
    // ============================================
    function chLog(c, date) {
      return state.chLogIndex[c.id + '|' + date] || null;
    }

    function rebuildChLogIndex() {
      const idx = {};
      state.challengeLogs.forEach(l => { idx[l.challenge_id + '|' + l.date] = l; });
      state.chLogIndex = idx;
    }

    function habitDoneOn(key, date) {
      if (date === todayStr()) return !!state.habits[key];
      const row = state.habitHistory[date];
      return !!(row && row[key]);
    }

    // done | fail | pending (nog in te vullen: vandaag of gisteren)
    function chDayStatus(c, date, today) {
      const log = chLog(c, date);
      if (c.link === 'retention') {
        const r = state.retentionStreak;
        const failDate = !r ? today : (r.start_date > c.start_date ? r.start_date : null);
        if (failDate && date >= failDate) return 'fail';
        return 'done';
      }
      if (c.kind === 'hard75') {
        if (log && log.failed) return 'fail';
        const t = (log && log.tasks) || {};
        if (hard75Tasks.every(x => t[x.key])) return 'done';
        return date >= dateAdd(today, -1) ? 'pending' : 'fail';
      }
      if (c.kind === 'abstain') return (log && log.failed) ? 'fail' : 'done';

      let done = false;
      const hk = chLinkedHabit(c);
      if (hk) done = habitDoneOn(hk, date);
      else if (autoLinks[c.link]) done = autoLinks[c.link].done(date, c);
      else if (c.kind === 'number') done = !!log && hasValue(log.value) && Number(log.value) >= chTargetFor(c, diffDays(c.start_date, date) + 1);
      else done = !!(log && log.done);

      if (done) return 'done';
      return date >= dateAdd(today, -1) ? 'pending' : 'fail';
    }

    function evalChallenge(c) {
      const today = todayStr();
      const D = Number(c.duration) || 30;
      const S = c.start_date;
      const rule = c.link === 'retention' ? 'strict' : (c.miss_rule || 'jokers');
      const jokersTotal = rule === 'jokers' ? Math.max(1, Math.floor(D / 10)) : 0;
      const days = [];
      let used = 0, failedOn = null, doneCount = 0, missedCount = 0;

      for (let i = 0; i < D; i++) {
        const date = dateAdd(S, i);
        if (failedOn || date > today) { days.push({ n: i + 1, date, st: 'future' }); continue; }
        let st = chDayStatus(c, date, today);
        if (st === 'fail') {
          if (rule === 'continue') { st = 'missed'; missedCount++; }
          else if (rule === 'jokers' && used < jokersTotal) { used++; st = 'joker'; }
          else { failedOn = date; st = 'missed'; missedCount++; }
        }
        if (st === 'done') doneCount++;
        days.push({ n: i + 1, date, st, today: date === today });
      }

      const lastDate = dateAdd(S, D - 1);
      const passive = c.kind === 'abstain' || c.link === 'retention';
      const complete = !failedOn && (passive
        ? lastDate < today
        : days.every(d => d.st !== 'pending' && d.st !== 'future'));

      let streak = 0;
      for (let j = days.length - 1; j >= 0; j--) {
        const st = days[j].st;
        if (st === 'future' || st === 'pending') continue;
        if (st === 'done' || st === 'joker') streak++;
        else break;
      }
      let best = 0, run = 0;
      days.forEach(d => {
        if (d.st === 'done' || d.st === 'joker') { run++; best = Math.max(best, run); }
        else if (d.st === 'missed') run = 0;
      });
      const resolved = days.filter(d => d.st === 'done' || d.st === 'joker' || d.st === 'missed').length;
      const pct = resolved ? Math.round((doneCount / resolved) * 100) : 100;
      const dayNum = Math.min(D, Math.max(1, diffDays(S, today) + 1));
      const todayDay = days.find(d => d.date === today) || null;
      const yesterdayDay = days.find(d => d.date === dateAdd(today, -1)) || null;

      return { days, D, dayNum, doneCount, missedCount, failedOn, complete, rule, jokersTotal, jokersLeft: jokersTotal - used, streak, best, pct, todayDay, yesterdayDay };
    }

    function activeChallenges() {
      return state.challenges.filter(c => c.status === 'active' && c.is_active !== false);
    }

    function habitChallenge(habitKey) {
      return activeChallenges().find(c => chLinkedHabit(c) === habitKey) || null;
    }

    // ============================================
    // CHALLENGES: DATABASE
    // ============================================
    async function loadChallenges() {
      if (!state.user) return;
      const { data, error } = await supabaseClient
        .from('challenges')
        .select('*')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false });
      if (error) {
        console.error('Fout bij laden challenges:', error);
        state.challengesError = error.message;
        return;
      }
      state.challengesError = null;
      // Alleen challenges van de nieuwe versie (met een soort)
      state.challenges = (data || []).filter(c => c.kind);
      // Oudere challenges zonder koppeling krijgen de koppeling van hun sjabloon (bijv. 8 uur slaap → Slaap)
      state.challenges.forEach(c => { if (!c.link) { const t = chTemplate(c.template_id); if (t && t.link) c.link = t.link; } });

      const logs = await supabaseClient.from('challenge_logs').select('*').eq('user_id', state.user.id);
      if (logs.error) {
        console.error('challenge_logs niet beschikbaar:', logs.error);
        state.challengesError = 'De challenges-update in Supabase is nog niet uitgevoerd.';
        state.challengeLogs = [];
      } else {
        state.challengeLogs = logs.data || [];
      }
      rebuildChLogIndex();
      await loadHabitHistory();
    }

    async function loadHabitHistory() {
      // Volledige geschiedenis: nodig voor challenges, XP en dagscore
      const { data, error } = await supabaseClient
        .from('daily_habits')
        .select('*')
        .eq('user_id', state.user.id);
      if (error) { console.error('Fout bij laden habit-geschiedenis:', error); return; }
      const hist = {};
      (data || []).forEach(row => {
        const h = {};
        Object.entries(habitColumns).forEach(([key, col]) => { h[key] = !!row[col]; });
        hist[row.date] = h;
      });
      state.habitHistory = hist;
    }

    // Mislukte of voltooide challenges afronden in de database
    async function settleChallenges() {
      const messages = [];
      for (const c of activeChallenges()) {
        const ev = evalChallenge(c);
        let update = null;
        if (ev.failedOn) {
          update = { status: 'failed', is_active: false, end_reason: 'missed', ended_on: ev.failedOn, days_completed: ev.doneCount };
          messages.push(`${c.name}: dag ${diffDays(c.start_date, ev.failedOn) + 1} gemist`);
        } else if (ev.complete) {
          update = { status: 'completed', is_active: false, is_completed: true, end_reason: 'completed', ended_on: todayStr(), days_completed: ev.doneCount };
          messages.push(`🏆 ${c.name} voltooid!`);
        } else if (Number(c.days_completed) !== ev.doneCount) {
          update = { days_completed: ev.doneCount };
        }
        if (update) {
          const { error } = await supabaseClient.from('challenges').update(update).eq('id', c.id);
          if (!error) Object.assign(c, update);
          else console.error('Fout bij bijwerken challenge:', error);
        }
      }
      return messages;
    }

    async function refreshChallenges() {
      await loadChallenges();
      const msgs = await settleChallenges();
      render();
      if (msgs.length) showToast(msgs[0]);
    }

    async function setChallengeLog(c, date, patch) {
      const existing = chLog(c, date);
      const row = { challenge_id: c.id, user_id: state.user.id, date, done: false, value: null, failed: false, ...(existing ? { done: existing.done, value: existing.value, failed: existing.failed } : {}), ...patch };
      if (existing && existing.tasks && !('tasks' in patch)) row.tasks = existing.tasks;
      const { error } = await supabaseClient.from('challenge_logs').upsert(row, { onConflict: 'challenge_id,date' });
      if (error) {
        alert('Fout bij opslaan: ' + error.message + (/tasks/.test(error.message) ? '\n\nVoer eerst hard75-update.sql uit in Supabase.' : ''));
        return false;
      }
      return true;
    }

    function findChallenge(id) {
      return state.challenges.find(c => c.id === id) || null;
    }

    async function chToggle(id, date) {
      const c = findChallenge(id);
      if (!c) return;
      const hk = chLinkedHabit(c);
      if (hk) {
        if (date === todayStr()) { await toggleHabit(hk); }
        else { await setHabitForDate(hk, date, !habitDoneOn(hk, date)); }
        await refreshChallenges();
        return;
      }
      const log = chLog(c, date);
      if (await setChallengeLog(c, date, { done: !(log && log.done) })) await refreshChallenges();
    }

    async function chSetValue(id, date) {
      const c = findChallenge(id);
      const el = document.getElementById(`cv-${id}-${date}`);
      if (!c || !el || !hasValue(el.value)) return;
      const n = parseFloat(String(el.value).replace(',', '.'));
      if (isNaN(n)) { alert('Vul een getal in'); return; }
      if (await setChallengeLog(c, date, { value: n })) {
        await refreshChallenges();
        const dayN = diffDays(c.start_date, date) + 1;
        if (n >= chTargetFor(c, dayN)) showToast('✓ Doel gehaald voor vandaag');
      }
    }

    async function chFail(id) {
      const c = findChallenge(id);
      if (!c) return;
      const ev = evalChallenge(c);
      const consequence = ev.rule === 'strict' || (ev.rule === 'jokers' && ev.jokersLeft === 0)
        ? 'De challenge stopt en je kunt opnieuw beginnen.'
        : ev.rule === 'jokers' ? 'Dit kost een joker.' : 'Je reeks begint opnieuw, de challenge loopt door.';
      if (!confirm(`Vandaag niet gelukt?\n\n${consequence}`)) return;
      if (await setChallengeLog(c, todayStr(), { failed: true })) await refreshChallenges();
    }

    async function setHabitForDate(key, date, value) {
      const row = { user_id: state.user.id, date };
      row[habitColumns[key]] = value;
      const { error } = await supabaseClient.from('daily_habits').upsert(row, { onConflict: 'user_id,date' });
      if (error) { alert('Fout bij opslaan habit: ' + error.message); return; }
      state.habitHistory[date] = { ...(state.habitHistory[date] || {}), [key]: value };
    }

    async function startChallenge() {
      const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const custom = state.chSetupTemplate === 'custom';
      const t = custom ? null : chTemplate(state.chSetupTemplate);

      const name = custom ? get('cs-name').trim() : t.name;
      if (!name) { alert('Geef je challenge een naam'); return; }
      const kind = custom ? get('cs-kind') : t.kind;
      const duration = parseInt(get('cs-duration'), 10);
      if (!duration || duration < 1 || duration > 365) { alert('Kies een duur tussen 1 en 365 dagen'); return; }

      let target = null, unit = null, step = null;
      if (kind === 'number') {
        target = parseFloat(String(get('cs-target')).replace(',', '.'));
        if (isNaN(target) || target <= 0) { alert('Vul een doel per dag in'); return; }
        unit = custom ? (get('cs-unit').trim() || null) : t.unit;
        step = t && t.step ? t.step : null;
      }
      const link = t && t.link ? t.link : null;

      if (link && activeChallenges().some(c => c.link === link)) {
        alert('Je hebt al een actieve challenge die aan deze habit gekoppeld is.');
        return;
      }

      const previous = state.challenges.filter(c => c.template_id === (custom ? 'custom' : t.id) && c.name === name).length;
      const row = {
        user_id: state.user.id,
        template_id: custom ? 'custom' : t.id,
        name,
        description: custom ? null : (t.what || null),
        duration,
        start_date: (link === 'retention')
          ? [get('cs-start') || todayStr(), state.retentionStreak ? state.retentionStreak.start_date : todayStr()].sort().pop()
          : (get('cs-start') || todayStr()),
        status: 'active',
        is_active: true,
        is_completed: false,
        days_completed: 0,
        today_completed: false,
        kind,
        target,
        unit,
        step,
        link,
        miss_rule: link === 'retention' ? 'strict' : (get('cs-rule') || 'jokers'),
        why: get('cs-why').trim() || null,
        attempt: previous + 1
      };

      const btn = document.getElementById('cs-start-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Starten...'; }
      const { error } = await supabaseClient.from('challenges').insert([row]);
      if (error) {
        console.error('Fout bij starten challenge:', error);
        alert('Fout bij starten: ' + error.message + (/column/i.test(error.message) ? '\n\nVoer eerst challenges-update.sql uit in Supabase.' : ''));
        if (btn) { btn.disabled = false; btn.textContent = 'Challenge starten'; }
        return;
      }
      if (link === 'retention' && !state.retentionStreak) await startRetention();
      state.chView = 'list';
      await refreshChallenges();
      showToast('🔥 Challenge gestart: ' + name);
    }

    async function stopChallenge(id) {
      if (!confirm('Challenge stoppen? Hij komt in je geschiedenis.')) return;
      const { error } = await supabaseClient.from('challenges').update({
        status: 'failed', is_active: false, end_reason: 'stopped', ended_on: todayStr()
      }).eq('id', id);
      if (error) { alert('Fout bij stoppen: ' + error.message); return; }
      state.chView = 'list';
      await refreshChallenges();
    }

    async function restartChallenge(id) {
      const old = findChallenge(id);
      if (!old) return;
      if (old.kind === 'hard75' && hard75Active()) { alert('Je hebt al een actieve 75 Hard.'); return; }
      if (old.link && activeChallenges().some(c => c.link === old.link)) {
        alert('Je hebt al een actieve challenge die aan deze habit gekoppeld is.');
        return;
      }
      const row = {
        user_id: state.user.id, template_id: old.template_id, name: old.name, description: old.description,
        duration: old.duration, start_date: todayStr(), status: 'active', is_active: true, is_completed: false,
        days_completed: 0, today_completed: false, kind: old.kind, target: old.target, unit: old.unit, step: old.step,
        link: old.link, miss_rule: old.miss_rule, why: old.why, attempt: (Number(old.attempt) || 1) + 1
      };
      const { error } = await supabaseClient.from('challenges').insert([row]);
      if (error) { alert('Fout bij starten: ' + error.message); return; }
      await refreshChallenges();
      showToast('🔥 Poging ' + row.attempt + ' gestart');
    }

    async function deleteChallenge(id) {
      if (!confirm('Challenge definitief verwijderen uit je geschiedenis?')) return;
      await supabaseClient.from('challenge_logs').delete().eq('challenge_id', id);
      const { error } = await supabaseClient.from('challenges').delete().eq('id', id);
      if (error) { alert('Fout bij verwijderen: ' + error.message); return; }
      await refreshChallenges();
    }

      if (view === 'detail') state.chDetailId = arg;

    // RENDER: CHALLENGES
    // ============================================

      return `
        <div class="page-header">
          <div class="page-sub">Fysiek</div>

      if (state.chView === 'library') return renderChLibrary();
      if (state.chView === 'setup') return renderChSetup();

      if (state.chView === 'hard75') return renderHard75Info();

    function chCheckBox(done, onclick, label) {
      return `<button class="goal-check ${done ? 'checked' : ''}" style="width: 28px; height: 28px;" onclick="${onclick}" aria-label="${esc(label)}">${done ? '✓' : ''}</button>`;
    }

    // Eén regel in "Vandaag" (of "Gisteren nog invullen")
    function renderChActionRow(c, ev, date, isYesterday) {
      const dayN = diffDays(c.start_date, date) + 1;
      const hk = chLinkedHabit(c);
      const st = (ev.days.find(d => d.date === date) || {}).st;
      const done = st === 'done';
      const prefix = isYesterday ? '<span style="color: #eab308;">Gisteren · </span>' : '';
      const sub = `${prefix}Dag ${dayN} van ${ev.D}${ev.streak ? ' · reeks ' + ev.streak : ''}`;
      const titleLink = `onclick="chGo('detail', '${c.id}')" style="cursor: pointer;"`;

      if (c.link === 'retention') {
        return `
          <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div style="width: 28px; height: 28px; border: 1px solid #1c1c1c; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;">${getRetentionDays()}</div>
            <div style="flex: 1; min-width: 0;" ${titleLink}>
              <div style="font-size: 14px;">${esc(c.name)}</div>
              <div style="font-size: 11px; color: #8a8a8a;">Dag ${ev.dayNum} van ${ev.D} · loopt via Retention</div>
            </div>
            <button class="entry-action" onclick="setSection('retention')">Retention →</button>
          </div>`;
      }

      if (c.kind === 'abstain') {
        return `
          <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div style="width: 28px; height: 28px; border: 1px solid #1c1c1c; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;">${ev.streak}</div>
            <div style="flex: 1; min-width: 0;" ${titleLink}>
              <div style="font-size: 14px;">${esc(c.name)}</div>
              <div style="font-size: 11px; color: #8a8a8a;">${ev.streak} ${ev.streak === 1 ? 'dag' : 'dagen'} schoon · dag ${ev.dayNum} van ${ev.D}</div>
            </div>
            <button class="entry-action" onclick="chFail('${c.id}')">Niet gelukt</button>
          </div>`;
      }

      if (c.kind === 'number' && !hk && !autoLinks[c.link]) {
        const log = chLog(c, date);
        const val = log && hasValue(log.value) ? Number(log.value) : 0;
        const target = chTargetFor(c, dayN);
        const pct = Math.min(100, Math.round((val / target) * 100));
        return `
          <div style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div style="display: flex; justify-content: space-between; gap: 8px;" ${titleLink}>
              <span style="font-size: 14px;">${done ? '✓ ' : ''}${esc(c.name)}</span>
              <span style="font-size: 12px; color: ${done ? '#22c55e' : '#a3a3a3'};">${fmtInt(val)} / ${fmtInt(target)} ${esc(chUnit(c))}</span>
            </div>
            <div class="progress-bar" style="margin-top: 6px;"><div class="progress-fill" style="width: ${pct}%; background: ${done ? '#22c55e' : '#e5484d'};"></div></div>
            <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${sub}</div>
            <div class="goal-update" style="margin-top: 8px;">
              <input type="text" inputmode="decimal" autocomplete="off" class="input-sm" id="cv-${c.id}-${date}" placeholder="Totaal ${isYesterday ? 'gisteren' : 'vandaag'}" onkeydown="if(event.key === 'Enter') chSetValue('${c.id}', '${date}')">
              <button class="btn btn-secondary btn-small" onclick="chSetValue('${c.id}', '${date}')">Opslaan</button>
            </div>
          </div>`;
      }

      if (autoLinks[c.link]) {
        const al = autoLinks[c.link];
        return `
          <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
            <div class="goal-check ${done ? 'checked' : ''}" style="width: 28px; height: 28px;">${done ? '✓' : ''}</div>
            <div style="flex: 1; min-width: 0;" ${titleLink}>
              <div style="font-size: 14px;">${esc(c.name)}</div>
              <div style="font-size: 11px; color: #8a8a8a;">${sub} · via ${al.via}</div>
            </div>
            ${!done && !isYesterday ? `<button class="entry-action" onclick="${al.go}">${al.btn}</button>` : ''}
          </div>`;
      }

      return `
        <div class="subtask" style="padding: 12px 0; border-bottom: 1px solid #1c1c1c;">
          ${chCheckBox(done, `chToggle('${c.id}', '${date}')`, c.name + (done ? ' gedaan' : ' afvinken'))}
          <div style="flex: 1; min-width: 0;" ${titleLink}>
            <div style="font-size: 14px;">${esc(c.name)}</div>
            <div style="font-size: 11px; color: #8a8a8a;">${sub}${hk ? ' · telt via habit ' + habitConfig[hk].icon : ''}</div>
          </div>
        </div>`;
    }

    function chStrip(ev, count) {
      const today = todayStr();
      const cells = [];
      for (let i = count - 1; i >= 0; i--) {
        const date = dateAdd(today, -i);
        const d = ev.days.find(x => x.date === date);
        let bg = '#1c1c1c', border = 'none';
        if (d) {
          if (d.st === 'done') bg = '#22c55e';
          else if (d.st === 'joker') bg = '#eab308';
          else if (d.st === 'missed') bg = '#7f1d1d';
          if (d.today) border = '1px solid #fafafa';
        } else {
          bg = 'transparent';
        }
        cells.push(`<div style="height: 14px; background: ${bg}; border: ${border}; box-sizing: border-box;"></div>`);
      }
      return `<div style="display: grid; grid-template-columns: repeat(${count}, minmax(0, 1fr)); gap: 3px; margin-top: 12px;">${cells.join('')}</div>`;
    }

    function renderChList() {
      const h75 = hard75Active();
      const active = activeChallenges().filter(c => c.kind !== 'hard75');
      const finished = state.challenges.filter(c => c.status !== 'active' || c.is_active === false);
      const completed = finished.filter(c => c.status === 'completed').length;
      const evs = {};
      active.forEach(c => { evs[c.id] = evalChallenge(c); });
      const bestStreak = Math.max(0, ...active.map(c => evs[c.id].best), ...finished.map(c => Number(c.days_completed) || 0));

      const yesterday = dateAdd(todayStr(), -1);
      const started = active.filter(c => c.start_date <= todayStr());
      const todayRows = started.map(c => renderChActionRow(c, evs[c.id], todayStr(), false)).join('') + active.filter(c => c.start_date > todayStr()).map(c => `<div style="padding: 12px 0; border-bottom: 1px solid #1c1c1c; font-size: 13px; color: #a3a3a3;">${esc(c.name)} · start ${fmtDateShort(c.start_date)}</div>`).join('');
      const yRows = active.filter(c => {
        const ev = evs[c.id];
        return ev.yesterdayDay && ev.yesterdayDay.st === 'pending' && c.kind !== 'abstain' && c.link !== 'retention' && !autoLinks[c.link];
      }).map(c => renderChActionRow(c, evs[c.id], yesterday, true)).join('');
      const openToday = active.filter(c => evs[c.id].todayDay && evs[c.id].todayDay.st === 'pending').length;

      return `
        ${renderBodyHeader()}

        ${state.challengesError ? `
          <div class="info-box">
            <div class="info-title">⚠️ Challenges nog niet klaar</div>
            <div class="info-text">${esc(state.challengesError)} Voer challenges-update.sql uit in Supabase.</div>
          </div>
        ` : ''}

        ${h75 ? renderHard75Hero(h75) : ''}

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">${activeChallenges().length}</div><div class="stat-label">Actief</div></div>
          <div class="stat"><div class="stat-value" style="color: #22c55e;">${completed}</div><div class="stat-label">Voltooid</div></div>
          <div class="stat"><div class="stat-value">${bestStreak}d</div><div class="stat-label">Beste reeks</div></div>
        </div>

        ${active.length ? `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
              <label class="label" style="margin-bottom: 0;">Vandaag</label>
              <span style="font-size: 11px; color: #a3a3a3;">${openToday ? openToday + ' nog te doen' : 'Alles gedaan ✓'}</span>
            </div>
            ${todayRows}
            ${yRows ? `
              <div style="font-size: 10px; color: #eab308; letter-spacing: 0.1em; margin-top: 16px;">GISTEREN NOG INVULLEN</div>
              ${yRows}
            ` : ''}
          </div>

          <label class="label" style="margin-top: 8px;">Actieve challenges</label>
          ${active.map(c => {
            const ev = evs[c.id];
            return `
              <div class="goal" style="cursor: pointer;" onclick="chGo('detail', '${c.id}')">
                <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
                  <div class="goal-title" style="margin-bottom: 0;">${esc(c.name)}</div>
                  <div style="font-size: 11px; color: #a3a3a3; white-space: nowrap;">Dag ${ev.dayNum} / ${ev.D}</div>
                </div>
                <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">${chKinds[c.kind] || ''} · ${chRules[ev.rule].label}${ev.rule === 'jokers' ? ' (' + ev.jokersLeft + ' over)' : ''}</div>
                ${chStrip(ev, 14)}
                <div style="font-size: 10px; color: #8a8a8a; margin-top: 6px;">Laatste 14 dagen</div>
              </div>
            `;
          }).join('')}
        ` : `
          <div class="empty">Nog geen actieve challenges.<br><br>Kies er een uit de bibliotheek of maak je eigen.</div>
        `}

        <button class="btn btn-primary" style="width: 100%; margin: 8px 0 16px;" onclick="chGo('library')">+ Challenge kiezen</button>

        ${h75 ? '' : `<div class="card" style="border-color: #7f1d1d; cursor: pointer;" onclick="chGo('hard75')">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">OPTIONEEL · HOOFDFOCUS</div>
            <div style="font-size: 10px; color: #8a8a8a;">75 dagen</div>
          </div>
          <div style="font-size: 22px; font-weight: 300; letter-spacing: 0.08em; margin-top: 8px;">75 HARD</div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 6px;">Het zwaarste programma voor mentale hardheid. Zes dagelijkse regels, geen uitzonderingen.</div>
          <div style="font-size: 11px; color: #e5484d; margin-top: 12px;">Bekijk de uitleg →</div>
        </div>`}

        ${finished.length ? `
          <div class="card">
            <label class="label">Geschiedenis</label>
            ${finished.map(c => {
              const icon = c.status === 'completed' ? '🏆' : c.end_reason === 'stopped' ? '⏹' : '✕';
              const label = c.status === 'completed' ? 'Voltooid' : c.end_reason === 'stopped' ? 'Gestopt' : 'Gemist';
              return `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #1c1c1c;">
                  <div style="min-width: 0;">
                    <div style="font-size: 13px;">${icon} ${esc(c.name)}${Number(c.attempt) > 1 ? ` <span style="color: #8a8a8a; font-size: 11px;">· poging ${c.attempt}</span>` : ''}</div>
                    <div style="font-size: 11px; color: #8a8a8a; margin-top: 2px;">${label} · ${Number(c.days_completed) || 0} van ${c.duration} dagen${c.ended_on ? ' · ' + fmtDateShort(c.ended_on) : ''}</div>
                  </div>
                  <div style="display: flex; gap: 4px; flex-shrink: 0;">
                    ${c.status !== 'completed' ? `<button class="entry-action" onclick="restartChallenge('${c.id}')">Opnieuw</button>` : ''}
                    <button class="icon-btn" onclick="deleteChallenge('${c.id}')" title="Verwijderen">🗑️</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      `;
    }

    function renderChLibrary() {
      const d = state.chDomain;
      const list = challengeTemplates.filter(t => d === 'all' || t.domain === d);
      const activeIds = activeChallenges().map(c => c.template_id);
      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('list')">← Terug</button>
        <div style="font-size: 18px; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 12px;">KIES EEN CHALLENGE</div>

        <div class="chips">
          <button class="chip ${d === 'all' ? 'active' : ''}" onclick="setChDomain('all')">Alle</button>
          ${Object.entries(chDomains).map(([k, v]) => `<button class="chip ${d === k ? 'active' : ''}" onclick="setChDomain('${k}')">${v.icon} ${v.label}</button>`).join('')}
        </div>

        <button class="goal" style="width: 100%; text-align: left; background: transparent; border: 1px dashed #525252; color: #fafafa; font-family: inherit; cursor: pointer;" onclick="chGo('setup', 'custom')">
          <div style="font-size: 14px;">+ Eigen challenge maken</div>
          <div style="font-size: 11px; color: #8a8a8a; margin-top: 4px;">Kies zelf naam, soort, duur en regels</div>
        </button>

        ${list.map(t => {
          const info = t.link && t.link.startsWith('habit:') ? habitConfig[t.link.slice(6)] : null;
          const desc = info ? info.what : t.what;
          const running = activeIds.includes(t.id);
          return `
            <button class="goal" style="width: 100%; text-align: left; color: #fafafa; font-family: inherit; cursor: pointer; ${running ? 'opacity: 0.5;' : ''}" onclick="chGo('setup', '${t.id}')">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
                <div style="font-size: 14px; font-weight: 500;">${esc(t.name)}</div>
                <div style="font-size: 10px; color: #8a8a8a; white-space: nowrap;">${chDomains[t.domain].icon} ${chDomains[t.domain].label}</div>
              </div>
              <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin-top: 6px;">${esc(desc || '')}</div>
              <div class="goal-meta" style="margin-top: 10px;">
                <span class="badge">${chKinds[t.kind]}</span>
                <span class="badge">${t.durations.join(' · ')} dagen</span>
                ${t.link && t.link.startsWith('habit:') ? `<span class="badge">telt via habit ${habitConfig[t.link.slice(6)].icon}</span>` : ''}
                ${t.link === 'retention' ? '<span class="badge">via Retention</span>' : ''}
                ${autoLinks[t.link] ? `<span class="badge">via ${autoLinks[t.link].via}</span>` : ''}
                ${running ? '<span class="badge" style="color: #22c55e;">loopt al</span>' : ''}
              </div>
            </button>
          `;
        }).join('')}

        <div class="card" style="border-color: #7f1d1d; cursor: pointer;" onclick="chGo('hard75')">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.06em;">75 HARD</div>
            <div style="font-size: 10px; color: #e5484d;">🔥 HOOFDFOCUS</div>
          </div>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.5; margin-top: 6px;">6 regels per dag, 75 dagen lang. Uitleg lezen en starten →</div>
        </div>
      `;
    }

    function renderChSetup() {
      const custom = state.chSetupTemplate === 'custom';
      const t = custom ? null : chTemplate(state.chSetupTemplate);
      if (!custom && !t) { state.chView = 'list'; return renderChList(); }
      const info = t ? chInfo({ template_id: t.id, link: t.link }) : null;
      const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`;
      const durations = custom ? [7, 14, 21, 30, 60, 90] : t.durations;
      const defDuration = durations.includes(30) ? 30 : durations[0];
      const rule = t ? t.rule : 'jokers';
      const linkedTaken = t && t.link && activeChallenges().some(c => c.link === t.link);

      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('library')">← Terug</button>

        <div class="card card-accent">
          <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${custom ? 'EIGEN CHALLENGE' : chDomains[t.domain].label.toUpperCase() + ' · ' + chKinds[t.kind].toUpperCase()}</div>
          <div style="font-size: 22px; font-weight: 300; letter-spacing: 0.06em; margin-top: 6px;">${custom ? 'Nieuwe challenge' : esc(t.name)}</div>
          ${info && info.what ? `
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
              <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">WAT</strong> · ${esc(info.what)}</div>
              ${info.how ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">HOE</strong> · ${esc(info.how)}</div>` : ''}
              ${info.why ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">WAAROM</strong> · ${esc(info.why)}</div>` : ''}
            </div>
          ` : ''}
          ${t && t.link && t.link.startsWith('habit:') ? `<div class="info-text" style="margin-top: 12px;">🔗 Telt automatisch via je habit ${habitConfig[t.link.slice(6)].icon} ${habitConfig[t.link.slice(6)].label} op het dashboard. Je vinkt maar één keer af.</div>` : ''}
          ${t && t.link === 'retention' ? `<div class="info-text" style="margin-top: 12px;">🔗 Loopt via je Retention-streak. Reset je die, dan stopt deze challenge.</div>` : ''}
          ${t && autoLinks[t.link] ? `<div class="info-text" style="margin-top: 12px;">🔗 ${autoLinks[t.link].info}</div>` : ''}
        </div>

        ${linkedTaken ? `
          <div class="info-box"><div class="info-text">Deze challenge loopt al. Rond hem eerst af of stop hem.</div></div>
        ` : `
          <div class="card">
            ${custom ? `
              <label class="form-label" style="margin-top: 0;">Naam</label>
              <input type="text" class="form-input" id="cs-name" placeholder="Bijv. elke dag 50 squats">
              <label class="form-label">Soort</label>
              <select class="form-input" id="cs-kind" onchange="document.getElementById('cs-number').style.display = this.value === 'number' ? 'block' : 'none'">
                ${Object.entries(chKinds).map(([k, l]) => opt(k, l, 'check')).join('')}
              </select>
              <div id="cs-number" style="display: none;">
                <div class="form-row">
                  <div><label class="form-label">Doel per dag</label><input type="text" inputmode="decimal" class="form-input" id="cs-target" placeholder="50"></div>
                  <div><label class="form-label">Eenheid</label><input type="text" class="form-input" id="cs-unit" placeholder="squats"></div>
                </div>
              </div>
            ` : (t.kind === 'number' ? `
              <label class="form-label" style="margin-top: 0;">${t.step ? 'Start (dag 1)' : 'Doel per dag'} (${esc(t.unit)})</label>
              <input type="text" inputmode="decimal" class="form-input" id="cs-target" value="${t.target}">
              ${t.step ? `<div style="font-size: 10px; color: #8a8a8a; margin-top: 4px;">Elke dag ${t.step} meer.</div>` : ''}
            ` : '')}

            <label class="form-label">Duur</label>
            <select class="form-input" id="cs-duration">
              ${durations.map(n => opt(n, n + ' dagen', defDuration)).join('')}
            </select>

            ${t && t.link === 'retention' ? '' : `
              <label class="form-label">Als je een dag mist</label>
              <select class="form-input" id="cs-rule">
                ${Object.entries(chRules).map(([k, r]) => opt(k, r.label + ': ' + r.text, rule)).join('')}
              </select>
            `}

            <label class="form-label">Startdatum</label>
            <select class="form-input" id="cs-start">
              ${opt(todayStr(), 'Vandaag', todayStr())}
              ${opt(addDays(-1), 'Gisteren (al begonnen)', todayStr())}
              ${opt(addDays(1), 'Morgen', todayStr())}
            </select>

            <label class="form-label">Jouw waarom</label>
            <textarea class="form-input" id="cs-why" placeholder="Waarom doe je dit? Dit zie je terug op moeilijke dagen."></textarea>

            <button class="btn btn-primary" id="cs-start-btn" style="width: 100%; margin-top: 20px;" onclick="startChallenge()">Challenge starten</button>
          </div>
        `}
      `;
    }

    function renderChDetail() {
      const c = findChallenge(state.chDetailId);
      if (!c) { state.chView = 'list'; return renderChList(); }
      const ev = evalChallenge(c);
      const info = chInfo(c);
      const isActive = c.status === 'active' && c.is_active !== false;
      const cols = ev.D === 75 ? 15 : ev.D <= 60 ? 10 : 15;
      const cell = d => {
        let bg = '#1c1c1c', color = '#8a8a8a', extra = '';
        if (d.st === 'done') { bg = '#22c55e'; color = '#050505'; }
        else if (d.st === 'joker') { bg = '#eab308'; color = '#050505'; }
        else if (d.st === 'missed') { bg = '#7f1d1d'; color = '#fafafa'; }
        if (d.today) extra = 'outline: 2px solid #fafafa; outline-offset: 1px;';
        return `<div style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: ${ev.D > 60 ? 8 : 10}px; background: ${bg}; color: ${color}; ${extra}" title="${fmtDateLong(d.date)}">${d.n}</div>`;
      };
      const milestones = [7, 14, 21, 30, 60, 90].filter(m => m <= ev.D);
      if (!milestones.includes(ev.D)) milestones.push(ev.D);
      const today = todayStr();

      return `
        ${renderBodyHeader()}
        <button class="entry-action" style="margin-bottom: 16px;" onclick="chGo('list')">← Terug</button>

        <div style="margin-bottom: 16px;">
          <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">${(chKinds[c.kind] || '').toUpperCase()}${Number(c.attempt) > 1 ? ' · POGING ' + c.attempt : ''}</div>
          <div style="font-size: 24px; font-weight: 300; letter-spacing: 0.06em; margin-top: 4px;">${esc(c.name.toUpperCase())}</div>
        </div>

        ${c.kind === 'hard75' && isActive ? renderHard75Hero(c) : `<div class="card" style="text-align: center;">
          <div style="font-size: 64px; font-weight: 200; line-height: 1;">${isActive ? ev.dayNum : (Number(c.days_completed) || ev.doneCount)}</div>
          <div style="font-size: 11px; color: #8a8a8a; letter-spacing: 0.15em; margin-top: 8px;">${isActive ? `DAG ${ev.dayNum} VAN ${ev.D}` : (c.status === 'completed' ? 'VOLTOOID' : c.end_reason === 'stopped' ? 'GESTOPT' : 'GEMIST') + ` · ${ev.D} DAGEN`}</div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round((ev.doneCount / ev.D) * 100)}%; background: #e5484d;"></div></div>
          ${isActive && c.start_date <= today ? `<div style="text-align: left; margin-top: 12px;">${renderChActionRow(c, ev, today, false)}</div>` : ''}
          ${isActive && c.start_date > today ? `<div style="font-size: 12px; color: #a3a3a3; margin-top: 12px;">Start op ${fmtDateLong(c.start_date)}</div>` : ''}
        </div>`}

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">${ev.streak}</div><div class="stat-label">Huidige reeks</div></div>
          <div class="stat"><div class="stat-value">${ev.best}</div><div class="stat-label">Langste reeks</div></div>
          <div class="stat"><div class="stat-value">${ev.pct}%</div><div class="stat-label">Gelukt</div></div>
        </div>

        <div class="card">
          <label class="label">Kalender</label>
          <div style="display: grid; grid-template-columns: repeat(${cols}, minmax(0, 1fr)); gap: 4px;">
            ${ev.days.map(cell).join('')}
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 10px; color: #a3a3a3;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #22c55e;"></span>Gelukt</span>
            ${ev.rule === 'jokers' ? '<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #eab308;"></span>Joker</span>' : ''}
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #7f1d1d;"></span>Gemist</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #1c1c1c;"></span>Nog te gaan</span>
          </div>
        </div>

        <div class="card">
          <label class="label">Mijlpalen</label>
          <div style="display: grid; grid-template-columns: repeat(${Math.min(4, milestones.length)}, minmax(0, 1fr)); gap: 8px; text-align: center;">
            ${milestones.map(m => {
              const reached = ev.doneCount + (ev.jokersTotal - ev.jokersLeft) >= m;
              return `<div style="border: 1px solid ${reached ? '#22c55e' : '#262626'}; padding: 10px 4px;">
                <div style="font-size: 16px; color: ${reached ? '#22c55e' : '#a3a3a3'};">${m}</div>
                <div style="font-size: 9px; color: #8a8a8a; margin-top: 2px;">${reached ? 'gehaald ✓' : 'dagen'}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        ${c.why ? `
          <div class="card">
            <label class="label">Jouw waarom</label>
            <div style="font-size: 14px; font-style: italic; line-height: 1.6;">"${esc(c.why)}"</div>
          </div>
        ` : ''}

        <div class="card">
          <label class="label">Regels</label>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;"><strong style="color: #fafafa;">${chRules[ev.rule].label}:</strong> ${chRules[ev.rule].text}${ev.rule === 'jokers' ? ` Je hebt nog ${ev.jokersLeft} van ${ev.jokersTotal} ${ev.jokersTotal === 1 ? 'joker' : 'jokers'}.` : ''}</div>
          ${c.kind === 'number' && c.target ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 8px;"><strong style="color: #fafafa;">Doel:</strong> ${c.step ? `dag 1: ${fmtInt(c.target)}, elke dag ${fmtInt(c.step)} meer (vandaag ${fmtInt(chTargetFor(c, ev.dayNum))})` : fmtInt(c.target)} ${esc(chUnit(c))}</div>` : ''}
          ${c.kind === 'hard75' && c.description ? `<div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 8px;"><strong style="color: #fafafa;">Jouw dieetregels:</strong> ${esc(c.description)}</div>` : ''}
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-top: 8px;"><strong style="color: #fafafa;">Gestart:</strong> ${fmtDateLong(c.start_date)} · eindigt ${fmtDateLong(dateAdd(c.start_date, ev.D - 1))}</div>
        </div>

        ${info.what || info.how || info.why ? `
          <div class="card">

    const hard75Tasks = [

    function hard75Active() {
      return activeChallenges().find(c => c.kind === 'hard75') || null;
    }

    function hard75TasksFor(c, date) {
      const log = chLog(c, date);
      return (log && log.tasks && typeof log.tasks === 'object') ? log.tasks : {};
    }

    function hard75DoneCount(c, date) {
      const t = hard75TasksFor(c, date);
      return hard75Tasks.filter(x => t[x.key]).length;
    }

    async function hard75Toggle(id, key) {
      const c = findChallenge(id);
      if (!c) return;
      const today = todayStr();
      const tasks = { ...hard75TasksFor(c, today) };
      tasks[key] = !tasks[key];
      const ok = await setChallengeLog(c, today, { tasks, done: hard75Tasks.every(x => tasks[x.key]) });
      if (!ok) return;
      // Afgevinkt? Dan telt het ook als habit op het dashboard
      const task = hard75Tasks.find(x => x.key === key);
      if (tasks[key] && task && task.habit && !state.habits[task.habit]) await toggleHabit(task.habit);
      await refreshChallenges();
      if (hard75Tasks.every(x => tasks[x.key])) showToast(`🔥 Dag ${diffDays(c.start_date, today) + 1} van 75 voltooid`);
    }

    // Eerlijkheidscheck: gisteren niet volledig afgevinkt
    async function hard75Confirm(id, date, allDone) {
      const c = findChallenge(id);
      if (!c) return;
      if (allDone) {
        const tasks = {};
        hard75Tasks.forEach(x => { tasks[x.key] = true; });
        if (await setChallengeLog(c, date, { tasks, done: true })) await refreshChallenges();
      } else {
        if (!confirm('Eerlijk is eerlijk. Je begint opnieuw bij dag 1.\n\nDoorgaan?')) return;
        if (await setChallengeLog(c, date, { failed: true })) await refreshChallenges();
      }
    }

    async function startHard75() {
      const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const diet = get('h75-diet').trim();
      const agree = document.getElementById('h75-agree');
      if (!diet) { alert('Schrijf je dieetregels op. Daar hou je je 75 dagen aan.'); return; }
      if (!agree || !agree.checked) { alert('Vink aan dat je de hoofdregel begrijpt.'); return; }
      if (hard75Active()) { alert('Je hebt al een actieve 75 Hard.'); return; }

      const previous = state.challenges.filter(c => c.kind === 'hard75').length;
      const row = {
        user_id: state.user.id,
        template_id: 'hard75',
        name: '75 Hard',
        description: diet,
        duration: 75,
        start_date: get('h75-start') || todayStr(),
        status: 'active',
        is_active: true,
        is_completed: false,
        days_completed: 0,
        today_completed: false,
        kind: 'hard75',
        link: null,
        miss_rule: 'strict',
        why: get('h75-why').trim() || null,
        attempt: previous + 1
      };
      const btn = document.getElementById('h75-start-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Starten...'; }
      const { error } = await supabaseClient.from('challenges').insert([row]);
      if (error) {
        alert('Fout bij starten: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = '75 Hard starten'; }
        return;

      state.chView = 'list';

    };

    const positiveHabitKeys = Object.keys(habitConfig).filter(k => habitConfig[k].positive);
    const negativeHabitKeys = Object.keys(habitConfig).filter(k => !habitConfig[k].positive);

    // Rang-afbeeldingen: eigen PNG's (rank-1.png t/m rank-11.png) gaan voor de meegeleverde SVG-emblemen.
    // De app zoekt in de map 'ranks' en ook in 'ranks/ranks' (gebeurt vaak bij het uitpakken van een zip).
    // Dit wordt één keer bij het opstarten bepaald.
    let rankBase = 'ranks/';
    let rankExt = 'svg';
    (function detectRankImages() {
      const options = [
        ['ranks/', 'png'], ['ranks/ranks/', 'png'],
        ['ranks/', 'svg'], ['ranks/ranks/', 'svg']
      ];
      let i = 0;
      const tryNext = () => {
        if (i >= options.length) return;
        const [base, ext] = options[i++];
        const probe = new Image();
        probe.onload = () => {
          if (base === rankBase && ext === rankExt) return;
          rankBase = base; rankExt = ext;
          if (state.user && !state.loading) render();
        };
        probe.onerror = tryNext;
        probe.src = base + 'rank-1.' + ext;
      };
      tryNext();
    })();

    function rankImg(n, size, style) {
      // Ontbreekt één eigen PNG, dan valt alleen die terug op het embleem
      const fallback = rankExt === 'png' ? `this.onerror=null; this.src='${rankBase}rank-${n}.svg';` : '';
      return `<img src="${rankBase}rank-${n}.${rankExt}" ${fallback ? `onerror="${fallback}"` : ''} alt="" width="${size}" height="${size}" style="display: block; width: ${size}px; height: ${size}px; border-radius: 50%; object-fit: cover; ${style || ''}">`;
    }

    function weekKey(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = (d.getDay() + 6) % 7; // maandag = 0
      d.setDate(d.getDate() - day);
      return localDateStr(d);
    }

    function dateOf(ts) {
      return ts ? localDateStr(new Date(ts)) : null;
    }

    // Alles wordt berekend uit je eigen gegevens: niets apart opgeslagen, niets te sjoemelen
    let progressCache = null;
    let progressCacheKey = -1;
    let renderCount = 0;

    function getProgress() {
      if (progressCache && progressCacheKey === renderCount) return progressCache;
      progressCache = computeProgress();
      progressCacheKey = renderCount;
      return progressCache;
    }

    function computeProgress() {
      const today = todayStr();
      const hist = { ...state.habitHistory, [today]: { ...state.habits } };
      const journalDates = new Set(journaledEntries().map(e => e.date));
      const retentions = state.retentionAll || [];

      // Challenges één keer doorrekenen
      const chDays = {};       // datum -> [{done}]
      const bonusOn = {};      // datum -> extra XP (voltooide challenges)
      const failDates = new Set();
      state.challenges.forEach(c => {
        const ev = evalChallenge(c);
        const stopAt = c.ended_on || null;
        ev.days.forEach(d => {
          if (d.st === 'future') return;
          if (stopAt && d.date > stopAt) return;
          (chDays[d.date] = chDays[d.date] || []).push({ done: d.st === 'done', hard: c.kind === 'hard75' });
        });
        if (c.status === 'completed' && c.ended_on) {
          bonusOn[c.ended_on] = (bonusOn[c.ended_on] || 0) + (c.kind === 'hard75' ? XP.hard75Done : (Number(c.duration) || 0) * XP.challengeDonePerDay);
        }
        if (c.status === 'failed' && c.end_reason === 'missed' && c.ended_on) failDates.add(c.ended_on);
      });

      // Begindatum: je eerste gegevens
      const starts = [];
      Object.keys(state.habitHistory).forEach(d => starts.push(d));
      state.entries.forEach(e => starts.push(e.date));
      state.challenges.forEach(c => starts.push(c.start_date));
      retentions.forEach(r => r.start_date && starts.push(r.start_date));
      state.bodyStats.forEach(b => starts.push(b.entry_date));
      (state.workouts || []).forEach(w => starts.push(w.date));
      Object.keys(state.foodDayCounts || {}).forEach(d => starts.push(d));
      Object.keys(sleepSettings().routine || {}).forEach(d => starts.push(d));
      Object.keys(stepsData().log).forEach(d => starts.push(d));
      Object.values(bookStatus()).forEach(b => b && b.s === 'read' && starts.push(b.at));
      const first = starts.filter(Boolean).filter(d => d <= today).sort()[0] || today;

      const retentionOn = (date) => retentions.some(r => r.start_date && r.start_date <= date && (r.is_active ? date <= today : (r.end_date ? date < r.end_date : false)));
      const retentionUsedBy = (date) => retentions.some(r => r.start_date && r.start_date <= date);
      const measuredWeeks = new Set();

      const days = [];
      let total = 0, comeback = false, hadActivity = false, goodDays = 0, primalDate = null;

      const valuesDate = valuesBonusDate();
      const trainDates = new Set((state.workouts || []).map(w => w.date));
      const routine = sleepSettings().routine || {};
      const stepsLog = stepsData().log, stepsGoal = stepsData().goal;
      // Wanneer ben je elk onderdeel gaan gebruiken?
      const firstOf = arr => arr.filter(Boolean).sort()[0] || null;
      const sleepSince = firstOf(state.entries.filter(e => e.daily && e.daily.sleepMin).map(e => e.date));
      const moveSince = firstOf([...trainDates, ...Object.keys(stepsLog)]);
      const foodT = (() => { try { const t = foodTargets(); return t && t.prot ? t : null; } catch (e) { return null; } })();
      const foodSince = firstOf((state.foodLogs || []).map(l => l.date));
      const foodWindow = dateAdd(today, -120); // eiwit per dag hebben we voor de laatste 120 dagen
      const jIdx = {};
      journaledEntries().forEach(e => {
        const j = jIdx[e.date] = jIdx[e.date] || { old: false, m: false, ev: false };
        if (!e.daily) j.old = true; else { if (e.daily.morningAt) j.m = true; if (e.daily.eveningAt) j.ev = true; }
      });
      const journalPart = (date) => { const j = jIdx[date]; if (!j) return 0; if (j.old) return 1; return (j.m ? 0.5 : 0) + (j.ev ? 0.5 : 0); };
      const bookXpOn = {};
      Object.values(bookStatus()).forEach(b => { if (b && b.s === 'read' && b.at) bookXpOn[b.at] = (bookXpOn[b.at] || 0) + XP.bookRead; });
      const fastXpOn = {};
      fastData().log.forEach(x => { if (x && x.e && (new Date(x.e) - new Date(x.s)) >= (Number(x.goal) || 16) * 3600e3) fastXpOn[localDateStr(new Date(x.e))] = XP.fast; });
      const protByDate = {};
      (state.foodLogs || []).forEach(l => { protByDate[l.date] = (protByDate[l.date] || 0) + (Number(l.prot) || 0); });
      for (let date = first; date <= today; date = dateAdd(date, 1)) {
        const h = hist[date] || {};
        const pos = positiveHabitKeys.filter(k => h[k]).length;
        const neg = negativeHabitKeys.filter(k => h[k]).length;
        const journal = journalDates.has(date);
        const chs = chDays[date] || [];
        const ret = retentionOn(date);

        // Dagscore 0-100
        // Onderdelen tellen pas mee vanaf de dag dat je ze bent gaan gebruiken
        const parts = [{ w: 30, v: Math.min(pos, 6) / 6 }, { w: 15, v: journalPart(date) }];
        if (sleepSince && date >= sleepSince) { const n = sleepNight(date); parts.push({ w: 15, v: n ? (n.min >= 420 ? 1 : 0.5) : 0 }); }
        if (moveSince && date >= moveSince) parts.push({ w: 15, v: trainDates.has(date) || (stepsLog[date] !== undefined && Number(stepsLog[date]) >= stepsGoal) ? 1 : 0 });
        if (foodT && foodSince && date >= foodSince && date >= foodWindow) parts.push({ w: 10, v: (protByDate[date] || 0) >= foodT.prot ? 1 : 0 });
        if (chs.length) parts.push({ w: 15, v: chs.filter(x => x.done).length / chs.length });
        if (ret) parts.push({ w: 10, v: 1 });
        const wSum = parts.reduce((a, p) => a + p.w, 0);
        let score = Math.round(parts.reduce((a, p) => a + p.w * p.v, 0) / wSum * 100) - neg * 5;
        score = Math.max(0, Math.min(100, score));

        // XP van die dag
        let xp = pos * XP.habit + (journal ? XP.journal : 0);
        chs.forEach(x => { if (x.done) xp += x.hard ? XP.hard75Day : XP.challengeDay; });
        if (ret) xp += XP.retentionDay;
        if (trainDates.has(date)) xp += XP.training;
        if (sleepNight(date)) xp += XP.sleepLog;
        if ((routine[date] || []).length >= 5) xp += XP.sleepRoutine;
        if ((state.foodDayCounts || {})[date] >= 3) xp += XP.foodDay;
        if (stepsLog[date] !== undefined && Number(stepsLog[date]) >= stepsGoal) xp += XP.steps;
        const measured = state.bodyStats.some(b => b.entry_date === date);
        if (measured && !measuredWeeks.has(weekKey(date))) { xp += XP.measurement; measuredWeeks.add(weekKey(date)); }

        // Comeback: eerste goede dag (score 50+) na een gemiste dag of mislukte challenge telt dubbel
        let doubled = false;
        if (comeback && score >= 50) { xp *= 2; doubled = true; comeback = false; }
        xp += bonusOn[date] || 0;
        xp += bookXpOn[date] || 0;
        xp += fastXpOn[date] || 0;
        if (date === valuesDate) xp += VALUES_BONUS_XP;
        if (xp > 0) hadActivity = true;
        if ((score < 20 && hadActivity && date < today) || failDates.has(date)) comeback = true;

        if (score >= 50) { goodDays++; if (goodDays === 365 && !primalDate) primalDate = date; }
        total += xp;
        days.push({ date, xp, score, doubled, total });
      }

      // Bewijs-eisen met datum
      const createdDates = state.challenges.map(c => dateOf(c.created_at) || c.start_date).filter(Boolean).sort();
      const proof = {
        first: createdDates[0] || null,
        iron: state.challenges.filter(c => c.status === 'completed' && Number(c.duration) >= 30 && c.ended_on).map(c => c.ended_on).sort()[0] || null,
        forged: state.challenges.filter(c => c.kind === 'hard75' && c.status === 'completed' && c.ended_on).map(c => c.ended_on).sort()[0] || null,
        primal: primalDate
      };

      // Wanneer is elke rang behaald?
      const achieved = {};
      let current = 0;
      days.forEach(d => {
        for (let r = current + 1; r <= ranks.length; r++) {
          const rk = ranks[r - 1];
          if (d.total < rk.xp) break;
          if (rk.req && !(proof[rk.req] && proof[rk.req] <= d.date)) break;
          achieved[r] = d.date;
          current = r;
        }
      });
      // Eerste challenge kan vandaag pas aangemaakt zijn
      if (!current && proof.first) { achieved[1] = proof.first; current = 1; }

      const todayDay = days[days.length - 1] || { xp: 0, score: 0 };
      const next = ranks[current] || null;
      return {
        total, days, current, achieved, proof, next, goodDays,
        today: todayDay,
        comebackReady: comeback,
        week: Array.from({ length: 7 }, (_, i) => {
          const date = dateAdd(today, i - 6);
          return days.find(d => d.date === date) || { date, xp: 0, score: 0, empty: true };
        })
      };
    }

    // ============================================
    // RANG-POP-UP
    // ============================================
    function getSeenRank() {
      const s = state.bodySettings || {};
      if (s.seen_rank !== undefined && s.seen_rank !== null) return Number(s.seen_rank);
      try { const v = localStorage.getItem('pf_seen_rank'); return v === null ? null : Number(v); } catch (e) { return null; }
    }

    async function saveSeenRank(n) {
      state.bodySettings = { ...(state.bodySettings || {}), seen_rank: n };
      try { localStorage.setItem('pf_seen_rank', String(n)); } catch (e) {}
      if (state.bodySettingsMissing || !state.user) return;
      const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, seen_rank: n }, { onConflict: 'user_id' });
      if (error) console.warn('seen_rank niet opgeslagen (voer rank-update.sql uit):', error.message);
    }

    function checkRankUp() {
      if (!state.user || state.loading || state.showRankUp) return;
      const p = getProgress();
      const seen = getSeenRank();
      if (p.current > 0 && (seen === null || p.current > seen)) {
        state.showRankUp = p.current;
        saveSeenRank(p.current);
        render();
      }
    }

    function closeRankUp() {
      state.showRankUp = null;
      render();
    }

    function renderRankUp() {
      const rk = ranks[state.showRankUp - 1];
      if (!rk) return '';
      const p = getProgress();
      return `
        <div class="modal-overlay" style="background: rgba(0,0,0,0.95); z-index: 500;" onclick="if(event.target === this) closeRankUp();">
          <div style="max-width: 360px; width: 100%; text-align: center; padding: 24px;">
            <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.35em; font-weight: 600; margin-bottom: 24px;">NIEUWE RANG BEHAALD</div>
            <div style="display: flex; justify-content: center; margin-bottom: 24px;">${rankImg(rk.n, 220, 'box-shadow: 0 0 60px rgba(229,72,77,0.35);')}</div>
            <div style="font-size: 11px; color: #8a8a8a; letter-spacing: 0.2em;">RANG ${rk.n} VAN ${ranks.length}</div>
            <div style="font-size: 28px; font-weight: 300; letter-spacing: 0.08em; margin-top: 8px; text-transform: uppercase;">${rk.name}</div>
            <div style="font-size: 14px; color: #a3a3a3; line-height: 1.6; margin-top: 16px; font-style: italic;">${rk.text}</div>
            <div style="font-size: 12px; color: #8a8a8a; margin-top: 16px;">${fmtInt(p.total)} XP</div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 28px;" onclick="closeRankUp()">Verder</button>
            <button class="entry-action" style="margin-top: 12px; border: none;" onclick="state.showRankUp = null; setSection('ranks');">Bekijk alle rangen</button>
          </div>
        </div>
      `;
    }

    // ============================================
    // DASHBOARD: RANG + DAGSCORE
    // ============================================
    function scoreColor(s) {
      if (s >= 75) return '#22c55e';
      if (s >= 50) return '#a3e635';
      if (s >= 25) return '#eab308';
      return '#7f1d1d';
    }

    function renderRankCard() {
      const p = getProgress();
      const rk = p.current ? ranks[p.current - 1] : null;
      const next = p.next;
      let barPct = 100, nextText = 'Hoogste rang bereikt';
      if (next) {
        const base = rk ? rk.xp : 0;
        barPct = next.xp > base ? Math.max(0, Math.min(100, Math.round(((p.total - base) / (next.xp - base)) * 100))) : 100;
        const xpLeft = Math.max(0, next.xp - p.total);
        const reqMissing = next.req && !p.proof[next.req];
        if (!p.current) nextText = rankReqText.first + ' → The Awakening';
        else if (xpLeft > 0) nextText = `Nog ${fmtInt(xpLeft)} XP tot ${next.name}`;
        else if (reqMissing) nextText = `${next.name}: ${rankReqText[next.req].toLowerCase()}`;
        else nextText = `Bijna ${next.name}`;
        if (reqMissing && xpLeft > 0) nextText += ` · eis: ${rankReqText[next.req].toLowerCase()}`;
      }
      const dayNames = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
      const week = p.week;
      const todayScore = p.today.score || 0;

      return `
        <div class="card" style="cursor: pointer; padding: 16px;" onclick="setSection('ranks')">
          <div style="display: flex; gap: 14px; align-items: center;">
            ${rk ? rankImg(rk.n, 56) : `<div style="width: 56px; height: 56px; border-radius: 50%; border: 1px dashed #525252; flex-shrink: 0;"></div>`}
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 9px; color: #8a8a8a; letter-spacing: 0.15em;">${rk ? 'RANG ' + rk.n + ' VAN ' + ranks.length : 'NOG GEEN RANG'}</div>
              <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.04em; margin-top: 2px;">${rk ? rk.name : 'Ongesmeed'}</div>
              <div style="font-size: 11px; color: #a3a3a3; margin-top: 2px;">${fmtInt(p.total)} XP · vandaag +${fmtInt(p.today.xp || 0)}${p.today.doubled ? ' (x2)' : ''}</div>
            </div>
            <div style="text-align: center; flex-shrink: 0;">
              <div style="font-size: 26px; font-weight: 300; line-height: 1; color: ${scoreColor(todayScore)};">${todayScore}</div>
              <div style="font-size: 8px; color: #8a8a8a; letter-spacing: 0.1em; margin-top: 4px;">DAGSCORE</div>
            </div>
          </div>
          <div class="progress-bar" style="margin-top: 14px;"><div class="progress-fill" style="width: ${barPct}%; background: #e5484d;"></div></div>
          <div style="font-size: 10px; color: #8a8a8a; margin-top: 6px;">${nextText}</div>
          ${p.comebackReady ? `<div style="font-size: 11px; color: #eab308; margin-top: 10px;">🔥 Comeback: haal vandaag een dagscore van 50 en je XP telt dubbel</div>` : ''}
          ${p.today.doubled ? `<div style="font-size: 11px; color: #22c55e; margin-top: 10px;">🔥 Comeback-bonus actief: vandaag dubbele XP</div>` : ''}
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; align-items: end;">
            ${week.map(d => {
              const dn = dayNames[(new Date(d.date + 'T00:00:00').getDay() + 6) % 7];
              const h = Math.max(3, Math.round(d.score * 0.32));
              return `<div style="text-align: center;" title="${fmtDateLong(d.date)}: dagscore ${d.score}, +${d.xp} XP">
                <div style="height: 32px; display: flex; align-items: flex-end;"><div style="width: 100%; height: ${h}px; background: ${d.date === todayStr() ? '#e5484d' : d.empty ? '#141414' : (d.score >= 50 ? '#525252' : '#262626')};"></div></div>
                <div style="font-size: 8px; color: ${d.date === todayStr() ? '#fafafa' : '#8a8a8a'}; margin-top: 4px;">${dn}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ============================================
    // RANGEN-OVERZICHT
    // ============================================
    function renderRanks() {
      const p = getProgress();
      const xpRows = [
        ['Positieve habit', `+${XP.habit} per habit`],
        ['Journal-entry', `+${XP.journal} per dag`],
        ['Challenge-dag gehaald', `+${XP.challengeDay} per challenge`],
        ['Retention-dag', `+${XP.retentionDay} per dag`],
        ['Training', `+${XP.training} per dag`],
        ['Nacht ingevuld (Slaap)', `+${XP.sleepLog} per nacht`],
        ['Avondroutine 5/7 of meer', `+${XP.sleepRoutine} per avond`],
        ['Voeding: 3+ dingen gelogd', `+${XP.foodDay} per dag`],
        ['Stappendoel gehaald', `+${XP.steps} per dag`],
        ['Boek uitgelezen', `+${XP.bookRead} per boek`],
        ['Vastendoel gehaald', `+${XP.fast} per dag`],
        ['Lichaamsmeting', `+${XP.measurement} (1x per week)`],
        ['Waarden-opdracht', `+${VALUES_BONUS_XP} (eenmalig)`],
        ['75 Hard-dag volledig', `+${XP.hard75Day}`],
        ['Challenge voltooid', `+${XP.challengeDonePerDay} × aantal dagen`],
        ['75 Hard voltooid', `+${fmtInt(XP.hard75Done)}`],
        ['Comeback', 'eerste dag met score 50+ na een gemiste dag (score onder 20) of mislukte challenge: XP × 2']
      ];
      return `
        <div class="page-header">
          <div class="page-sub">Motivatie</div>
          <div class="page-title">Rangen</div>
        </div>

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">${fmtInt(p.total)}</div><div class="stat-label">Totaal XP</div></div>
          <div class="stat"><div class="stat-value">${p.current}/${ranks.length}</div><div class="stat-label">Rang</div></div>
          <div class="stat"><div class="stat-value">${p.goodDays}</div><div class="stat-label">Dagen ≥ 50</div></div>
        </div>

        ${ranks.map(rk => {
          const got = !!p.achieved[rk.n];
          const isNext = rk.n === p.current + 1;
          const filter = got ? '' : isNext ? 'filter: grayscale(1) brightness(0.6);' : 'filter: grayscale(1) brightness(0.25);';
          const xpLeft = Math.max(0, rk.xp - p.total);
          let status;
          if (got) status = `<span style="color: #22c55e;">Behaald ${fmtDateLong(p.achieved[rk.n])}</span>`;
          else {
            const bits = [];
            if (rk.n > 1 && xpLeft > 0) bits.push(`nog ${fmtInt(xpLeft)} XP`);
            if (rk.req && !p.proof[rk.req]) bits.push(rankReqText[rk.req].toLowerCase());
            if (rk.req === 'primal' && !p.proof.primal) bits[bits.length - 1] += ` (${p.goodDays}/365)`;
            status = bits.length ? bits.join(' · ') : 'eerst de vorige rang';
            status = `<span style="color: ${isNext ? '#a3a3a3' : '#525252'};">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
          }
          return `
            <div class="goal" style="display: flex; gap: 14px; align-items: center; ${got ? '' : 'opacity: ' + (isNext ? 1 : 0.8) + ';'} ${rk.n === p.current ? 'border-color: #7f1d1d;' : ''}">
              <div style="flex-shrink: 0; cursor: ${got ? 'pointer' : 'default'};" ${got ? `onclick="state.showRankUp = ${rk.n}; render();"` : ''}>${rankImg(rk.n, 64, filter)}</div>
              <div style="flex: 1; min-width: 0;">
                <div style="font-size: 9px; color: #8a8a8a; letter-spacing: 0.15em;">RANG ${rk.n}${rk.n > 1 ? ' · ' + fmtInt(rk.xp) + ' XP' : ''}${rk.n === p.current ? ' · <span style="color: #e5484d;">HUIDIG</span>' : ''}</div>
                <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.04em; margin-top: 2px; ${got || isNext ? '' : 'color: #737373;'}">${rk.name}</div>
                ${got || isNext ? `<div style="font-size: 11px; color: #a3a3a3; margin-top: 4px; line-height: 1.5; font-style: italic;">${rk.text}</div>` : ''}
                <div style="font-size: 11px; margin-top: 4px;">${status}</div>
              </div>
            </div>
          `;
        }).join('')}

        <div class="card">
          <label class="label">Hoe verdien je XP</label>
          ${xpRows.map(r => `
            <div style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #1c1c1c; font-size: 12px;">
              <span style="color: #a3a3a3;">${r[0]}</span><span style="text-align: right;">${r[1]}</span>
            </div>
          `).join('')}
          <div style="font-size: 11px; color: #8a8a8a; line-height: 1.6; margin-top: 12px;">Je verliest nooit XP. Alles wordt berekend uit wat je echt hebt gedaan, ook je dagen van vóór deze update.</div>
        </div>

        <div class="card">
          <label class="label">Dagscore</label>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.7;">

    const restoreOrder = [
      { table: 'journal_entries', key: 'id' },
      { table: 'retention', key: 'id' },
      { table: 'daily_habits', key: 'user_id,date', dropId: true },
      { table: 'goals', key: 'id' },
      { table: 'goal_subtasks', key: 'id' },
      { table: 'body_stats', key: 'id' },

    let pendingRestore = null;

    function pickRestoreFile() {
      const input = document.getElementById('restore-file');
      if (input) input.click();
    }

    function onRestoreFile(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || data.app !== 'Primal Forged' || !data.tables) throw new Error('Dit is geen Primal Forged back-up.');
          pendingRestore = data;
          state.showRestore = true;
          render();
        } catch (e) {
          alert('Kan dit bestand niet lezen: ' + e.message);
        }
      };
      reader.readAsText(file);
    }

    function renderRestoreModal() {
      const d = pendingRestore;
      if (!d) return '';
      const rows = restoreOrder
        .map(o => ({ t: o.table, n: Array.isArray(d.tables[o.table]) ? d.tables[o.table].length : 0 }))
        .filter(x => x.n > 0);
      const labels = {
        journal_entries: 'Journal-entries', retention: 'Retention-streaks', daily_habits: 'Habit-dagen', goals: 'Missies (oud)',
        goal_subtasks: 'Missie-stappen (oud)', body_stats: 'Metingen', challenges: 'Challenges', challenge_logs: 'Challenge-dagen',
        user_settings: 'Instellingen', workouts: 'Trainingen', workout_sets: 'Training-sets', food_logs: 'Voeding', progress_photos: "Foto's (alleen de lijst)", blood_tests: 'Bloedwaarden'
      };
      return `
        <div class="modal-overlay" onclick="if(event.target === this) closeRestore();">
          <div class="modal">
            <div class="modal-title" style="color: #fafafa;">Back-up terugzetten</div>
            <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-bottom: 12px;">
              Back-up van ${d.exported_at ? new Date(d.exported_at).toLocaleString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'onbekende datum'}${d.user_email ? ' · ' + esc(d.user_email) : ''}
            </div>
            ${rows.length ? rows.map(r => `
              <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1c1c1c; font-size: 13px;">
                <span style="color: #a3a3a3;">${labels[r.t] || r.t}</span><span>${r.n}</span>
              </div>
            `).join('') : '<div class="empty">Deze back-up is leeg.</div>'}
            <div class="info-box" style="margin-top: 16px;">
              <div class="info-text">Er wordt niets gewist. Wat in de back-up staat, wordt aangevuld of teruggezet naar de versie uit de back-up. Alles komt op je huidige account te staan.</div>
            </div>
            <div id="restore-progress" style="font-size: 12px; color: #a3a3a3; min-height: 18px;"></div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px;">
              <button class="btn btn-secondary" onclick="closeRestore()">Annuleren</button>
              <button class="btn btn-primary" id="restore-btn" onclick="runRestore()" ${rows.length ? '' : 'disabled'}>Terugzetten</button>
            </div>
          </div>
        </div>
      `;
    }

    function closeRestore() {
      pendingRestore = null;
      state.showRestore = false;
      render();
    }

    async function runRestore() {
      const d = pendingRestore;
      if (!d || !state.user) return;
      const btn = document.getElementById('restore-btn');
      const prog = document.getElementById('restore-progress');
      if (btn) { btn.disabled = true; btn.textContent = 'Bezig...'; }
      const done = [], failed = [];

      for (const o of restoreOrder) {
        const list = Array.isArray(d.tables[o.table]) ? d.tables[o.table] : [];
        if (!list.length) continue;
        if (prog) prog.textContent = 'Terugzetten: ' + o.table + '...';
        const rows = list.map(r => {
          const copy = { ...r, user_id: state.user.id };
          if (o.table === 'user_settings') delete copy.id;
          if (o.dropId) delete copy.id;
          return copy;
        });
        let ok = true, msg = '';
        for (let i = 0; i < rows.length; i += 500) {
          const { error } = await supabaseClient.from(o.table).upsert(rows.slice(i, i + 500), { onConflict: o.key });
          if (error) { ok = false; msg = error.message; break; }
        }
        (ok ? done : failed).push(ok ? o.table : `${o.table}: ${msg}`);
      }

      pendingRestore = null;
      state.showRestore = false;
      await loadAll();
      render();
      if (failed.length) alert('Terugzetten klaar, maar niet alles lukte:\n\n' + failed.join('\n') + '\n\nDe rest is wel teruggezet.');
      else showToast('✓ Back-up teruggezet');
    }

    const exerciseSuggestions = [
      'Bankdrukken', 'Squat', 'Deadlift', 'Overhead press', 'Barbell row', 'Pull-ups', 'Chin-ups', 'Dips', 'Push-ups',
      'Incline dumbbell press', 'Dumbbell schouderpress', 'Lat pulldown', 'Cable row', 'Romanian deadlift', 'Lunges',
      'Bulgarian split squat', 'Hip thrust', 'Leg press', 'Leg curl', 'Leg extension', 'Calf raises', 'Biceps curl',
