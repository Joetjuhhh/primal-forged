          `).join('')}
          <div style="font-size: 10px; color: #8a8a8a; line-height: 1.6; margin-top: 12px;">Geschat 1RM = wat je ongeveer 1 keer zou kunnen tillen, berekend uit je beste set (formule van Epley).</div>
        </div>
      `;
    }

              <div style="display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 8px; align-items: center; margin-top: 12px; font-size: 9px; color: #8a8a8a; letter-spacing: 0.1em;">

              ${ex.sets.map((s, j) => `

                  <input type="text" inputmode="numeric" class="input-sm" value="${esc(s.reps)}" placeholder="reps" oninput="tfSet(${i}, ${j}, 'reps', this.value)" aria-label="Reps set ${j + 1}">

    // ============================================
    // WEEKRAPPORT
    // ============================================
    const weekQuestions = [
      'Wat was je grootste overwinning deze week, en hoe herhaal je die?',
      'Welke habit liet je het vaakst liggen, en wat hield je tegen?',
      'Op welk moment was je deze week het sterkst? Wat deed je toen anders?',
      'Wat ga je volgende week bewust anders doen? Eén ding.',
      'Waar ben je deze week trots op dat niemand anders heeft gezien?',
      'Welke situatie kostte je deze week de meeste energie, en hoe bereid je je erop voor?',
      'Als je deze week een cijfer geeft voor discipline: welk cijfer, en wat maakt het één punt hoger?',
      'Wie of wat heeft je deze week geholpen, en hoe kun je daar meer van krijgen?'
    ];

    function isoWeekNumber(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const jan4 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    }

    function computeWeek(offset) {
      const p = getProgress();
      const today = todayStr();
      const start = dateAdd(weekKey(today), -7 * offset);
      const end = dateAdd(start, 6);
      const last = end < today ? end : today;
      const inWeek = d => d >= start && d <= last;
      const dayMap = {};
      p.days.forEach(d => { dayMap[d.date] = d; });

      const days = [];
      for (let d = start; d <= end; d = dateAdd(d, 1)) {
        days.push({ date: d, future: d > today, ...(dayMap[d] || { xp: 0, score: 0 }) });
      }
      // Dagen vóór je eerste gegevens tellen niet mee
      const firstDate = p.days.length ? p.days[0].date : today;
      days.forEach(d => { d.before = d.date < firstDate; });
      const past = days.filter(d => !d.future && !d.before);
      const avg = past.length ? Math.round(past.reduce((a, d) => a + (d.score || 0), 0) / past.length) : 0;
      const xp = past.reduce((a, d) => a + (d.xp || 0), 0);
      const best = past.reduce((b, d) => (!b || d.score > b.score ? d : b), null);

      // Habits: hoe vaak per habit
      const hist = { ...state.habitHistory, [today]: { ...state.habits } };
      const habitCounts = visibleHabitKeys.map(k => ({ k, n: past.filter(d => hist[d.date] && hist[d.date][k]).length }))
        .sort((a, b) => b.n - a.n);
      const negCount = negativeHabitKeys.reduce((a, k) => a + past.filter(d => hist[d.date] && hist[d.date][k]).length, 0);

      // Challenges
      let chDone = 0, chTotal = 0;
      const completed = [], failed = [];
      state.challenges.forEach(c => {
        const ev = evalChallenge(c);
        ev.days.forEach(d => {
          if (!inWeek(d.date) || d.st === 'future' || d.st === 'pending') return;
          if (c.ended_on && d.date > c.ended_on) return;
          chTotal++;
          if (d.st === 'done') chDone++;
        });
        if (c.ended_on && inWeek(c.ended_on)) (c.status === 'completed' ? completed : failed).push(c.name);
      });

      const workouts = (state.workouts || []).filter(w => inWeek(w.date));
      const minutes = workouts.reduce((a, w) => a + (Number(w.duration_min) || 0), 0);
      const journals = state.entries.filter(e => inWeek(e.date)).length;

      // Gewicht: laatste meting tot en met deze week vs. laatste meting daarvoor
      const wl = bodyEntriesFor('weight');
      const wNow = wl.filter(x => x.date <= last).pop() || null;
      const wPrev = wl.filter(x => x.date < start).pop() || null;
      const weightDelta = (wNow && wPrev && wNow.date >= start) ? Math.round((wNow.value - wPrev.value) * 10) / 10 : null;

      return { offset, start, end, days, past, avg, xp, best, habitCounts, negCount, chDone, chTotal, completed, failed, workouts, minutes, journals, wNow, weightDelta, week: isoWeekNumber(start) };
    }

    function deltaBadge(now, prev, unit) {
      if (prev === null || prev === undefined) return '';
      const d = now - prev;
      if (!d) return `<span style="color: #8a8a8a; font-size: 11px;">= vorige week</span>`;
      return `<span style="color: ${d > 0 ? '#22c55e' : '#eab308'}; font-size: 11px;">${d > 0 ? '+' : ''}${fmtInt(d)}${unit || ''} t.o.v. vorige week</span>`;
    }

    function writeWeekReflection(q, week) {
      state.content = `Weekreflectie week ${week}\n${q}\n\n`;
      state.editingId = null;
      state.journalTab = 'new';
      setSection('journal');
    }

    function setWeekOffset(o) {
      state.weekOffset = Math.max(0, o);
      render();
    }

    function renderWeek() {
      const w = computeWeek(state.weekOffset || 0);
      const prev = computeWeek((state.weekOffset || 0) + 1);
      const isCurrent = w.offset === 0;
      const q = weekQuestions[w.week % weekQuestions.length];
      const dayNames = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
      const hasPrevData = prev.past.some(d => d.xp > 0 || d.score > 0);

      return `
        <div class="page-header">
          <div class="page-sub">Weekrapport</div>
          <div class="page-title">Week ${w.week}</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <button class="entry-action" onclick="setWeekOffset(${w.offset + 1})">← Vorige</button>
          <div style="font-size: 12px; color: #a3a3a3;">${fmtDateShort(w.start)} – ${fmtDateShort(w.end)}${isCurrent ? ' · lopend' : ''}</div>
          <button class="entry-action" ${isCurrent ? 'disabled style="opacity: 0.3;"' : ''} onclick="setWeekOffset(${w.offset - 1})">Volgende →</button>
        </div>

        <div class="card" style="text-align: center;">
          <div style="font-size: 10px; color: #8a8a8a; letter-spacing: 0.15em;">GEMIDDELDE DAGSCORE</div>
          <div style="font-size: 56px; font-weight: 200; line-height: 1.1; color: ${scoreColor(w.avg)};">${w.avg}</div>
          <div>${hasPrevData ? deltaBadge(w.avg, prev.avg) : ''}</div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 20px; align-items: end;">
            ${w.days.map((d, i) => `
              <div title="${fmtDateLong(d.date)}: ${d.future ? 'nog niet' : 'dagscore ' + d.score + ', +' + d.xp + ' XP'}">
                <div style="font-size: 10px; color: #a3a3a3; margin-bottom: 4px;">${d.future || d.before ? '' : d.score}</div>
                <div style="height: 48px; display: flex; align-items: flex-end;"><div style="width: 100%; height: ${d.future || d.before ? 2 : Math.max(3, Math.round(d.score * 0.48))}px; background: ${d.future || d.before ? '#141414' : (w.best && d.date === w.best.date ? '#e5484d' : (d.score >= 50 ? '#525252' : '#262626'))};"></div></div>
                <div style="font-size: 9px; color: #8a8a8a; margin-top: 4px;">${dayNames[i]}</div>
              </div>
            `).join('')}
          </div>
          ${w.best && w.best.score ? `<div style="font-size: 11px; color: #a3a3a3; margin-top: 12px;">Beste dag: ${fmtDateLong(w.best.date)} (${w.best.score})</div>` : ''}
        </div>

        <div class="stats" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat"><div class="stat-value">+${fmtInt(w.xp)}</div><div class="stat-label">XP</div></div>
          <div class="stat"><div class="stat-value">${w.workouts.length}</div><div class="stat-label">Trainingen</div></div>
          <div class="stat"><div class="stat-value">${w.journals}</div><div class="stat-label">Journal</div></div>
        </div>
        ${hasPrevData ? `<div style="font-size: 11px; text-align: center; margin: -12px 0 16px;">${deltaBadge(w.xp, prev.xp, ' XP')}</div>` : ''}

        <div class="card">
          <label class="label">Habits deze week</label>
          ${w.habitCounts.map(h => `
            <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0;">
              <span style="width: 24px; text-align: center;">${habitConfig[h.k].icon}</span>
              <span style="flex: 1; font-size: 12px; color: #a3a3a3;">${habitConfig[h.k].title}</span>
              <div style="display: flex; gap: 3px;">
                ${w.days.map(d => {
                  const hist = d.date === todayStr() ? state.habits : (state.habitHistory[d.date] || {});
                  return `<span style="width: 10px; height: 10px; background: ${d.future || d.before ? '#141414' : (hist[h.k] ? '#22c55e' : '#262626')};"></span>`;
                }).join('')}
              </div>
              <span style="width: 28px; text-align: right; font-size: 12px;">${h.n}/${w.past.length}</span>
            </div>
          `).join('')}

        </div>

        <div class="card">
          <label class="label">Challenges & lichaam</label>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Challenge-dagen gehaald</span><span>${w.chTotal ? w.chDone + ' van ' + w.chTotal : '—'}</span></div>
          ${w.completed.length ? `<div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Voltooid</span><span style="color: #22c55e;">🏆 ${w.completed.map(esc).join(', ')}</span></div>` : ''}
          ${w.failed.length ? `<div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Gestopt of gemist</span><span>${w.failed.map(esc).join(', ')}</span></div>` : ''}
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Trainingstijd</span><span>${w.minutes ? w.minutes + ' min' : (w.workouts.length ? w.workouts.length + ' trainingen' : '—')}</span></div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px;"><span style="color: #a3a3a3;">Gewicht</span><span>${w.wNow ? fmtVal(w.wNow.value) + ' kg' + (w.weightDelta !== null ? ` (${w.weightDelta > 0 ? '+' : ''}${fmtVal(w.weightDelta)})` : '') : '—'}</span></div>
        </div>

        <div class="prompt">
          <div class="prompt-label">📝 Vraag voor deze week</div>
          <div class="prompt-text">"${q}"</div>
          <button class="btn btn-secondary btn-small" style="margin-top: 12px;" onclick="writeWeekReflection(${esc(JSON.stringify(q))}, ${w.week})">Beantwoord in Journal</button>
        </div>

        <button class="btn btn-secondary" style="width: 100%;" onclick="setSection('dashboard')">← Terug naar dashboard</button>
      `;
    }

    // Dashboardkaart: zondag de lopende week, maandag de afgelopen week
    function renderWeekTeaser() {
      const dow = new Date().getDay(); // 0 = zondag, 1 = maandag
      if (dow !== 0 && dow !== 1) return '';
      const offset = dow === 1 ? 1 : 0;
      const w = computeWeek(offset);
      if (!w.past.some(d => d.xp > 0)) return '';
      return `
        <div class="card card-accent" style="cursor: pointer;" onclick="state.weekOffset = ${offset}; setSection('week');">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
            <div>
              <div style="font-size: 10px; color: #e5484d; letter-spacing: 0.2em; font-weight: 600;">📊 WEEKRAPPORT · WEEK ${w.week}</div>
              <div style="font-size: 13px; margin-top: 6px;">Gem. dagscore ${w.avg} · +${fmtInt(w.xp)} XP · ${w.workouts.length} ${w.workouts.length === 1 ? 'training' : 'trainingen'}</div>
            </div>
            <div style="font-size: 18px; color: #8a8a8a;">→</div>
          </div>
        </div>
      `;
    }

    // ============================================
    // RENDER: RETENTION
    // ============================================
    function renderRetention() {
      const days = getRetentionDays();
      const phase = getRetentionPhase(days);
      const nextMilestone = getNextMilestone(days);
      const progress = nextMilestone ? (days / nextMilestone.days) * 100 : 100;
      
      return `
        <div class="page-header">
          <div class="page-sub">Discipline</div>
          <div class="page-title">Retention</div>
        </div>
        
        ${state.retentionStreak ? `
          <div class="card" style="text-align: center;">
            <div class="streak-big">
              <div class="streak-number" style="color: ${phase.color}">${days}</div>
              <div class="streak-label">Dagen Streak</div>
            </div>
            <div class="phase-indicator" style="background: ${phase.color}20; border: 1px solid ${phase.color}50;">
              <div class="phase-name" style="color: ${phase.color}">Fase: ${phase.name}</div>
            </div>
            ${nextMilestone && days < nextMilestone.days ? `
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%; background: ${phase.color};"></div>
              </div>
              <div style="font-size: 10px; color: #525252; margin-top: 8px;">
                Nog ${nextMilestone.days - days} dagen tot ${nextMilestone.title}
              </div>

    // Thema volgt de weekdag; binnen het thema schuift de vraag elke week één plek op
    function journalPromptFor(dateStr, swap) {
      const d = new Date(dateStr + 'T12:00:00');
      const wd = (d.getDay() + 6) % 7;
      const theme = journalThemes[wd];
      const week = Math.floor((d - new Date('2024-01-01T12:00:00')) / (7 * 86400000));
      const idx = ((week + (swap ? 25 : 0)) % theme.q.length + theme.q.length) % theme.q.length;
      return { theme: theme.name, day: theme.day, text: theme.q[idx] };
    }

    // ============================================
    // JOURNAL: VANDAAG (ochtend & avond)
    // ============================================
    function todayJournalEntry() {
      const t = todayStr();
      return state.entries.find(e => e.date === t && e.daily) || null;
    }
    function yesterdayJournalEntry() {
      const y = dateAdd(todayStr(), -1);
      return state.entries.find(e => e.date === y && e.daily) || null;
    }
    function jdInit() {
      const t = todayStr();
      if (state.jd && state.jd.date === t) return state.jd;
      const e = todayJournalEntry();
      const d = (e && e.daily) || {};
      state.jd = {
        date: t, id: e ? e.id : null,
        bed: d.bed || '', wake: d.wake || '',
        goals: d.goals || '', goalsDone: d.goalsDone || [],
        gratitude: d.gratitude || '', answer: d.answer || '', win: d.win || '',
        tomorrow: d.tomorrow || '', hard: d.hard || '', free: (e && e.content) || '',
        swap: !!d.swap, morningAt: d.morningAt || null, eveningAt: d.eveningAt || null,
        sleep: e && e.sleep_quality ? e.sleep_quality : 7, energy: e && e.energy ? e.energy : 7,
        mood: e && e.mood ? e.mood : 7, focus: e && e.focus ? e.focus : 7,
        stress: e && e.stress ? e.stress : 4, libido: e && e.libido ? e.libido : 7
      };
      if (!state.jMode) state.jMode = (state.jd.morningAt && !state.jd.eveningAt) || new Date().getHours() >= 15 ? 'avond' : 'ochtend';
      return state.jd;
    }
    function jSet(field, value) { if (state.jd) state.jd[field] = value; }
    function jSlider(field, value) {
      if (!state.jd) return;
      state.jd[field] = parseInt(value);
      const el = document.getElementById('jv-' + field);
      if (el) { el.textContent = value; el.style.color = getColor(parseInt(value), field === 'stress'); }
    }
    function jSleepCalc() {
      const jd = state.jd; if (!jd || !jd.bed || !jd.wake) return null;
      const [bh, bm] = jd.bed.split(':').map(Number), [wh, wm] = jd.wake.split(':').map(Number);
      if ([bh, bm, wh, wm].some(isNaN)) return null;
      let min = (wh * 60 + wm) - (bh * 60 + bm);
      if (min <= 0) min += 24 * 60;
      return min;
    }
    function jSleepText() {
      const m = jSleepCalc();
      return m === null ? 'Vul je tijden in' : `${Math.floor(m / 60)} u ${String(m % 60).padStart(2, '0')} min geslapen`;
    }
    function jTime(field, value) {
      jSet(field, value);
      const el = document.getElementById('j-sleeptxt');
      if (el) { el.textContent = jSleepText(); el.style.color = jSleepCalc() !== null && jSleepCalc() >= 420 ? '#22c55e' : '#a3a3a3'; }
    }
    function jGoalList(text) {
      return String(text || '').split('\n').map(l => l.replace(/^\s*\d+\s*[.)\-:]\s*/, '').trim()).filter(Boolean).slice(0, 5);
    }
    function jGoalToggle(i, checked) {
      const jd = state.jd; if (!jd) return;
      const n = jGoalList(jd.goals).length;
      jd.goalsDone = Array.from({ length: n }, (_, k) => k === i ? checked : !!jd.goalsDone[k]);
      const done = jd.goalsDone.filter(Boolean).length;
      const el = document.getElementById('j-goalscore'); if (el) el.textContent = `${done} / ${n}`;
      const row = document.getElementById('j-goal-' + i); if (row) row.classList.toggle('done', checked);
    }
    function jSwapPrompt() { if (state.jd) { state.jd.swap = !state.jd.swap; render(); } }
    function setJMode(m) { state.jMode = m; render(); window.scrollTo(0, 0); }

    async function saveJournalDay(part) {
      if (!state.user) return;
      const jd = jdInit();
      document.querySelectorAll('[data-jf]').forEach(el => { jd[el.dataset.jf] = el.value; });
      const now = new Date().toISOString();
      if (part === 'ochtend') {
        if (!jGoalList(jd.goals).length) { alert('Schrijf minstens één ding op dat je vandaag wilt waarmaken.'); return; }
        jd.morningAt = jd.morningAt || now;
      } else {
        if (!jd.gratitude.trim() && !jd.answer.trim() && !jd.win.trim()) { alert('Vul minstens je dankbaarheid, de vraag of je overwinning in.'); return; }
        jd.eveningAt = jd.eveningAt || now;
      }
      const prompt = journalPromptFor(jd.date, jd.swap);
      const daily = {
        bed: jd.bed, wake: jd.wake, sleepMin: jSleepCalc(), goals: jd.goals, goalsDone: jd.goalsDone,
        gratitude: jd.gratitude, prompt: prompt.text, theme: prompt.theme, answer: jd.answer, win: jd.win,
        tomorrow: jd.tomorrow, hard: jd.hard, swap: jd.swap, morningAt: jd.morningAt, eveningAt: jd.eveningAt
      };
      const row = { user_id: state.user.id, date: jd.date, daily, content: jd.free || '', habits: { ...state.habits }, energy: jd.energy, sleep_quality: jd.sleep };
      if (jd.eveningAt) Object.assign(row, { mood: jd.mood, focus: jd.focus, stress: jd.stress, libido: jd.libido });
      const btn = document.getElementById('j-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }
      let res;
      if (jd.id) res = await supabaseClient.from('journal_entries').update(row).eq('id', jd.id);
      else {
        res = await supabaseClient.from('journal_entries').insert([row]).select().single();
        if (!res.error && res.data) jd.id = res.data.id;
      }
      if (res.error) {
        if (btn) { btn.disabled = false; btn.textContent = part === 'ochtend' ? 'Ochtend opslaan' : 'Dag afsluiten'; }
        alert('Fout bij opslaan: ' + res.error.message + (/daily/.test(res.error.message) ? '\n\nVoer eerst journal-update.sql uit in Supabase.' : ''));
        return;
      }
      await loadEntries();
      state.jd = null; jdInit();
      if (part === 'ochtend') state.jMode = 'avond';
      render();
      window.scrollTo(0, 0);
      showToast(part === 'ochtend' ? '☀️ Ochtend opgeslagen · tot vanavond' : '🌙 Dag afgesloten');
    }

        `;
      }

      const prompt = journalPromptFor(jd.date, jd.swap);
      const goals = jGoalList(jd.goals);
      const done = goals.filter((g, i) => jd.goalsDone[i]).length;
      return `

          <button class="tab ${state.journalTab === 'new' ? 'active' : ''}" onclick="setJournalTab('new')">Vandaag</button>
          <button class="tab ${state.journalTab === 'history' ? 'active' : ''}" onclick="setJournalTab('history')">Geschiedenis</button>
          <button class="tab ${state.journalTab === 'patterns' ? 'active' : ''}" onclick="setJournalTab('patterns')">Patronen</button>
        </div>
        
        ${state.journalTab === 'new' ? (state.editingId ? renderNewEntry() : renderJournalToday()) : ''}
        ${state.journalTab === 'history' ? renderHistory() : ''}
        ${state.journalTab === 'patterns' ? renderPatterns() : ''}
      `;
    }

    function renderNewEntry() {
      const prompt = getDailyPrompt();
      return `
        ${state.editingId ? `
          <div class="card card-accent">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 12px; color: #7f1d1d;">✏️ Je bewerkt een entry</span>
              <button onclick="state.editingId = null; state.content = ''; render();" style="background: transparent; border: none; color: #525252; font-size: 11px; cursor: pointer;">Annuleer</button>
            </div>
          </div>
        ` : `
          <div class="prompt">
            <div class="prompt-label">📝 Vraag van vandaag</div>
            <div class="prompt-text">"${prompt}"</div>
          </div>
        `}
        
        <div class="card">
          <label class="label">Schrijf je gedachten</label>
          <textarea class="textarea" id="entry-content" placeholder="Wat houdt je bezig?">${state.content}</textarea>
        </div>
        
        <div class="card">
          <label class="label">Hoe voel je je?</label>
          ${['mood', 'energy', 'libido', 'focus', 'stress', 'sleep'].map(key => {
            const icons = { mood: '😊', energy: '⚡', libido: '🔥', focus: '🧠', stress: '😰', sleep: '😴' };
            const labels = { mood: 'Stemming', energy: 'Energie', libido: 'Libido', focus: 'Focus', stress: 'Stress', sleep: 'Slaap' };
            const value = state[key];
            const isStress = key === 'stress';
            return `
              <div class="slider-group">
                <div class="slider-header">
                  <span class="slider-label">${icons[key]} ${labels[key]}</span>
                  <span class="slider-value" id="${key}-value" style="color: ${getColor(value, isStress)}">${value}</span>
                </div>
                <input type="range" class="slider ${isStress ? 'slider-stress' : ''}" min="1" max="10" value="${value}" oninput="updateSlider('${key}', this.value)">
              </div>
            `;
          }).join('')}
        </div>
        
        <div class="card">
          <label class="label">Vandaag's Habits</label>
          <div class="info-box" style="margin-bottom: 12px;">
            <div class="info-text">💡 Habits worden automatisch gekoppeld aan je journal entry</div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            ${visibleHabitKeys.map(key => [key, habitConfig[key]]).map(([key, cfg]) => `
              <span style="padding: 6px 10px; font-size: 11px; background: ${state.habits[key] ? (cfg.positive ? 'rgba(34,197,94,0.1)' : 'rgba(234,179,8,0.1)') : '#0a0a0a'}; border: 1px solid ${state.habits[key] ? (cfg.positive ? '#22c55e' : '#eab308') : '#1c1c1c'}; color: ${state.habits[key] ? (cfg.positive ? '#22c55e' : '#eab308') : '#525252'};">
                ${cfg.icon} ${cfg.label}
              </span>
            `).join('')}
          </div>
          <div style="margin-top: 12px; font-size: 11px; color: #525252;">
            <a href="#" onclick="setSection('dashboard'); return false;" style="color: #7f1d1d;">→ Habits aanpassen op Dashboard</a>
          </div>
        </div>
        
        <div style="display: flex; justify-content: space-between;">
          <button class="btn btn-secondary" onclick="state.content = ''; render();">Reset</button>
          <button class="btn btn-primary" onclick="saveEntry()">${state.editingId ? 'Bijwerken' : 'Opslaan'}</button>
        </div>
      `;
    }

    function renderHistory() {
      if (state.entries.length === 0) {
        return `<div class="empty">Nog geen entries. Begin met schrijven!</div>`;
      }
      return state.entries.map(entry => entry.daily ? renderDailyEntry(entry) : `
        <div class="entry">
          <div class="entry-date">${formatDate(entry.date)}</div>
          <div class="entry-scores">
            <span class="entry-score" style="color: ${getColor(entry.mood)}">😊 ${entry.mood}</span>
            <span class="entry-score" style="color: ${getColor(entry.energy)}">⚡ ${entry.energy}</span>
            <span class="entry-score" style="color: ${getColor(entry.libido)}">🔥 ${entry.libido}</span>
            <span class="entry-score" style="color: ${getColor(entry.focus)}">🧠 ${entry.focus}</span>
          </div>
          ${entry.content ? `<div class="entry-content">${esc(entry.content.substring(0, 200))}${entry.content.length > 200 ? '...' : ''}</div>` : ''}
          ${entry.habits ? `
            <div class="entry-habits">
              ${Object.entries(entry.habits).filter(([k, v]) => v && habitConfig[k]).map(([k, v]) => {
                const cfg = habitConfig[k];
                return `<span class="entry-habit" style="background: ${cfg.positive ? 'rgba(34,197,94,0.1)' : 'rgba(234,179,8,0.1)'}; color: ${cfg.positive ? '#22c55e' : '#eab308'};">${cfg.icon} ${cfg.label}</span>`;
              }).join('')}
            </div>
          ` : ''}
          <div class="entry-actions">
            <button class="entry-action" onclick="editEntryById('${entry.id}')">✏️ Bewerken</button>
            <button class="entry-action delete" onclick="deleteEntry('${entry.id}')">🗑️ Verwijderen</button>
          </div>
        </div>
      `).join('');
    }

    function editEntryById(id) {
      const entry = state.entries.find(e => e.id === id);
      if (entry) editEntry(entry);
    }

    function renderPatterns() {
      const insights = getInsights();
      const entriesWithHabits = state.entries.filter(e => e.habits && Object.keys(e.habits).length > 0 && e.mood);
      
      let html = `
        <div class="info-box">
          <div class="info-title">📊 Hoe werkt dit?</div>
          <div class="info-text">De app analyseert welke habits correleren met hogere of lagere mood/energie scores. Hoe meer data, hoe accurater de patronen.</div>
        </div>
      `;
      
      if (entriesWithHabits.length < 3) {
        html += `<div class="empty">Log minimaal 3 entries MET habits om patronen te zien.<br><br>💡 Tip: Vink habits af op Dashboard vóórdat je een journal entry maakt!</div>`;
      } else if (insights.length === 0) {
        html += `<div class="empty">Nog geen duidelijke patronen gevonden.<br><br>Je hebt ${entriesWithHabits.length} entries met habits. Blijf consistent loggen voor betere inzichten!</div>`;
      } else {
        html += insights.map(insight => `
          <div class="insight ${insight.positive ? 'insight-positive' : 'insight-negative'}">
            <div class="insight-icon">${insight.icon}</div>
            <div>
              <div class="insight-title">${insight.title}</div>
              <div class="insight-text">${insight.text}</div>
            </div>
          </div>
        `).join('');
      }
      return html;
    }

    // ============================================
    // RENDER: MORE
    // ============================================
    function renderMore() {
      const since = daysSinceBackup();
      const last = getLastBackup();
      const backupText = last
        ? `Laatste back-up: ${new Date(last).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' })}${since > 0 ? ` (${since} dagen geleden)` : ' (vandaag)'}`
        : 'Nog geen back-up gemaakt op dit apparaat.';
      const backupColor = (since === null || since > 30) ? '#eab308' : '#22c55e';
      return `
        <div class="page-header">
          <div class="page-sub">Extra</div>
          <div class="page-title">Meer</div>
        </div>
        
        <div class="card card-accent">
          <label class="label">💾 Back-up</label>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6; margin-bottom: 12px;">
            Download al je data (journal, habits, challenges, metingen, trainingen, retention) als bestand. Bewaar het op je computer of in de cloud.
          </div>
          <div style="font-size: 11px; color: ${backupColor}; margin-bottom: 16px;">${backupText}</div>
          <button class="btn btn-primary" id="backup-btn" style="width: 100%;" onclick="exportBackup()">Back-up downloaden</button>
          <button class="btn btn-secondary" style="width: 100%; margin-top: 8px;" onclick="pickRestoreFile()">Back-up terugzetten</button>
          <input type="file" id="restore-file" accept=".json,application/json" style="display: none;" onchange="onRestoreFile(this)">
        </div>

        <div class="card" style="cursor: pointer;" onclick="state.weekOffset = 0; setSection('week');">
          <label class="label">📊 Weekrapport</label>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;">Je week in één overzicht: dagscore, XP, habits, challenges en trainingen. Blader terug naar eerdere weken.</div>
          <div style="font-size: 11px; color: #e5484d; margin-top: 10px;">Bekijk deze week →</div>
        </div>

        <div class="card" style="cursor: pointer;" onclick="setSection('ranks')">
          <label class="label">🏅 Rangen</label>
          <div style="font-size: 12px; color: #a3a3a3; line-height: 1.6;">Alle rangen, wat je nog nodig hebt en hoe je XP verdient.</div>
        </div>

        <div class="card">
          <label class="label">📱 App op je beginscherm</label>
          ${isInstalled() ? `
            <div style="font-size: 12px; color: #22c55e;">✓ Je gebruikt Primal Forged als app.</div>
          ` : deferredInstallPrompt ? `
            <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 16px;">Installeer Primal Forged als app: eigen icoon, opent schermvullend.</div>
            <button class="btn btn-primary" style="width: 100%;" onclick="installApp()">Installeren</button>
          ` : isIOS() ? `
            <div style="font-size: 12px; color: #a3a3a3; line-height: 1.7;">
              Open deze site in <strong>Safari</strong>, tik op het <strong>deel-icoon</strong> (vierkant met pijl omhoog) en kies <strong>"Zet op beginscherm"</strong>.
            </div>
          ` : `
            <div style="font-size: 12px; color: #a3a3a3; line-height: 1.7;">
              <strong>Android (Chrome):</strong> menu ⋮ → "App installeren" of "Toevoegen aan startscherm".<br>
              <strong>Computer (Edge/Chrome):</strong> klik op het installeer-icoon rechts in de adresbalk.
            </div>
          `}
        </div>

        <div class="card">
          <label class="label">Komt binnenkort</label>
          <div style="color: #525252; font-size: 12px;">
            <p style="margin-bottom: 12px;">• Voeding logboek</p>
            <p style="margin-bottom: 12px;">• Supplementen</p>
            <p style="margin-bottom: 12px;">• Slaap analyse</p>
            <p style="margin-bottom: 12px;">• Trainingsschema's</p>
            <p>• Bloedwaarden</p>
          </div>
        </div>
        
        <div class="card">
          <label class="label">Account</label>
          <div style="font-size: 12px; color: #525252; margin-bottom: 16px;">${esc(state.user.email)}</div>
          <button class="btn btn-secondary" style="width: 100%;" onclick="signOut()">Uitloggen</button>
        </div>
      `;
    }

    // ============================================
    // RENDER: APP
    // ============================================
    function renderApp() {
      return `
        <div class="app-header">
          <div>
            <span class="logo">PRIMAL</span><span class="logo logo-accent">FORGED</span>
          </div>
          <div class="user-menu">
            <span class="user-email">${esc(state.user.email)}</span>
            <button class="logout-btn" onclick="signOut()">Logout</button>
          </div>
        </div>
        
        <div id="toast" class="toast"></div>
        
        <div class="container">
          ${state.activeSection === 'dashboard' ? renderDashboard() : ''}
          ${state.activeSection === 'journal' ? renderJournal() : ''}
          ${state.activeSection === 'body' ? renderBody() : ''}
          ${state.activeSection === 'ranks' ? renderRanks() : ''}
          ${state.activeSection === 'training' ? renderTraining() : ''}
          ${state.activeSection === 'week' ? renderWeek() : ''}
          ${state.activeSection === 'retention' ? renderRetention() : ''}
          ${state.activeSection === 'more' ? renderMore() : ''}
        </div>
        
        ${state.showRankUp ? renderRankUp() : ''}
        ${state.showRestore ? renderRestoreModal() : ''}

        <nav class="nav">
          <button class="nav-item ${state.activeSection === 'dashboard' ? 'active' : ''}" onclick="setSection('dashboard')">
            <span class="nav-icon">📊</span>Dashboard
          </button>
          <button class="nav-item ${state.activeSection === 'journal' ? 'active' : ''}" onclick="setSection('journal')">
            <span class="nav-icon">📝</span>Journal
          </button>
          <button class="nav-item ${state.activeSection === 'body' ? 'active' : ''}" onclick="setSection('body')">
            <span class="nav-icon">💪</span>Lichaam
          </button>
          <button class="nav-item ${state.activeSection === 'training' ? 'active' : ''}" onclick="setSection('training')">
            <span class="nav-icon">🏋️</span>Training
          </button>
          <button class="nav-item ${state.activeSection === 'retention' ? 'active' : ''}" onclick="setSection('retention')">
            <span class="nav-icon">🔥</span>Retention
          </button>
          <button class="nav-item ${state.activeSection === 'more' ? 'active' : ''}" onclick="setSection('more')">
            <span class="nav-icon">⚡</span>Meer
          </button>
        </nav>
      `;
    }

    function render() {
      renderCount++;
      const app = document.getElementById('app');
      if (state.loading) {
        app.innerHTML = '<div class="loading"><span class="loading-text">Laden...</span></div>';
        return;
      }
      if (!state.user) {
        app.innerHTML = renderAuth();
        return;
      }
      app.innerHTML = renderApp();
      if (state.activeSection === 'body') setupBodyChart();
      if (!state.showRankUp) setTimeout(checkRankUp, 50);
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    function setSection(section) {
      state.activeSection = section;
      render();
      window.scrollTo(0, 0);
    }

    function setJournalTab(tab) {
      state.journalTab = tab;
      render();
    }

    function updateSlider(key, value) {
      state[key] = parseInt(value);
      const el = document.getElementById(`${key}-value`);
      if (el) {
        el.textContent = value;
        el.style.color = getColor(parseInt(value), key === 'stress');
      }
    }

    // Long-press for habits
    let habitPressTimer = null;
    let habitPressStart = null;
    const LONG_PRESS_DURATION = 500; // ms

    function startHabitPress(habitKey) {
      habitPressStart = Date.now();
      habitPressTimer = setTimeout(() => {
        // Long press - show modal
        state.showHabitModal = habitKey;
        render();
        habitPressTimer = null;
      }, LONG_PRESS_DURATION);
    }

    function endHabitPress(habitKey) {
      if (habitPressTimer) {
        // Short press - toggle habit
        clearTimeout(habitPressTimer);
        habitPressTimer = null;
        toggleHabit(habitKey);
      }
    }

    function cancelHabitPress() {
      if (habitPressTimer) {
        clearTimeout(habitPressTimer);
        habitPressTimer = null;
      }
    }

    // ============================================
    // INIT
    // ============================================
    async function loadAll() {
      await Promise.all([loadEntries(), loadRetention(), loadHabits(), loadBody(), loadTraining()]);
      // Eén onderdeel dat faalt mag de rest van de app niet blokkeren
      try {
        await loadChallenges();
        const msgs = await settleChallenges();
        if (msgs.length) setTimeout(() => showToast(msgs[0]), 600);
      } catch (e) {
        console.error('Challenges laden mislukt:', e);
        state.challengesError = 'Challenges konden niet laden.';
      }
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        state.user = session.user;
        await loadAll();
      }
      
      state.loading = false;
      render();
      
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'TOKEN_REFRESHED') return;
        if (session) {
          state.user = session.user;
          await loadAll();
        } else {
          state.user = null;
          state.entries = [];
          state.retentionStreak = null;
          state.bodyStats = [];
      state.bodySettings = {};
      state.challenges = [];
      state.challengeLogs = [];
      state.chLogIndex = {};
      state.retentionAll = [];
      state.showRankUp = null;
      state.workouts = [];
      state.workoutSets = [];
      state.trainForm = null;
      Object.assign(state, { ts: null, tpick: {}, tswap: null, tsetup: null, tc: null, tday: null, trainView: 'list', jd: null, jMode: null });
        }
        render();
      });
    }

    init();
  </script>
</body>
</html>
