    .logo-accent { color: #7f1d1d; margin-left: 6px; }

    .auth-subtitle { font-size: 11px; color: #525252; text-align: center; margin-bottom: 32px; }
    .auth-input { width: 100%; padding: 14px 16px; background: #0a0a0a; border: 1px solid #1c1c1c; color: #fafafa; font-size: 14px; font-family: inherit; margin-bottom: 12px; }
    .auth-input:focus { outline: none; border-color: #7f1d1d; }
    .auth-btn { width: 100%; padding: 14px; background: #7f1d1d; border: none; color: #fff; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }
    .auth-btn:hover { background: #991b1b; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch { text-align: center; margin-top: 24px; font-size: 12px; color: #525252; }
    .auth-switch a { color: #7f1d1d; cursor: pointer; text-decoration: none; }
    .auth-error { background: rgba(220,38,38,0.1); border: 1px solid #dc2626; color: #dc2626; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    .auth-success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; padding: 12px; font-size: 12px; margin-bottom: 16px; }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid #1c1c1c; display: flex; z-index: 100; }
    .nav-item { flex: 1; padding: 12px 4px; background: transparent; border: none; color: #525252; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; font-family: inherit; text-align: center; }
    .nav-item.active { color: #7f1d1d; }
    .nav-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    
    .card { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 16px; }
    .card-accent { border-left: 3px solid #7f1d1d; }
    
    .label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 500; display: block; }
    
    .page-header { margin-bottom: 24px; padding-top: 60px; }
    .page-sub { font-size: 10px; color: #7f1d1d; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 6px; font-weight: 600; }
    .page-title { font-size: 26px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; }
    
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
    .stat { text-align: center; padding: 16px 8px; background: #0a0a0a; border: 1px solid #1c1c1c; }
    .stat-value { font-size: 20px; font-weight: 300; }
    .stat-label { font-size: 8px; color: #525252; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.05em; }
    
    .tabs { display: flex; border-bottom: 1px solid #1c1c1c; margin-bottom: 24px; overflow-x: auto; }
    .tab { padding: 12px 16px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #525252; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; font-family: inherit; margin-bottom: -1px; white-space: nowrap; }
    .tab.active { color: #fafafa; border-bottom-color: #7f1d1d; }
    
    .textarea { width: 100%; min-height: 150px; padding: 16px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 1.7; resize: vertical; }
    .textarea:focus { outline: none; border-color: #7f1d1d; }
    
    .slider-group { margin-bottom: 16px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-label { font-size: 12px; color: #a3a3a3; }
    .slider-value { font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .slider { 
      -webkit-appearance: none; 
      width: 100%; 
      height: 8px; 
      background: linear-gradient(to right, #dc2626, #eab308, #22c55e); 
      outline: none; 
      border-radius: 4px;
      opacity: 0.4;
    }
    .slider::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 22px; 
      height: 22px; 
      background: #fafafa; 
      cursor: pointer; 
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #fafafa;
      cursor: pointer;
      border-radius: 50%;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .slider-stress {
      background: linear-gradient(to right, #22c55e, #eab308, #dc2626);
    }
    
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 10px 14px; background: transparent; border: 1px solid #1c1c1c; color: #737373; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .tag:hover { border-color: #525252; }
    .tag.active { background: rgba(127,29,29,0.2); border-color: #7f1d1d; color: #fafafa; }
    
    .btn { padding: 14px 28px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; }
    .btn-primary { background: #7f1d1d; color: #fff; }
    .btn-primary:hover { background: #991b1b; }
    .btn-secondary { background: transparent; border: 1px solid #1c1c1c; color: #737373; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-small { padding: 10px 16px; font-size: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .entry { background: #0a0a0a; border: 1px solid #1c1c1c; padding: 20px; margin-bottom: 12px; }
    .entry-date { font-size: 11px; color: #525252; margin-bottom: 12px; }
    .entry-scores { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .entry-score { font-size: 10px; padding: 4px 8px; background: #1c1c1c; }
    .entry-content { font-size: 13px; color: #a3a3a3; line-height: 1.7; white-space: pre-wrap; }
    .entry-habits { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .entry-habit { font-size: 9px; padding: 4px 8px; border-radius: 2px; }
    .entry-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1c1c1c; }
    .entry-action { background: transparent; border: 1px solid #1c1c1c; color: #737373; padding: 8px 12px; font-size: 10px; cursor: pointer; font-family: inherit; }
    .entry-action:hover { border-color: #525252; }
    .entry-action.delete { color: #dc2626; }
    
    .info-box { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .info-title { font-size: 11px; color: #7f1d1d; margin-bottom: 6px; font-weight: 500; }
    .info-text { font-size: 12px; color: #a3a3a3; line-height: 1.6; }
    
    .prompt { padding: 16px; background: rgba(127,29,29,0.1); border-left: 3px solid #7f1d1d; margin-bottom: 16px; }
    .prompt-label { font-size: 10px; color: #7f1d1d; margin-bottom: 6px; }
    .prompt-text { font-size: 13px; color: #a3a3a3; font-style: italic; }
    
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #166534; color: #fff; padding: 12px 24px; font-size: 12px; z-index: 400; display: none; }
    .toast.show { display: block; }
    
    .empty { text-align: center; padding: 40px 20px; color: #525252; font-size: 13px; }
    
    .insight { padding: 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
    .insight-positive { background: rgba(34,197,94,0.1); border-left: 3px solid #22c55e; }
    .insight-negative { background: rgba(234,179,8,0.1); border-left: 3px solid #eab308; }
    .insight-icon { font-size: 20px; }
    .insight-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .insight-positive .insight-title { color: #22c55e; }
    .insight-negative .insight-title { color: #eab308; }
    .insight-text { font-size: 11px; color: #a3a3a3; }

    /* Dashboard specific */
    .greeting { font-size: 20px; font-weight: 300; margin-bottom: 4px; }
    .greeting-sub { font-size: 12px; color: #525252; margin-bottom: 24px; }
    
    .streak-big { text-align: center; padding: 32px; }
    .streak-number { font-size: 72px; font-weight: 200; line-height: 1; }
    .streak-label { font-size: 11px; color: #525252; text-transform: uppercase; letter-spacing: 0.15em; margin-top: 8px; }
    
    .habit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .habit { padding: 12px 8px; background: transparent; border: 1px solid #1c1c1c; color: #525252; cursor: pointer; font-family: inherit; text-align: center; }
    .habit.done { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
    .habit.done.negative { background: rgba(234,179,8,0.1); border-color: #eab308; color: #eab308; }
    .habit-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .habit-label { font-size: 8px; text-transform: uppercase; }
    
    .quote-card { padding: 20px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 16px; }
    .quote-text { font-size: 14px; color: #a3a3a3; font-style: italic; line-height: 1.6; margin-bottom: 12px; }
    .quote-author { font-size: 11px; color: #525252; }
    
    /* Retention specific */
    .phase-indicator { padding: 12px; text-align: center; margin-top: 16px; }
    .phase-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
    
    .progress-bar { height: 4px; background: #1c1c1c; margin-top: 16px; }
    .progress-fill { height: 100%; transition: width 0.3s; }
    
    .emergency-btn { width: 100%; padding: 20px; background: #dc2626; border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 24px; }
    .emergency-btn:hover { background: #b91c1c; }
    
    .milestone { padding: 16px; background: #0a0a0a; border: 1px solid #1c1c1c; margin-bottom: 12px; display: flex; gap: 16px; align-items: flex-start; }

    .milestone-day { font-size: 24px; font-weight: 300; color: #525252; min-width: 50px; }

    .milestone-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .milestone-desc { font-size: 11px; color: #525252; }

    .urge:hover { border-color: #7f1d1d; }
    .urge-icon { font-size: 24px; display: block; margin-bottom: 8px; }
    .urge-label { font-size: 9px; color: #a3a3a3; text-transform: uppercase; }

    .goal.done .goal-title { text-decoration: line-through; color: #737373; }
    .goal-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge { padding: 3px 8px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid #1c1c1c; color: #737373; }

    .input-sm { flex: 1; padding: 10px 12px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; min-width: 0; }

    .subtask-text { flex: 1; font-size: 12px; color: #a3a3a3; word-break: break-word; }
    .subtask-text.done { text-decoration: line-through; color: #525252; }
    .icon-btn { background: transparent; border: none; color: #525252; cursor: pointer; font-size: 14px; padding: 2px 6px; font-family: inherit; }
    .icon-btn:hover { color: #dc2626; }
    .goal-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1c1c1c; }
    .form-label { font-size: 10px; color: #525252; text-transform: uppercase; letter-spacing: 0.1em; margin: 14px 0 6px; display: block; }
    .form-input { width: 100%; padding: 12px 14px; background: #050505; border: 1px solid #1c1c1c; color: #fafafa; font-size: 13px; font-family: inherit; color-scheme: dark; }
    .form-input:focus { outline: none; border-color: #7f1d1d; }
    textarea.form-input { min-height: 70px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .template-list { max-height: 220px; overflow-y: auto; border: 1px solid #1c1c1c; }
    .template { display: block; width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: none; border-bottom: 1px solid #1c1c1c; color: #d4d4d4; font-size: 12px; cursor: pointer; font-family: inherit; }
    .template:hover { background: rgba(127,29,29,0.15); color: #fafafa; }
    .template-sub { font-size: 10px; color: #525252; margin-top: 2px; }
    .smart-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 16px; }
    .smart-cell { text-align: center; padding: 8px 2px; background: #050505; border: 1px solid #1c1c1c; }
    .smart-char { font-size: 15px; font-weight: 600; color: #7f1d1d; }
    .smart-word { font-size: 7px; color: #525252; text-transform: uppercase; margin-top: 2px; }
  </style>
</head>

    function getColor(value, isStress = false) {
      // For stress: low is good (green), high is bad (red)
      // For others: low is bad (red), high is good (green)
      const v = isStress ? (11 - value) : value;
      
      if (v <= 2) return '#dc2626';      // Red
      if (v <= 3) return '#ea580c';      // Orange-red
      if (v <= 4) return '#f97316';      // Orange
      if (v <= 5) return '#eab308';      // Yellow
      if (v <= 6) return '#a3e635';      // Yellow-green
      if (v <= 7) return '#84cc16';      // Lime
      if (v <= 8) return '#22c55e';      // Green
      return '#16a34a';                   // Dark green
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Goedemorgen';
      if (hour < 18) return 'Goedemiddag';
      return 'Goedenavond';
    }

    function getDailyQuote() {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      return quotes[dayOfYear % quotes.length];

      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      return dailyPrompts[dayOfYear % dailyPrompts.length];

    function getRetentionPhase(days) {
      for (let i = retentionPhases.length - 1; i >= 0; i--) {
        if (days >= retentionPhases[i].days) return retentionPhases[i];
      }
      return retentionPhases[0];
    }

    function getNextMilestone(days) {
      return retentionMilestones.find(m => m.days > days) || retentionMilestones[retentionMilestones.length - 1];
    }

    function getAverageMood() {
      if (state.entries.length === 0) return '—';
      const sum = state.entries.reduce((a, e) => a + (e.mood || 5), 0);
      return (sum / state.entries.length).toFixed(1);
    }

    function getAverageEnergy() {
      if (state.entries.length === 0) return '—';
      const sum = state.entries.reduce((a, e) => a + (e.energy || 5), 0);
      return (sum / state.entries.length).toFixed(1);
    }

    function getJournalStreak() {
      if (state.entries.length === 0) return 0;
      let streak = 1;
      const dates = state.entries.map(e => e.date).sort().reverse();
      for (let i = 1; i < dates.length; i++) {
        const d1 = new Date(dates[i-1]);
        const d2 = new Date(dates[i]);
        const diff = (d1 - d2) / (1000 * 60 * 60 * 24);
        if (diff <= 1) streak++;
        else break;
      }
      return streak;
    }

    function emptyGoalForm(timeframe) {
      return {
        title: '', domain: '', priority: 'medium',
        timeframe: timeframe || 'short', deadline: '',
        start: '', current: '', target: '', notes: ''
      };
    }

    function calcGoalProgress(goal) {
      const subtasks = goal.goal_subtasks || [];
      if (hasValue(goal.target_value)) {
        const start = hasValue(goal.start_value) ? Number(goal.start_value) : 0;
        const current = hasValue(goal.current_value) ? Number(goal.current_value) : start;
        const target = Number(goal.target_value);
        if (target === start) return current === target ? 100 : 0;
        const pct = ((current - start) / (target - start)) * 100;
        return Math.max(0, Math.min(100, Math.round(pct)));
      }
      if (subtasks.length > 0) {
        const done = subtasks.filter(s => s.is_completed).length;
        return Math.round((done / subtasks.length) * 100);
      }
      return goal.is_completed ? 100 : 0;
    }

    function deadlineText(deadline) {
      if (!deadline) return '';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(deadline + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      if (diff > 1) return diff + ' dagen';
      if (diff === 1) return 'Morgen';
      if (diff === 0) return 'Vandaag';
      return 'Verlopen';
    }

    function getInsights() {
      // Filter entries that have habits data
      const entriesWithHabits = state.entries.filter(e => e.habits && Object.keys(e.habits).length > 0);
      
      if (entriesWithHabits.length < 3) return [];
      
      const insights = [];
      
      // Analyze each habit's correlation with mood and energy
      Object.entries(habitConfig).forEach(([habitKey, habitCfg]) => {
        const withHabit = entriesWithHabits.filter(e => e.habits && e.habits[habitKey]);
        const withoutHabit = entriesWithHabits.filter(e => e.habits && !e.habits[habitKey]);
        
        if (withHabit.length >= 2 && withoutHabit.length >= 2) {
          const avgMoodWith = withHabit.reduce((a, e) => a + (e.mood || 5), 0) / withHabit.length;
          const avgMoodWithout = withoutHabit.reduce((a, e) => a + (e.mood || 5), 0) / withoutHabit.length;
          const avgEnergyWith = withHabit.reduce((a, e) => a + (e.energy || 5), 0) / withHabit.length;
          const avgEnergyWithout = withoutHabit.reduce((a, e) => a + (e.energy || 5), 0) / withoutHabit.length;
          
          if (habitCfg.positive) {
            // Positive habit: show if it improves mood/energy
            const moodDiff = avgMoodWith - avgMoodWithout;
            const energyDiff = avgEnergyWith - avgEnergyWithout;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verbetert je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (+${moodDiff.toFixed(1)})`,
                positive: true,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} boost je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (+${energyDiff.toFixed(1)})`,
                positive: true,
                impact: energyDiff
              });
            }
          } else {
            // Negative habit: show if it lowers mood/energy
            const moodDiff = avgMoodWithout - avgMoodWith;
            const energyDiff = avgEnergyWithout - avgEnergyWith;
            
            if (moodDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je mood`,
                text: `Met: ${avgMoodWith.toFixed(1)} | Zonder: ${avgMoodWithout.toFixed(1)} (-${moodDiff.toFixed(1)})`,
                positive: false,
                impact: moodDiff
              });
            }
            if (energyDiff >= 0.5) {
              insights.push({
                icon: habitCfg.icon,
                title: `${habitCfg.title} verlaagt je energie`,
                text: `Met: ${avgEnergyWith.toFixed(1)} | Zonder: ${avgEnergyWithout.toFixed(1)} (-${energyDiff.toFixed(1)})`,
                positive: false,
                impact: energyDiff
              });
            }
          }
        }
      });
      
      // Sort by impact and return top 6
      insights.sort((a, b) => (b.impact || 0) - (a.impact || 0));
      return insights.slice(0, 6);
    }

    async function loadGoals() {
      if (!state.user) return;
      let { data, error } = await supabaseClient
        .from('goals')
        .select('*, goal_subtasks(*)')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false });

      // Fallback: als subtaken-koppeling faalt, laad alleen doelen
      if (error) {
        console.warn('Subtaken laden mislukt, probeer zonder:', error);
        const retry = await supabaseClient
          .from('goals')
          .select('*')
          .eq('user_id', state.user.id)
          .order('created_at', { ascending: false });
        data = retry.data;
        error = retry.error;
      }

      if (error) {
        console.error('Fout bij laden missies:', error);
        state.goalsError = error.message;
        return;
      }

      state.goalsError = null;
      state.goals = (data || []).map(g => ({
        ...g,
        goal_subtasks: (g.goal_subtasks || []).sort((a, b) => (a.position || 0) - (b.position || 0))
      }));
    }

    async function refreshGoals() {
      await loadGoals();
      render();
    }

    async function ensureProfile() {
      const { error } = await supabaseClient.from('profiles').upsert({ id: state.user.id });
      if (error) console.error('Profiel aanmaken mislukt:', error);
      return error;
    }

    async function writeGoal(data) {
      if (state.editingGoalId) {
        const { error } = await supabaseClient
          .from('goals')
          .update({ ...data, updated_at: new Date().toISOString() })
          .eq('id', state.editingGoalId);
        return error;
      }
      const { error } = await supabaseClient.from('goals').insert([{ ...data, is_completed: false }]);
      return error;
    }

    async function saveGoal() {
      readGoalForm();
      const f = state.goalForm;
      if (!f.title.trim()) {
        alert('Vul een titel in voor je missie');
        return;
      }

      const num = v => {
        if (!hasValue(v)) return null;
        const n = parseFloat(String(v).replace(',', '.'));
        return isNaN(n) ? null : n;
      };

      const startVal = num(f.start);
      const currentVal = num(f.current);
      const data = {
        user_id: state.user.id,
        title: f.title.trim(),
        domain: f.domain || null,
        priority: f.priority || 'medium',
        timeframe: f.timeframe || 'short',
        deadline: f.deadline || null,
        start_value: startVal,
        current_value: currentVal !== null ? currentVal : startVal,
        target_value: num(f.target),
        notes: f.notes.trim() || null
      };

      const btn = document.getElementById('goal-save-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }

      let error = await writeGoal(data);

      // Foreign key fout: profiel bestaat nog niet -> aanmaken en opnieuw proberen
      if (error && error.code === '23503') {
        const profileError = await ensureProfile();
        if (!profileError) error = await writeGoal(data);
      }

      if (error) {
        console.error('Fout bij opslaan missie:', error);
        alert('Fout bij opslaan: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
        return;
      }

      const wasEditing = !!state.editingGoalId;
      state.showGoalModal = false;
      state.editingGoalId = null;
      state.goalTab = data.timeframe;
      await refreshGoals();
      showToast(wasEditing ? '✓ Missie bijgewerkt' : '🎯 Missie gestart!');
    }

    async function toggleGoalComplete(goalId) {
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal) return;
      const completing = !goal.is_completed;
      const { error } = await supabaseClient.from('goals').update({
        is_completed: completing,
        last_completed_date: completing ? todayStr() : goal.last_completed_date,
        updated_at: new Date().toISOString()
      }).eq('id', goalId);
      if (error) { alert('Fout bij bijwerken: ' + error.message); return; }
      await refreshGoals();
      if (completing) showToast('🏆 Missie voltooid!');
    }

    async function updateGoalValue(goalId) {
      const input = document.getElementById(`gv-${goalId}`);
      if (!input || !hasValue(input.value)) return;
      const value = parseFloat(String(input.value).replace(',', '.'));
      if (isNaN(value)) { alert('Vul een getal in'); return; }

      const goal = state.goals.find(g => g.id === goalId);
      const update = { current_value: value, updated_at: new Date().toISOString() };

      if (goal && hasValue(goal.target_value)) {
        const start = hasValue(goal.start_value) ? Number(goal.start_value) : 0;
        const target = Number(goal.target_value);
        const reached = target >= start ? value >= target : value <= target;
        if (reached && confirm('🎯 Doel bereikt! Markeren als voltooid?')) {
          update.is_completed = true;
          update.last_completed_date = todayStr();
        }
      }

      const { error } = await supabaseClient.from('goals').update(update).eq('id', goalId);
      if (error) { alert('Fout bij bijwerken: ' + error.message); return; }
      await refreshGoals();
      showToast('✓ Voortgang bijgewerkt');
    }

    async function deleteGoal(goalId) {
      if (!confirm('Missie permanent verwijderen?')) return;
      // Eerst subtaken verwijderen (voor het geval er geen cascade is)
      await supabaseClient.from('goal_subtasks').delete().eq('goal_id', goalId);
      const { error } = await supabaseClient.from('goals').delete().eq('id', goalId);
      if (error) { alert('Fout bij verwijderen: ' + error.message); return; }
      await refreshGoals();
    }

    async function addSubtask(goalId) {
      const input = document.getElementById(`st-${goalId}`);
      if (!input || !input.value.trim()) return;
      const goal = state.goals.find(g => g.id === goalId);
      const position = goal ? (goal.goal_subtasks || []).length : 0;
      const { error } = await supabaseClient.from('goal_subtasks').insert([{
        goal_id: goalId,
        user_id: state.user.id,
        title: input.value.trim(),
        is_completed: false,
        position
      }]);
      if (error) { alert('Fout bij toevoegen stap: ' + error.message); return; }
      await refreshGoals();
      const again = document.getElementById(`st-${goalId}`);
      if (again) again.focus();
    }

    async function toggleSubtask(goalId, subtaskId) {
      const goal = state.goals.find(g => g.id === goalId);
      const st = goal ? (goal.goal_subtasks || []).find(s => s.id === subtaskId) : null;
      if (!st) return;
      const { error } = await supabaseClient.from('goal_subtasks')
        .update({ is_completed: !st.is_completed })
        .eq('id', subtaskId);
      if (error) { alert('Fout bij bijwerken stap: ' + error.message); return; }
      await refreshGoals();
    }

    async function deleteSubtask(subtaskId) {
      const { error } = await supabaseClient.from('goal_subtasks').delete().eq('id', subtaskId);
      if (error) { alert('Fout bij verwijderen stap: ' + error.message); return; }
      await refreshGoals();
    }

        const g = state.goals.find(x => x.id === goalId);

        state.editingGoalId = goalId;
        state.goalForm = {
          title: g.title || '',
          domain: g.domain || '',

          timeframe: g.timeframe || 'short',

          start: hasValue(g.start_value) ? String(Number(g.start_value)) : '',
          current: hasValue(g.current_value) ? String(Number(g.current_value)) : '',
          target: hasValue(g.target_value) ? String(Number(g.target_value)) : '',

        };

        state.editingGoalId = null;

          state.goalForm.domain = state.goalDomain;
          state.templateDomain = state.goalDomain;

      document.getElementById('auth-switch-text').textContent = authMode === 'login' ? 'Nog geen account?' : 'Al een account?';

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errorEl = document.getElementById('auth-error');
      const successEl = document.getElementById('auth-success');
      const submitBtn = document.getElementById('auth-submit');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Even geduld...';
      
      try {
        if (authMode === 'signup') {
          await signUp(email, password);
          successEl.textContent = 'Check je email om je account te bevestigen!';
          successEl.style.display = 'block';
        } else {
          await signIn(email, password);
        }
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      }
      
      submitBtn.disabled = false;
      submitBtn.textContent = authMode === 'login' ? 'Inloggen' : 'Registreren';
    }

          </div>
        </div>
      `;
    }

    // ============================================
    // RENDER: MISSIES
    // ============================================
    function renderMissions() {
      const active = state.goals.filter(g => !g.is_completed);
      const done = state.goals.filter(g => g.is_completed);
      const avg = active.length
        ? Math.round(active.reduce((a, g) => a + calcGoalProgress(g), 0) / active.length)
        : 0;
      const high = active.filter(g => g.priority === 'high').length;

      let list = state.goalTab === 'completed'
        ? done
        : active.filter(g => g.timeframe === state.goalTab);
      if (state.goalDomain !== 'all') list = list.filter(g => g.domain === state.goalDomain);

      const countFor = tf => active.filter(g => g.timeframe === tf).length;

      return `
        <div class="page-header">
          <div class="page-sub">Discipline boven motivatie</div>
          <div class="page-title">Missies</div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-value">${active.length}</div>
            <div class="stat-label">Actief</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: #22c55e;">${done.length}</div>
            <div class="stat-label">Voltooid</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: #eab308;">${avg}%</div>
            <div class="stat-label">Gem. voortgang</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: #dc2626;">${high}</div>
            <div class="stat-label">Hoge prio</div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab ${state.goalTab === 'short' ? 'active' : ''}" onclick="setGoalTab('short')">Kort (${countFor('short')})</button>
          <button class="tab ${state.goalTab === 'medium' ? 'active' : ''}" onclick="setGoalTab('medium')">Middel (${countFor('medium')})</button>
          <button class="tab ${state.goalTab === 'long' ? 'active' : ''}" onclick="setGoalTab('long')">Lang (${countFor('long')})</button>
          <button class="tab ${state.goalTab === 'completed' ? 'active' : ''}" onclick="setGoalTab('completed')">Voltooid (${done.length})</button>
        </div>

        <div class="chips">
          <button class="chip ${state.goalDomain === 'all' ? 'active' : ''}" onclick="setGoalDomain('all')">Alle</button>
          ${Object.entries(domainConfig).map(([key, d]) => `
            <button class="chip ${state.goalDomain === key ? 'active' : ''}" onclick="setGoalDomain('${key}')">${d.icon} ${d.label}</button>
          `).join('')}
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-bottom: 16px;" onclick="openGoalModal()">+ Nieuwe Missie</button>

        ${state.goalsError ? `
          <div class="info-box">
            <div class="info-title">⚠️ Missies konden niet laden</div>
            <div class="info-text">${esc(state.goalsError)}</div>
          </div>
        ` : ''}

        ${list.length ? list.map(renderGoalCard).join('') : `
          <div class="empty">
            ${state.goalTab === 'completed'
              ? 'Nog geen voltooide missies. Je eerste overwinning komt eraan.'
              : 'Nog geen missies hier.<br><br>Kies een template: kleine stappen, echte resultaten.'}
          </div>
        `}

        ${state.showGoalModal ? renderGoalModal() : ''}
      `;
    }

    function renderGoalCard(g) {
      const p = calcGoalProgress(g);
      const d = domainConfig[g.domain];
      const pr = priorityConfig[g.priority];
      const st = g.goal_subtasks || [];
      const stDone = st.filter(s => s.is_completed).length;
      const hasTarget = hasValue(g.target_value);
      const dl = deadlineText(g.deadline);
      const barColor = p >= 75 ? '#22c55e' : p >= 40 ? '#eab308' : '#7f1d1d';

      return `
        <div class="goal ${g.is_completed ? 'done' : ''}">
          <div class="goal-top">
            <button class="goal-check ${g.is_completed ? 'checked' : ''}" onclick="toggleGoalComplete('${g.id}')" title="${g.is_completed ? 'Terugzetten naar actief' : 'Markeer als voltooid'}">${g.is_completed ? '✓' : ''}</button>
            <div style="flex: 1; min-width: 0;">
              <div class="goal-title">${esc(g.title)}</div>
              <div class="goal-meta">
                ${d ? `<span class="badge" style="color: #a3a3a3;">${d.icon} ${d.label}</span>` : ''}
                ${pr ? `<span class="badge" style="color: ${pr.color}; border-color: ${pr.color}55;">${pr.label}</span>` : ''}
                ${dl ? `<span class="badge" style="${dl === 'Verlopen' && !g.is_completed ? 'color: #dc2626; border-color: #dc262655;' : ''}">📅 ${dl}</span>` : ''}
              </div>
            </div>
          </div>

          ${g.notes ? `<div class="goal-notes">${esc(g.notes)}</div>` : ''}

          ${(hasTarget || st.length) ? `
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${p}%; background: ${barColor};"></div>
            </div>
            <div class="goal-progress-row">
              <span>${hasTarget
                ? `${fmtNum(g.start_value)} → <strong style="color: #fafafa;">${fmtNum(hasValue(g.current_value) ? g.current_value : g.start_value)}</strong> → ${fmtNum(g.target_value)}`
                : `${stDone}/${st.length} stappen`}</span>
              <span>${p}%</span>
            </div>
          ` : ''}

          ${hasTarget && !g.is_completed ? `
            <div class="goal-update">
              <input type="number" step="any" inputmode="decimal" class="input-sm" id="gv-${g.id}" placeholder="Nieuwe waarde" onkeydown="if(event.key === 'Enter') updateGoalValue('${g.id}')">
              <button class="btn btn-primary btn-small" onclick="updateGoalValue('${g.id}')">Bijwerken</button>
            </div>
          ` : ''}

          ${(st.length || !g.is_completed) ? `
            <div class="subtasks">
              ${st.map(s => `
                <div class="subtask">
                  <button class="subtask-check ${s.is_completed ? 'checked' : ''}" onclick="toggleSubtask('${g.id}', '${s.id}')">${s.is_completed ? '✓' : ''}</button>
                  <div class="subtask-text ${s.is_completed ? 'done' : ''}">${esc(s.title)}</div>
                  <button class="icon-btn" onclick="deleteSubtask('${s.id}')" title="Stap verwijderen">×</button>
                </div>
              `).join('')}
              ${!g.is_completed ? `
                <div class="goal-update" style="margin-top: 8px;">
                  <input type="text" class="input-sm" id="st-${g.id}" placeholder="+ Stap toevoegen" onkeydown="if(event.key === 'Enter') addSubtask('${g.id}')">
                  <button class="btn btn-secondary btn-small" onclick="addSubtask('${g.id}')">+</button>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <div class="goal-actions">
            <button class="entry-action" onclick="openGoalModal('${g.id}')">✏️ Bewerken</button>
            <button class="entry-action delete" onclick="deleteGoal('${g.id}')">🗑️ Verwijderen</button>
          </div>
        </div>
      `;
    }

    function renderGoalModal() {
      const f = state.goalForm || emptyGoalForm();
      const isEdit = !!state.editingGoalId;
      const td = state.templateDomain;
      const templates = goalTemplates
        .map((t, i) => ({ t, i }))
        .filter(x => x.t[0] === td && x.t[1] === f.timeframe);

      const opt = (value, label, current) =>
        `<option value="${value}" ${current === value ? 'selected' : ''}>${label}</option>`;

      return `
        <div class="modal-overlay" onclick="if(event.target === this) closeGoalModal();">
          <div class="modal" style="max-width: 520px;">
            <div class="modal-title" style="color: #fafafa;">${isEdit ? 'Missie Bewerken' : 'Nieuwe Missie'}</div>

            <div class="smart-row">
              ${[['S','Specifiek'],['M','Meetbaar'],['A','Acceptabel'],['R','Realistisch'],['T','Tijdgebonden']].map(([c, w]) => `
                <div class="smart-cell"><div class="smart-char">${c}</div><div class="smart-word">${w}</div></div>
              `).join('')}
            </div>

            ${!isEdit ? `
              <label class="form-label" style="margin-top: 0;">⚡ Kies een template (of vul zelf in)</label>
              <div class="chips" style="margin-bottom: 8px;">
                ${Object.entries(domainConfig).map(([key, d]) => `
                  <button class="chip ${td === key ? 'active' : ''}" onclick="setTemplateDomain('${key}')">${d.icon} ${d.label}</button>
                `).join('')}
              </div>
              <div class="template-list">
                ${templates.length ? templates.map(({ t, i }) => `
                  <button class="template" onclick="applyTemplate(${i})">
                    ${esc(t[2])}
                    <div class="template-sub">${t[4] !== null ? `Doel: ${t[4]} ${esc(t[5])}` : 'Zelf waarden invullen'}${t[6] ? ' · ' + esc(t[6]) : ''}</div>
                  </button>
                `).join('') : `<div class="empty" style="padding: 20px;">Geen templates voor deze termijn.</div>`}
              </div>
              <div style="font-size: 10px; color: #525252; margin-top: 6px;">Templates passen bij de gekozen termijn hieronder.</div>
            ` : ''}

            <label class="form-label">Missie</label>
            <input type="text" class="form-input" id="gf-title" placeholder="Wat wil je bereiken? (wees specifiek)" value="${esc(f.title)}">

            <div class="form-row">
              <div>
                <label class="form-label">Domein</label>
                <select class="form-input" id="gf-domain">
                  ${opt('', 'Kies...', f.domain)}
                  ${Object.entries(domainConfig).map(([key, d]) => opt(key, d.icon + ' ' + d.label, f.domain)).join('')}
                </select>
              </div>
              <div>
                <label class="form-label">Prioriteit</label>
                <select class="form-input" id="gf-priority">
                  ${Object.entries(priorityConfig).map(([key, p]) => opt(key, p.label, f.priority)).join('')}
                </select>
              </div>
            </div>

            <div class="form-row">
              <div>
                <label class="form-label">Termijn</label>
                <select class="form-input" id="gf-timeframe" onchange="onGoalTimeframeChange()">
                  ${Object.entries(timeframeConfig).map(([key, t]) => opt(key, t.full, f.timeframe)).join('')}
                </select>
              </div>
              <div>
                <label class="form-label">Deadline</label>
                <input type="date" class="form-input" id="gf-deadline" value="${esc(f.deadline)}">
              </div>
            </div>

            <label class="form-label">Meetbaar maken (optioneel)</label>
            <div class="form-row-3">
              <input type="number" step="any" inputmode="decimal" class="form-input" id="gf-start" placeholder="Start" value="${esc(f.start)}">
              <input type="number" step="any" inputmode="decimal" class="form-input" id="gf-current" placeholder="Nu" value="${esc(f.current)}">
              <input type="number" step="any" inputmode="decimal" class="form-input" id="gf-target" placeholder="Doel" value="${esc(f.target)}">
            </div>

            <label class="form-label">Notities / aanpak</label>
            <textarea class="form-input" id="gf-notes" placeholder="Hoe ga je dit aanpakken?">${esc(f.notes)}</textarea>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 20px;">
              <button class="btn btn-secondary" onclick="closeGoalModal()">Annuleren</button>
              <button class="btn btn-primary" id="goal-save-btn" onclick="saveGoal()">Opslaan</button>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================
    // RENDER: RETENTION
    // ============================================
    function renderRetention() {
      const days = getRetentionDays();
      const phase = getRetentionPhase(days);
      const nextMilestone = getNextMilestone(days);
      const progress = nextMilestone ? (days / nextMilestone.days) * 100 : 100;
      
      return `
        <div class="page-header">
          <div class="page-sub">Discipline</div>
          <div class="page-title">Retention</div>
        </div>
        
        ${state.retentionStreak ? `
          <div class="card" style="text-align: center;">
            <div class="streak-big">
              <div class="streak-number" style="color: ${phase.color}">${days}</div>
              <div class="streak-label">Dagen Streak</div>
            </div>
            <div class="phase-indicator" style="background: ${phase.color}20; border: 1px solid ${phase.color}50;">
              <div class="phase-name" style="color: ${phase.color}">Fase: ${phase.name}</div>
            </div>
            ${nextMilestone && days < nextMilestone.days ? `
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%; background: ${phase.color};"></div>
              </div>
              <div style="font-size: 10px; color: #525252; margin-top: 8px;">
                Nog ${nextMilestone.days - days} dagen tot ${nextMilestone.title}
              </div>
            ` : ''}
          </div>
          
          <button class="emergency-btn" onclick="state.showEmergencyModal = true; render();">
            🚨 NOODPROTOCOL
          </button>
          
          <div class="card">
            <label class="label">Milestones</label>
            ${retentionMilestones.map(m => `
              <div class="milestone ${days >= m.days ? 'achieved' : ''}">
                <div class="milestone-day">${m.days}</div>
                <div>
                  <div class="milestone-title">${days >= m.days ? '✓ ' : ''}${m.title}</div>
                  <div class="milestone-desc">${m.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
          
          <div class="card">
            <label class="label">Urge Technieken</label>
            <div class="urge-grid">
              ${urges.map(u => `
                <div class="urge" title="${u.desc}">
                  <span class="urge-icon">${u.icon}</span>
                  <span class="urge-label">${u.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
          
          <button class="btn btn-secondary" style="width: 100%;" onclick="resetRetention()">Reset Streak</button>
        ` : `
          <div class="card" style="text-align: center; padding: 40px;">
            <div style="font-size: 48px; margin-bottom: 16px;">🔥</div>
            <div style="font-size: 14px; color: #a3a3a3; margin-bottom: 24px;">
              Begin je retention journey en track je voortgang.
            </div>
            <button class="btn btn-primary" onclick="startRetention()">Start Streak</button>
          </div>
        `}
        
        ${state.showEmergencyModal ? renderEmergencyModal() : ''}
      `;
    }

    function renderEmergencyModal() {
      return `
        <div class="modal-overlay" onclick="if(event.target === this) { state.showEmergencyModal = false; render(); }">
          <div class="modal">
            <div class="modal-title">🚨 NOODPROTOCOL</div>
            <p style="font-size: 12px; color: #a3a3a3; margin-bottom: 16px;">
              Je hebt een urge. Dat is normaal. Volg deze stappen:
            </p>
            <div class="modal-step">
              <div class="modal-step-title">1. ADEM</div>
              <div class="modal-step-text">4 tellen in, 4 tellen vast, 4 tellen uit. Herhaal 5x.</div>
            </div>
            <div class="modal-step">
              <div class="modal-step-title">2. VERLAAT</div>
              <div class="modal-step-text">Ga nu naar een andere kamer. Nu.</div>
            </div>
            <div class="modal-step">
              <div class="modal-step-title">3. KOUD WATER</div>
              <div class="modal-step-text">Spoel je gezicht met ijskoud water of neem een koude douche.</div>
            </div>
            <div class="modal-step">
              <div class="modal-step-title">4. BEWEEG</div>
              <div class="modal-step-text">20 push-ups. 20 squats. Nu. Geen excuses.</div>
            </div>
            <div class="modal-step">
              <div class="modal-step-title">5. HERINNER</div>
              <div class="modal-step-text">Je bent ${getRetentionDays()} dagen sterk. Gooi dat niet weg voor 5 seconden.</div>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 16px;" onclick="state.showEmergencyModal = false; render();">
              Ik heb dit 💪
            </button>
          </div>
        </div>
      `;
    }

    // ============================================
    // RENDER: JOURNAL
    // ============================================
    function renderJournal() {
      return `
        <div class="page-header">
          <div class="page-sub">Reflectie</div>
          <div class="page-title">Journal</div>
        </div>
        
        <div class="stats">
          <div class="stat">
            <div class="stat-value">${state.entries.length}</div>
            <div class="stat-label">Entries</div>
          </div>
          <div class="stat">
            <div class="stat-value" style="color: ${getColor(parseFloat(getAverageMood()) || 5)}">${getAverageMood()}</div>
            <div class="stat-label">Mood</div>
          </div>
          <div class="stat">
            <div class="stat-value">${getJournalStreak()}</div>
            <div class="stat-label">Streak</div>
          </div>
          <div class="stat">
            <div class="stat-value">${getAverageEnergy()}</div>
            <div class="stat-label">Energie</div>
          </div>
        </div>
        
        <div class="tabs">
          <button class="tab ${state.journalTab === 'new' ? 'active' : ''}" onclick="setJournalTab('new')">Nieuwe Entry</button>
          <button class="tab ${state.journalTab === 'history' ? 'active' : ''}" onclick="setJournalTab('history')">Geschiedenis</button>
          <button class="tab ${state.journalTab === 'patterns' ? 'active' : ''}" onclick="setJournalTab('patterns')">Patronen</button>
        </div>
        
        ${state.journalTab === 'new' ? renderNewEntry() : ''}
        ${state.journalTab === 'history' ? renderHistory() : ''}
        ${state.journalTab === 'patterns' ? renderPatterns() : ''}
      `;
    }

    function renderNewEntry() {
      const prompt = getDailyPrompt();
      return `
        ${state.editingId ? `
          <div class="card card-accent">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 12px; color: #7f1d1d;">✏️ Je bewerkt een entry</span>
              <button onclick="state.editingId = null; state.content = ''; render();" style="background: transparent; border: none; color: #525252; font-size: 11px; cursor: pointer;">Annuleer</button>
            </div>
          </div>
        ` : `
          <div class="prompt">
            <div class="prompt-label">📝 Vraag van vandaag</div>
            <div class="prompt-text">"${prompt}"</div>
          </div>
        `}
        
        <div class="card">
          <label class="label">Schrijf je gedachten</label>
          <textarea class="textarea" id="entry-content" placeholder="Wat houdt je bezig?">${state.content}</textarea>
        </div>
        
        <div class="card">
          <label class="label">Hoe voel je je?</label>
          ${['mood', 'energy', 'libido', 'focus', 'stress', 'sleep'].map(key => {
            const icons = { mood: '😊', energy: '⚡', libido: '🔥', focus: '🧠', stress: '😰', sleep: '😴' };
            const labels = { mood: 'Stemming', energy: 'Energie', libido: 'Libido', focus: 'Focus', stress: 'Stress', sleep: 'Slaap' };
            const value = state[key];
            const isStress = key === 'stress';
            return `
              <div class="slider-group">
                <div class="slider-header">
                  <span class="slider-label">${icons[key]} ${labels[key]}</span>
                  <span class="slider-value" id="${key}-value" style="color: ${getColor(value, isStress)}">${value}</span>
                </div>
                <input type="range" class="slider ${isStress ? 'slider-stress' : ''}" min="1" max="10" value="${value}" oninput="updateSlider('${key}', this.value)">
              </div>
            `;
          }).join('')}
        </div>
        
        <div class="card">
          <label class="label">Vandaag's Habits</label>
          <div class="info-box" style="margin-bottom: 12px;">
            <div class="info-text">💡 Habits worden automatisch gekoppeld aan je journal entry</div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            ${Object.entries(habitConfig).map(([key, cfg]) => `
              <span style="padding: 6px 10px; font-size: 11px; background: ${state.habits[key] ? (cfg.positive ? 'rgba(34,197,94,0.1)' : 'rgba(234,179,8,0.1)') : '#0a0a0a'}; border: 1px solid ${state.habits[key] ? (cfg.positive ? '#22c55e' : '#eab308') : '#1c1c1c'}; color: ${state.habits[key] ? (cfg.positive ? '#22c55e' : '#eab308') : '#525252'};">
                ${cfg.icon} ${cfg.label}
              </span>
            `).join('')}
          </div>
          <div style="margin-top: 12px; font-size: 11px; color: #525252;">
            <a href="#" onclick="setSection('dashboard'); return false;" style="color: #7f1d1d;">→ Habits aanpassen op Dashboard</a>
          </div>
        </div>
        
        <div style="display: flex; justify-content: space-between;">
          <button class="btn btn-secondary" onclick="state.content = ''; render();">Reset</button>
          <button class="btn btn-primary" onclick="saveEntry()">${state.editingId ? 'Bijwerken' : 'Opslaan'}</button>
        </div>
      `;
    }

    function renderHistory() {
      if (state.entries.length === 0) {
        return `<div class="empty">Nog geen entries. Begin met schrijven!</div>`;
      }
      return state.entries.map(entry => `
        <div class="entry">
          <div class="entry-date">${formatDate(entry.date)}</div>
          <div class="entry-scores">
            <span class="entry-score" style="color: ${getColor(entry.mood)}">😊 ${entry.mood}</span>
            <span class="entry-score" style="color: ${getColor(entry.energy)}">⚡ ${entry.energy}</span>
            <span class="entry-score" style="color: ${getColor(entry.libido)}">🔥 ${entry.libido}</span>
            <span class="entry-score" style="color: ${getColor(entry.focus)}">🧠 ${entry.focus}</span>
          </div>
          ${entry.content ? `<div class="entry-content">${esc(entry.content.substring(0, 200))}${entry.content.length > 200 ? '...' : ''}</div>` : ''}
          ${entry.habits ? `
            <div class="entry-habits">
              ${Object.entries(entry.habits).filter(([k, v]) => v && habitConfig[k]).map(([k, v]) => {
                const cfg = habitConfig[k];
                return `<span class="entry-habit" style="background: ${cfg.positive ? 'rgba(34,197,94,0.1)' : 'rgba(234,179,8,0.1)'}; color: ${cfg.positive ? '#22c55e' : '#eab308'};">${cfg.icon} ${cfg.label}</span>`;
              }).join('')}
            </div>
          ` : ''}
          <div class="entry-actions">
            <button class="entry-action" onclick="editEntryById('${entry.id}')">✏️ Bewerken</button>
            <button class="entry-action delete" onclick="deleteEntry('${entry.id}')">🗑️ Verwijderen</button>
          </div>
        </div>
      `).join('');
    }

    function editEntryById(id) {
      const entry = state.entries.find(e => e.id === id);
      if (entry) editEntry(entry);
    }

    function renderPatterns() {
      const insights = getInsights();
      const entriesWithHabits = state.entries.filter(e => e.habits && Object.keys(e.habits).length > 0);
      
      let html = `
        <div class="info-box">
          <div class="info-title">📊 Hoe werkt dit?</div>
          <div class="info-text">De app analyseert welke habits correleren met hogere of lagere mood/energie scores. Hoe meer data, hoe accurater de patronen.</div>
        </div>
      `;
      
      if (entriesWithHabits.length < 3) {
        html += `<div class="empty">Log minimaal 3 entries MET habits om patronen te zien.<br><br>💡 Tip: Vink habits af op Dashboard vóórdat je een journal entry maakt!</div>`;
      } else if (insights.length === 0) {
        html += `<div class="empty">Nog geen duidelijke patronen gevonden.<br><br>Je hebt ${entriesWithHabits.length} entries met habits. Blijf consistent loggen voor betere inzichten!</div>`;
      } else {
        html += insights.map(insight => `
          <div class="insight ${insight.positive ? 'insight-positive' : 'insight-negative'}">
            <div class="insight-icon">${insight.icon}</div>
            <div>
              <div class="insight-title">${insight.title}</div>
              <div class="insight-text">${insight.text}</div>
            </div>
          </div>
        `).join('');
      }
      return html;
    }

    // ============================================
    // RENDER: MORE
    // ============================================
    function renderMore() {
      return `
        <div class="page-header">
          <div class="page-sub">Extra</div>
          <div class="page-title">Meer</div>
        </div>
        
        <div class="card">
          <label class="label">Komt binnenkort</label>
          <div style="color: #525252; font-size: 12px;">
            <p style="margin-bottom: 12px;">• Lichaamsmetingen</p>
            <p style="margin-bottom: 12px;">• Challenges</p>
            <p style="margin-bottom: 12px;">• Voeding logboek</p>
            <p style="margin-bottom: 12px;">• Supplementen</p>
            <p style="margin-bottom: 12px;">• Slaap analyse</p>
            <p style="margin-bottom: 12px;">• Training programma's</p>
            <p>• Bloedwaarden</p>
          </div>
        </div>
        
        <div class="card">
          <label class="label">Account</label>
          <div style="font-size: 12px; color: #525252; margin-bottom: 16px;">${esc(state.user.email)}</div>
          <button class="btn btn-secondary" style="width: 100%;" onclick="signOut()">Uitloggen</button>
        </div>
      `;
    }

    // ============================================
    // RENDER: APP
    // ============================================
    function renderApp() {
      return `
        <div class="app-header">
          <div>
            <span class="logo">PRIMAL</span><span class="logo logo-accent">FORGED</span>
          </div>
          <div class="user-menu">
            <span class="user-email">${esc(state.user.email)}</span>
            <button class="logout-btn" onclick="signOut()">Logout</button>
          </div>
        </div>
        
        <div id="toast" class="toast"></div>
        
        <div class="container">
          ${state.activeSection === 'dashboard' ? renderDashboard() : ''}
          ${state.activeSection === 'journal' ? renderJournal() : ''}
          ${state.activeSection === 'missions' ? renderMissions() : ''}
          ${state.activeSection === 'retention' ? renderRetention() : ''}
          ${state.activeSection === 'more' ? renderMore() : ''}
        </div>
        
        <nav class="nav">
          <button class="nav-item ${state.activeSection === 'dashboard' ? 'active' : ''}" onclick="setSection('dashboard')">
            <span class="nav-icon">📊</span>Dashboard
          </button>
          <button class="nav-item ${state.activeSection === 'journal' ? 'active' : ''}" onclick="setSection('journal')">
            <span class="nav-icon">📝</span>Journal
          </button>
          <button class="nav-item ${state.activeSection === 'missions' ? 'active' : ''}" onclick="setSection('missions')">
            <span class="nav-icon">🎯</span>Missies
          </button>
          <button class="nav-item ${state.activeSection === 'retention' ? 'active' : ''}" onclick="setSection('retention')">
            <span class="nav-icon">🔥</span>Retention
          </button>
          <button class="nav-item ${state.activeSection === 'more' ? 'active' : ''}" onclick="setSection('more')">
            <span class="nav-icon">⚡</span>Meer
          </button>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.loading) {
        app.innerHTML = '<div class="loading"><span class="loading-text">Laden...</span></div>';
        return;
      }
      if (!state.user) {
        app.innerHTML = renderAuth();
        return;
      }
      app.innerHTML = renderApp();
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    function setSection(section) {
      state.activeSection = section;
      render();
      window.scrollTo(0, 0);
    }

    function setJournalTab(tab) {
      state.journalTab = tab;
      render();
    }

    function updateSlider(key, value) {
      state[key] = parseInt(value);
      const el = document.getElementById(`${key}-value`);
      if (el) {
        el.textContent = value;
        el.style.color = getColor(parseInt(value), key === 'stress');
      }
    }

    // Long-press for habits
    let habitPressTimer = null;
    let habitPressStart = null;
    const LONG_PRESS_DURATION = 500; // ms

    function startHabitPress(habitKey) {
      habitPressStart = Date.now();
      habitPressTimer = setTimeout(() => {
        // Long press - show modal
        state.showHabitModal = habitKey;
        render();
        habitPressTimer = null;
      }, LONG_PRESS_DURATION);
    }

    function endHabitPress(habitKey) {
      if (habitPressTimer) {
        // Short press - toggle habit
        clearTimeout(habitPressTimer);
        habitPressTimer = null;
        toggleHabit(habitKey);
      }
    }

    function cancelHabitPress() {
      if (habitPressTimer) {
        clearTimeout(habitPressTimer);
        habitPressTimer = null;
      }
    }

    // ============================================
    // INIT
    // ============================================
    async function loadAll() {
      await Promise.all([loadEntries(), loadRetention(), loadHabits(), loadGoals()]);
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        state.user = session.user;
        await loadAll();
      }
      
      state.loading = false;
      render();
      
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'TOKEN_REFRESHED') return;
        if (session) {
          state.user = session.user;
          await loadAll();
        } else {
          state.user = null;
          state.entries = [];
          state.retentionStreak = null;
          state.goals = [];
        }
        render();
      });
    }

    init();
  </script>
</body>
</html>
