    function sleepSettings() {
      const s = state.bodySettings || {};
      let v = s.sleep;
      if (!v) { try { v = JSON.parse(localStorage.getItem('pf_sleep') || 'null'); } catch (e) {} }
      v = v || {};
      return { wake: v.wake || '07:00', hours: v.hours || 8, night: v.night || 'off', strength: v.strength || 100, routine: v.routine || {}, set: !!v.wake };
    }
    let sleepSaveTimer = null;
    function saveSleepSettings(patch, quiet) {
      const cur = sleepSettings();
      delete cur.set;
      const n = { ...cur, ...patch };
      // routine-historie blijft bewaard: telt mee voor je XP
      Object.keys(n.routine || {}).forEach(d => { if (!n.routine[d] || !n.routine[d].length) delete n.routine[d]; });
      state.bodySettings = { ...(state.bodySettings || {}), sleep: n };
      try { localStorage.setItem('pf_sleep', JSON.stringify(n)); } catch (e) {}
      applyNightMode();
      if (!state.user) return;
      clearTimeout(sleepSaveTimer);
      sleepSaveTimer = setTimeout(async () => {
        const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, sleep: n }, { onConflict: 'user_id' });
        if (error) console.warn('Slaapinstellingen alleen lokaal (voer slaap-update.sql uit):', error.message);
      }, quiet ? 800 : 0);
    }
    function hm2min(t) { const [h, m] = String(t || '').split(':').map(Number); return isNaN(h) || isNaN(m) ? null : h * 60 + m; }
    function min2hm(n) { n = ((Math.round(n) % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
    function fmtSleepDur(min) { return min === null || min === undefined ? '—' : `${Math.floor(min / 60)}u${String(min % 60).padStart(2, '0')}`; }
    function sleepBedMin() { const s = sleepSettings(); return hm2min(s.wake) - Math.round(s.hours * 60); }
    // Na middernacht hoort de avondroutine nog bij gisteravond
    function sleepEveningDate() { return new Date().getHours() < 5 ? dateAdd(todayStr(), -1) : todayStr(); }

    // Nachten uit je journal (ochtend) of het Slaap-scherm: datum = de ochtend dat je opstond
    function sleepNight(date) {
      const e = state.entries.find(x => x.date === date && x.daily && x.daily.sleepMin);
      if (!e) return null;
      return { date, min: e.daily.sleepMin, bed: e.daily.bed, wake: e.daily.wake, q: e.sleep_quality || null };
    }
    function sleepNights(from, to) {
      const out = [];
      for (let d = from; d <= to; d = dateAdd(d, 1)) { const n = sleepNight(d); if (n) out.push(n); }
      return out;
    }
    function sleepSd(arr) { const m = arr.reduce((a, b) => a + b, 0) / arr.length; return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / arr.length); }
    // Eigen eenvoudige regelmaat-score: hoeveel je bed- en opstatijd schommelen (geen officiële SRI)
    function sleepRegularity(nights) {
      const ok = nights.filter(n => hm2min(n.bed) !== null && hm2min(n.wake) !== null);
      if (ok.length < 3) return null;
      const bed = ok.map(n => (hm2min(n.bed) - 720 + 1440) % 1440); // minuten sinds 12:00
      const wake = ok.map(n => (hm2min(n.wake) + 720) % 1440 - 720);  // rond middernacht
      const sdBed = Math.round(sleepSd(bed)), sdWake = Math.round(sleepSd(wake));
      const avg = (sdBed + sdWake) / 2;
      const score = Math.max(0, Math.min(100, Math.round(100 - avg * 1.2)));
      const label = avg <= 20 ? 'Zeer regelmatig' : avg <= 45 ? 'Redelijk regelmatig' : 'Onregelmatig';
      const color = avg <= 20 ? '#22c55e' : avg <= 45 ? '#eab308' : '#e5484d';
      return { sdBed, sdWake, score, label, color, n: ok.length };
    }
    function sleepAvg(nights) { return nights.length ? Math.round(nights.reduce((a, n) => a + n.min, 0) / nights.length) : null; }

    function sleepRoutineItems() {
      const B = sleepBedMin();
      return [
        ['coffee', `Laatste koffie vóór ${min2hm(B - 540)}`, '9 uur voor bed'],
        ['train', `Geen zware training na ${min2hm(B - 60)}`, 'laatste uur voor bed'],
        ['shower', `Warme douche of bad rond ${min2hm(B - 90)}`, '1–2 uur voor bed'],
        ['screen', `Scherm weg vanaf ${min2hm(B - 60)}`, '1–2 uur voor bed'],
        ['light', 'Licht gedimd of rood', 'laatste uur'],
        ['room', 'Slaapkamer donker, telefoon niet naast je bed', ''],
        ['bed', `In bed rond ${min2hm(B)}`, 'binnen 30 min'],

    }
    function sleepRoutineToggle(key, on) {
      const s = sleepSettings();
      const d = sleepEveningDate();
      const cur = new Set(s.routine[d] || []);

      saveSleepSettings({ routine: { ...s.routine, [d]: [...cur] } }, true);
      const el = document.getElementById('sr-score'); if (el) el.textContent = `${cur.size} / ${sleepRoutineItems().length}`;
      const row = document.getElementById('sr-' + key); if (row) row.classList.toggle('done', on);
    }

    async function saveSleepNight() {
      if (!state.user) return;
      const jd = jdInit();
      if (!jd.bed || !jd.wake) { alert('Vul in hoe laat je naar bed ging en opstond.'); return; }
      const sleepMin = jSleepCalc();
      const existing = jd.id ? state.entries.find(e => e.id === jd.id) : null;
      const daily = { ...((existing && existing.daily) || {}), bed: jd.bed, wake: jd.wake, sleepMin };
      const btn = document.getElementById('sl-save');
      if (btn) { btn.disabled = true; btn.textContent = 'Opslaan...'; }
      let res;
      if (jd.id) res = await supabaseClient.from('journal_entries').update({ daily, sleep_quality: jd.sleep }).eq('id', jd.id);
      else {
        res = await supabaseClient.from('journal_entries').insert([{ user_id: state.user.id, date: jd.date, daily, content: '', habits: { ...state.habits }, energy: jd.energy, sleep_quality: jd.sleep }]).select().single();
        if (!res.error && res.data) jd.id = res.data.id;
      }
      if (res.error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
        alert('Fout bij opslaan: ' + res.error.message);
        return;
      }
      await loadEntries();
      state.jd = null; jdInit();
      render();
      showToast('😴 Nacht opgeslagen');
    }

    // Rode nachtmodus: legt een rood filter over deze app (niet over je hele telefoon)
    function nightModeActive() {
      const s = sleepSettings();
      if (s.night === 'on') return true;
      if (s.night !== 'auto') return false;
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      const start = ((sleepBedMin() - 60) % 1440 + 1440) % 1440, end = hm2min(s.wake);
      return start < end ? m >= start && m < end : m >= start || m < end;
    }
    function applyNightMode() {
      let el = document.getElementById('pf-night');
      const on = !!state.user && nightModeActive();
      if (!on) { if (el) el.remove(); document.documentElement.classList.remove('pf-night-on'); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'pf-night';
        el.setAttribute('aria-hidden', 'true');
        document.body.appendChild(el);

      document.documentElement.classList.add('pf-night-on');

    function renderSleepChart(nights14, goalMin) {
      const days = [];
      for (let i = 13; i >= 0; i--) days.push(dateAdd(todayStr(), -i));
      const max = 600; // 10 uur
      const goalPct = Math.min(100, goalMin / max * 100);
      const wd = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
      return `
        <div class="sl-chart" role="img" aria-label="Slaapduur afgelopen 14 nachten">
          <div class="sl-goal" style="bottom: calc(16px + (100% - 22px) * ${(goalPct / 100).toFixed(3)});"><span>${fmtSleepDur(goalMin)}</span></div>
          ${days.map(d => {
            const n = nights14.find(x => x.date === d);
            const h = n ? Math.max(4, Math.min(100, n.min / max * 100)) : 0;
            const c = !n ? '' : n.min >= goalMin - 15 ? '#22c55e' : n.min >= 420 ? '#525252' : '#7f1d1d';
            return `<div class="sl-col" title="${d}: ${n ? fmtSleepDur(n.min) : 'niet ingevuld'}">
              <div class="sl-bar-wrap">${n ? `<div class="sl-bar" style="height: ${h}%; background: ${c};"></div>` : '<div class="sl-bar sl-none"></div>'}</div>
              <div class="sl-day">${wd[new Date(d + 'T12:00:00').getDay()]}</div>
            </div>`;
          }).join('')}

    }

      const tests = (state.bloodTests || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));

      if (!m) return null;

      if (k === 'vitd' && /nmol/i.test(m.unit || 'nmol/L')) return v < 30 ? 'deficit' : v < 50 ? 'low' : 'ok';

    // Zonnehoogte in graden (benadering, nauwkeurig tot ±0,5°)
    function sunElevation(date, lat, lon) {
      const rad = Math.PI / 180;
      const d = (date.getTime() - 946728000000) / 86400000; // dagen sinds 1 jan 2000 12:00 UTC
      const g = (357.529 + 0.98560028 * d) * rad;
      const q = 280.459 + 0.98564736 * d;
      const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
      const e = (23.439 - 0.00000036 * d) * rad;
      const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / rad;
      const decl = Math.asin(Math.sin(e) * Math.sin(L));
      const gmst = 18.697374558 + 24.06570982441908 * d;
      const ha = (((gmst + lon / 15) * 15 - ra) % 360 + 360) % 360 * rad;
      const la = lat * rad;
      return Math.asin(Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha)) / rad;
    }
    function sunLoc() {
      try { const v = JSON.parse(localStorage.getItem('pf_geo') || 'null'); if (v && isFinite(v.lat)) return v; } catch (e) {}
      return { lat: 52.37, lon: 4.90, name: 'Amsterdam' };
    }
    function sunUseMyLocation() {
      if (!navigator.geolocation) { alert('Je browser kan je locatie niet bepalen.'); return; }
      navigator.geolocation.getCurrentPosition(p => {
        const v = { lat: Math.round(p.coords.latitude * 100) / 100, lon: Math.round(p.coords.longitude * 100) / 100, name: 'jouw locatie' };
        try { localStorage.setItem('pf_geo', JSON.stringify(v)); } catch (e) {}
        render();
      }, () => alert('Locatie niet beschikbaar. De app rekent met Amsterdam.'), { timeout: 10000 });
    }
    // Venster van de dag waarin de zon boven de drempel staat
    function sunWindow(day, loc, min) {
      let start = null, end = null, max = -90, maxAt = null;
      for (let m = 4 * 60; m <= 22 * 60; m += 5) {
        const t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, m);
        const el = sunElevation(t, loc.lat, loc.lon);
        if (el > max) { max = el; maxAt = t; }
        if (el >= min) { if (!start) start = t; end = t; }
      }
      return { start, end, max, maxAt };
    }
    const hhmm = t => t ? String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') : '—';

        const day = new Date(now.getFullYear(), 0, 1 + i);

      const dm = d => d ? d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : '—';
      const hours = [];
      for (let h = 7; h <= 19; h++) hours.push(h);
      const months = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      const grid = months.map((mn, mi) => {

        }).join('');
        return `<div class="sd-row ${mi === now.getMonth() ? 'now' : ''}"><b>${mn}</b>${cells}</div>`;
      }).join('');
      return `
        <details class="hs-sec sd-box">
          <summary><span>☀️ Wanneer maakt je huid vitamine D?</span><span class="hs-pm" aria-hidden="true"></span></summary>
          <div class="hs-body">

              <div><b>${Math.round(w.max)}°</b><span>Hoogst vandaag (${hhmm(w.maxAt)})</span></div>
              <div><b style="font-size: 15px;">${w.start ? hhmm(w.start) + '–' + hhmm(w.end) : 'Geen'}</b><span>Vitamine D-venster</span></div>
            </div>
            <div style="font-size: 12px; color: ${statusNow[0]}; margin: 8px 0 12px;">${statusNow[1]}</div>
            <p><b>Vuistregel: je schaduw is korter dan jijzelf.</b> Dan staat de zon hoger dan 45° en komt er genoeg UVB door om vitamine D te maken. Staat de zon lager, dan maakt je huid weinig tot niets.</p>
            <p>${loc.name === 'Amsterdam' ? 'In Amsterdam' : 'Op jouw locatie'} staat de zon dit jaar van <b>${dm(first)}</b> tot <b>${dm(last)}</b> rond het middaguur hoog genoeg. Daarbuiten heb je het van je voorraad, je eten of een supplement nodig.</p>
            <div class="sd-grid" role="img" aria-label="Zonnestand per maand en uur">
              <div class="sd-row sd-head"><b></b>${hours.map(h => `<i>${h % 2 ? '' : h}</i>`).join('')}</div>
              ${grid}
            </div>

    function userPrefs() {

    let prefsSaveTimer = null;
    function saveUserPrefs(patch) {
      const p = { ...userPrefs(), ...patch };
      state.bodySettings = { ...(state.bodySettings || {}), prefs: p };
      try { localStorage.setItem('pf_prefs', JSON.stringify(p)); } catch (e) {}
      if (!state.user) return;
      clearTimeout(prefsSaveTimer);
      prefsSaveTimer = setTimeout(async () => {
        const { error } = await supabaseClient.from('user_settings').upsert({ user_id: state.user.id, prefs: p }, { onConflict: 'user_id' });

    function dashLayout() {
      const d = userPrefs().dash || {};
      const known = dashCards.map(c => c[0]);
      const order = (d.order || []).filter(k => known.includes(k));
      // Nieuwe kaarten op hun standaardplek invoegen (na de kaart die er standaard voor staat)
      known.forEach((k, i) => {
        if (order.includes(k)) return;
        let at = order.length;
        for (let j = i - 1; j >= 0; j--) { const pos = order.indexOf(known[j]); if (pos >= 0) { at = pos + 1; break; } }
        order.splice(at, 0, k);
      });
      return { order, off: (d.off || []).filter(k => known.includes(k)) };
    }

      const plan = trainingPlan();
      if (plan) {
        const idx = (new Date().getDay() + 6) % 7;

      try {

    function renderYearCard() {
      const p = getProgress();
      const year = new Date().getFullYear();
      const today = todayStr();
      const byDate = {};
      p.days.forEach(d => { byDate[d.date] = d.score; });
      // reeks: dagen met dagscore 50+ achter elkaar (vandaag telt mee als hij al 50+ is)
      let cur = 0, best = 0, run = 0;
      p.days.forEach(d => { if (d.score >= 50) { run++; best = Math.max(best, run); } else if (d.date !== today) run = 0; });
      for (let i = p.days.length - 1; i >= 0; i--) {
        const d = p.days[i];
        if (d.score >= 50) cur++;
        else if (d.date === today) continue;
        else break;
      }
      const months = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      const color = s => s === undefined ? '#0d0d0d' : s >= 60 ? '#e5484d' : s >= 35 ? '#7f1d1d' : s > 0 ? '#3a1414' : '#141414';
      const rows = months.map((m, mi) => {
        const len = new Date(year, mi + 1, 0).getDate();
        let cells = '';
        for (let d = 1; d <= 31; d++) {
          if (d > len) { cells += '<i class="yr-x"></i>'; continue; }
          const ds = `${year}-${String(mi + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells += `<i style="background: ${color(byDate[ds])};${ds === today ? ' outline: 1px solid #fafafa;' : ''}" title="${d} ${m}${byDate[ds] !== undefined ? ': dagscore ' + byDate[ds] : ''}"></i>`;
        }
        return `<div class="yr-row"><span>${m}</span><div class="yr-cells">${cells}</div></div>`;
      }).join('');
      return `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="label" style="margin: 0;">${year} in dagen</label>
            <span style="font-size: 11px; color: #8a8a8a;">reeks <b style="color: #fafafa;">${cur}</b> · beste <b style="color: #fafafa;">${best}</b></span>

          <div class="yr-leg"><span>Dagscore</span><i style="background: #141414;"></i><i style="background: #3a1414;"></i><i style="background: #7f1d1d;"></i><i style="background: #e5484d;"></i><span>laag → hoog · reeks = dagen met 50+</span></div>
        </div>`;
    }

    // ============================================
    // TIMERS: rust (training), ademhaling (Rust), koude douche (Koud)
    // De timers staan buiten de app-weergave, zodat ze blijven lopen als de pagina opnieuw tekent.
    // ============================================
    let audioCtx = null;
    function timerBeep(times) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < (times || 1); i++) {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
          const t = audioCtx.currentTime + i * 0.3;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          o.start(t); o.stop(t + 0.22);
        }
      } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    }
    function timerUnlockAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
    const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

    // ---- Rusttimer (training) ----
    let restTick = null;
    function startRest(label) {
      timerUnlockAudio();
      const sec = Number(userPrefs().rest) || 90;
      state.rest = { end: Date.now() + sec * 1000, total: sec, label: label || '' };
      drawRest();
      clearInterval(restTick);
      restTick = setInterval(drawRest, 250);
    }
    function restAdjust(d) {
      const r = state.rest; if (!r) return;
      r.end += d * 1000; r.total = Math.max(15, r.total + d);
      saveUserPrefs({ rest: Math.max(15, Math.min(600, (Number(userPrefs().rest) || 90) + d)) });
      drawRest();
    }
    function stopRest() {
      clearInterval(restTick); restTick = null; state.rest = null;
      document.body.classList.remove('rest-on');
      const el = document.getElementById('pf-rest'); if (el) el.remove();
    }
    function drawRest() {
      const r = state.rest; if (!r) return;
      let el = document.getElementById('pf-rest');
      if (!el) {
        el = document.createElement('div'); el.id = 'pf-rest'; el.setAttribute('role', 'timer');
        document.body.classList.add('rest-on');
        el.innerHTML = `<div class="rt-top"><div style="flex: 1; min-width: 0;"><div class="rt-l" id="rt-l"></div><div class="rt-t" id="rt-t"></div></div>
          <button onclick="restAdjust(-15)" aria-label="15 seconden minder">−15</button><button onclick="restAdjust(15)" aria-label="15 seconden meer">+15</button><button class="rt-skip" onclick="stopRest()">Skip</button></div>
          <div class="rt-bar"><span id="rt-b"></span></div>`;
        document.body.appendChild(el);
      }
      const left = (r.end - Date.now()) / 1000;
      if (left <= 0) {
        if (!r.doneAt) { r.doneAt = Date.now(); timerBeep(2); }
        el.classList.add('done');
        document.getElementById('rt-l').textContent = 'RUST VOORBIJ';
        document.getElementById('rt-t').textContent = 'Volgende set!';
        document.getElementById('rt-b').style.width = '100%';
        if (Date.now() - r.doneAt > 4000) stopRest();
        return;
      }
      el.classList.remove('done');
      document.getElementById('rt-l').textContent = 'RUST' + (r.label ? ' · ' + r.label : '');
      document.getElementById('rt-t').textContent = fmtClock(left);
      document.getElementById('rt-b').style.width = Math.min(100, (1 - left / r.total) * 100) + '%';
    }
    // Na het invullen van de reps van een werkset start de rust vanzelf
    function tcRepsDone(ei, si, value) {
      if (si < 1 || !String(value).trim()) return;
      const ex = state.ts && state.ts.exercises && state.ts.exercises[ei];
      startRest(ex ? ex.name + ' · set ' + si : 'set ' + si);
    }

    // ---- Ademhaling & koude douche ----
    let htTick = null;
    const breathPhases = [['Adem in', 4], ['Vasthouden', 4], ['Adem uit', 4], ['Vasthouden', 4]];
    function openHabitTimer(kind) {
      timerUnlockAudio();
      state.showHabitModal = null; render();
      const p = userPrefs();
      state.htimer = { kind, dur: kind === 'breath' ? (p.breathDur || 300) : (p.coldDur || 60), running: false, start: 0, pausedAt: 0, done: false };
      drawHabitTimer();
    }
    function htSetDur(sec) { const t = state.htimer; if (!t || t.running) return; t.dur = sec; drawHabitTimer(); }
    function htStart() {
      const t = state.htimer; if (!t) return;
      timerUnlockAudio();
      if (t.pausedAt) { t.start += Date.now() - t.pausedAt; t.pausedAt = 0; }
      else { t.start = Date.now(); saveUserPrefs(t.kind === 'breath' ? { breathDur: t.dur } : { coldDur: t.dur }); }
      t.running = true;
      clearInterval(htTick); htTick = setInterval(drawHabitTimer, 200);
      drawHabitTimer();
    }
    function htPause() { const t = state.htimer; if (!t || !t.running) return; t.running = false; t.pausedAt = Date.now(); clearInterval(htTick); drawHabitTimer(); }
    function closeHabitTimer() {
      clearInterval(htTick); htTick = null;
      const t = state.htimer;
      // koude douche: ook een onvoltooide poging telt mee als "vorige keer"
      if (t && t.kind === 'cold' && t.start && !t.done) {
        const el = Math.round(((t.pausedAt || Date.now()) - t.start) / 1000);
        if (el >= 10) { const c = userPrefs().cold || {}; saveUserPrefs({ cold: { last: el, best: Math.max(c.best || 0, el) } }); }
      }
      state.htimer = null;
      const el = document.getElementById('pf-htimer'); if (el) el.remove();
    }
    async function htFinish() {
      const t = state.htimer; if (!t || t.done) return;
      t.done = true; t.running = false; clearInterval(htTick);
      timerBeep(3);
      const key = t.kind === 'breath' ? 'meditation' : 'coldShower';
      if (t.kind === 'cold') { const c = userPrefs().cold || {}; saveUserPrefs({ cold: { last: t.dur, best: Math.max(c.best || 0, t.dur) } }); }
      if (!state.habits[key]) await toggleHabit(key);
      drawHabitTimer();
    }
    function drawHabitTimer() {
      const t = state.htimer; if (!t) return;
      let el = document.getElementById('pf-htimer');
      if (!el) { el = document.createElement('div'); el.id = 'pf-htimer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
      const elapsed = t.start ? ((t.pausedAt || Date.now()) - t.start) / 1000 : 0;
      const left = Math.max(0, t.dur - elapsed);
      if (t.running && left <= 0) { htFinish(); return; }
      const cold = t.kind === 'cold';
      const opts = cold ? [[30, '30 sec'], [60, '1 min'], [120, '2 min'], [180, '3 min']] : [[180, '3 min'], [300, '5 min'], [600, '10 min'], [900, '15 min']];
      const c = userPrefs().cold || {};
      let middle;
      if (t.done) {
        middle = `<div class="ht-done">✓</div><div class="ht-msg">${cold ? 'Klaar! Goed gedaan.' : 'Klaar. Merk hoe je je nu voelt.'}</div><div class="ht-sub">${cold ? 'Koud' : 'Rust'} is afgevinkt bij je gewoontes.</div>`;
      } else if (!cold) {
        const cyc = breathPhases.reduce((a, p) => a + p[1], 0);
        const inCyc = elapsed % cyc;
        let acc = 0, ph = breathPhases[0], phLeft = 4, phIdx = 0;
        for (let i = 0; i < breathPhases.length; i++) { if (inCyc < acc + breathPhases[i][1]) { ph = breathPhases[i]; phIdx = i; phLeft = acc + breathPhases[i][1] - inCyc; break; } acc += breathPhases[i][1]; }
        const prog = 1 - phLeft / ph[1];
        const scale = !t.start ? 0.6 : phIdx === 0 ? 0.6 + 0.4 * prog : phIdx === 1 ? 1 : phIdx === 2 ? 1 - 0.4 * prog : 0.6;
        middle = `
          <div class="ht-box"><div class="ht-sq" style="transform: scale(${scale.toFixed(3)});"></div>
            <div class="ht-in"><div class="ht-ph">${t.start ? ph[0] : 'Klaar?'}</div><div class="ht-n">${t.start ? Math.ceil(phLeft) : '4·4·4·4'}</div></div></div>
          <div class="ht-steps">${['IN 4', 'VAST 4', 'UIT 4', 'VAST 4'].map((s, i) => `<span style="color: ${t.start && i === phIdx ? '#fafafa' : '#525252'};">${s}</span>`).join('')}</div>
          <div class="ht-sub">${fmtClock(left)} over${t.start ? ' · ronde ' + (Math.floor(elapsed / cyc) + 1) : ''}</div>`;
      } else {
        middle = `
          <div class="ht-clock">${fmtClock(left)}</div>
          <div class="ht-bar"><span style="width: ${t.dur ? Math.min(100, elapsed / t.dur * 100) : 0}%;"></span></div>
          <div class="ht-sub">Rustig uitademen door je mond. Langzaam opbouwen gaat voor lang.</div>
          ${c.last ? `<div class="ht-sub" style="color: #737373;">Vorige keer: ${fmtClock(c.last)} · beste: ${fmtClock(c.best || c.last)}</div>` : ''}`;
      }
      el.className = cold ? 'cold' : 'breath';
      // Alleen het middenstuk vernieuwen zolang de knoppen hetzelfde blijven (anders mis je soms een tik)
      const struct = [t.kind, t.dur, !!t.start, t.running, !!t.pausedAt, t.done].join('|');
      const mid = document.getElementById('ht-mid');
      if (mid && el.dataset.struct === struct) { mid.innerHTML = middle; return; }
      el.dataset.struct = struct;
      el.innerHTML = `
        <div class="ht-card">
          <button class="ht-x" onclick="closeHabitTimer()" aria-label="Sluiten">✕</button>
          <div class="ht-title">${cold ? 'Koud douchen' : 'Rust · box breathing'}</div>
          ${!t.start && !t.done ? `<div class="ht-opts">${opts.map(([s, l]) => `<button class="${t.dur === s ? 'on' : ''}" onclick="htSetDur(${s})">${l}</button>`).join('')}</div>` : ''}
          <div id="ht-mid">${middle}</div>
          ${t.done ? `<button class="ht-main" onclick="closeHabitTimer()">Sluiten</button>`
            : t.running ? `<button class="ht-sec" onclick="htPause()">Pauze</button>`
            : `<button class="ht-main" onclick="htStart()">${t.pausedAt ? 'Verder' : 'Start'}</button>`}
        </div>`;
    }

    // ============================================
    // LICHAAM: VOORTGANGSFOTO'S (privé in Supabase Storage)
    // ============================================
    const PHOTO_BUCKET = 'progress-photos';
    const photoPoses = [['voor', 'Voor'], ['zij', 'Zij'], ['achter', 'Achter']];
    async function loadPhotosAndBlood() {
      if (!state.user) return;
      const ph = await supabaseClient.from('progress_photos').select('*').eq('user_id', state.user.id).order('date', { ascending: true });
      state.photosError = !!ph.error; state.photos = ph.error ? [] : (ph.data || []);
      const bl = await supabaseClient.from('blood_tests').select('*').eq('user_id', state.user.id).order('date', { ascending: true });
      state.bloodError = !!bl.error; state.bloodTests = bl.error ? [] : (bl.data || []);
    }
    state.photoUrls = {};
    async function photoUrlsFor(list) {
      const need = list.filter(p => p && !state.photoUrls[p.path]);
      if (!need.length) return;
      const res = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrls(need.map(p => p.path), 3600);
      if (res.error || !res.data) return;
      res.data.forEach(r => { if (r.signedUrl) state.photoUrls[r.path] = r.signedUrl; });
      render();
    }
    // Foto verkleinen (max 1080 px, jpg) zodat hij snel laadt en weinig ruimte kost
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1080, sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob(b => b ? resolve(b) : reject(new Error('Kon foto niet verwerken')), 'image/jpeg', 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Dit bestand is geen foto')); };
        img.src = url;
      });
    }
    async function uploadPhoto(input) {
      const file = input.files && input.files[0]; input.value = '';
      if (!file || !state.user) return;
      const pose = state.photoPose || 'voor';
      showToast('Foto uploaden...');
      try {
        const blob = await shrinkImage(file);
        const date = todayStr();
        const path = `${state.user.id}/${date}-${pose}-${Date.now()}.jpg`;
        const up = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        const ins = await supabaseClient.from('progress_photos').insert([{ user_id: state.user.id, date, pose, path }]);
        if (ins.error) throw ins.error;
        await loadPhotosAndBlood(); render(); showToast('📸 Foto opgeslagen');
      } catch (e) {
        alert('Uploaden mislukt: ' + (e.message || e) + '\n\nHeb je update-okt.sql al uitgevoerd in Supabase?');
      }
    }
    async function deletePhoto(id) {
      const p = (state.photos || []).find(x => x.id === id); if (!p) return;
      if (!confirm('Deze foto verwijderen?')) return;
      await supabaseClient.storage.from(PHOTO_BUCKET).remove([p.path]);
      await supabaseClient.from('progress_photos').delete().eq('id', id);
      state.photoView = null; state.photoCmp = null;
      await loadPhotosAndBlood(); render();
    }
    function photoWeight(date) {
      const list = bodyEntriesFor('weight').filter(e => e.date <= date);
      return list.length ? list[list.length - 1].value : null;
    }
    function renderPhotos(embed) {
      const pose = state.photoPose || 'voor';
      const list = (state.photos || []).filter(p => p.pose === pose);
      const cmp = state.photoCmp && state.photoCmp.pose === pose ? state.photoCmp : null;
      const a = cmp ? list.find(p => p.id === cmp.a) : list[0];
      const b = cmp ? list.find(p => p.id === cmp.b) : list[list.length - 1];
      photoUrlsFor([a, b, ...list.slice(-12)]);
      const img = (p) => p && state.photoUrls[p.path] ? `<img src="${esc(state.photoUrls[p.path])}" alt="Voortgangsfoto ${esc(p.date)}" loading="lazy">` : `<span>${p ? 'laden…' : 'nog geen foto'}</span>`;
      const cap = (p, other) => {
        if (!p) return '';
        const w = photoWeight(p.date), wo = other ? photoWeight(other.date) : null;
        const d = w !== null && wo !== null && other !== p ? Math.round((w - wo) * 10) / 10 : null;
        return `${fmtDateShort(p.date)}${w !== null ? ' · ' + fmtVal(w) + ' kg' : ''}${d ? ` <b style="color: ${d < 0 ? '#22c55e' : '#a3a3a3'};">${d > 0 ? '+' : ''}${fmtVal(d)}</b>` : ''}`;
      };
      const viewing = state.photoView ? (state.photos || []).find(p => p.id === state.photoView) : null;
      return `
        ${embed ? '' : renderBodyHeader()}
        ${state.photosError ? `<div class="info-box"><div class="info-title">⚠️ Nog één update</div><div class="info-text">Voer update-okt.sql uit in Supabase om foto's op te slaan.</div></div>` : ''}
        <div class="ph-poses">${photoPoses.map(([k, l]) => `<button class="${pose === k ? 'on' : ''}" onclick="state.photoPose = '${k}'; state.photoCmp = null; render();">${l}</button>`).join('')}</div>
        <div class="card">
          <label class="label">Vergelijk</label>
          <div class="ph-cmp">
            <div><div class="ph-img">${img(a)}</div><div class="ph-cap">${cap(a)}</div></div>
            <div><div class="ph-img">${img(b)}</div><div class="ph-cap">${b && b !== a ? cap(b, a) : ''}</div></div>
          </div>
          ${list.length > 1 ? `<div class="hs-small" style="margin-top: 10px;">Tik op een foto hieronder om hem rechts te zetten.</div>` : ''}
        </div>
        ${list.length ? `
          <label class="label">Alle foto's · ${photoPoses.find(x => x[0] === pose)[1].toLowerCase()}</label>
          <div class="ph-grid">
            ${list.slice().reverse().map(p => `
              <button class="ph-th ${b && b.id === p.id ? 'sel' : ''}" onclick="state.photoCmp = { pose: '${pose}', a: ${JSON.stringify((a || p).id).replace(/"/g, '&quot;')}, b: ${JSON.stringify(p.id).replace(/"/g, '&quot;')} }; render();" oncontextmenu="state.photoView = ${JSON.stringify(p.id).replace(/"/g, '&quot;')}; render(); return false;" aria-label="Foto ${esc(p.date)}">
                <span class="ph-img sm">${img(p)}</span><span class="ph-d">${fmtDateShort(p.date)}</span>
              </button>`).join('')}

        <label class="btn btn-primary ph-up" style="width: 100%; padding: 18px; display: block; text-align: center; box-sizing: border-box; margin-top: 8px;">
          + Nieuwe foto (${photoPoses.find(x => x[0] === pose)[1].toLowerCase()})
          <input type="file" accept="image/*" capture="environment" onchange="uploadPhoto(this)" style="display: none;">
        </label>
        ${b ? `<button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px;" onclick="state.photoView = ${JSON.stringify(b.id).replace(/"/g, '&quot;')}; render();">Rechterfoto groot bekijken / verwijderen</button>` : ''}
        <div class="hs-small" style="margin: 14px 0;">Tip: elke 2 weken, zelfde plek, zelfde licht, 's ochtends. Je foto's zijn privé: alleen jij kunt ze zien.</div>
        ${viewing ? `
          <div class="modal-overlay" onclick="if (event.target === this) { state.photoView = null; render(); }">
            <div class="modal" style="padding: 12px;">
              <div class="ph-img big">${img(viewing)}</div>
              <div class="ph-cap" style="margin: 10px 0;">${cap(viewing)}</div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn btn-secondary" onclick="state.photoView = null; render();">Sluiten</button>
                <button class="btn btn-secondary" style="color: #e5484d;" onclick="deletePhoto(${JSON.stringify(viewing.id).replace(/"/g, '&quot;')})">Verwijderen</button>
              </div>
            </div>
          </div>` : ''}
      `;
    }

    // ============================================
    // LICHAAM: BLOEDWAARDEN
    // ============================================
    const bloodMarkers = [
      ['testo', 'Testosteron (totaal)', 'nmol/L'],
      ['ftesto', 'Vrij testosteron', 'pmol/L'],
      ['shbg', 'SHBG', 'nmol/L'],
      ['vitd', 'Vitamine D (25-OH)', 'nmol/L'],
      ['ferritine', 'Ferritine', 'µg/L'],
      ['hb', 'Hemoglobine', 'mmol/L'],
      ['tsh', 'TSH (schildklier)', 'mU/L'],
      ['hba1c', 'HbA1c', 'mmol/mol'],
      ['ldl', 'LDL-cholesterol', 'mmol/L'],
      ['zink', 'Zink', 'µmol/L']
    ];
    function bloodMarkerName(k) { const m = bloodMarkers.find(x => x[0] === k); return m ? m[1] : k.replace(/^c_/, ''); }
    function bloodNum(v) { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; }
    function bloodStatus(m) {
      const v = bloodNum(m.v), lo = bloodNum(m.lo), hi = bloodNum(m.hi);
      if (v === null || (lo === null && hi === null)) return '';
      if (lo !== null && v < lo) return '<span class="bl-st low">onder referentie</span>';
      if (hi !== null && v > hi) return '<span class="bl-st high">boven referentie</span>';
      return '<span class="bl-st ok">binnen referentie</span>';
    }
    function openBloodForm(id) {
      const t = id ? (state.bloodTests || []).find(x => x.id === id) : null;
      const prev = (state.bloodTests || [])[(state.bloodTests || []).length - 1];
      const markers = {};
      bloodMarkers.forEach(([k, , unit]) => {
        const old = t && t.markers && t.markers[k];
        const p = prev && prev.markers && prev.markers[k];
        markers[k] = { v: old ? old.v : '', unit: (old && old.unit) || (p && p.unit) || unit, lo: old ? old.lo : (p ? p.lo : ''), hi: old ? old.hi : (p ? p.hi : '') };
      });
      const custom = t ? Object.keys(t.markers || {}).filter(k => k.startsWith('c_')).map(k => ({ name: k.slice(2), ...t.markers[k] })) : [];
      state.bloodForm = { id: t ? t.id : null, date: t ? t.date : todayStr(), note: t ? (t.note || '') : '', markers, custom };
      render(); window.scrollTo(0, 0);
    }
    function bfSet(k, f, v) { if (state.bloodForm) state.bloodForm.markers[k][f] = v; }
    function bfCustom(i, f, v) { if (state.bloodForm) state.bloodForm.custom[i][f] = v; }
    function bfAddCustom() { state.bloodForm.custom.push({ name: '', v: '', unit: '', lo: '', hi: '' }); render(); }
    async function saveBloodTest() {
      const f = state.bloodForm; if (!f || !state.user) return;
      const markers = {};
      Object.entries(f.markers).forEach(([k, m]) => { if (String(m.v).trim()) markers[k] = { v: String(m.v).trim(), unit: m.unit, lo: String(m.lo || '').trim(), hi: String(m.hi || '').trim() }; });
      f.custom.forEach(c => { if (String(c.name).trim() && String(c.v).trim()) markers['c_' + String(c.name).trim()] = { v: String(c.v).trim(), unit: c.unit, lo: String(c.lo || '').trim(), hi: String(c.hi || '').trim() }; });
      if (!Object.keys(markers).length) { alert('Vul minstens één waarde in.'); return; }
      const row = { user_id: state.user.id, date: f.date || todayStr(), markers, note: f.note || '' };
      const res = f.id ? await supabaseClient.from('blood_tests').update(row).eq('id', f.id) : await supabaseClient.from('blood_tests').insert([row]);
      if (res.error) { alert('Opslaan mislukt: ' + res.error.message + '\n\nHeb je update-okt.sql al uitgevoerd in Supabase?'); return; }
      state.bloodForm = null; await loadPhotosAndBlood(); render(); window.scrollTo(0, 0); showToast('🩸 Uitslag opgeslagen');
    }
    async function deleteBloodTest(id) {
      if (!confirm('Deze uitslag verwijderen?')) return;
      await supabaseClient.from('blood_tests').delete().eq('id', id);
      state.bloodForm = null; await loadPhotosAndBlood(); render();
    }
    function renderBloodForm() {
      const f = state.bloodForm;
      const row = (k, name, m, i) => `
        <div class="bl-frow">
          <div class="bl-fname">${i === undefined ? esc(name) : `<input class="form-input" placeholder="Naam" value="${esc(m.name)}" oninput="bfCustom(${i}, 'name', this.value)">`}</div>
          <div class="bl-fgrid">
            <label>Waarde<input class="form-input" inputmode="decimal" value="${esc(m.v)}" oninput="${i === undefined ? `bfSet('${k}', 'v', this.value)` : `bfCustom(${i}, 'v', this.value)`}"></label>
            <label>Eenheid<input class="form-input" value="${esc(m.unit)}" oninput="${i === undefined ? `bfSet('${k}', 'unit', this.value)` : `bfCustom(${i}, 'unit', this.value)`}"></label>
            <label>Ref. min<input class="form-input" inputmode="decimal" value="${esc(m.lo)}" oninput="${i === undefined ? `bfSet('${k}', 'lo', this.value)` : `bfCustom(${i}, 'lo', this.value)`}"></label>
            <label>Ref. max<input class="form-input" inputmode="decimal" value="${esc(m.hi)}" oninput="${i === undefined ? `bfSet('${k}', 'hi', this.value)` : `bfCustom(${i}, 'hi', this.value)`}"></label>
          </div>
        </div>`;
      return `
        <button class="entry-action" style="margin-bottom: 14px;" onclick="state.bloodForm = null; render(); window.scrollTo(0, 0);">← Terug</button>
        <div class="page-header" style="margin-bottom: 12px;"><div class="page-sub">Bloedwaarden</div><div class="page-title">${f.id ? 'Uitslag bewerken' : 'Nieuwe uitslag'}</div></div>
        <div class="card">
          <label class="label" for="bl-date">Datum van afname</label>
          <input type="date" id="bl-date" class="form-input" value="${esc(f.date)}" onchange="state.bloodForm.date = this.value">
          <div class="hs-small" style="margin-top: 10px;">Vul alleen in wat je hebt laten meten. De referentie (min/max) staat op de uitslag van je lab; die verschilt per lab. Je vorige referentie wordt alvast ingevuld.</div>
        </div>
        <div class="card" style="padding-top: 6px;">
          ${bloodMarkers.map(([k, name]) => row(k, name, f.markers[k])).join('')}
          ${f.custom.map((c, i) => row(null, null, c, i)).join('')}
          <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 12px;" onclick="bfAddCustom()">+ Eigen waarde</button>
        </div>
        <div class="card"><label class="label" for="bl-note">Notitie (optioneel)</label><textarea id="bl-note" class="textarea" style="min-height: 70px;" placeholder="Bijv. nuchter, 's ochtends om 8:00" oninput="state.bloodForm.note = this.value">${esc(f.note)}</textarea></div>
        <button class="btn btn-primary" style="width: 100%; padding: 18px;" onclick="saveBloodTest()">Opslaan</button>
        ${f.id ? `<button class="btn btn-secondary" style="width: 100%; margin-top: 8px; color: #e5484d;" onclick="deleteBloodTest(${JSON.stringify(f.id).replace(/"/g, '&quot;')})">Uitslag verwijderen</button>` : ''}`;
    }
    function renderBlood() {
      if (state.bloodForm) return renderBloodForm();
      const tests = state.bloodTests || [];
      const keys = [];
      tests.forEach(t => Object.keys(t.markers || {}).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
      const sel = keys.includes(state.bloodSel) ? state.bloodSel : keys[0];
      const pts = tests.filter(t => t.markers && t.markers[sel] && bloodNum(t.markers[sel].v) !== null).map(t => ({ date: t.date, m: t.markers[sel], v: bloodNum(t.markers[sel].v) }));
      const last = pts[pts.length - 1];
      const lo = last ? bloodNum(last.m.lo) : null, hi = last ? bloodNum(last.m.hi) : null;
      const max = Math.max(...pts.map(p => p.v), hi || 0) * 1.1 || 1;
      const latest = tests[tests.length - 1];
      return `
        ${renderBodyHeader()}
        ${state.bloodError ? `<div class="info-box"><div class="info-title">⚠️ Nog één update</div><div class="info-text">Voer update-okt.sql uit in Supabase om bloedwaarden op te slaan.</div></div>` : ''}
        ${keys.length ? `
          <div class="ph-poses bl-chips">${keys.map(k => `<button class="${k === sel ? 'on' : ''}" onclick="state.bloodSel = '${esc(k)}'; render();">${esc(bloodMarkerName(k))}</button>`).join('')}</div>
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 14px;">${esc(bloodMarkerName(sel))}</span><span style="font-size: 11px; color: #8a8a8a;">${esc(last ? last.m.unit || '' : '')}</span></div>
            <div class="bl-chart">
              ${hi !== null ? `<div class="bl-ref" style="bottom: ${hi / max * 100}%;"><span>max ${fmtVal(hi)}</span></div>` : ''}
              ${lo !== null ? `<div class="bl-ref" style="bottom: ${lo / max * 100}%;"><span>min ${fmtVal(lo)}</span></div>` : ''}

    function stepsData() { const s = userPrefs().steps || {}; return { goal: Number(s.goal) || 10000, log: s.log || {} }; }
    function stepsOn(date) { const v = stepsData().log[date]; return v === undefined || v === null || v === '' ? null : Number(v); }
    function saveSteps(date, value) {
      const d = stepsData();
      const n = parseInt(String(value).replace(/[^\d]/g, ''), 10);
      const log = { ...d.log };
      if (isNaN(n)) delete log[date]; else log[date] = Math.min(n, 200000);
      saveUserPrefs({ steps: { goal: d.goal, log } });
    }
    function stepsSubmit() {
      const el = document.getElementById('steps-in'); if (!el) return;
      const date = state.stepsYesterday ? dateAdd(todayStr(), -1) : todayStr();
      saveSteps(date, el.value);
      const n = stepsOn(date);
      render();
      if (n !== null) showToast(n >= stepsData().goal ? `👟 ${fmtInt(n)} stappen · doel gehaald!` : `👟 ${fmtInt(n)} stappen opgeslagen`);
    }
    function stepsSetGoal() {
      const d = stepsData();
      const v = prompt('Je dagdoel in stappen:', d.goal);
      if (v === null) return;

      saveUserPrefs({ steps: { goal: n, log: d.log } }); render();
    }

      const pct = cur ? Math.min(100, cur / goal * 100) : 0;
      const days = [];
      for (let i = 6; i >= 0; i--) days.push(dateAdd(todayStr(), -i));
      const max = Math.max(goal, ...days.map(d => stepsOn(d) || 0));
      const wd = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
      return `
        <div class="card" id="dash-steps">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">

            <label class="sr-only" for="steps-in">Aantal stappen ${yest ? 'gisteren' : 'vandaag'}</label>
            <input id="steps-in" class="form-input" type="text" inputmode="numeric" autocomplete="off" placeholder="Stappen ${yest ? 'gisteren' : 'vandaag'}" value="${cur !== null ? cur : ''}">
            <button type="submit" class="btn btn-primary">Opslaan</button>
          </form>
          <div class="st-week" role="img" aria-label="Stappen afgelopen 7 dagen">
            <div class="st-goalline" style="bottom: calc(14px + (100% - 14px) * ${(goal / max).toFixed(3)});"></div>
            ${days.map(d => { const v = stepsOn(d); return `<div class="st-col" title="${d}: ${v !== null ? fmtInt(v) : 'niet ingevuld'}"><span class="st-bar" style="height: ${v ? Math.max(4, v / max * 100) : 0}%; background: ${v !== null && v >= goal ? '#22c55e' : '#525252'};"></span><span class="st-wd">${wd[new Date(d + 'T12:00:00').getDay()]}</span></div>`; }).join('')}

    }
    function bookLesson(id, i, v) {
      const L = { ...bookLessons() };
      const arr = (L[id] || ['', '', '']).slice(0, 3);
      while (arr.length < 3) arr.push('');
      arr[i] = String(v || '').trim().slice(0, 240);
      if (arr.some(Boolean)) L[id] = arr; else delete L[id];

          (files || []).forEach(f => f && f.name && paths.add(uid + '/' + f.name));
        } catch (e) {}
        const all = [...paths];
        for (let i = 0; i < all.length; i += 100) {
          const { error } = await supabaseClient.storage.from('progress-photos').remove(all.slice(i, i + 100));
          if (error) throw new Error("Foto's wissen lukte niet: " + error.message);

        // 3. Alle gegevens en het account zelf

    function fastElapsedMin(f) { return f.start ? Math.max(0, Math.floor((Date.now() - new Date(f.start).getTime()) / 60000)) : 0; }
    function fastFmt(min) { return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`; }

    // ============================================
    // KOMPAS: je waarom, visie, identiteit en kwartaaldoelen
    // ============================================
    function compass() { const c = userPrefs().compass; return c && typeof c === 'object' ? c : {}; }
    function compassSet(patch) { saveUserPrefs({ compass: { ...compass(), ...patch, updated: todayStr() }, whyLine: compassWhyLine({ ...compass(), ...patch }) }); }
    function compassHas() { const c = compass(); return !!(c.why || c.identity || (c.goals || []).length); }
    // Korte versie van je waarom (voor meldingen en kleine plekken)
    function compassWhyLine(c) {
      c = c || compass();
      const w = String(c.why || '').trim(); if (!w) return null;
      const first = w.split(/(?<=[.!?])\s/)[0];
      return first.length > 110 ? first.slice(0, 107).trim() + '…' : first;
    }
    function quarterKey(d) { const x = new Date((d || todayStr()) + 'T12:00:00'); return x.getFullYear() + '-Q' + (Math.floor(x.getMonth() / 3) + 1); }
    function compassGoals() { return (compass().goals || []).filter(g => g && g.t); }
    function compassGoalFor(link) { return compassGoals().find(g => (g.links || []).includes(link)) || null; }
    function compassGoalLine(link) {
      const g = compassGoalFor(link); if (!g) return '';
      return `<div class="kp-goalline">🧭 Hoort bij je doel <b>${esc(g.t)}</b>${g.why ? `<span>${esc(g.why)}</span>` : ''}</div>`;
    }
    function compassSaveField(field, v) {
      compassSet({ [field]: String(v || '').trim().slice(0, 600) });
      const el = document.getElementById('kp-saved'); if (el) { el.textContent = '✓ Opgeslagen'; setTimeout(() => { if (el) el.textContent = ''; }, 1500); }
    }
    function compassGoalSet(i, field, v) {
      const goals = (compass().goals || []).slice(0, 3);
      while (goals.length < 3) goals.push({ t: '', why: '', value: '', links: [] });
      goals[i] = { ...goals[i], [field]: typeof v === 'string' ? v.trim().slice(0, 300) : v };
      if (!goals[i].q) goals[i].q = quarterKey();
      compassSet({ goals });
      if (field === 'links' || field === 'value') render();
      else { const el = document.getElementById('kp-saved'); if (el) el.textContent = '✓ Opgeslagen'; }
    }
    function compassToggleLink(i, link) {
      const g = (compass().goals || [])[i] || {};
      const links = (g.links || []).includes(link) ? g.links.filter(x => x !== link) : (g.links || []).concat(link);
      // een gewoonte of challenge hoort bij één doel
      const goals = (compass().goals || []).map((x, j) => j === i ? x : { ...x, links: (x.links || []).filter(l => l !== link) });
      compass().goals && compassSet({ goals });
      compassGoalSet(i, 'links', links);
    }
    function compassLinkOptions() {
      const out = visibleHabitKeys.map(k => ['h:' + k, habitConfig[k].icon + ' ' + habitConfig[k].title]);
      activeChallenges().forEach(c => out.push(['ch:' + c.id, '🏁 ' + c.name]));
      ketenChains().forEach(c => out.push(['k:' + c.id, ketenIcon(c) + ' ' + ketenName(c)]));
      return out;
    }
    function renderCompass() {
      const c = compass();
      const goals = (c.goals || []).slice(0, 3);
      while (goals.length < 3) goals.push({ t: '', why: '', value: '', links: [] });
      const vtop = latestValues();
      const vals = vtop ? vtop.top : valueOptions.slice(0, 12);
      const opts = compassLinkOptions();
      const ta = (id, field, ph, rows) => `<textarea id="${id}" class="form-input kp-ta" rows="${rows || 3}" placeholder="${esc(ph)}" onchange="compassSaveField('${field}', this.value)">${esc(c[field] || '')}</textarea>`;
      const q = quarterKey();
      const stale = goals.some(g => g.t && g.q && g.q !== q);
      return `
        <div class="page-header" style="margin-bottom: 8px;"><div class="page-sub">Mind</div><div class="page-title">Kompas</div></div>
        <div class="hm-sub">Zonder waarom houdt niets stand. Schrijf het op, dan komt het terug op de momenten die ertoe doen.</div>
        <div class="card kp-card">
          <label class="label" for="kp-why">Waarom ben je hier?</label>
          <div class="hs-small" style="margin: -4px 0 8px;">In je eigen woorden. Wat wil je veranderen, en waarom is dat belangrijk voor je?</div>
          ${ta('kp-why', 'why', 'Bijv. Ik wil een vader zijn waar mijn kinderen tegenop kijken: sterk, rustig en iemand die doet wat hij zegt.', 4)}
        </div>
        <div class="card kp-card">
          <label class="label" for="kp-identity">Wie ben je? · identiteitszin</label>
          <div class="hs-small" style="margin: -4px 0 8px;">Komt bovenaan je dashboard te staan. Begin met "Ik ben iemand die…"</div>
          <input id="kp-identity" class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="140" placeholder="Ik ben iemand die zijn woord houdt, ook tegenover zichzelf." value="${esc(c.identity || '')}" onchange="compassSaveField('identity', this.value)">
        </div>
        <div class="card kp-card">
          <label class="label" for="kp-vision">Over een jaar · je visie</label>
          ${ta('kp-vision', 'vision', 'Hoe ziet je leven eruit over 12 maanden? Lichaam, geest, relaties, werk.', 4)}
        </div>
        <div id="kp-saved" class="hs-small" style="min-height: 16px; margin: -8px 0 8px; color: #22c55e;"></div>
        <label class="label" style="margin: 8px 0 10px;">Doelen dit kwartaal (${q.replace('-Q', ' · Q')})</label>
        ${stale ? `<div class="info-box"><div class="info-title">Nieuw kwartaal</div><div class="info-text">Je doelen zijn van een vorig kwartaal. Kijk of ze nog kloppen, pas ze aan of kies nieuwe.</div></div>` : ''}
        ${goals.map((g, i) => `
          <div class="card kp-goal">
            <div class="kp-gn">Doel ${i + 1}</div>
            <label class="sr-only" for="kp-g${i}">Doel ${i + 1}</label>
            <input id="kp-g${i}" class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="100" placeholder="${['Bijv. 10 kg sterker op de squat', 'Bijv. elke dag 7+ uur slaap', 'Bijv. elke week één avond echt aandacht voor mijn relatie'][i]}" value="${esc(g.t || '')}" onchange="compassGoalSet(${i}, 't', this.value)">
            <label class="sr-only" for="kp-gw${i}">Waarom</label>
            <input id="kp-gw${i}" class="form-input" style="width: 100%; box-sizing: border-box; margin-top: 8px;" maxlength="200" placeholder="Waarom is dit belangrijk voor je?" value="${esc(g.why || '')}" onchange="compassGoalSet(${i}, 'why', this.value)">
            <div class="kp-row">
              <label for="kp-gv${i}">Waarde</label>
              <select id="kp-gv${i}" class="form-input" onchange="compassGoalSet(${i}, 'value', this.value)">
                <option value="">Kies…</option>${vals.map(v => `<option ${g.value === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}
              </select>
            </div>
            ${g.t ? `
            <details class="kp-links" ${state.kpOpen === i ? 'open' : ''} ontoggle="if (this.open) state.kpOpen = ${i};">
              <summary>Gewoontes en challenges die hierbij horen (${(g.links || []).length}) <span class="hm-pm" aria-hidden="true"></span></summary>
              <div class="kp-chips">${opts.map(([k, l]) => `<button class="${(g.links || []).includes(k) ? 'on' : ''}" aria-pressed="${(g.links || []).includes(k)}" onclick="compassToggleLink(${i}, '${k}')">${esc(l)}</button>`).join('')}</div>
            </details>` : ''}
          </div>`).join('')}
        ${!vtop ? `<div class="hs-small" style="margin: 0 0 12px;">Tip: doe eerst de <a href="#" onclick="openValues(); return false;" style="color: #e5484d;">waarden-opdracht</a>, dan kies je hier uit je eigen top 5.</div>` : ''}
        <div class="card card-accent" style="cursor: pointer;" onclick="reviewStart()">
          <label class="label">📋 Wekelijkse review</label>
          <div class="su-txt">${reviewDue() ? 'Je review staat klaar: 10 minuten terugkijken en één focus kiezen.' : currentFocus() ? 'Focus deze week: <b style="color: #fafafa;">' + esc(currentFocus().text) + '</b>' : 'Elke zondag: terugkijken, bijsturen en één focus kiezen.'}</div>
          <div style="font-size: 11px; color: #e5484d; margin-top: 10px;">${reviewDue() ? 'Start je review →' : 'Review openen →'}</div>
        </div>
        <div class="card" style="cursor: pointer;" onclick="state.review90 = true; setSection('review');">
          <label class="label">⏳ Wie was je 90 dagen geleden?</label>
          <div class="su-txt">Vergelijk jezelf nu met drie maanden terug: dagscore, slaap, training, gewicht en wat je toen schreef →</div>
        </div>`;
    }

    // ============================================
    // WEKELIJKSE REVIEW: ritueel met je waarom, goed/lastig en één focus
    // ============================================
    function reviews() { const r = userPrefs().reviews; return r && typeof r === 'object' ? r : {}; }
    // Welke week review je nu? Zondag: deze week. Maandag/dinsdag: vorige week als die nog open staat.
    function reviewTargetWeek() {
      const today = todayStr(), dow = new Date().getDay();
      const thisW = weekKey(today), lastW = weekKey(dateAdd(today, -7));
      if ((dow === 1 || dow === 2) && !reviews()[lastW]) return lastW;
      return thisW;
    }
    function reviewDue() {
      const dow = new Date().getDay(), today = todayStr();
      if (dow === 1 || dow === 2) return !reviews()[weekKey(dateAdd(today, -7))];   // ma/di: vorige week nog open
      if (dow === 0 || dow === 6) return !reviews()[weekKey(today)];               // za/zo: deze week
      return false;
    }
    function currentFocus() {
      const wk = weekKey(todayStr());
      const r = Object.values(reviews()).filter(x => x && x.forWeek === wk && x.focus).sort((a, b) => String(b.at).localeCompare(String(a.at)))[0];
      return r ? { text: r.focus, goal: r.focusGoal || '', from: r } : null;
    }
    function reviewStart() {
      const wk = reviewTargetWeek();
      const ex = reviews()[wk] || {};
      const prevFocus = Object.values(reviews()).find(x => x && x.forWeek === wk && x.focus);
      state.rv = { wk, rate: ex.rate || 6, last: ex.last || '', good: ex.good || '', hard: ex.hard || '', focus: ex.focus || '', focusGoal: ex.focusGoal || '', prevFocus: prevFocus ? prevFocus.focus : '' };
      state.review90 = false;
      setSection('review'); window.scrollTo(0, 0);
    }
    function rvSet(f, v) { if (state.rv) state.rv[f] = v; }
    function reviewSave() {
      const r = state.rv; if (!r) return;
      ['good', 'hard', 'focus'].forEach(f => { const el = document.getElementById('rv-' + f); if (el) r[f] = el.value.trim().slice(0, 500); });
      if (!r.focus) { alert('Kies je ene focus voor volgende week. Dat is het belangrijkste deel van je review.'); return; }
      const all = { ...reviews() };
      const was = all[r.wk];
      all[r.wk] = { rate: Number(r.rate), last: r.last, good: r.good, hard: r.hard, focus: r.focus, focusGoal: r.focusGoal, forWeek: dateAdd(r.wk, 7), at: (was && was.at) || todayStr() };
      // focus geldt voor de week ná de reviewweek; review je op zondag, dan is dat morgen
      saveUserPrefs({ reviews: all });
      progressCache = null;
      state.rv = null;
      setSection('dashboard');
      showToast(was ? '✓ Review bijgewerkt' : `✓ Review klaar · +${XP.review} XP`);
      try { buddyPushSnapshot && buddyPushSnapshot(); } catch (e) {}
    }
    function renderReview() {
      if (state.review90 || !state.rv) return `
        <button class="entry-action" style="margin-bottom: 14px;" onclick="setSection('kompas')">← Kompas</button>
        <div class="page-header" style="margin-bottom: 12px;"><div class="page-sub">Terugblik</div><div class="page-title">90 dagen</div></div>
        ${renderLookback90()}`;
      const r = state.rv;
      const c = compass();
      const w = computeWeek(r.wk === weekKey(todayStr()) ? 0 : 1);
      const goals = compassGoals();
      const opt = (f, v, l) => `<button class="${r[f] === v ? 'on' : ''}" aria-pressed="${r[f] === v}" onclick="rvSet('${f}', '${v}'); render();">${l}</button>`;
      const is13 = Object.keys(reviews()).length > 0 && (Object.keys(reviews()).length + 1) % 13 === 0;
      return `
        <button class="entry-action" style="margin-bottom: 14px;" onclick="state.rv = null; setSection('kompas')">← Kompas</button>
        <div class="page-header" style="margin-bottom: 8px;"><div class="page-sub">Week ${w.week}</div><div class="page-title">Review</div></div>
        <div class="hm-sub">10 minuten. Kijk terug, stuur bij, kies één focus.</div>
        <div class="card kp-why-card">
          <label class="label">1 · Je waarom</label>
          ${c.why ? `<div class="kp-quote">${esc(c.why)}</div>` : `<div class="su-txt">Je hebt je waarom nog niet opgeschreven. <a href="#" onclick="setSection('kompas'); return false;" style="color: #e5484d;">Doe dat in je Kompas →</a></div>`}
          ${c.identity ? `<div class="kp-id">${esc(c.identity)}</div>` : ''}
          <div class="rv-q">Leefde je er deze week naar?</div>
          <div class="rv-rate"><input type="range" min="1" max="10" value="${r.rate}" oninput="rvSet('rate', this.value); document.getElementById('rv-rate-v').textContent = this.value;" aria-label="Cijfer 1 tot 10"><b id="rv-rate-v">${r.rate}</b></div>
        </div>
        <div class="card">
          <label class="label">2 · Je week in cijfers</label>
          <div class="rv-stats"><div><b>${w.avg}</b><span>gem. dagscore</span></div><div><b>+${fmtInt(w.xp)}</b><span>XP</span></div><div><b>${w.workouts.length}</b><span>trainingen</span></div><div><b>${w.journals}</b><span>journal</span></div></div>
          ${r.prevFocus ? `
            <div class="rv-q" style="margin-top: 14px;">Je focus was: <b style="color: #fafafa;">${esc(r.prevFocus)}</b>. Gehaald?</div>
            <div class="rv-seg">${opt('last', 'ja', 'Ja')}${opt('last', 'deels', 'Deels')}${opt('last', 'nee', 'Nee')}</div>` : ''}
        </div>
        <div class="card">
          <label class="label" for="rv-good">3 · Wat ging goed?</label>
          <textarea id="rv-good" class="form-input kp-ta" rows="3" placeholder="Waar ben je trots op?" onchange="rvSet('good', this.value)">${esc(r.good)}</textarea>
          <label class="label" for="rv-hard" style="margin-top: 14px;">Wat hield je tegen?</label>
          <textarea id="rv-hard" class="form-input kp-ta" rows="3" placeholder="Eerlijk zijn mag. Wat was het echte obstakel?" onchange="rvSet('hard', this.value)">${esc(r.hard)}</textarea>
        </div>
        <div class="card kp-focus-card">
          <label class="label" for="rv-focus">4 · Je ene focus voor volgende week</label>
          <div class="hs-small" style="margin: -4px 0 8px;">Eén ding. Concreet genoeg dat je zondag weet of het gelukt is. Staat de hele week bovenaan je dashboard.</div>
          <input id="rv-focus" class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="120" placeholder="Bijv. elke avond om 22:30 scherm weg" value="${esc(r.focus)}" onchange="rvSet('focus', this.value)">
          ${goals.length ? `<div class="kp-row"><label for="rv-goal">Bij doel</label><select id="rv-goal" class="form-input" onchange="rvSet('focusGoal', this.value)"><option value="">Geen</option>${goals.map(g => `<option ${r.focusGoal === g.t ? 'selected' : ''}>${esc(g.t)}</option>`).join('')}</select></div>` : ''}
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 16px;" onclick="reviewSave()">Review afronden${reviews()[r.wk] ? '' : ` · +${XP.review} XP`}</button>
        ${is13 ? `<div class="card" style="margin-top: 14px; cursor: pointer; border-left: 3px solid #d9a441;" onclick="state.review90 = true; render(); window.scrollTo(0, 0);"><label class="label">⏳ Kwartaal-terugblik</label><div class="su-txt">Je 13e review: tijd om terug te kijken op de afgelopen 90 dagen en je kompas bij te stellen →</div></div>` : `<button class="hm-go" style="margin-top: 10px;" onclick="state.review90 = true; render(); window.scrollTo(0, 0);">Of bekijk: wie was je 90 dagen geleden? →</button>`}`;
    }
    // Dashboardkaart: je focus van deze week en of je review klaarstaat
    function renderFocusCard() {
      const f = currentFocus();
      const id = compass().identity;
      const due = reviewDue();
      if (!f && !due && !compassHas()) return `
        <div class="card kp-dash" style="cursor: pointer;" onclick="setSection('kompas')">
          <label class="label">🧭 Kompas</label>
          <div class="su-txt">Zonder waarom houdt niets stand. Schrijf in 2 minuten op waarom je dit doet en wie je wilt zijn →</div>
        </div>`;
      if (!f && !due) return '';
      return `
        <div class="card kp-dash">
          ${f ? `<label class="label">Focus deze week</label><div class="kp-focus">${esc(f.text)}</div>${f.goal ? `<div class="hs-small" style="margin-top: 4px;">🧭 ${esc(f.goal)}</div>` : ''}` : ''}
          ${due ? `<button class="btn btn-primary btn-small" style="width: 100%; margin-top: ${f ? 12 : 0}px;" onclick="reviewStart()">📋 Tijd voor je wekelijkse review · 10 min</button>` : ''}
          ${id && !f && !due ? '' : ''}
        </div>`;
    }

    // 90 dagen terug: jij nu tegenover jij toen (30 dagen rond beide momenten)
    function renderLookback90() {
      const today = todayStr();
      const p = getProgress();
      const win = (endOff) => { const end = dateAdd(today, -endOff), start = dateAdd(end, -29); return [start, end]; };
      const [nS, nE] = win(0), [tS, tE] = win(90);
      const first = p.days.length ? p.days[0].date : today;
      const enough = first <= tE;
      const daysIn = (a, b) => p.days.filter(d => d.date >= a && d.date <= b);
      const avg = (arr, f) => arr.length ? Math.round(arr.reduce((x, d) => x + f(d), 0) / arr.length) : null;
      const sNow = avg(daysIn(nS, nE), d => d.score), sThen = avg(daysIn(tS, tE), d => d.score);
      const xNow = daysIn(nS, nE).reduce((a, d) => a + d.xp, 0), xThen = daysIn(tS, tE).reduce((a, d) => a + d.xp, 0);
      const tr = (a, b) => (state.workouts || []).filter(w => w.date >= a && w.date <= b).length;
      const sl = (a, b) => { const n = sleepNights(a, b); return n.length ? sleepAvg(n) : null; };
      const jr = (a, b) => journaledEntries().filter(e => e.date >= a && e.date <= b).length;
      const wAt = (d) => { const list = (state.bodyStats || []).filter(b => b.weight && b.entry_date <= d).sort((a, b) => b.entry_date.localeCompare(a.entry_date)); return list[0] ? Number(list[0].weight) : null; };
      const rankAt = (d) => { let r = 0; Object.entries(p.achieved || {}).forEach(([n, dt]) => { if (dt <= d) r = Math.max(r, Number(n)); }); return r ? ranks[r - 1].name : '—'; };
      const then = journaledEntries().filter(e => e.date >= dateAdd(today, -97) && e.date <= dateAdd(today, -83)).map(e => ({ e, s: entrySnippet(e) })).find(x => x.s);
      const row = (label, a, b, fmt, better) => {
        const fa = a === null || a === undefined ? '—' : fmt(a), fb = b === null || b === undefined ? '—' : fmt(b);
        let cls = '';
        if (a !== null && b !== null && a !== undefined && b !== undefined && a !== b && better) cls = (better === 'up' ? b > a : b < a) ? 'up' : 'down';
        return `<div class="lb-row"><span>${label}</span><span class="lb-then">${fa}</span><span class="lb-now ${cls}">${fb}</span></div>`;
      };
      return `
        ${!enough ? `<div class="info-box"><div class="info-title">Nog even geduld</div><div class="info-text">Je gebruikt de app nog geen 90 dagen. Over ${diffDays(today, dateAdd(first, 90 + 29))} dagen is deze vergelijking compleet. Wat er al is, zie je hieronder.</div></div>` : ''}
        <div class="card">
          <div class="lb-row lb-h"><span></span><span class="lb-then">90 dagen geleden</span><span class="lb-now">Nu</span></div>
          ${row('Gem. dagscore', sThen, sNow, v => v, 'up')}
          ${row('XP in 30 dagen', xThen, xNow, v => fmtInt(v), 'up')}
          ${row('Trainingen', tr(tS, tE), tr(nS, nE), v => v, 'up')}
          ${row('Gem. slaap', sl(tS, tE), sl(nS, nE), v => fmtSleepDur(v), 'up')}
          ${row('Journal-dagen', jr(tS, tE), jr(nS, nE), v => v, 'up')}
          ${row('Gewicht', wAt(tE), wAt(nE), v => fmtVal(v) + ' kg', null)}
          ${row('Rang', rankAt(tE), rankAt(nE), v => v, null)}
          <div class="hs-small" style="margin-top: 10px;">Per periode van 30 dagen. Groen = beter dan toen.</div>
        </div>
        ${then ? `
        <div class="card j-lb">
          <label class="label">Wat je toen schreef · ${formatDate(then.e.date)}</label>
          <div class="j-lb-k">${esc(then.s[0])}</div>
          <div class="j-lb-t">${esc(then.s[1])}</div>
        </div>` : ''}
        <div class="card" style="cursor: pointer;" onclick="state.bodyTab = 'fotos'; setSection('body');">
          <label class="label">📸 Je foto's</label>
          <div class="su-txt">Leg je foto van toen naast die van nu bij Lichaam → Foto's →</div>
        </div>
        <div class="card kp-why-card">
          <label class="label">En je kompas?</label>
          ${compass().why ? `<div class="kp-quote">${esc(compass().why)}</div>` : ''}
          <div class="su-txt" style="margin-top: 8px;">Klopt je waarom nog? Zijn je doelen voor het komende kwartaal scherp?</div>
          <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 12px;" onclick="setSection('kompas')">Naar je kompas</button>
        </div>`;
    }

    // ============================================
    // GEWOONTES LATEN AFSTUDEREN: 60 van 66 dagen = automatisch, dan een niveau omhoog
    // ============================================
    const habitLevels = {
      coldShower: ['30–60 sec koud aan het eind', '2 minuten koud', '3 minuten koud', 'Koud bad of ijsbad, 2–5 minuten'],
      sunlight: ['10 min ochtendlicht', '20 min ochtendlicht', '20 min ochtend + 10 min avondlicht'],
      cleanEating: ['Geen fastfood en frisdrank', 'Ook geen toegevoegde suiker', 'De hele dag alleen onbewerkt'],
      workout: ['30 min bewegen', '45 min training', '60 min zware training'],
      meditation: ['5 min stil', '10 min stil', '20 min stil'],
      noAlcohol: ['Geen alcohol', 'Ook geen alcohol op feestjes en in het weekend'],
      reading: ["10 pagina's", "20 pagina's", "30 pagina's"],
      stretching: ['10 min', '15 min', '20 min + mobility']
    };
    const GRAD_WINDOW = 66, GRAD_NEED = 60;
    function habitLvl(k) { const l = (userPrefs().habitLvl || {})[k]; return l && typeof l === 'object' ? l : { n: 0, since: null }; }
    function habitGradLog() { const g = userPrefs().habitGrad; return g && typeof g === 'object' ? g : {}; }
    function habitGradStats(k) {
      const today = todayStr(), lvl = habitLvl(k);
      const start = lvl.since && lvl.since > dateAdd(today, -(GRAD_WINDOW - 1)) ? lvl.since : dateAdd(today, -(GRAD_WINDOW - 1));
      let done = 0, days = 0;
      for (let d = start; d <= today; d = dateAdd(d, 1)) { days++; const h = d === today ? state.habits : (state.habitHistory || {})[d]; if (h && h[k]) done++; }
      const graduated = (habitGradLog()[k] || []).some(x => x.n === lvl.n);
      const eligible = !graduated && days >= GRAD_WINDOW && done >= GRAD_NEED;
      return { done, days, graduated, eligible, lvl };
    }
    // Wordt bij het laden en na afvinken gecontroleerd
    function habitGradCheck() {
      const log = { ...habitGradLog() }; let fresh = null;
      visibleHabitKeys.forEach(k => {
        const s = habitGradStats(k);
        if (s.eligible) { log[k] = (log[k] || []).concat({ n: s.lvl.n, at: todayStr() }); fresh = k; }
      });
      if (fresh) { saveUserPrefs({ habitGrad: log }); progressCache = null; setTimeout(() => showToast(`🎓 ${habitConfig[fresh].title} gaat nu vanzelf · +${XP.habitGrad} XP`), 1200); }
    }
    function habitLevelUp(k) {
      const lv = habitLvl(k), max = (habitLevels[k] || []).length - 1;
      if (lv.n >= max) return;
      const all = { ...(userPrefs().habitLvl || {}) };
      all[k] = { n: lv.n + 1, since: todayStr() };
      saveUserPrefs({ habitLvl: all });
      render();
      showToast(`⬆ ${habitConfig[k].title}: niveau ${lv.n + 2}`);
    }
    function habitLevelHtml(k) {
      const levels = habitLevels[k]; if (!levels) return '';
      const s = habitGradStats(k), max = levels.length - 1;
      const pct = Math.min(100, Math.round(s.done / GRAD_NEED * 100));
      return `
        <div class="hl-box">
          <div class="hl-top"><span>Jouw niveau <b>${s.lvl.n + 1}</b> van ${levels.length}</span>${s.graduated ? '<span class="hl-auto">🎓 Automatisch</span>' : ''}</div>
          <div class="hl-target">${esc(levels[s.lvl.n])}</div>
          ${s.graduated
            ? (s.lvl.n < max ? `<div class="hs-small" style="margin-top: 6px;">Dit gaat nu vanzelf. Tijd om het zwaarder te maken: <b style="color: #fafafa;">${esc(levels[s.lvl.n + 1])}</b>.</div><button class="btn btn-primary btn-small" style="width: 100%; margin-top: 10px;" onclick="habitLevelUp('${k}')">Niveau omhoog</button>` : `<div class="hs-small" style="margin-top: 6px;">Hoogste niveau bereikt. Dit is wie je bent.</div>`)
            : `<div class="hl-bar"><span style="width: ${pct}%;"></span></div><div class="hs-small" style="margin-top: 6px;">${s.done} van de ${GRAD_NEED} dagen in ${GRAD_WINDOW} dagen. Haal je er ${GRAD_NEED}, dan gaat het vanzelf (+${XP.habitGrad} XP) en mag je een niveau omhoog.</div>`}
        </div>`;
    }

    // ============================================
    // BUDDY'S: 1-op-1 maatjes, alleen op uitnodiging, maximaal 3
    // ============================================
    const buddyShareDefs = [
      ['focus', 'Je focus van de week', 'En of je hem haalde, en of je je review deed'],
      ['score', 'Dagscore en rang', 'Je score van vandaag, je weekgemiddelde en je rang'],
      ['streak', 'Gewoontes en reeks', 'Hoeveel gewoontes je vandaag deed (niet welke) en je reeks goede dagen'],
      ['challenge', 'Challenges', 'Naam en dag, bijv. 75 Hard dag 23/75'],
      ['training', 'Training vandaag', 'Alleen of je getraind hebt, geen gewichten'],
      ['home', 'Primal Home-score', 'Je score van 0 tot 100'],

    // Status van één dag: free | ok | over | slip | null (onbekend)
